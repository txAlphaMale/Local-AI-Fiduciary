W('calculators','Planning','CALCULATORS tab (what-if payoff, mortgage true cost, loans, DRIP, TVM, …)',
  'A bench of household-finance calculators in one top-level tab. WHAT-IF · MY DEBTS works on your real liabilities; the rest are general-purpose: MORTGAGE (true cost of ownership — principal, interest, property tax, insurance, PMI, HOA and upkeep, escalating yearly, plus the net cost after an eventual sale), LOAN (auto/personal/student, including trade-in, sales tax and the effective APR of an origination fee), LAND LOAN (balloon and interest-only terms, land-type down-payment guidance), TVM SOLVER (N, I/Y, PV, PMT, FV — leave one blank and it is solved), DRIP (dividend-reinvestment projection vs taking cash), RENT vs BUY, AFFORDABILITY (28/36), POINTS break-even, YIELDS (after-tax and taxable-equivalent yield across CDs, Treasuries and munis, plus APR↔APY), INFLATION and real return, LUMP SUM vs ANNUITY, and NPV/IRR. All math runs server-side in calculators.py — the same engine the Fiduciary chat calls (run_calculator), so the chat and this tab always agree.',
  'Results update as you type (WHAT-IF waits for the RUN button). Inputs marked * are required; ⓘ explains a field. Growth-rate assumptions are pre-filled and editable — they are assumptions, not forecasts. Nothing is guessed silently: a missing APR is never treated as 0%, and a >80% LTV mortgage without a PMI rate is flagged rather than estimated. TVM signs follow financial-calculator convention: money you receive is +, money you pay out is −; if you enter PV and PMT with the same sign while solving N or I/Y, it flips PMT for you and says so. In WHAT-IF, an account missing its APR or payment shows just those fields; SAVE TO ACCOUNT writes them to the same per-account settings PLAN → CASH·DEBT and SETTINGS → ACCOUNTS use, so the three never disagree. Your inputs are remembered in this browser only.',
  'DRIP details: the projection is anchored on the ANNUAL DIVIDEND PER SHARE in dollars, not the yield — payouts are far steadier than a yield that moves with the share price. LOOK UP (any ticker) fills price, trailing-12-month dividend per share and payment frequency; dividend growth defaults to 0% (flat) and is independent of price growth; the yield is derived (dividend ÷ price). If the price falls while a flat dividend continues, the yield would balloon, so the dividend is cut to a yield ceiling (default the larger of 8% or 1.25× today\'s yield — editable) and the result says so. The result shows both incomes side by side (DRIP shares vs the original shares with dividends taken as cash), the implied annual return of the whole projection, and warns when it is far above the roughly 10%/yr long-run stock market return — a 20%+ yield plus reinvestment compounding is usually a sign the inputs, not the math, are optimistic. WHAT-IF lists only debts with a balance, and skips 0% debts that have no payment on file.',
  'Use WHAT-IF before deciding where an extra dollar goes: compare its interest saved (a guaranteed return equal to the APR) with the payoff-vs-invest hurdle on PLAN → CASH·DEBT. Use MORTGAGE before buying to see the full lifetime cash out, not just the payment. Use TVM for any "how long / how much / what rate" question. These are arithmetic models — each result lists what it ignores (taxes, deductions, rate changes); confirm big decisions with a professional.');
function wikiLink(id){
  const a=el('span',null,'?');
  a.title='What is this? (opens the Wiki)';
  a.style.cssText='cursor:pointer;display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;'+
    'border:1px solid var(--color-border-strong);border-radius:50%;font-size:var(--font-size-sm);color:var(--color-text-muted);margin-left:var(--space-2);vertical-align:middle;';
  a.onclick=(e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); WIKI_FOCUS=id; WIKI_OPEN[id]=true; TAB='wiki'; render(); };
  return a;
}
function wikiContent(){
  const wrap=el('div');
  wrap.appendChild(el('div','ph','WIKI · HOW TO READ THIS TERMINAL'));
  const intro=el('div','muted'); intro.style.cssText='font-size:var(--font-size-base);line-height:1.5;margin-bottom:var(--space-3);';
  intro.textContent='Every feature explained: what it is, how to read it, and when to act. Search below, or click a "?" anywhere in the terminal to jump straight to the relevant entry.';
  wrap.appendChild(intro);
  const sb=el('input'); sb.type='search'; sb.placeholder='Search the wiki…'; sb.id='wiki-search';
  sb.value=(WIKI_Q||''); sb.style.cssText='width:100%;max-width:360px;margin-bottom:var(--space-3);padding:var(--space-1) var(--space-2);';
  sb.oninput=()=>{ WIKI_Q=sb.value; const box=document.getElementById('wiki-body'); if(box){ box.innerHTML=''; buildWiki(box); } };
  wrap.appendChild(sb);
  const body=el('div'); body.id='wiki-body'; wrap.appendChild(body);
  buildWiki(body);
  return wrap;
}
function buildWiki(box){
  const esc=s=>(s==null?'':s).toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const q=(WIKI_Q||'').trim().toLowerCase();
  const match=e=> !q || (e.title+' '+e.def+' '+e.read+' '+e.use+' '+e.cat).toLowerCase().includes(q);
  let shown=0;
  WIKI_CATS.forEach(cat=>{
    const items=WIKI.filter(e=>e.cat===cat && match(e));
    if(!items.length) return;
    const ch=el('div'); ch.style.cssText='letter-spacing:2px;font-size:var(--font-size-sm);color:var(--color-accent);margin:14px 0 6px;'; ch.textContent=cat.toUpperCase();
    box.appendChild(ch);
    items.forEach(e=>{ shown++;
      const card=el('div'); card.id='wiki-'+e.id;
      card.style.cssText='border:1px solid var(--color-border);border-radius:var(--radius-lg);margin:5px 0;padding:var(--space-2) var(--space-3);';
      const open=!!WIKI_OPEN[e.id] || (WIKI_FOCUS===e.id);
      const head=el('div'); head.style.cssText='cursor:pointer;display:flex;justify-content:space-between;align-items:center;';
      head.innerHTML=`<span class="sym">${esc(e.title)}</span><span class="muted" style="font-size:var(--font-size-base);">${open?'−':'+'}</span>`;
      head.onclick=()=>{ WIKI_OPEN[e.id]=!open; const b=document.getElementById('wiki-body'); b.innerHTML=''; buildWiki(b); };
      card.appendChild(head);
      if(open){
        // esc() first (XSS-safe), THEN turn any authored \n into a real line break — lets a
        // long glossary entry list one term per line instead of one run-on paragraph, while
        // every other entry (no \n in its source string) renders exactly as before.
        const nl=s=>esc(s).replace(/(https:\/\/[^\s<)]+[^\s<).,;])/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g,'<br>');
        const d=el('div'); d.style.cssText='margin-top:var(--space-2);font-size:var(--font-size-md);line-height:1.5;';
        d.innerHTML=`<div><span class="muted" style="font-size:var(--font-size-sm);letter-spacing:1px;">WHAT IT IS</span><br>${nl(e.def)}</div>`+
          `<div style="margin-top:var(--space-2);"><span class="muted" style="font-size:var(--font-size-sm);letter-spacing:1px;">HOW TO READ IT</span><br>${nl(e.read)}</div>`+
          `<div style="margin-top:var(--space-2);"><span class="muted" style="font-size:var(--font-size-sm);letter-spacing:1px;">WHEN TO USE IT</span><br>${nl(e.use)}</div>`;
        card.appendChild(d);
        // Live interactive checklist (2026-07-23) — moved here from the old Dashboard card per
        // Jason's ask: same setupItemRow()/SETUP_TIER_LABEL used before, just rendered inside the
        // WIKI entry instead of a standalone card, so the checkboxes/GO-> links survive the move.
        if(e.id==='setup-guide' && SETUPPROG && !SETUPPROG.error){
          const sp=SETUPPROG;
          const live=el('div'); live.id='wiki-setup-guide-live';
          live.style.cssText='margin-top:var(--space-3);border-top:1px solid var(--color-border);padding-top:var(--space-3);';
          const lh=el('div'); lh.style.cssText='display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2);flex-wrap:wrap;';
          lh.innerHTML='<span style="font-size:var(--font-size-sm);letter-spacing:1px;color:var(--color-text-muted);">LIVE CHECKLIST — '+sp.done+' of '+sp.total+' done</span>';
          const tourBtn=el('span',null,'🎯 Take the guided tour');
          tourBtn.style.cssText='cursor:pointer;margin-left:auto;color:var(--color-accent);font-size:var(--font-size-sm);';
          tourBtn.onclick=startTour;
          lh.appendChild(tourBtn);
          live.appendChild(lh);
          // Icon legend (2026-07-23, Jason: "is there a legend...which is a default usable value
          // vs something I need to enter to unblock a capability?") — spelled out once, plainly,
          // right above the checklist rather than relying on hover tooltips no one finds.
          const legend=el('div'); legend.style.cssText='font-size:var(--font-size-sm);line-height:1.6;'+
            'color:var(--color-text-muted);margin-bottom:var(--space-3);padding:6px 8px;'+
            'border:1px solid var(--color-border);border-radius:var(--radius-md);';
          legend.innerHTML =
            '<span style="color:var(--color-positive);">✓</span> set &nbsp; '+
            '<span style="color:var(--color-text-muted);">·</span> has a working default — nothing to fix, change only if you want to customize &nbsp; '+
            '<span style="color:var(--color-negative);font-weight:700;">!</span> blank and blocks or skews a real calculation for everyone — worth fixing &nbsp; '+
            '<span style="color:var(--color-accent);">△</span> blank and situational — normal to skip if it doesn\'t apply to you';
          live.appendChild(legend);
          const barOuter=el('div'); barOuter.style.cssText='height:6px;border-radius:3px;background:var(--color-border);overflow:hidden;margin-bottom:var(--space-3);';
          const barInner=el('div'); const pct2 = sp.total?Math.round(100*sp.done/sp.total):100;
          barInner.style.cssText='height:100%;background:var(--color-accent);width:'+pct2+'%;';
          barOuter.appendChild(barInner); live.appendChild(barOuter);
          (sp.tiers||[]).forEach(t=>{
            const visible=(t.items||[]).filter(it=>it.applicable);
            if(!visible.length) return;
            const th=el('div'); th.style.cssText='font-size:var(--font-size-sm);letter-spacing:1px;color:var(--color-text-muted);margin:var(--space-2) 0 4px;';
            th.textContent=(SETUP_TIER_LABEL[t.tier]||('TIER '+t.tier))+(t.total?' — '+t.done+'/'+t.total:'');
            live.appendChild(th);
            visible.forEach(it=>live.appendChild(setupItemRow(it)));
          });
          card.appendChild(live);
        }
      }
      box.appendChild(card);
    });
  });
  if(!shown){ const m=el('div','muted'); m.style.cssText='font-size:var(--font-size-md);'; m.textContent='No wiki entries match "'+WIKI_Q+'".'; box.appendChild(m); }
  if(WIKI_FOCUS){ const id='wiki-'+WIKI_FOCUS; WIKI_FOCUS=null;
    setTimeout(()=>{ const n=document.getElementById(id); if(n){ n.scrollIntoView({behavior:'smooth',block:'center'});
      n.style.boxShadow='0 0 0 2px var(--color-accent)'; setTimeout(()=>{ n.style.boxShadow=''; },2400); } },60);
  }
}

function render(){
  // DATA can be null when the portfolio provider itself is down (see load()'s d.error branch,
  // 2026-07-24) -- `|| {}` keeps every d.field below as undefined (all read through null-safe
  // usd()/sgn()/pct()/cls() helpers) instead of throwing here and silently killing gear-click
  // navigation into SETTINGS.
  const d=DATA||{};
  document.getElementById('meta').textContent =
    ` · ${d.investment_account_count} brokerage accts · ${d.position_count} positions`;
  const age = d.cached_age_s||0;
  document.getElementById('updated').textContent =
    'as of '+new Date(d.generated_at*1000).toLocaleString()+(age>60?` (${Math.round(age/60)}m old)`:'');
  // top stats
  const stats=[
    ['NET WORTH', usd(d.net_worth), ''],
    ['INVESTED', usd(d.invested_value), ''],
    ['UNREAL P/L', sgn(d.total_unrealized_gain), cls(d.total_unrealized_gain)],
    ['P/L %', pct(d.total_gain_pct), cls(d.total_gain_pct)],
  ];
  document.getElementById('stats').innerHTML = stats.map(s=>
    `<div class="ts"><span class="l">${s[0]}</span><span class="v ${s[2]}">${s[1]}</span></div>`).join('');

  const body=document.getElementById('body'); body.innerHTML='';
  charts.forEach(c=>c.destroy()); charts=[];

  if(TAB!=='chat' && TAB!=='wiki'){   // CHAT and WIKI use the full panel; skip the cockpit strip above them
    body.appendChild(emergencyBannerNode());   // TASK-002: red banner while an emergency request is pending (admin)
    body.appendChild(cockpitPanel());   // always-visible "what needs attention" strip + tile router
  }
  // NOTE: the Dashboard visuals (allocation donuts · accounts · gainers/losers/day-movers ·
  // Portfolio-vs-SPY growth-of-100 chart) formerly rendered here as a permanent header that ate
  // vertical space on every tab. They now live in their own leftmost "DASHBOARD" top-level tab
  // (see dashboardContent() + the tabSpecs list below). The cockpit stays persistent as the
  // attention strip whose chips route to the relevant tab.

  // tabbed panel: POSITIONS | RESEARCH (one at a time, to keep the page short)
  const on='color:var(--color-accent)', off='color:var(--color-text-muted)';
  const haveAnalysis = ANALYSIS && ANALYSIS.briefs && Object.keys(ANALYSIS.briefs).length;
  const haveInsights = INSIGHTS && !INSIGHTS.error;
  const havePlan = RETIRE && !RETIRE.error;
  const haveIdeas = IDEAS && !IDEAS.error;
  const haveStrat = STRAT && !STRAT.error;
  const haveTaxAudit = TAXAUDIT && !TAXAUDIT.error && (TAXAUDIT.tax_loss_harvest || TAXAUDIT.asset_location);
  const haveTaxBracket = TAX && !TAX.error && (TAX.marginal_ordinary_rate_pct!=null || TAX.effective);
  const haveTax = haveTaxAudit || haveTaxBracket;
  const haveFL = FL && !FL.error && FL.liquidity;
  const haveResearch = haveAnalysis || haveIdeas;   // RESEARCH tab = briefs + ideas/scan
  const haveAudits = haveTax || haveFL;             // AUDITS tab = tax + fees/liquidity
  if(TAB==='ideas') TAB='research';                 // migrate legacy tab keys -> grouped tabs
  if(TAB==='tax' || TAB==='fl') TAB='audits';
  if(TAB==='research' && !haveResearch) TAB='positions';
  if(TAB==='insights' && !haveInsights) TAB='positions';
  if(TAB==='plan' && !havePlan) TAB='positions';
  if(TAB==='audits' && !haveAudits) TAB='positions';
  if(TAB==='strategist' && !haveStrat) TAB='positions';
  const _gear=document.getElementById('gear'); if(_gear) _gear.style.color=(TAB==='settings')?'var(--color-accent)':'';
  const p=el('div','panel'); p.style.marginTop='10px';
  const tabBar=el('div'); tabBar.id='main-tabbar'; tabBar.style.cssText='display:flex;align-items:center;gap:var(--space-3);border-bottom:1px solid var(--color-border);padding-bottom:var(--space-2);margin-bottom:var(--space-3);flex-wrap:wrap;';
  const tabSpecsRaw=[['dashboard','DASHBOARD'],['positions',`OVERVIEW · ${d.unique_securities}`]];
  if(haveResearch) tabSpecsRaw.push(['research','RESEARCH · IDEAS']);
  if(haveInsights) tabSpecsRaw.push(['insights','RISK · EXPOSURE']);
  if(havePlan) tabSpecsRaw.push(['plan','PLAN · FI']);
  if(haveAudits) tabSpecsRaw.push(['audits','AUDITS · TAX·FEES']);
  if(haveStrat) tabSpecsRaw.push(['strategist','STRATEGIST']);
  // Always available, independent of DATA/provider health (2026-07-24) — this is the escape

    if(nDrift) A.push({sev:'warn',cat:'DRIFT',msg:nDrift+' sleeve(s) out of band',tab:'insights',subtab:'drift'});

    const nLoc=((TAXAUDIT.asset_location||{}).misplaced||[]).length;
    if(nLoc) A.push({sev:'opp',cat:'ASSET LOC',msg:nLoc+' high-yield holding(s) in taxable accounts',tab:'audits',subtab:'tax',tip:'High-yield holdings in a taxable account create a yearly tax bill; they would be sheltered in an IRA/401(k)/Roth. Click for the list, and the ? there for an explanation.'});
  }
  if(FL && !FL.error){
    const nHigh=(((FL.fees||{}).funds)||[]).filter(x=>x.high).length;
    if(nHigh) A.push({sev:'warn',cat:'FEES',msg:nHigh+' high-cost fund(s)',tab:'audits',subtab:'fees'});
    const nLiq=(((FL.liquidity||{}).flagged)||[]).length;
    if(nLiq) A.push({sev:'warn',cat:'LIQUIDITY',msg:nLiq+' hard-to-exit',tab:'audits',subtab:'fees'});
  }
  if(DISCO && !DISCO.error){
    const nA=((DISCO.alerts)||[]).length;
    if(nA) A.push({sev:'info',cat:'NEWS',msg:nA+' holding alert(s)',tab:'research',subtab:'alerts'});
    // 2026-10-19: a dead news feed went unnoticed for ~6 weeks because it only showed as a small
    // amber line inside the NEWS panel while this strip kept counting stale alerts as if current.
    if(DISCO.cache_stale || (DISCO.fetch_failures>0 && !DISCO.cache_fetched_at)){
      const when=DISCO.cache_fetched_at?new Date(DISCO.cache_fetched_at*1000).toLocaleDateString():'never';
      A.push({sev:'warn',cat:'NEWS FEED',msg:'stale (last good pull '+when+') — source failing',tab:'research',subtab:'alerts',
              tip:DISCO.fetch_error||'Tavily news could not be refreshed'});

  }
  if(RETIRE && !RETIRE.error && RETIRE.monte_carlo && RETIRE.monte_carlo.success_pct!=null){
    const sp=RETIRE.monte_carlo.success_pct;
    A.push({sev: sp>=80?'ok':(sp>=60?'info':'warn'), cat:'FIRE', msg:sp+'% success', tab:'plan', subtab:'fi'});
  }
  // TASK-004: EMERGENCY FUND — red/yellow/green from PLAN → CASH·DEBT's own status (no new maths).
  if(CASHDEBT && !CASHDEBT.error && CASHDEBT.emergency_fund){
    const ef=CASHDEBT.emergency_fund;
    if(ef.months_covered!=null && ef.target_months){
      let sev=ef.status==='critical'?'crit':(ef.status==='low'?'warn':'ok');
      const stressShort=(ef.status==='ok' && (ef.status_stress==='low'||ef.status_stress==='critical'));
      if(stressShort) sev='warn';
      const msg=ef.months_covered+' of '+ef.target_months+' months'
        +((ef.gap_dollars>0)?(' · gap '+usd(ef.gap_dollars)):'')
        +(stressShort?(' · only '+ef.months_covered_stress+' after a '+ef.stress_drawdown_pct+'% drawdown'):'')
        +(ef.designated?'':' · estimate (no accounts designated)');
      A.push({id:'EMERGENCY FUND',sev,cat:'EMERGENCY FUND',msg,tab:'plan',subtab:'cashdebt',
              tip:ef.designated?'Reserve = the accounts you designated':'Auto-detected cash only — designate your real reserve accounts in PLAN → CASH·DEBT'});
    } else {
      A.push({id:'EMERGENCY FUND',sev:'info',cat:'EMERGENCY FUND',msg:'set your annual expenses to size it',tab:'plan',subtab:'assumptions'});
    }
  }
  if(RETIRE && !RETIRE.error && RETIRE.bridge && RETIRE.bridge.aca){
    const ac=RETIRE.bridge.aca, fl=ac.flags||{}, sub=ac.subsidy||{}, fp=sub.fpl_pct;
    if(fl.over_cliff) A.push({sev:'warn',cat:'ACA CLIFF',msg:'bridge MAGI '+(fp||'?')+'% FPL — over 400%, $0 subsidy',tab:'plan',subtab:'bridge'});
    else if(fl.below_floor_gap) A.push({sev:'warn',cat:'ACA GAP',msg:'MAGI <100% FPL — TX coverage gap',tab:'plan',subtab:'bridge'});
    else if(fl.on_cliff_edge) A.push({sev:'info',cat:'ACA',msg:(fp||'?')+'% FPL — near 400% cliff',tab:'plan',subtab:'bridge'});
  }
  if(LT && !LT.error && LT.hidden_exposure){
    LT.hidden_exposure.filter(h=>h.ticker && (h.weight_pct||0)>20).slice(0,3).forEach(h=>{
      A.push({sev:'warn',cat:'HIDDEN EXPOSURE',msg:h.ticker+' truly '+h.weight_pct+'% incl. funds',tab:'insights',subtab:'lookthrough'});
    });
  }
  // Complete = every source the tiles above read has loaded without error; only then is it safe to
  // prune dismissals for tiles that are "absent" (a half-loaded cockpit must not forget them).
  const complete=!!(EXP&&!EXP.error&&INSIGHTS&&!INSIGHTS.error&&TAXAUDIT&&!TAXAUDIT.error&&FL&&!FL.error&&RETIRE&&!RETIRE.error&&DISCO&&!DISCO.error&&CASHDEBT&&!CASHDEBT.error);
  if(COCKPIT_DISM===null){ _cockpitFetchDismissed(); }
  const vis=cockpitVisibility(A, COCKPIT_DISM||{});
  if(complete && COCKPIT_DISM && vis.prune.length){ _cockpitPrune(vis.prune); }
  const sevRank={crit:0,warn:1};
  const shown=vis.shown.map((a,i)=>[a,i]).sort((x,y)=>((sevRank[x[0].sev]??2)-(sevRank[y[0].sev]??2))||(x[1]-y[1])).map(x=>x[0]);
  if(!shown.length && !(COCKPIT_SHOW&&vis.hidden.length)){
    const ok=el('div'); ok.style.cssText='font-size:var(--font-size-md);color:var(--color-positive);';
    ok.textContent='✓ All clear — nothing over your thresholds right now.'; p.appendChild(ok);
  }
  const colOf={crit:'var(--color-negative)',warn:'var(--color-accent)',opp:'var(--color-positive)',ok:'var(--color-positive)',info:'var(--color-text-muted)'};
  const strip=el('div'); strip.style.cssText='display:flex;flex-wrap:wrap;gap:var(--space-2);';
  const addChip=(a,dim)=>{
    const c=colOf[a.sev]||'var(--color-text-muted)';
    const chip=el('span');
    chip.style.cssText=`cursor:pointer;border:1px solid ${c};border-left:3px solid ${c};border-radius:var(--radius-md);`+
      `padding:var(--space-1) var(--space-2);font-size:var(--font-size-base);color:var(--color-text);white-space:nowrap;`+(dim?'opacity:0.55;':'');
    const lab=document.createElement('span'); lab.innerHTML=`<span style="color:${c};letter-spacing:1px;">${a.cat}</span> <span class="muted">·</span> ${a.msg}`;
    chip.appendChild(lab);
    chip.title=(a.tip?a.tip+' — ':'')+'Go to '+a.tab.toUpperCase()+(a.subtab?(' · '+a.subtab.toUpperCase()):'')+' tab';
    chip.onclick=()=>{ TAB=a.tab; if(a.subtab){ setSubtab(a.tab,a.subtab); } else { render(); } };
    if(a.sev==='ok'||a.sev==='opp'){      // green tiles are dismissible; reappear if they stop being green
      const x=document.createElement('span'); x.style.cssText='margin-left:8px;opacity:0.7;'; x.textContent=dim?'↺':'✕';
      x.title=dim?'Restore this tile':'Dismiss — it comes back on its own if it stops being green';
      x.onclick=ev=>{ ev.stopPropagation(); dim?_cockpitRestore([a.id||a.cat]):_cockpitDismiss(a.id||a.cat,a.sev); };
      chip.appendChild(x);
    }
    strip.appendChild(chip);
  };
  shown.forEach(a=>addChip(a,false));
  if(COCKPIT_SHOW) vis.hidden.forEach(a=>addChip(a,true));
  p.appendChild(strip);
  if(vis.hidden.length){
    const t=el('div','muted'); t.style.cssText='font-size:var(--font-size-sm);margin-top:var(--space-2);cursor:pointer;';
    t.textContent=(COCKPIT_SHOW?'▾ hide':'✓ '+vis.hidden.length+' acknowledged · show')+(COCKPIT_SHOW?' acknowledged':'');
    t.onclick=()=>{ COCKPIT_SHOW=!COCKPIT_SHOW; _cockpitRerender(); };
    p.appendChild(t);
  }
  return p;
}

// ---- cockpit tile dismissal (TASK-004) ----
let COCKPIT_DISM=null, COCKPIT_SHOW=false;
// Pure: which tiles show / are hidden, and which stored dismissals no longer apply. A green tile
// (ok/opp) is hidden only while its severity still equals the one stored at dismissal; a stored
// entry whose tile is gone or changed severity is returned in `prune` so it can reappear later.
function cockpitVisibility(A, dism){
  dism=dism||{}; const shown=[], hidden=[], prune=[], present={};
  A.forEach(a=>{ present[a.id||a.cat]=a; });
  A.forEach(a=>{ const id=a.id||a.cat, green=(a.sev==='ok'||a.sev==='opp');
    if(green && dism[id]===a.sev) hidden.push(a); else shown.push(a); });
  Object.keys(dism).forEach(id=>{ const a=present[id]; if(!a || a.sev!==dism[id]) prune.push(id); });
  return {shown, hidden, prune};
}
function _cockpitRerender(){ const old=document.getElementById('cockpit-panel'); if(old) old.replaceWith(cockpitPanel()); }
async function _cockpitFetchDismissed(){
  COCKPIT_DISM={};   // placeholder so we don't refetch in a loop
  try{ const d=await (await fetch('/api/cockpit/dismissed')).json(); COCKPIT_DISM=d.dismissed||{}; }catch(_){ }
  _cockpitRerender();
}
async function _cockpitPost(path,body){
  try{ const d=await (await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();
       if(d&&d.dismissed) COCKPIT_DISM=d.dismissed; }catch(_){ }
  _cockpitRerender();
}
function _cockpitDismiss(id,sev){ COCKPIT_DISM=Object.assign({},COCKPIT_DISM||{},{[id]:sev}); _cockpitRerender(); _cockpitPost('/api/cockpit/dismiss',{id,sev}); }
function _cockpitRestore(ids){ const m=Object.assign({},COCKPIT_DISM||{}); ids.forEach(i=>delete m[i]); COCKPIT_DISM=m; _cockpitRerender(); _cockpitPost('/api/cockpit/restore',{ids}); }
let _cockpitPruning=false;
function _cockpitPrune(ids){ if(_cockpitPruning) return; _cockpitPruning=true; const m=Object.assign({},COCKPIT_DISM||{}); ids.forEach(i=>delete m[i]); COCKPIT_DISM=m;
  fetch('/api/cockpit/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})}).catch(()=>{}).finally(()=>{ _cockpitPruning=false; }); }

function accountsPanel(d){
  const p=el('div','panel');
  const _ah=el('div','ph','ACCOUNTS'); _ah.appendChild(wikiLink('accounts-panel')); p.appendChild(_ah);
  d.by_account.forEach(a=>{
    const row=el('div','row');
    row.innerHTML=`<span class="nm">${a.account}<br><span class="sub">${shortInst(a.institution)}</span></span>`+
      `<span style="text-align:right">${usd(a.value)}</span>`;
    p.appendChild(row);
  });
  // Balance-only investment accounts (2026-07-22): 401(k)/IRA/HSA/brokerage accounts whose provider
  // syncs a balance but no line-item holdings. They belong with the ACCOUNTS (and the institution
  // donut), not under "Other Assets" — the "balance only" note explains why they have no holdings detail.
  (d.investment_balance_accounts||[]).forEach(a=>{
    const row=el('div','row');
    row.innerHTML=`<span class="nm">${a.account}<br><span class="sub">${shortInst(a.institution)} · balance only</span></span>`+
      `<span style="text-align:right">${usd(a.value)}</span>`;
    p.appendChild(row);
  });
  // OTHER ASSETS & LIABILITIES: everything in the net-worth roll-up that ISN'T a
  // holdings/brokerage account — cash, the home (Zillow-valued), and all debts.
  // These move net worth but were invisible here (this panel only listed
  // holdings accounts), so the home + liabilities never showed. Liabilities carry
  // a POSITIVE balance in the feed (= debt owed) and are shown negative/red.
  const held=new Set([...(d.by_account||[]).map(a=>a.account), ...((d.investment_balance_accounts||[]).map(a=>a.account))]);
  const other=(d.accounts||[]).filter(a=>!held.has(a.name) && Math.round(a.balance||0)!==0);
  const assets=other.filter(a=>a.is_asset!==false);
  const liabs =other.filter(a=>a.is_asset===false);
  const subhead=t=>{ const s=el('div','sub'); s.style.cssText='margin:9px 0 2px;letter-spacing:1px;color:var(--color-text-muted);'; s.textContent=t; return s; };
  const line=(nm,inst,val,neg)=>{
    const row=el('div','row');
    row.innerHTML=`<span class="nm">${nm}<br><span class="sub">${shortInst(inst||'—')}</span></span>`+
      `<span class="${neg?'neg':''}" style="text-align:right">${neg?'-'+usd(Math.abs(val)):usd(val)}</span>`;
    return row;
  };
  if(assets.length){
    p.appendChild(subhead('OTHER ASSETS'));
    assets.sort((a,b)=>(b.balance||0)-(a.balance||0)).forEach(a=>p.appendChild(line(a.name,a.institution,a.balance,false)));
  }
  if(liabs.length){
    p.appendChild(subhead('LIABILITIES'));

  return p;
}

  // if /api/setup-progress hasn't loaded yet or the household has already dismissed it AND
  // finished everything (see setupProgressCard()'s own dismissed-chip logic for the in-between
  // dismissed-but-not-done case).

  const nbox=el('div'); nbox.style.cssText='border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-3);margin-bottom:var(--space-3);';

    // over time without having to reproduce a timeout.
    dt.textContent=new Date(nl.generated_at*1000).toLocaleString()+(nl.gpu_wait_s!=null?` · queued ${nl.gpu_wait_s}s for GPU`:'');
    nbox.appendChild(dt);
    const body=el('div'); body.style.cssText='font-size:var(--font-size-md);line-height:1.65;white-space:pre-wrap;';
    const txt=(nl.letter||'');

    else { body.textContent=txt; nbox.appendChild(body); }
  } else {
    nbox.appendChild(el('div','muted','No letter yet — it writes itself Monday mornings, or generate one now.'));
    // Surface WHY the last attempt failed instead of leaving a silent "No letter yet" forever —
    // found 2026-07-18: every failure mode (timeout, Ollama error, empty response) used to be
    // swallowed with zero trace anywhere. Only shown when there's genuinely no letter yet; once
    // one exists, a past error is no longer the interesting fact.
    if(NARR && NARR.last_error){
      const el2=el('div'); el2.style.cssText='font-size:var(--font-size-base);color:var(--color-negative);margin-top:var(--space-2);line-height:1.4;';
      const when=NARR.last_error_at?new Date(NARR.last_error_at*1000).toLocaleString():'';
      el2.textContent=`Last attempt failed${when?' ('+when+')':''}: ${NARR.last_error}`;
      nbox.appendChild(el2);
    }
  }
  const gb=el('button','mut-btn',nl?'REGENERATE':'GENERATE NOW'); gb.style.cssText='margin-top:var(--space-2);';
  gb.onclick=()=>runJob('/api/run-narrative', gb, 'queued… (watch #jobs)').then(res=>{ if(res) _narrStartPoll(); });

  wrap.appendChild(nbox);

  // from the daily snapshot) — its own full-width row, first of the panel rows (was row 3,
  // below the movers). No margin-top: follows nbox, which already carries margin-bottom.
  const r3=el('div'); r3.appendChild(valuePanel()); wrap.appendChild(r3);
  // row 2 (restructured 2026-07-22, Jason): the two donut panels finished rendering early and,
  // because ACCOUNTS shared the same CSS-grid row and Grid stretches every cell to the tallest
  // sibling, a long ACCOUNTS list stretched the short donuts and left dead space above the movers
  // row below. Fix: dock ACCOUNTS as a single tall pane on the right, and tile the 5 small panels
  // (2 donuts + 3 movers) together in the remaining width as their own nested auto-fit grid, so
  // they fill height with more small tiles instead of one short row followed by a mostly-empty one.
  // align-items:start keeps each column its own natural height (no cross-stretch); minmax(0,1fr)
  // on the wide column prevents the nested grid from overflowing on narrow viewports.
  const body=el('div'); body.style.cssText='display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:10px;margin-top:10px;align-items:start;';
  const small=el('div','grid cols');

  small.appendChild(allocPanel('ALLOCATION · ASSET TYPE','c-type', d.by_type, d.invested_value));

  body.appendChild(small);
  const acctCol=el('div'); acctCol.appendChild(accountsPanel(d)); body.appendChild(acctCol);
  wrap.appendChild(body);
  return wrap;
}

      `Hold ${rr(br.Hold)} · Sell <span class="${(br.Sell&&br.Sell.avg_fwd_return_pct<=0)?'pos':'neg'}">${rr(br.Sell)}</span> · `+
      `Buy−Hold <span class="${(s.buy_minus_hold_pct||0)>=0?'pos':'neg'}">${s.buy_minus_hold_pct==null?'—':(s.buy_minus_hold_pct>0?'+':'')+s.buy_minus_hold_pct+'pt'}</span> · `+
      `hit-rate ${s.directional_hit_rate_pct==null?'—':s.directional_hit_rate_pct+'%'}`;

  }
  const head=el('div'); head.style.cssText='display:grid;grid-template-columns:70px 150px 1fr;gap:var(--space-2);font-size:var(--font-size-sm);color:var(--color-text-muted);letter-spacing:1px;border-bottom:1px solid var(--color-border-strong);padding:3px 0;';
  head.innerHTML='<span>SYM</span><span>ANALYST · MODEL</span><span>THESIS</span>';
  wrap.appendChild(head);
  const badge=r=>{ if(!r) return '<span class="muted">—</span>'; const c=r==='Buy'?'var(--color-positive)':(r==='Sell'?'var(--color-negative)':'var(--color-accent)'); return `<span style="color:${c}">${r}</span>`; };
  const fundLine=b=>{
    const f=b.fundamentals, v=b.valuation, out=[];
    if(f && f.available){
      const m=f.metrics||{}, r=f.ratios||{}, bits=[];
      if(m.fiscal_year_end) bits.push('FY'+String(m.fiscal_year_end).slice(0,4));
      if(m.revenue_growth_pct!=null) bits.push('rev '+(m.revenue_growth_pct>0?'+':'')+m.revenue_growth_pct+'%');
      if(r.net_margin_pct!=null) bits.push('nm '+r.net_margin_pct+'%');
      if(r.return_on_equity_pct!=null) bits.push('ROE '+r.return_on_equity_pct+'%');
      if(r.fcf_margin_pct!=null) bits.push('FCFm '+r.fcf_margin_pct+'%');
      if(r.debt_to_equity!=null) bits.push('Liab/Eq '+r.debt_to_equity);
      if(r.quality_of_earnings!=null) bits.push('QoE '+r.quality_of_earnings);
      out.push(`<span style="display:block;color:var(--color-info);font-size:var(--font-size-sm);margin-top:var(--space-1)">▸ GAAP: ${bits.join(' · ')}</span>`);
      const sco=f.scores||{}, pf=sco.piotroski_f, az=sco.altman_z, sb=[];
      if(pf) sb.push(`<span class="${pf.rating==='strong'?'pos':(pf.rating==='weak'?'neg':'')}">Piotroski F ${pf.score}/${pf.of}</span>`);
      if(az) sb.push(`<span class="${az.zone==='safe'?'pos':(az.zone==='distress'?'neg':'')}">Altman Z′ ${az.z_score} (${az.zone})</span>`);
      if(sb.length) out.push(`<span style="display:block;color:var(--color-info);font-size:var(--font-size-sm);margin-top:var(--space-1)">▸ SCORES: ${sb.join(' · ')}</span>`);
    } else if(f){
      // 2026-08-06: "not SEC-filed" is only true when there's no CIK at all. An IFRS filer
      // (20-F/40-F — the Canadian/Australian listings here) IS an SEC filer whose taxonomy this
      // app can't parse; saying otherwise is simply incorrect. edgar.py now reports which case
      // it is via `sec_filer`/`taxonomies`, so say the accurate thing.
      const lbl = f.sec_filer
        ? `SEC filer · reports under ${(f.taxonomies||[]).join(', ')||'a non-US-GAAP taxonomy'} (not parsed)`
        : 'not SEC-filed';
      out.push(`<span style="display:block;color:var(--color-text-dim);font-size:var(--font-size-sm);margin-top:var(--space-1)" title="${(f.reason||'').replace(/"/g,'&quot;')}">▸ GAAP: ${lbl}</span>`);
    }
    if(v && (v.pe_ttm!=null||v.pb!=null||v.dividend_yield_pct!=null)){
      const vb=[];
      if(v.pe_ttm!=null) vb.push('P/E '+(+v.pe_ttm).toFixed(1));
      if(v.pe_forward!=null) vb.push('fwd '+(+v.pe_forward).toFixed(1));
      if(v.pb!=null) vb.push('P/B '+(+v.pb).toFixed(1));
      if(v.ps_ttm!=null) vb.push('P/S '+(+v.ps_ttm).toFixed(1));
      if(v.dividend_yield_pct!=null) vb.push('yld '+(+v.dividend_yield_pct).toFixed(2)+'%');
      out.push(`<span style="display:block;color:var(--color-accent);font-size:var(--font-size-sm);margin-top:var(--space-1)">▸ VAL: ${vb.join(' · ')}</span>`);
    }
    // 13F WATCHED HOLDERS (RESUME-TRACKER 2026-07-11 follow-up, built 2026-08-06). Mirrors the
    // on-demand research panel's line (researchBrief) but trimmed to 3 manager names — this table
    // renders one row per holding, so the full 4-name list plus the methodology caveat that fits
    // fine on a single-ticker page would crowd 46 rows here. The "≤45d lag" caveat is kept because
    // dropping it would let a stale quarterly filing read as current positioning.
    const inst=b.institutional;
    if(inst && inst.holder_count>0){
      const esc2=s=>(s==null?'':s).toString().replace(/</g,'&lt;');
      const net=(inst.buying||0)-(inst.selling||0);
      const col=net>0?'var(--color-positive)':(net<0?'var(--color-negative)':'var(--color-text-muted)');
      const names=(inst.holders||[]).slice(0,3).map(h=>{
        const ch=h.change, s=(ch==='added'||ch==='new')?'▲':((ch==='trimmed'||ch==='exited')?'▼':'•');
        return s+esc2(h.manager);
      }).join(' · ');
      out.push(`<span style="display:block;color:${col};font-size:var(--font-size-sm);margin-top:var(--space-1)">`+
        `▸ 13F: <b>${inst.holder_count}</b> watched holder${inst.holder_count===1?'':'s'} `+
        `(${inst.buying||0}▲ / ${inst.selling||0}▼ last Q)`+(names?` <span class="muted">${names}</span>`:'')+
        ` <span class="muted">· ≤45d lag, context only</span></span>`);
    }
    return out.join('');
  };
  const briefs=a.briefs;
  // 2026-08-06: panel-level staleness banner. The daily briefs now carry the same
  // cache_fetched_at/cache_stale provenance the on-demand research panel has always shown
  // (_cacheAgeLabel). Before this, a Tavily/Finnhub/EDGAR outage was INVISIBLE here — the
  // last-known-good fallback kept feeding the model old inputs and the resulting thesis read
  // exactly as confident as a fresh one. Counted rather than repeated per row: with ~46 holdings
  // a per-row "as of" line on every brief would drown the theses; the red chip below only appears
  // on the rows that actually fell back.
  // 2026-08-08: TWO banners, not one. The single banner above conflated three different things
  // and consequently sat at "26 of 26" indefinitely, which is the same as showing nothing. Now:
  //   DEGRADED (red)  — an input could not be retrieved at all and nothing was cached to fall back
  //                     on, so the brief was written WITHOUT it. Names the source, because the old
  //                     "news, analyst consensus, valuation or SEC fundamentals" list left the
  //                     reader unable to tell a total EDGAR outage from a slow news week.
  //   STALE (amber)   — an input fell back to a copy that has aged past that source's own
  //                     freshness window. Real, but a rung below missing.
  // Securities that legitimately have no data for a source (ETFs have no SEC company facts) no
  // longer appear in either count — see store.cached_fetch's is_empty.
  // 2026-08-08b: freshness windows are measured in TRADING time (market_calendar.py), so a
  // Friday-evening pull read over the weekend is not flagged — the market has not opened since,
  // and no fresher value exists to have missed.
  const CACHE_RULES_VERSION=2;
  const keys=Object.keys(briefs||{}), total=keys.length;
  const banner=(color,text)=>{
    const wn=el('div');
    wn.style.cssText=`border:1px solid ${color};border-radius:var(--radius-lg);padding:var(--space-2) var(--space-3);margin-bottom:var(--space-3);font-size:var(--font-size-base);color:${color};`;
    wn.innerHTML=text; wrap.appendChild(wn);
  };
  // Briefs written BEFORE the current rules carry flags that meant something else (v1's
  // cache_stale was "any fallback at all"). Re-rendering those under today's wording states a
  // conclusion the current logic never reached — the first deploy of this banner did exactly
  // that, reporting "28 of 28 dated" from stale v1 booleans. Label them; don't reinterpret them.
  const legacyKeys=keys.filter(k=>((briefs[k]||{}).cache_rules_version||1)<CACHE_RULES_VERSION);
  const currentKeys=keys.filter(k=>((briefs[k]||{}).cache_rules_version||1)>=CACHE_RULES_VERSION);
  if(legacyKeys.length){
    banner('var(--color-text-muted)',
      `ℹ ${legacyKeys.length} of ${total} briefs were generated before the current data-freshness rules `+
      `and their flags are not directly comparable. Re-run RESEARCH → BRIEFS to re-evaluate them.`);
  }
  const degradedKeys=currentKeys.filter(k=>(briefs[k]||{}).cache_degraded);
  if(degradedKeys.length){
    const srcs=[...new Set(degradedKeys.flatMap(k=>(briefs[k]||{}).cache_missing||[]))].sort();
    banner('var(--color-negative)',
      `⚠ ${degradedKeys.length} of ${currentKeys.length} briefs are MISSING an input entirely${srcs.length?' — '+srcs.join(', '):''}. `+
      `The source could not be retrieved and no previous copy existed, so those theses were written without it. `+
      `This is a live outage, not aged data — check the source's credentials/connectivity.`);
  }
  const staleKeys=currentKeys.filter(k=>(briefs[k]||{}).cache_stale);
  if(staleKeys.length){
    const srcs=[...new Set(staleKeys.flatMap(k=>(briefs[k]||{}).cache_dated||[]))].sort();
    banner('var(--color-accent)',
      `⚠ ${staleKeys.length} of ${currentKeys.length} briefs used data past its freshness window${srcs.length?' — '+srcs.join(', '):''}. `+
      `Measured in trading days, so weekends and market holidays are excluded. Treat those theses as dated.`);
  }
  // sort: actionable calls first (Buy, Sell, then Hold), then by model confidence, then ticker
  const RANK={Buy:0,Sell:1,Hold:2}, CONF={high:0,med:1,low:2};
  const sortedKeys=Object.keys(briefs).sort((x,y)=>{
    const mx=(briefs[x]||{}).llm||{}, my=(briefs[y]||{}).llm||{};
    const rx=RANK[mx.rating]==null?3:RANK[mx.rating], ry=RANK[my.rating]==null?3:RANK[my.rating];
    if(rx!==ry) return rx-ry;
    const cx=CONF[mx.confidence]==null?3:CONF[mx.confidence], cy=CONF[my.confidence]==null?3:CONF[my.confidence];
    if(cx!==cy) return cx-cy;
    return x.localeCompare(y);
  });
  sortedKeys.forEach(t=>{
    const b=briefs[t]||{}, g=b.grounded||{}, m=b.llm||{};
    const esc=s=>(s==null?'':s).toString().replace(/</g,'&lt;');
    const thesis=esc(m.thesis||m.summary||(m.error?'model error: '+m.error:''));
    const extra=[];
    if(m.bull_case) extra.push(`<span class="pos" style="display:block;font-size:var(--font-size-base);margin-top:var(--space-1)">▲ BULL: ${esc(m.bull_case)}</span>`);
    if(m.bear_case) extra.push(`<span class="neg" style="display:block;font-size:var(--font-size-base);margin-top:var(--space-1)">▼ BEAR: ${esc(m.bear_case)}</span>`);
    if(m.key_risks){ const kr=Array.isArray(m.key_risks)?m.key_risks.join('; '):m.key_risks; extra.push(`<span class="muted" style="display:block;font-size:var(--font-size-base);margin-top:var(--space-1)">⚠ RISKS: ${esc(kr)}</span>`); }
    const tgt=g.target_mean?` <span class="muted" style="font-size:var(--font-size-base)">$${Math.round(g.target_mean)}</span>`:'';
    const conf=m.confidence?` <span class="muted" style="font-size:var(--font-size-sm)">(${m.confidence})</span>`:'';
    const row=el('div'); row.id='brief-'+t; row.style.cssText='display:grid;grid-template-columns:70px 150px 1fr;gap:var(--space-2);padding:7px 0;border-bottom:1px solid var(--color-border);font-size:var(--font-size-md);align-items:start;transition:background 0.4s;';
    // CIT (RESUME-TRACKER 2026-07-18k): no Buy/Sell/Hold badge to show (rating is intentionally
    // null) — label it plainly instead of letting it read as "no signal yet".
    const ratingCell = b.is_cit
      ? '<span class="muted" style="font-size:var(--font-size-sm)">CIT · not publicly traded</span>'
      : `${badge(g.rating)}${tgt} <span class="muted">·</span> ${badge(m.rating)}${conf}`;
    // Per-row chip — the banners give counts, the chip says WHICH rows and why. Missing outranks
    // stale: if an input is absent entirely there is no "as of" date worth printing for it.
    const _legacy=((b.cache_rules_version||1)<CACHE_RULES_VERSION);
    const staleChip = _legacy
      ? (b.cache_stale||b.cache_degraded
        ? `<span class="muted" style="display:block;font-size:var(--font-size-sm);margin-bottom:2px" title="Generated under the previous freshness rules, where any cache fallback counted as stale. Re-run to re-evaluate.">◦ PRE-RULES BRIEF${b.cache_fetched_at?' · data from '+new Date(b.cache_fetched_at*1000).toLocaleDateString():''}</span>`
        : '')
      : (b.cache_degraded
        ? `<span class="neg" style="display:block;font-size:var(--font-size-sm);margin-bottom:2px" title="This input could not be retrieved and no previous copy existed — the thesis was written without it.">⚠ MISSING INPUT${(b.cache_missing||[]).length?' · '+b.cache_missing.join(', '):''}</span>`
        : (b.cache_stale
          ? `<span style="display:block;font-size:var(--font-size-sm);margin-bottom:2px;color:var(--color-accent)" title="An input could not be refreshed and the last successful retrieval is past its freshness window, counted in trading days.">⚠ DATED INPUTS${(b.cache_dated||[]).length?' · '+b.cache_dated.join(', '):''}${b.cache_fetched_at?' · oldest source from '+new Date(b.cache_fetched_at*1000).toLocaleDateString():''}</span>`
          : ''));
    row.innerHTML=`<span style="color:var(--color-accent)">${t}</span>`+
      `<span>${ratingCell}</span>`+
      `<span style="line-height:1.45">${staleChip}<span style="color:var(--color-text)">${thesis||'—'}</span>${extra.join('')}${fundLine(b)}</span>`;
    wrap.appendChild(row);
  });
  return wrap;
}

function saveScanner(){
  const wl=(document.getElementById('scan-wl').value||'').split(/[,\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
  const crit={};
  ['min_rev_growth_pct','min_fcf_margin_pct','max_pe_forward','min_analyst_buy_pct','min_piotroski','max_share_price','min_share_price'].forEach(k=>{
    const x=document.getElementById('scan-'+k).value; if(x!=='') crit[k]=parseFloat(x);
  });
  const disco=(document.getElementById('scan-disco').value||'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const body={ watchlist:wl, criteria:crit,
    include_holding_peers: document.getElementById('scan-peers').checked,
    strategy_description: document.getElementById('scan-strat').value,
    discovery_queries: disco };
  const al=document.getElementById('scan-alertlim').value; if(al!=='') body.alert_holdings_limit=parseInt(al,10);
  fetch('/api/scanner-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(()=>load(false)).catch(e=>alert('Save failed: '+e));
}

  _renderScanAnalysis(abox);   // pending + saved history + most-recent brief (survives navigation/reload)
  // 2026-08-06: `unscreened` (user-added watchlist names that failed the price cap / fit gate) and
  // `unavailable` (watchlist symbols that returned no data — usually a typo or a delisting) are
  // rendered in their own sections below. The empty-state guard has to consider all THREE lists,

  const unscreened=r.unscreened_watchlist||[], unavail=r.unavailable_watchlist||[];
  const ideaRow=i=>{
    const tr=el('tr');
    const fit=i.fit_score!=null?`${i.fit_score}/${i.max_score}`:'—';
    const fitc=i.fit_score>=3?'pos':(i.fit_score===2?'':'neg');
    const ana=i.analyst_rating?`${i.analyst_rating}${i.analyst_buy_pct!=null?' '+i.analyst_buy_pct+'%':''}`:'—';
    const why=(i.excluded_because||[]).join('; ');
    tr.innerHTML=`<td class="sym">${i.ticker}${i.already_held?' <span class="muted" style="font-size:var(--font-size-xs)">held</span>':''}${i.composite_score!=null?` <span class="muted" style="font-size:var(--font-size-xs)" title="composite quality+value+momentum (0-100): Q ${(i.composite_subscores||{}).quality} · V ${(i.composite_subscores||{}).value} · M ${(i.composite_subscores||{}).momentum}">·c${i.composite_score}</span>`:''}</td>`+
      `<td>${i.price!=null?'$'+(+i.price).toFixed(2):'—'}</td>`+
      `<td class="${fitc}">${fit}</td>`+
      `<td class="${(i.expected_return_pct||0)>=0?'pos':'neg'}" title="${i.target_mean!=null?'analyst target $'+(+i.target_mean).toFixed(2):''}">${i.expected_return_pct!=null?(i.expected_return_pct>0?'+':'')+i.expected_return_pct+'%':'—'}</td>`+
      `<td>${i.rev_growth_pct!=null?(i.rev_growth_pct>0?'+':'')+i.rev_growth_pct+'%':'—'}</td>`+
      `<td>${i.fcf_margin_pct!=null?i.fcf_margin_pct+'%':'—'}</td>`+
      `<td>${i.net_margin_pct!=null?i.net_margin_pct+'%':'—'}</td>`+
      `<td>${i.pe_forward!=null?(+i.pe_forward).toFixed(1):'—'}</td>`+
      `<td class="l">${ana}</td>`+
      `<td class="l"><button onclick="researchIdea('${i.ticker}')" style="font-size:var(--font-size-sm);padding:var(--space-1) var(--space-2);">▸ analyze</button>`+
        `${why?` <span class="muted" style="font-size:var(--font-size-xs)" title="${why.replace(/"/g,'&quot;')}">why?</span>`:''}`+
        `${(i.error||!i.available)?` <span class="muted" style="font-size:var(--font-size-xs)">${i.error?'err':'no SEC data'}</span>`:''}</td>`;

  };
  const mkTable=rows=>{

    t.appendChild(h); rows.forEach(i=>t.appendChild(ideaRow(i))); return t;
  };
  if(!(r.ideas&&r.ideas.length) && !unscreened.length && !unavail.length){
    wrap.appendChild(el('div','muted','No watchlist ideas from the screen — use “Analyze any ticker” above for holdings the growth screen filters out, or see the DISCOVERED / NEWS ALERTS sub-tabs.'));

    sub.textContent='You added these by hand, so they are never dropped for failing the growth/price/fit filters — they are shown with full metrics and the reason they would not have qualified (hover “why?”). They are deliberately kept out of the ranked list above, which still means “passed your screen.”';
    wrap.appendChild(hd); wrap.appendChild(sub); wrap.appendChild(mkTable(unscreened));

  if(r.note){ const n=el('div','muted'); n.style.cssText='margin-top:var(--space-3);font-size:var(--font-size-sm);line-height:1.4;'; n.textContent=r.note; wrap.appendChild(n); }

// RESUME-TRACKER (2026-07-30, "last-known-good cache" Part 2) -- shared label for any panel that
// renders cached external data (research briefs, sector exposure, discovery/news, ...). Jason's
// spec: a simple "Based on data retrieved <date>" line at the top of the panel; color-flags it
// (rather than adding more text) when the backend reports the panel fell back to a stale/last-
// known-good value instead of a fresh fetch.
function _cacheAgeLabel(fetchedAt, stale, missing, fetchError){
  // `missing` (2026-08-08): array of source names that could not be retrieved at all. Rendered
  // even when there is no fetchedAt to show — "nothing came back" is the case most worth saying.
  const miss=(missing||[]).length
    ? `<div style="font-size:var(--font-size-sm);margin-bottom:var(--space-2);color:var(--color-negative);">⚠ Not retrieved: ${missing.join(', ')} — this analysis was built without it.</div>`
    : '';
  if(!fetchedAt) return miss;
  const dt=new Date(fetchedAt*1000).toLocaleString();
  const color=stale?'var(--color-accent)':'var(--color-text-muted)';
  return miss+`<div class="muted" style="font-size:var(--font-size-sm);margin-bottom:var(--space-2);color:${color};">`+
    `Based on data retrieved ${dt}${stale?' — a source could not be refreshed and this copy is past its freshness window':''}`+
    (stale&&fetchError?`<br>Why: ${String(fetchError).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}`:'')+`</div>`;
}
function researchBrief(d){
  const wrap=el('div'); wrap.style.cssText='padding:6px 0;font-size:var(--font-size-md);line-height:1.5;';
  const m=d.llm||{}, g=d.grounded||{}, va=d.valuation||{};
  const dsc=s=>(s==null?'':s).toString().replace(/</g,'&lt;');
  let html=_cacheAgeLabel(d.cache_fetched_at, d.cache_stale, d.cache_missing)+
    `<span style="color:var(--color-accent)">${d.ticker}</span> ${ratingBadge(g.rating)}`+(m.rating?` <span class="muted">·</span> ${ratingBadge(m.rating)}`+(m.confidence?` <span class="muted" style="font-size:var(--font-size-sm)">(${m.confidence})</span>`:''):'');
  if(g.target_mean) html+=` <span class="muted">· analyst target $${(+g.target_mean).toFixed(2)}</span>`;
  const th=dsc(m.thesis||m.summary||(m.error?'research error: '+m.error:''));
  if(th) html+=`<div style="color:var(--color-text);margin-top:var(--space-1)">${th}</div>`;
  if(m.bull_case) html+=`<div class="pos" style="font-size:var(--font-size-base);margin-top:var(--space-1)">▲ BULL: ${dsc(m.bull_case)}</div>`;
  if(m.bear_case) html+=`<div class="neg" style="font-size:var(--font-size-base);margin-top:var(--space-1)">▼ BEAR: ${dsc(m.bear_case)}</div>`;
  if(m.key_risks){ const kr=Array.isArray(m.key_risks)?m.key_risks.join('; '):m.key_risks; html+=`<div class="muted" style="font-size:var(--font-size-base);margin-top:var(--space-1)">⚠ RISKS: ${dsc(kr)}</div>`; }
  const fund=d.fundamentals||{}, fu=(fund.available?(fund.metrics||{}):{}), ra=(fund.available?(fund.ratios||{}):{});
  const gb=[]; if(fu.revenue_growth_pct!=null) gb.push('rev '+(fu.revenue_growth_pct>0?'+':'')+fu.revenue_growth_pct+'%'); if(ra.net_margin_pct!=null) gb.push('nm '+ra.net_margin_pct+'%'); if(ra.fcf_margin_pct!=null) gb.push('FCFm '+ra.fcf_margin_pct+'%'); if(ra.debt_to_equity!=null) gb.push('D/E '+ra.debt_to_equity);
  const vb=[]; if(va.pe_forward!=null) vb.push('fwd P/E '+(+va.pe_forward).toFixed(1)); if(va.ps_ttm!=null) vb.push('P/S '+(+va.ps_ttm).toFixed(1)); if(va.dividend_yield_pct!=null) vb.push('yld '+(+va.dividend_yield_pct).toFixed(2)+'%');
  if(gb.length) html+=`<div style="color:var(--color-info);font-size:var(--font-size-sm);margin-top:var(--space-1)">▸ GAAP: ${gb.join(' · ')}</div>`;
  if(vb.length) html+=`<div style="color:var(--color-accent);font-size:var(--font-size-sm);margin-top:var(--space-1)">▸ VAL: ${vb.join(' · ')}</div>`;
  const rd=m.reverse_dcf;
  if(rd && rd.implied_growth_pct!=null){
    const dem=/demanding/.test(rd.assessment||'');
    html+=`<div style="font-size:var(--font-size-sm);margin-top:var(--space-1);color:${dem?'var(--color-accent)':'var(--color-text-muted)'}">▸ REVERSE-DCF: price implies ~${rd.implied_growth_pct}%/yr FCF growth (${rd.years}y)`+
      (rd.vs_actual_growth_pct!=null?` vs ${rd.vs_actual_growth_pct}% actual`:'')+(rd.assessment?` — ${dsc(rd.assessment)}`:'')+`</div>`;
  }
  const ins=d.insider;
  if(ins && ins.available && ins.signal && ins.signal!=='no open-market activity'){
    const usd=v=>{v=+v||0;const a=Math.abs(v);const s=a>=1e6?(v/1e6).toFixed(2)+'M':(a>=1e3?(v/1e3).toFixed(0)+'k':v.toFixed(0));return '$'+s;};
    const buying=/buying/.test(ins.signal), selling=/selling/.test(ins.signal);
    const col=buying?'var(--pos)':(selling?'var(--neg)':'var(--color-text-muted)');
    const b=ins.buy||{}, s=ins.sell||{};
    html+=`<div style="font-size:var(--font-size-sm);margin-top:var(--space-1);color:${col}">▸ INSIDERS (Form 4, ${ins.lookback_days||''}d): <b>${dsc(ins.signal)}</b>`+
      (ins.net_buy_pct!=null?` <span class="muted">net ${ins.net_buy_pct>0?'+':''}${ins.net_buy_pct}%</span>`:'')+
      ` <span class="muted">· buy ${b.count||0}/${usd(b.value)} (${b.insiders||0} ppl) · sell ${s.count||0}/${usd(s.value)} (${s.insiders||0} ppl)`+
      (ins.as_of?` · as of ${dsc(ins.as_of)}`:'')+` · open-market only, context not advice</span></div>`;
  }
  const si=ins&&ins.short_interest;
  if(si && si.short_interest_shares){
    const m=v=>{v=+v||0;return v>=1e6?(v/1e6).toFixed(1)+'M':(v>=1e3?(v/1e3).toFixed(0)+'k':v);};
    html+=`<div style="font-size:var(--font-size-sm);margin-top:var(--space-1);color:${si.flag?'var(--neg)':'var(--color-text-muted)'}">▸ SHORT INTEREST (FINRA, settle ${dsc(si.settlement_date||'')}): `+
      `${m(si.short_interest_shares)} sh${si.change_pct!=null?` (${si.change_pct>0?'+':''}${si.change_pct}% vs prior)`:''}`+
      `${si.days_to_cover!=null?` · days-to-cover ${si.days_to_cover}`:''}`+
      `${si.flag?` · <b>${dsc(si.flag)}</b>`:''} <span class="muted">· context only</span></div>`;
  }
  const inst=d.institutional;
  if(inst && inst.holder_count>0){
    const net=(inst.buying||0)-(inst.selling||0);
    const col=net>0?'var(--pos)':(net<0?'var(--neg)':'var(--color-text-muted)');
    const names=(inst.holders||[]).slice(0,4).map(h=>{const ch=h.change;const s=(ch==='added'||ch==='new')?'▲':((ch==='trimmed'||ch==='exited')?'▼':'•');return s+dsc(h.manager)+(h.pct_change!=null?` ${h.pct_change>0?'+':''}${h.pct_change}%`:'');}).join(' · ');
    html+=`<div style="font-size:var(--font-size-sm);margin-top:var(--space-1);color:${col}">▸ 13F WATCHED HOLDERS: <b>${inst.holder_count}</b> (${inst.buying||0}▲ / ${inst.selling||0}▼ last Q) <span class="muted">${names} · long-only, ≤45d lag, context</span></div>`;
  }
  const ver=m.verification;
  if(ver&&ver.checked&&ver.grounded_score!=null){
    const thr=(ver.threshold!=null?ver.threshold:0.6), sc=Math.round(ver.grounded_score*100), low=ver.grounded_score<thr;
    html+=`<div class="${low?'neg':'pos'}" style="font-size:var(--font-size-sm);margin-top:var(--space-2)">🔍 GROUNDEDNESS ${sc}% <span class="muted">· share of claims supported by the provided data (flagged &lt; ${Math.round(thr*100)}%)</span>`+(ver.assessment?` <span class="muted">· ${dsc(ver.assessment)}</span>`:'')+`</div>`;
    if(Array.isArray(ver.unsupported_claims)&&ver.unsupported_claims.length) html+=`<div class="neg" style="font-size:var(--font-size-sm);margin-top:var(--space-1)">⚑ UNSUPPORTED: ${dsc(ver.unsupported_claims.join('; '))}</div>`;

// On-demand ticker research (2026-07-22 resilience rework). The run now persists server-side
// (RESEARCH_CACHE_FILE via /api/research), so leaving the sub-tab, switching tabs, or reloading no
// longer loses a completed brief: a background poller on /api/research-cache recovers whatever
// finished even if this page's own fetch callback is gone, and a short history of past on-demand
// tickers is kept (RESEARCH_CACHE.recent) instead of only the single most-recent result.
function _researchPending(){ try{ return JSON.parse(localStorage.getItem('fidResearchPending')||'[]')||[]; }catch(_){ return []; } }
function _setResearchPending(a){ try{ localStorage.setItem('fidResearchPending', JSON.stringify(a||[])); }catch(_){} }
function _addPending(t){ const a=_researchPending(); if(a.indexOf(t)<0){ a.push(t); _setResearchPending(a); } }
function _clearPending(t){ _setResearchPending(_researchPending().filter(x=>x!==t)); }
function _onResearchDone(t, d){
  _clearPending(t);
  if(RESEARCH_POLLS[t]){ clearInterval(RESEARCH_POLLS[t]); delete RESEARCH_POLLS[t]; }
  if(d && !d.error){
    const ga=d.generated_at||Math.floor(Date.now()/1000);
    RESEARCH_CACHE.items[t]={ticker:t, generated_at:ga, data:d};
    RESEARCH_CACHE.recent=[{ticker:t, generated_at:ga}].concat((RESEARCH_CACHE.recent||[]).filter(x=>x.ticker!==t));
    LAST_SCAN_ANALYSIS={ticker:t, data:d};
    RESEARCH_ERR=null;
  } else if(d && d.error){ RESEARCH_ERR={ticker:t, error:d.error}; }
  if(TAB==='research' && (SUBTAB.research==='scanner' || !SUBTAB.research)){ render(); }   // refresh the IDEAS view in place if it's open
}
function _startResearchPoll(t, startedAt){
  if(RESEARCH_POLLS[t]) return;
  let tries=0;
  RESEARCH_POLLS[t]=setInterval(()=>{
    tries++;
    if(tries>90){ clearInterval(RESEARCH_POLLS[t]); delete RESEARCH_POLLS[t]; _clearPending(t); return; }   // ~9 min safety cap
    fetch('/api/research-cache?ticker='+encodeURIComponent(t)).then(r=>r.json()).then(rc=>{
      if(rc && rc.found && rc.item && rc.item.data && (rc.item.generated_at||0) >= (startedAt-2)){ _onResearchDone(t, rc.item.data); }
    }).catch(_=>{});
  }, 6000);
}
function _resumeResearchPolls(){ _researchPending().forEach(t=>{ if(!RESEARCH_POLLS[t]) _startResearchPoll(t, 0); }); }
function _showCachedAnalysis(t){ const it=RESEARCH_CACHE.items[t]; if(it && it.data){ LAST_SCAN_ANALYSIS={ticker:t, data:it.data}; RESEARCH_ERR=null; render(); } }
function _renderScanAnalysis(box){
  _researchPending().forEach(t=>{ const w=el('div','muted'); w.style.cssText='font-size:var(--font-size-base);padding:4px 0;';
    w.textContent='⏳ Analyzing '+t+'… (runs server-side — safe to leave this tab or reload; it will appear here when done)'; box.appendChild(w); });
  if(RESEARCH_ERR){ const e=el('div','muted'); e.style.cssText='font-size:var(--font-size-base);color:var(--color-negative);padding:4px 0;'; e.textContent='⚠ '+RESEARCH_ERR.ticker+': '+RESEARCH_ERR.error; box.appendChild(e); }
  const recent=RESEARCH_CACHE.recent||[];
  if(recent.length){
    const hist=el('div'); hist.style.cssText='display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;margin:6px 0;';
    const lbl=el('span','muted'); lbl.style.cssText='font-size:var(--font-size-sm);'; lbl.textContent='recent on-demand (saved): '; hist.appendChild(lbl);
    recent.slice(0,12).forEach(r=>{ const chip=el('span'); chip.style.cssText='cursor:pointer;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);padding:var(--space-1) var(--space-2);font-size:var(--font-size-sm);';
      chip.textContent=r.ticker; chip.title='show saved analysis'; chip.onclick=()=>_showCachedAnalysis(r.ticker); hist.appendChild(chip); });
    box.appendChild(hist);
  }
  let shown=LAST_SCAN_ANALYSIS;
  if((!shown || !shown.data) && recent.length){ const t0=recent[0].ticker, it=RESEARCH_CACHE.items[t0]; if(it && it.data) shown={ticker:t0, data:it.data}; }
  if(shown && shown.data){ box.appendChild(el('div','ph','ON-DEMAND ANALYSIS · '+shown.ticker)); box.appendChild(researchBrief(shown.data)); }
}
function researchIdea(t){
  if(!t) return;
  const startedAt=Math.floor(Date.now()/1000);
  _addPending(t); RESEARCH_ERR=null;
  const box=document.getElementById('scan-analysis');
  if(box){ box.innerHTML=''; box.appendChild(el('div','ph','ON-DEMAND ANALYSIS · '+t));
    const wait=el('div','muted'); wait.style.cssText='font-size:var(--font-size-base);padding:6px 0;';
    wait.textContent='Analyzing '+t+'… the model runs for a minute or two (SEC fundamentals + analyst + news → LLM), then a second 🔍 groundedness pass fact-checks the brief. The result is saved server-side — you can leave this sub-tab or reload and it will appear here when it finishes.';
    box.appendChild(wait); box.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  _startResearchPoll(t, startedAt);   // safety net: recovers the result even if this fetch's callback is lost to a navigation/reload
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 300000);
  fetch('/api/research?ticker='+encodeURIComponent(t),{signal:ctl.signal}).then(r=>r.json()).then(d=>{ clearTimeout(to); _onResearchDone(t, d); })
    .catch(e=>{ clearTimeout(to); /* leave the poll running: an aborted/failed direct fetch may still be completing + persisting server-side */ });
}

// ---- Multiple income sources per earner (2026-07-24) --------------------------------------
// Optional itemized breakdown feeding income_self/income_spouse's SUM automatically (see
// _income_sources_total() / _read_insurance_cfg() in app.py) — a household that never adds a row
// here just keeps using the plain single-number field exactly as before.
const INCSRC_TYPES=[['w2','W-2 salary'],['1099','1099 contract'],['self_employment','Self-employment'],['rental','Rental income'],['pension','Pension'],['other','Other']];
function incSrcArr(who){ return who==='self'?INCSRC_SELF:INCSRC_SPOUSE; }
function syncIncSrcFromDOM(who){
  const arr=incSrcArr(who);
  arr.forEach((r,i)=>{
    const l=document.getElementById(`incsrc-${who}-${i}-label`);
    const t=document.getElementById(`incsrc-${who}-${i}-type`);
    const a=document.getElementById(`incsrc-${who}-${i}-amt`);
    const n=document.getElementById(`incsrc-${who}-${i}-notes`);
    if(l) r.label=l.value;
    if(t) r.type=t.value;
    if(a) r.annual_amount=a.value===''?null:parseFloat(a.value);
    if(n) r.notes=n.value;
  });
}
function incSrcRedraw(who){
  const wrap=document.getElementById(`incsrc-${who}-wrap`);
  if(wrap) wrap.innerHTML=incSrcTableHtml(who);
}
function addIncSrcRow(who){
  syncIncSrcFromDOM(who);
  incSrcArr(who).push({label:'',type:'w2',annual_amount:null,notes:''});
  incSrcRedraw(who);
}
function removeIncSrcRow(who,idx){
  syncIncSrcFromDOM(who);
  incSrcArr(who).splice(idx,1);
  incSrcRedraw(who);
}
function incSrcTableHtml(who){
  const arr=incSrcArr(who);
  const total=arr.reduce((s,r)=>s+(parseFloat(r.annual_amount)||0),0);
  let rows=arr.map((r,i)=>`<tr>`+
    `<td><input id="incsrc-${who}-${i}-label" type="text" value="${esc(r.label||'')}" placeholder="e.g. Main job, Consulting" style="width:140px;"/></td>`+
    `<td><select id="incsrc-${who}-${i}-type" style="width:130px;">`+INCSRC_TYPES.map(([v,l])=>`<option value="${v}"${(r.type||'w2')===v?' selected':''}>${l}</option>`).join('')+`</select></td>`+
    `<td><input id="incsrc-${who}-${i}-amt" type="number" step="500" value="${r.annual_amount!=null?r.annual_amount:''}" placeholder="$/yr" style="width:100px;"/></td>`+
    `<td><input id="incsrc-${who}-${i}-notes" type="text" value="${esc(r.notes||'')}" placeholder="notes" style="width:110px;"/></td>`+
    `<td><button type="button" onclick="removeIncSrcRow('${who}',${i})" title="Remove this source" style="font-size:var(--font-size-sm);padding:0 var(--space-2);">✕</button></td>`+
    `</tr>`).join('');
  if(!rows) rows=`<tr><td colspan="5" class="muted" style="font-size:var(--font-size-sm);padding:4px 0;">No itemized sources yet — the single income field above still works on its own.</td></tr>`;
  return `<table style="margin:4px 0;"><tr><th class="l">Label</th><th class="l">Type</th><th class="l">$/yr</th><th class="l">Notes</th><th></th></tr>${rows}`+
    `<tr><td colspan="5" style="padding-top:4px;">`+
    `<button type="button" onclick="addIncSrcRow('${who}')" style="font-size:var(--font-size-sm);">+ add income source</button> `+
    (arr.length?`<span class="muted" style="font-size:var(--font-size-sm);">total: $${Math.round(total).toLocaleString()}/yr — replaces the single field above once saved</span>`:'')+
    `</td></tr></table>`;
}

function saveRetire(){
  const num=id=>{const x=document.getElementById(id).value; return x===''?null:parseFloat(x);};
  const val=id=>{const e=document.getElementById(id); return e?e.value:'';};
  const body={
    withdrawal_rate_pct: num('ret-wr')||4,
    expected_real_return_pct: num('ret-rr')||5,
    target_age: num('ret-tage')||60,
    annual_expenses_override: num('ret-exp'),
    annual_savings_override: num('ret-sav'),
    income_target_yield_pct: num('ret-yield')||3.5,
    optimistic_real_return_pct: num('ret-opt')||8,
    volatility_pct: num('ret-vol'),
  };
  // Tax / ACA / SS — only send keys the user actually filled, so a blank never
  // clobbers a stored value. filing_status is a select (always present).
  const fs=val('ret-fs'); if(fs) body.filing_status=fs;
  const stEl=document.getElementById('ret-state'); if(stEl) body.state_of_residence=stEl.value||null;
  const opt=(id,key,xf)=>{const v=num(id); if(v!=null) body[key]=xf?xf(v):v;};
  opt('ret-fill','convert_fill_to_rate',v=>v/100);   // UI shows % ; config stores a decimal rate
  opt('ret-needs','needs_pct_of_expenses');          // funded-ratio needs/wants split (G1)
  opt('ret-hh','household_size');
  opt('ret-slcsp','aca_slcsp_annual');
  opt('ret-by','birth_year');
  opt('ret-ca','ss_claim_age');
  opt('ret-ssb','ss_estimated_fra_benefit');
  opt('ret-sby','spouse_birth_year');
  opt('ret-sca','spouse_ss_claim_age');
  opt('ret-sssb','spouse_ss_estimated_fra_benefit');
  // income_self/income_spouse/no_income moved here from PLAN->INSURANCE (2026-07-25) but are
  // still stored via /api/insurance-config -- fire both saves together, refresh once both land.
  const g=id=>document.getElementById(id);
  const incBody={};
  if(g('ret-inc-s')) incBody.income_self=numOrNull(g('ret-inc-s').value);
  if(g('ret-inc-sp')) incBody.income_spouse=numOrNull(g('ret-inc-sp').value);
  if(g('ret-no-income')) incBody.no_income=g('ret-no-income').checked;
  // Multiple income sources (2026-07-24) — sync any in-progress row edits, then send full-
  // replacement lists; a still-empty list leaves income_self/income_spouse as the plain manual
  // number above (see _read_insurance_cfg() in app.py).
  syncIncSrcFromDOM('self'); syncIncSrcFromDOM('spouse');
  incBody.income_sources_self=INCSRC_SELF.filter(r=>(r.label||'').trim());
  incBody.income_sources_spouse=INCSRC_SPOUSE.filter(r=>(r.label||'').trim());
  Promise.all([
    fetch('/api/retirement-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),
    fetch('/api/insurance-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(incBody)})
  ]).then(()=>load(false)).catch(e=>alert('Save failed: '+e));
}

  sub.textContent=`financial independence · today's dollars · informational, not advice · updated ${new Date(r.generated_at*1000).toLocaleString()}`;

    INCSRC_SELF=JSON.parse(JSON.stringify((INS&&INS.income_sources_self)||[]));
    INCSRC_SPOUSE=JSON.parse(JSON.stringify((INS&&INS.income_sources_spouse)||[]));

// Categories in each group are mutually-exclusive shares of the SAME whole portfolio (every
// holding has exactly one Monarch type / one IPS sleeve), so their targets can legitimately sum
// to LESS than 100% (categories you haven't set a target for absorb the rest) but never MORE —
// that would be targeting >100% of your money. Live sum + save-time guard catch entry mistakes.
function _polSumOf(cls){
  let s=0; document.querySelectorAll(cls).forEach(i=>{ const v=parseFloat(i.value); if(!isNaN(v)) s+=v; });
  return Math.round(s*100)/100;
}
function _updatePolSums(){
  const ts=_polSumOf('.pol-type'), ss=_polSumOf('.pol-sleeve');
  const fmt=(sum,el)=>{
    if(!el) return;
    if(sum>100.5){ el.className='neg'; el.textContent=`Σ ${sum}% — exceeds 100%, fix before saving`; }
    else if(sum<99.5){ el.className='muted'; el.textContent=`Σ ${sum}% (remaining ${Math.round((100-sum)*100)/100}% has no explicit target)`; }
    else { el.className='pos'; el.textContent=`Σ ${sum}%`; }
  };
  fmt(ts, document.getElementById('pol-type-sum'));
  fmt(ss, document.getElementById('pol-sleeve-sum'));
}
function savePolicy(){
  const targets={};
  document.querySelectorAll('.pol-type').forEach(i=>{ const v=parseFloat(i.value); if(!isNaN(v)) targets[i.dataset.type]=v; });
  const sleeves={};
  document.querySelectorAll('.pol-sleeve').forEach(i=>{ const v=parseFloat(i.value); if(!isNaN(v)) sleeves[i.dataset.sleeve]=v; });
  const caps={};
  (document.getElementById('pol-caps').value||'').split(',').forEach(p=>{
    const m=p.split(':'); const t=(m[0]||'').trim().toUpperCase(); const v=parseFloat((m[1]||'').trim());
    if(t && !isNaN(v)) caps[t]=v;
  });
  const ts=_polSumOf('.pol-type'), ss=_polSumOf('.pol-sleeve');
  const over=[]; if(ts>100.5) over.push(`Targets by type sum to ${ts}%`); if(ss>100.5) over.push(`IPS sleeves sum to ${ss}%`);
  if(over.length && !confirm(over.join('; ')+' — that targets more than 100% of the portfolio. Save anyway?')) return;
  const body={ targets_by_type:targets, targets_by_sleeve:sleeves,
    max_position_pct: parseFloat(document.getElementById('pol-maxcap').value)||10,
    drift_threshold_pct: parseFloat(document.getElementById('pol-drift').value)||5,
    position_caps: caps };
  fetch('/api/policy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(d=>{
      // optimistic: merge the saved policy straight into INSIGHTS and re-render NOW, before load()'s
      // ~40-endpoint batch resolves — otherwise the still-stale INSIGHTS gets rendered first and the
      // fields you just set flash back to their pre-save values for the several seconds that takes
      if(d && d.ok && d.policy && INSIGHTS){
        INSIGHTS.policy=d.policy;
        if(INSIGHTS.allocation) INSIGHTS.allocation.forEach(a=>{ if(d.policy.targets_by_type && d.policy.targets_by_type[a.type]!=null) a.target_pct=d.policy.targets_by_type[a.type]; });
        if(TAB==='insights') render();
      }
      load(false);
    }).catch(e=>alert('Save failed: '+e));
}
