  if(TAB==='research' && !haveResearch) TAB='positions';
  if(TAB==='insights' && !haveInsights) TAB='positions';
  if(TAB==='plan' && !havePlan) TAB='positions';
  if(TAB==='audits' && !haveAudits) TAB='positions';
  if(TAB==='strategist' && !haveStrat) TAB='positions';
  const _gear=document.getElementById('gear'); if(_gear) _gear.style.color=(TAB==='settings')?'var(--amber)':'';
  const p=el('div','panel'); p.style.marginTop='10px';
  const tabBar=el('div'); tabBar.style.cssText='display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--bd);padding-bottom:7px;margin-bottom:10px;flex-wrap:wrap;';
  const tabSpecsRaw=[['dashboard','DASHBOARD'],['positions',`OVERVIEW · ${d.unique_securities}`]];
  if(haveResearch) tabSpecsRaw.push(['research','RESEARCH · IDEAS']);
  if(haveInsights) tabSpecsRaw.push(['insights','RISK · EXPOSURE']);
  if(havePlan) tabSpecsRaw.push(['plan','PLAN · FI']);
  if(haveAudits) tabSpecsRaw.push(['audits','AUDITS · TAX·FEES']);
  if(haveStrat) tabSpecsRaw.push(['strategist','STRATEGIST']);
  tabSpecsRaw.push(['chat','CHAT']);   // Fiduciary / Strategist chat — always available (Phase 4, replaces OWUI)
  tabSpecsRaw.push(['wiki','WIKI']);   // in-app help — always available (rightmost)
  // SETTINGS is NOT a top tab — it opens from the ⚙ gear in the top-right (N11).
  // Apply the user-dragged order (TABORDER, persisted); unknown/new keys (e.g. a tab that only
  // appears once data loads) fall to the end rather than disappearing.
  const tabSpecs = TABORDER.length
    ? tabSpecsRaw.slice().sort((a,b)=>{ const ix=k=>{ const i=TABORDER.indexOf(k); return i<0?999:i; }; return ix(a[0])-ix(b[0]); })
    : tabSpecsRaw;
  const topTabKeys = tabSpecs.map(ts=>ts[0]);
  const mkTab=(key,label)=>{
    const active=TAB===key;
    const t=el('span',null,label);
    t.title='drag to reorder';

function cockpitPanel(){
  const p=el('div','panel'); p.style.cssText='margin-bottom:10px;padding:9px 12px;';
  const head=el('div'); head.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:7px;';
  head.innerHTML='<span class="ph" style="border:none;padding:0;margin:0;">⚑ COCKPIT · WHAT NEEDS ATTENTION</span>';
  head.appendChild(wikiLink('cockpit'));
  p.appendChild(head);
  const anyLoaded = EXP||INSIGHTS||TAX||TAXAUDIT||FL||RETIRE||DISCO;
  if(!anyLoaded){ const m=el('div','muted'); m.style.cssText='font-size:11px;'; m.textContent='Scanning your book (drift · concentration · tax · fees · liquidity · outlook)…'; p.appendChild(m); return p; }
  const A=[];  // {sev: warn|opp|info|ok, cat, msg, tab}
  if(EXP && !EXP.error){
    ((EXP.concentration||{}).flags||[]).forEach(f=>A.push({sev:'warn',cat:'CONCENTRATION',msg:f,tab:'insights'}));
    if(EXP.portfolio_beta!=null && EXP.portfolio_beta>1.3) A.push({sev:'warn',cat:'BETA',msg:'portfolio beta '+EXP.portfolio_beta,tab:'insights'});
  }
  if(INSIGHTS && !INSIGHTS.error){
    const nOver=(INSIGHTS.concentration||[]).length;
    if(nOver) A.push({sev:'warn',cat:'OVER CAP',msg:nOver+' position(s) over your cap',tab:'insights'});
    const nDrift=(INSIGHTS.allocation||[]).filter(a=>a.flag).length;
    if(nDrift) A.push({sev:'warn',cat:'DRIFT',msg:nDrift+' sleeve(s) out of band',tab:'insights'});
  }
  if(TAXAUDIT && !TAXAUDIT.error){
    const tlh=TAXAUDIT.tax_loss_harvest||{};
    if(tlh.total_harvestable_loss && Math.abs(tlh.total_harvestable_loss)>0)
      A.push({sev:'opp',cat:'TAX-LOSS',msg:usd(Math.abs(tlh.total_harvestable_loss))+' harvestable ('+(tlh.count||0)+')',tab:'audits'});
    const nLoc=((TAXAUDIT.asset_location||{}).misplaced||[]).length;
    if(nLoc) A.push({sev:'opp',cat:'ASSET LOC',msg:nLoc+' holding(s) misplaced',tab:'audits'});
  }
  if(FL && !FL.error){
    const nHigh=(((FL.fees||{}).funds)||[]).filter(x=>x.high).length;
    if(nHigh) A.push({sev:'warn',cat:'FEES',msg:nHigh+' high-cost fund(s)',tab:'audits'});
    const nLiq=(((FL.liquidity||{}).flagged)||[]).length;
    if(nLiq) A.push({sev:'warn',cat:'LIQUIDITY',msg:nLiq+' hard-to-exit',tab:'audits'});
  }
  if(DISCO && !DISCO.error){
    const nA=((DISCO.alerts)||[]).length;
    if(nA) A.push({sev:'info',cat:'NEWS',msg:nA+' holding alert(s)',tab:'research'});
  }
  if(RETIRE && !RETIRE.error && RETIRE.monte_carlo && RETIRE.monte_carlo.success_pct!=null){
    const sp=RETIRE.monte_carlo.success_pct;
    A.push({sev: sp>=80?'ok':(sp>=60?'info':'warn'), cat:'FIRE', msg:sp+'% success', tab:'plan'});
  }
  if(RETIRE && !RETIRE.error && RETIRE.bridge && RETIRE.bridge.aca){
    const ac=RETIRE.bridge.aca, fl=ac.flags||{}, sub=ac.subsidy||{}, fp=sub.fpl_pct;
    if(fl.over_cliff) A.push({sev:'warn',cat:'ACA CLIFF',msg:'bridge MAGI '+(fp||'?')+'% FPL — over 400%, $0 subsidy',tab:'plan'});
    else if(fl.below_floor_gap) A.push({sev:'warn',cat:'ACA GAP',msg:'MAGI <100% FPL — TX coverage gap',tab:'plan'});
    else if(fl.on_cliff_edge) A.push({sev:'info',cat:'ACA',msg:(fp||'?')+'% FPL — near 400% cliff',tab:'plan'});
  }
  if(LT && !LT.error && LT.hidden_exposure){
    LT.hidden_exposure.filter(h=>h.ticker && (h.weight_pct||0)>20).slice(0,3).forEach(h=>{
      A.push({sev:'warn',cat:'HIDDEN EXPOSURE',msg:h.ticker+' truly '+h.weight_pct+'% incl. funds',tab:'insights'});
    });
  }
  if(!A.length){ const ok=el('div'); ok.style.cssText='font-size:12px;color:var(--grn);'; ok.textContent='✓ All clear — nothing over your thresholds right now.'; p.appendChild(ok); return p; }
  const colOf={warn:'var(--amber)',opp:'var(--grn)',ok:'var(--grn)',info:'var(--mut)'};
  const strip=el('div'); strip.style.cssText='display:flex;flex-wrap:wrap;gap:7px;';
  A.forEach(a=>{
    const c=colOf[a.sev]||'var(--mut)';
    const chip=el('span');
    chip.style.cssText=`cursor:pointer;border:1px solid ${c};border-left:3px solid ${c};border-radius:3px;`+
      `padding:3px 9px;font-size:11px;color:var(--txt);white-space:nowrap;`;
    chip.innerHTML=`<span style="color:${c};letter-spacing:1px;">${a.cat}</span> <span class="muted">·</span> ${a.msg}`;
    chip.title='Go to '+a.tab.toUpperCase()+' tab';
    chip.onclick=()=>{ TAB=a.tab; render(); };
    strip.appendChild(chip);
  });
  p.appendChild(strip);
  return p;
}

function accountsPanel(d){
  const p=el('div','panel');
  const _ah=el('div','ph','ACCOUNTS'); _ah.appendChild(wikiLink('accounts-panel')); p.appendChild(_ah);
  d.by_account.forEach(a=>{
    const row=el('div','row');
    row.innerHTML=`<span class="nm">${a.account}<br><span class="sub">${shortInst(a.institution)}</span></span>`+
      `<span style="text-align:right">${usd(a.value)}</span>`;
    p.appendChild(row);
  });
  // OTHER ASSETS & LIABILITIES: everything in the net-worth roll-up that ISN'T a
  // holdings/brokerage account — cash, the home (Zillow-valued), and all debts.
  // These move net worth but were invisible here (this panel only listed
  // holdings accounts), so the home + liabilities never showed. Liabilities carry
  // a POSITIVE balance in the feed (= debt owed) and are shown negative/red.
  const held=new Set((d.by_account||[]).map(a=>a.account));
  const other=(d.accounts||[]).filter(a=>!held.has(a.name) && Math.round(a.balance||0)!==0);
  const assets=other.filter(a=>a.is_asset!==false);
  const liabs =other.filter(a=>a.is_asset===false);
  const subhead=t=>{ const s=el('div','sub'); s.style.cssText='margin:9px 0 2px;letter-spacing:1px;color:var(--mut);'; s.textContent=t; return s; };
  const line=(nm,inst,val,neg)=>{
    const row=el('div','row');
    row.innerHTML=`<span class="nm">${nm}<br><span class="sub">${shortInst(inst||'—')}</span></span>`+
      `<span class="${neg?'neg':''}" style="text-align:right">${neg?'-'+usd(Math.abs(val)):usd(val)}</span>`;
    return row;
  };
  if(assets.length){
    p.appendChild(subhead('OTHER ASSETS'));
    assets.sort((a,b)=>(b.balance||0)-(a.balance||0)).forEach(a=>p.appendChild(line(a.name,a.institution,a.balance,false)));
  }
  if(liabs.length){
    p.appendChild(subhead('LIABILITIES'));
    liabs.sort((a,b)=>(b.balance||0)-(a.balance||0)).forEach(a=>p.appendChild(line(a.name,a.institution,a.balance,true)));
  }
  return p;
}

function positionsTable(positions){
  positions.forEach(p=>p._analyst=analystRating(p.ticker));
  const cols=[
    ['ticker','SYM','l'],['name','NAME','l'],['account','ACCT','l'],['_analyst','ANALYST','l'],
    ['quantity','QTY'],['price','PX'],['value','VALUE'],
    ['cost_total','COST'],['gain','UNREAL'],['gain_pct','P/L%'],['day_pct','DAY%']
  ];
  const tbl=el('table');
  const thead=el('tr');
  cols.forEach(c=>{
    const th=el('th',c[2]==='l'?'l':'', c[1]+(SORT.key===c[0]?(SORT.dir<0?' ▾':' ▴'):''));
    th.onclick=()=>{ if(SORT.key===c[0])SORT.dir*=-1; else {SORT.key=c[0];SORT.dir=-1;} render(); };
    thead.appendChild(th);
  });
  tbl.appendChild(thead);
  const sorted=[...positions].sort((a,b)=>{
    let x=a[SORT.key], y=b[SORT.key];
    if(typeof x==='string'||typeof y==='string'){ x=(x||'').toString(); y=(y||'').toString(); return SORT.dir*x.localeCompare(y); }
    return SORT.dir*(((x??-1e15))-((y??-1e15)));
  });
  sorted.forEach(p=>{
    const tr=el('tr');
    tr.innerHTML =
      `<td class="sym">${p.ticker}</td>`+
      `<td class="name" title="${(p.name||'').replace(/"/g,'')}">${p.name||''}</td>`+
      `<td class="l muted">${shortInst(p.institution)}</td>`+
      `<td class="l">${ratingBadge(p._analyst)}</td>`+
      `<td>${p.quantity!=null?(+p.quantity).toLocaleString(undefined,{maximumFractionDigits:2}):'—'}</td>`+
      `<td>${p.price!=null?'$'+(+p.price).toFixed(2):'—'}</td>`+
      `<td>${usd(p.value)}</td>`+
      `<td class="muted">${usd(p.cost_total)}</td>`+
      `<td class="${cls(p.gain)}">${sgn(p.gain)}</td>`+
      `<td class="${cls(p.gain_pct)}">${pct(p.gain_pct)}</td>`+
      `<td class="${cls(p.day_pct)}">${pct(p.day_pct)}</td>`;
    tbl.appendChild(tr);
  });
  return tbl;
}

    sc.innerHTML=`<span class="ph" style="border:none;padding:0;margin:0;font-size:11px;">AI TRACK RECORD</span> `+
      `<span class="muted">(${s.scored_calls} scored calls, ≥${s.min_age_days}d fwd):</span> `+
      `Buy <span class="${(br.Buy&&br.Buy.avg_fwd_return_pct>=0)?'pos':'neg'}">${rr(br.Buy)}</span> · `+
      `Hold ${rr(br.Hold)} · Sell <span class="${(br.Sell&&br.Sell.avg_fwd_return_pct<=0)?'pos':'neg'}">${rr(br.Sell)}</span> · `+
      `Buy−Hold <span class="${(s.buy_minus_hold_pct||0)>=0?'pos':'neg'}">${s.buy_minus_hold_pct==null?'—':(s.buy_minus_hold_pct>0?'+':'')+s.buy_minus_hold_pct+'pt'}</span> · `+
      `hit-rate ${s.directional_hit_rate_pct==null?'—':s.directional_hit_rate_pct+'%'}`;
    wrap.appendChild(sc);
  }
  const head=el('div'); head.style.cssText='display:grid;grid-template-columns:70px 150px 1fr;gap:8px;font-size:10px;color:var(--mut);letter-spacing:1px;border-bottom:1px solid var(--bd2);padding:3px 0;';
  head.innerHTML='<span>SYM</span><span>ANALYST · MODEL</span><span>THESIS</span>';
  wrap.appendChild(head);
  const badge=r=>{ if(!r) return '<span class="muted">—</span>'; const c=r==='Buy'?'var(--grn)':(r==='Sell'?'var(--red)':'var(--amber)'); return `<span style="color:${c}">${r}</span>`; };
  const fundLine=b=>{
    const f=b.fundamentals, v=b.valuation, out=[];
    if(f && f.available){
      const m=f.metrics||{}, r=f.ratios||{}, bits=[];
      if(m.fiscal_year_end) bits.push('FY'+String(m.fiscal_year_end).slice(0,4));
      if(m.revenue_growth_pct!=null) bits.push('rev '+(m.revenue_growth_pct>0?'+':'')+m.revenue_growth_pct+'%');
      if(r.net_margin_pct!=null) bits.push('nm '+r.net_margin_pct+'%');
      if(r.return_on_equity_pct!=null) bits.push('ROE '+r.return_on_equity_pct+'%');
      if(r.fcf_margin_pct!=null) bits.push('FCFm '+r.fcf_margin_pct+'%');
      if(r.debt_to_equity!=null) bits.push('Liab/Eq '+r.debt_to_equity);
      if(r.quality_of_earnings!=null) bits.push('QoE '+r.quality_of_earnings);
      out.push(`<span style="display:block;color:var(--blu);font-size:10px;margin-top:3px">▸ GAAP: ${bits.join(' · ')}</span>`);
      const sco=f.scores||{}, pf=sco.piotroski_f, az=sco.altman_z, sb=[];
      if(pf) sb.push(`<span class="${pf.rating==='strong'?'pos':(pf.rating==='weak'?'neg':'')}">Piotroski F ${pf.score}/${pf.of}</span>`);
      if(az) sb.push(`<span class="${az.zone==='safe'?'pos':(az.zone==='distress'?'neg':'')}">Altman Z′ ${az.z_score} (${az.zone})</span>`);
      if(sb.length) out.push(`<span style="display:block;color:var(--blu);font-size:10px;margin-top:2px">▸ SCORES: ${sb.join(' · ')}</span>`);
    } else if(f){
      out.push(`<span style="display:block;color:var(--dim);font-size:10px;margin-top:3px">▸ GAAP: not SEC-filed</span>`);
    }
    if(v && (v.pe_ttm!=null||v.pb!=null||v.dividend_yield_pct!=null)){
      const vb=[];
      if(v.pe_ttm!=null) vb.push('P/E '+(+v.pe_ttm).toFixed(1));
      if(v.pe_forward!=null) vb.push('fwd '+(+v.pe_forward).toFixed(1));
      if(v.pb!=null) vb.push('P/B '+(+v.pb).toFixed(1));
      if(v.ps_ttm!=null) vb.push('P/S '+(+v.ps_ttm).toFixed(1));
      if(v.dividend_yield_pct!=null) vb.push('yld '+(+v.dividend_yield_pct).toFixed(2)+'%');
      out.push(`<span style="display:block;color:var(--amber);font-size:10px;margin-top:2px">▸ VAL: ${vb.join(' · ')}</span>`);
    }
    return out.join('');
  };
  const briefs=a.briefs;
  // sort: actionable calls first (Buy, Sell, then Hold), then by model confidence, then ticker
  const RANK={Buy:0,Sell:1,Hold:2}, CONF={high:0,med:1,low:2};
  const sortedKeys=Object.keys(briefs).sort((x,y)=>{
    const mx=(briefs[x]||{}).llm||{}, my=(briefs[y]||{}).llm||{};
    const rx=RANK[mx.rating]==null?3:RANK[mx.rating], ry=RANK[my.rating]==null?3:RANK[my.rating];
    if(rx!==ry) return rx-ry;
    const cx=CONF[mx.confidence]==null?3:CONF[mx.confidence], cy=CONF[my.confidence]==null?3:CONF[my.confidence];
    if(cx!==cy) return cx-cy;
    return x.localeCompare(y);
  });
  sortedKeys.forEach(t=>{
    const b=briefs[t]||{}, g=b.grounded||{}, m=b.llm||{};
    const esc=s=>(s==null?'':s).toString().replace(/</g,'&lt;');
    const thesis=esc(m.thesis||m.summary||(m.error?'model error: '+m.error:''));
    const extra=[];
    if(m.bull_case) extra.push(`<span class="pos" style="display:block;font-size:11px;margin-top:4px">▲ BULL: ${esc(m.bull_case)}</span>`);
    if(m.bear_case) extra.push(`<span class="neg" style="display:block;font-size:11px;margin-top:2px">▼ BEAR: ${esc(m.bear_case)}</span>`);
    if(m.key_risks){ const kr=Array.isArray(m.key_risks)?m.key_risks.join('; '):m.key_risks; extra.push(`<span class="muted" style="display:block;font-size:11px;margin-top:2px">⚠ RISKS: ${esc(kr)}</span>`); }
    const tgt=g.target_mean?` <span class="muted" style="font-size:11px">$${Math.round(g.target_mean)}</span>`:'';
    const conf=m.confidence?` <span class="muted" style="font-size:10px">(${m.confidence})</span>`:'';
    const row=el('div'); row.id='brief-'+t; row.style.cssText='display:grid;grid-template-columns:70px 150px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #191c20;font-size:12px;align-items:start;transition:background 0.4s;';
    row.innerHTML=`<span style="color:var(--amber)">${t}</span>`+
      `<span>${badge(g.rating)}${tgt} <span class="muted">·</span> ${badge(m.rating)}${conf}</span>`+
      `<span style="line-height:1.45"><span class="muted">${thesis||'—'}</span>${extra.join('')}${fundLine(b)}</span>`;
    wrap.appendChild(row);
  });
  return wrap;
}

function researchBrief(d){
  const wrap=el('div'); wrap.style.cssText='padding:6px 0;font-size:12px;line-height:1.5;';
  const m=d.llm||{}, g=d.grounded||{}, va=d.valuation||{};
  const dsc=s=>(s==null?'':s).toString().replace(/</g,'&lt;');
  let html=`<span style="color:var(--amber)">${d.ticker}</span> ${ratingBadge(g.rating)}`+(m.rating?` <span class="muted">·</span> ${ratingBadge(m.rating)}`+(m.confidence?` <span class="muted" style="font-size:10px">(${m.confidence})</span>`:''):'');
  if(g.target_mean) html+=` <span class="muted">· analyst target $${(+g.target_mean).toFixed(2)}</span>`;
  const th=dsc(m.thesis||m.summary||(m.error?'research error: '+m.error:''));
  if(th) html+=`<div class="muted" style="margin-top:4px">${th}</div>`;
  if(m.bull_case) html+=`<div class="pos" style="font-size:11px;margin-top:3px">▲ BULL: ${dsc(m.bull_case)}</div>`;
  if(m.bear_case) html+=`<div class="neg" style="font-size:11px;margin-top:2px">▼ BEAR: ${dsc(m.bear_case)}</div>`;
  if(m.key_risks){ const kr=Array.isArray(m.key_risks)?m.key_risks.join('; '):m.key_risks; html+=`<div class="muted" style="font-size:11px;margin-top:2px">⚠ RISKS: ${dsc(kr)}</div>`; }
  const fund=d.fundamentals||{}, fu=(fund.available?(fund.metrics||{}):{}), ra=(fund.available?(fund.ratios||{}):{});
  const gb=[]; if(fu.revenue_growth_pct!=null) gb.push('rev '+(fu.revenue_growth_pct>0?'+':'')+fu.revenue_growth_pct+'%'); if(ra.net_margin_pct!=null) gb.push('nm '+ra.net_margin_pct+'%'); if(ra.fcf_margin_pct!=null) gb.push('FCFm '+ra.fcf_margin_pct+'%'); if(ra.debt_to_equity!=null) gb.push('D/E '+ra.debt_to_equity);
  const vb=[]; if(va.pe_forward!=null) vb.push('fwd P/E '+(+va.pe_forward).toFixed(1)); if(va.ps_ttm!=null) vb.push('P/S '+(+va.ps_ttm).toFixed(1)); if(va.dividend_yield_pct!=null) vb.push('yld '+(+va.dividend_yield_pct).toFixed(2)+'%');
  if(gb.length) html+=`<div style="color:var(--blu);font-size:10px;margin-top:4px">▸ GAAP: ${gb.join(' · ')}</div>`;
  if(vb.length) html+=`<div style="color:var(--amber);font-size:10px;margin-top:1px">▸ VAL: ${vb.join(' · ')}</div>`;
  const rd=m.reverse_dcf;
  if(rd && rd.implied_growth_pct!=null){
    const dem=/demanding/.test(rd.assessment||'');
    html+=`<div style="font-size:10px;margin-top:1px;color:${dem?'var(--amber)':'var(--mut)'}">▸ REVERSE-DCF: price implies ~${rd.implied_growth_pct}%/yr FCF growth (${rd.years}y)`+
      (rd.vs_actual_growth_pct!=null?` vs ${rd.vs_actual_growth_pct}% actual`:'')+(rd.assessment?` — ${dsc(rd.assessment)}`:'')+`</div>`;
  }
  const ins=d.insider;
  if(ins && ins.available && ins.signal && ins.signal!=='no open-market activity'){
    const usd=v=>{v=+v||0;const a=Math.abs(v);const s=a>=1e6?(v/1e6).toFixed(2)+'M':(a>=1e3?(v/1e3).toFixed(0)+'k':v.toFixed(0));return '$'+s;};
    const buying=/buying/.test(ins.signal), selling=/selling/.test(ins.signal);
    const col=buying?'var(--pos)':(selling?'var(--neg)':'var(--mut)');
    const b=ins.buy||{}, s=ins.sell||{};
    html+=`<div style="font-size:10px;margin-top:1px;color:${col}">▸ INSIDERS (Form 4, ${ins.lookback_days||''}d): <b>${dsc(ins.signal)}</b>`+
      (ins.net_buy_pct!=null?` <span class="muted">net ${ins.net_buy_pct>0?'+':''}${ins.net_buy_pct}%</span>`:'')+
      ` <span class="muted">· buy ${b.count||0}/${usd(b.value)} (${b.insiders||0} ppl) · sell ${s.count||0}/${usd(s.value)} (${s.insiders||0} ppl)`+
      (ins.as_of?` · as of ${dsc(ins.as_of)}`:'')+` · open-market only, context not advice</span></div>`;
  }
  const si=ins&&ins.short_interest;
  if(si && si.short_interest_shares){
    const m=v=>{v=+v||0;return v>=1e6?(v/1e6).toFixed(1)+'M':(v>=1e3?(v/1e3).toFixed(0)+'k':v);};
    html+=`<div style="font-size:10px;margin-top:1px;color:${si.flag?'var(--neg)':'var(--mut)'}">▸ SHORT INTEREST (FINRA, settle ${dsc(si.settlement_date||'')}): `+
      `${m(si.short_interest_shares)} sh${si.change_pct!=null?` (${si.change_pct>0?'+':''}${si.change_pct}% vs prior)`:''}`+
      `${si.days_to_cover!=null?` · days-to-cover ${si.days_to_cover}`:''}`+
      `${si.flag?` · <b>${dsc(si.flag)}</b>`:''} <span class="muted">· context only</span></div>`;
  }
  const inst=d.institutional;
  if(inst && inst.holder_count>0){
    const net=(inst.buying||0)-(inst.selling||0);
    const col=net>0?'var(--pos)':(net<0?'var(--neg)':'var(--mut)');
    const names=(inst.holders||[]).slice(0,4).map(h=>{const ch=h.change;const s=(ch==='added'||ch==='new')?'▲':((ch==='trimmed'||ch==='exited')?'▼':'•');return s+dsc(h.manager)+(h.pct_change!=null?` ${h.pct_change>0?'+':''}${h.pct_change}%`:'');}).join(' · ');
    html+=`<div style="font-size:10px;margin-top:1px;color:${col}">▸ 13F WATCHED HOLDERS: <b>${inst.holder_count}</b> (${inst.buying||0}▲ / ${inst.selling||0}▼ last Q) <span class="muted">${names} · long-only, ≤45d lag, context</span></div>`;
  }
  const ver=m.verification;
  if(ver&&ver.checked&&ver.grounded_score!=null){
    const thr=(ver.threshold!=null?ver.threshold:0.6), sc=Math.round(ver.grounded_score*100), low=ver.grounded_score<thr;
    html+=`<div class="${low?'neg':'pos'}" style="font-size:10px;margin-top:6px">🔍 GROUNDEDNESS ${sc}% <span class="muted">· share of claims supported by the provided data (flagged &lt; ${Math.round(thr*100)}%)</span>`+(ver.assessment?` <span class="muted">· ${dsc(ver.assessment)}</span>`:'')+`</div>`;
    if(Array.isArray(ver.unsupported_claims)&&ver.unsupported_claims.length) html+=`<div class="neg" style="font-size:10px;margin-top:1px">⚑ UNSUPPORTED: ${dsc(ver.unsupported_claims.join('; '))}</div>`;
    if(m.confidence_adjusted) html+=`<div class="muted" style="font-size:10px;margin-top:1px">confidence lowered ${dsc(m.confidence_original)}→${dsc(m.confidence)} (weakly grounded in the data)</div>`;
  }
  html+=`<div class="muted" style="font-size:10px;margin-top:6px">Educational, not advice.</div>`;
  wrap.innerHTML=html; return wrap;
}
function researchIdea(t){
  const box=document.getElementById('scan-analysis'); if(!box) return;
  box.innerHTML='';
  box.appendChild(el('div','ph','ON-DEMAND ANALYSIS · '+t));
  const wait=el('div','muted'); wait.style.cssText='font-size:11px;padding:6px 0;';
  wait.textContent='Analyzing '+t+'… the model runs for a minute or two (SEC fundamentals + analyst + news → LLM), then a second 🔍 groundedness pass fact-checks the brief against that data. Leaving this sub-tab cancels the view but not the run.';
  box.appendChild(wait);
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 300000);
  fetch('/api/research?ticker='+encodeURIComponent(t),{signal:ctl.signal}).then(r=>r.json()).then(d=>{
    clearTimeout(to);
    const b=document.getElementById('scan-analysis'); if(!b) return;

function ssWhatif(){

  fetch('/api/ss'+(q.length?'?'+q.join('&'):'')).then(r=>r.json()).then(d=>{
    if(!out) return;
    if(!d || d.available===false || d.error){ out.textContent=' '+((d&&(d.note||d.error))||'set SS inputs in ASSUMPTIONS first'); return; }
    const mo=d.household_monthly_benefit, yr=d.household_annual_benefit, tx=d.household_taxable_portion;
    out.innerHTML=' → <span class="pos">$'+Math.round(mo).toLocaleString()+'/mo</span> <span class="muted">($'+Math.round(yr).toLocaleString()+'/yr · $'+Math.round(tx||0).toLocaleString()+' taxable)</span>';

function acaWhatif(){
  const m=document.getElementById('acaw-magi').value, h=document.getElementById('acaw-hh').value, s=document.getElementById('acaw-slcsp').value;
  const q=[]; if(m!=='') q.push('magi='+encodeURIComponent(m)); if(h!=='') q.push('household_size='+encodeURIComponent(h)); if(s!=='') q.push('slcsp_annual='+encodeURIComponent(s));
  const out=document.getElementById('acaw-out'); if(out) out.textContent=' …';
  fetch('/api/aca'+(q.length?'?'+q.join('&'):'')).then(r=>r.json()).then(d=>{
    if(!out) return;
    if(!d || d.error){ out.textContent=' '+((d&&d.error)||'error'); return; }
    const sub=d.subsidy||{}, cl=d.cliff||{}, fl=d.flags||{};
    const fpl=sub.fpl_pct!=null?sub.fpl_pct+'% FPL':'—';
    const money=sub.estimated_annual_ptc!=null?('PTC $'+Math.round(sub.estimated_annual_ptc).toLocaleString()+'/yr'):(sub.expected_annual_contribution!=null?('contrib $'+Math.round(sub.expected_annual_contribution).toLocaleString()+'/yr'):'set SLCSP');
    const cls=fl.over_cliff?'neg':(fl.below_floor_gap?'neg':'pos');
    const tag=fl.over_cliff?' ⚠ over cliff':(fl.below_floor_gap?' ⚠ under 100% FPL':'');

// Knowledge reindex now runs on the serial job queue (non-blocking) — poll GET /api/knowledge
// for chunk-level progress ({reindexing, done_chunks, total_chunks, current_file}) plus
// GET /api/jobs for the "queued but not yet running" state (another heavy job ahead of it).
let _knPollTimer=null, _knSawRunning=false;
function _knPollTick(){
  Promise.all([fetch('/api/knowledge').then(r=>r.json()), fetch('/api/jobs').then(r=>r.json())])
    .then(([k,jobs])=>{
      const btn=document.getElementById('kn-reindex');
      const jrec=((jobs && jobs.jobs)||[]).find(j=>j.kind==='knowledge_reindex' && (j.status==='queued'||j.status==='running'));
      if(k && k.reindexing){
        _knSawRunning=true;
        const tot=k.total_chunks||0, done=k.done_chunks||0;
        const pct=tot>0?Math.round(100*done/tot):0;
        if(btn){ btn.disabled=true; btn.textContent=`⏳ indexing… ${pct}% (${done}/${tot})`+(k.current_file?' — '+k.current_file:''); }
      } else if(jrec){                          // enqueued but not yet started
        if(btn){ btn.disabled=true; btn.textContent='⏳ queued…'; }
      } else if(_knSawRunning){                 // was running, now finished
        _knSawRunning=false;
        clearInterval(_knPollTimer); _knPollTimer=null;
        load(false);
      } else {
        clearInterval(_knPollTimer); _knPollTimer=null;   // nothing in flight
      }
    }).catch(()=>{});
}
function _knStartPoll(){ if(_knPollTimer) return; _knPollTimer=setInterval(_knPollTick, 1000); _knPollTick(); }
function reindexKnowledge(){
  const btn=document.getElementById('kn-reindex'); if(btn){ btn.disabled=true; btn.textContent='⏳ queuing…'; }
  fetch('/api/knowledge/reindex',{method:'POST', headers: ANALYSIS_TOKEN ? {'X-Analysis-Token': ANALYSIS_TOKEN} : {}})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status+(r.status===401?' — check ANALYSIS_TOKEN':'')); return r.json(); })
    .then(()=>_knStartPoll())
    .catch(e=>{ alert('Reindex failed: '+e); if(btn){ btn.disabled=false; btn.textContent='↻ REINDEX'; } });
}
// Narrative (State-of-the-Wealth) completion poll — mirrors the knowledge-reindex pattern above.
// Diagnosed 2026-07-18 (LIVE, against the running instance): the DASHBOARD GENERATE NOW/REGENERATE
// button fired runJob('/api/run-narrative') fire-and-forget, so NARR only refreshed on the 5-minute
// background load() — the letter box appeared frozen "when the job completes". This watches
// /api/jobs for the narrative job and calls load(false) (which refetches /api/narrative + re-renders
// the letter box) once it leaves queued/running. Narrative has no chunk-level progress like the
// knowledge reindex, so this only tracks the queued→running→done transition.
let _narrPollTimer=null, _narrSawActive=false;
function _narrPollTick(){
  fetch('/api/jobs').then(r=>r.json()).then(jobs=>{
    const jrec=((jobs&&jobs.jobs)||[]).find(j=>j.kind==='narrative' && (j.status==='queued'||j.status==='running'));
    if(jrec){ _narrSawActive=true; }
    else if(_narrSawActive){                 // was in flight, now finished — pull the fresh letter
      _narrSawActive=false;
      clearInterval(_narrPollTimer); _narrPollTimer=null;
      load(false);
    } else {                                  // nothing in flight (e.g. finished before first tick)
      clearInterval(_narrPollTimer); _narrPollTimer=null;
    }
  }).catch(()=>{});
}

        cc.innerHTML='<span class="muted" style="font-size:10px;letter-spacing:1px;">HIGHEST PAIRWISE CORRELATIONS</span><br>'+

function stratPost(path,body,label){
  return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(r=>r.json()).then(d=>{ if(d&&d.error){ alert(label+' failed: '+d.error); } load(false); return d; })
    .catch(e=>alert(label+' failed: '+e));
}
function stratRun(){
  const s=document.getElementById('strat-runstatus');

    .then(d=>{ if(s&&d&&d.status==='already running') s.textContent='⏳ A review is already running…'; })

// ============================================================================
//  Fiduciary / Strategist chat (Phase 4) — streams from POST /api/chat.
//  Read-only: the backend hard-blocks paper-ledger writers for these personas.
//  EventSource is GET-only, so we stream with fetch()+ReadableStream and parse
//  the SSE frames (events: session, token, tool, tool_done, done, error).
// ============================================================================
function mdToHtml(t){
  try{ if(window.marked) return marked.parse(t||'', {breaks:true}); }catch(_){}
  return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
}
function chatScroll(){ const s=document.getElementById('chat-scroll'); if(s) s.scrollTop=s.scrollHeight; }
function chatLoadSessions(){
  if(CHAT_SESS_LOADING) return;
  CHAT_SESS_LOADING=true;
  fetch('/api/chat/sessions').then(r=>r.json())
    .then(d=>{ CHAT_SESSIONS=(d&&d.sessions)||[]; })
    .catch(()=>{ CHAT_SESSIONS=CHAT_SESSIONS||[]; })
    .finally(()=>{ CHAT_SESS_LOADING=false; if(TAB==='chat' && !CHAT_STREAMING) render(); });
}
// Stop the in-flight stream (if any) and supersede its finally handler so a new
// action (new chat, switch persona/session, new message) can start immediately.
// IMPORTANT: aborting the fetch only closes OUR OWN connection to the server — it does not, by
// itself, stop the server from continuing to generate (and hold the shared GPU lock) in the
// background. So we also tell the server to actually stop via /api/chat/cancel (req_id), which
// _chat_stream polls and exits on within ~1s. Fire-and-forget: we don't wait on it before
// resetting local UI state, since the client-side abort is what makes the UI feel instant.
function chatInterrupt(){
  if(!CHAT_STREAMING) return;
  CHAT_STREAM_ID++;                       // supersede the running send's generation
  if(CHAT_REQ_ID){
    fetch('/api/chat/cancel',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({req_id:CHAT_REQ_ID})}).catch(()=>{});
  }
  if(CHAT_ABORT){ try{ CHAT_ABORT.abort(); }catch(_){} }
  CHAT_ABORT=null; CHAT_STREAMING=false; CHAT_REQ_ID=null;
  const last=CHAT_MSGS[CHAT_MSGS.length-1];
  if(last && last.streaming) last.streaming=false;   // freeze the partial answer in place
}
function chatStop(){ chatInterrupt(); render(); }
function chatNew(){ chatInterrupt(); CHAT_SID=null; CHAT_MSGS=[]; render(); }
function chatSetPersona(p){ chatInterrupt(); if(CHAT_PERSONA!==p){ CHAT_PERSONA=p; CHAT_SID=null; CHAT_MSGS=[]; render(); } }
function chatOpen(sid,persona){
  chatInterrupt();
  fetch('/api/chat/session/'+sid).then(r=>r.json()).then(d=>{
    CHAT_SID=sid; if(persona) CHAT_PERSONA=persona;
    CHAT_MSGS=((d&&d.messages)||[]).filter(m=>m.role==='user'||m.role==='assistant')
      .map(m=>({role:m.role,content:m.content||'',tools:[]}));
    render(); chatScroll();
  }).catch(e=>alert('Could not open chat: '+e));
}
function chatDelete(sid,ev){
  if(ev) ev.stopPropagation();
  if(!confirm('Delete this conversation?')) return;
  if(!confirm('Delete this conversation?')) return;
  fetch('/api/chat/session/'+sid,{method:'DELETE'}).then(r=>r.json()).then(()=>{
    if(CHAT_SID===sid){ CHAT_SID=null; CHAT_MSGS=[]; }
    chatLoadSessions();
  }).catch(e=>alert('Delete failed: '+e));
}
function chatKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); chatSend(); } }
function chatTools(asst){
  const t=document.getElementById('chat-live-tools'); if(!t) return;
  t.innerHTML=asst.tools.map(x=>`<span class="tool-chip">${x.done?'✓':'⋯'} ${x.name}</span>`).join('');
}
function chatFrame(frame,asst){
  let ev='message', data='';
  frame.split('\n').forEach(line=>{
    if(line.indexOf('event:')===0) ev=line.slice(6).trim();
    else if(line.indexOf('data:')===0) data+=line.slice(5).trim();
  });
  let o={}; if(data){ try{ o=JSON.parse(data); }catch(_){} }
  if(ev==='session'){ CHAT_SID=o.session_id||CHAT_SID; }
  else if(ev==='token'){ asst.content+=(o.t||''); const c=document.getElementById('chat-live-content'); if(c) c.textContent=asst.content; chatScroll(); }
  else if(ev==='tool'){ asst.tools.push({name:o.name,done:false}); chatTools(asst); }
  else if(ev==='tool_done'){ for(let k=asst.tools.length-1;k>=0;k--){ if(asst.tools[k].name===o.name && !asst.tools[k].done){ asst.tools[k].done=true; break; } } chatTools(asst); }
  else if(ev==='status'){ const c=document.getElementById('chat-live-content'); if(c && !asst.content) c.textContent='⏳ '+(o.message||'waiting…'); chatScroll(); }
  else if(ev==='thinking'){ asst.think=(asst.think||'')+(o.t||''); const c=document.getElementById('chat-live-content'); if(c && !asst.content) c.textContent='💭 thinking… '+asst.think.slice(-400); chatScroll(); }
  else if(ev==='done'){ CHAT_SID=o.session_id||CHAT_SID; }
  else if(ev==='cancelled'){ CHAT_SID=o.session_id||CHAT_SID; if(!asst.content) asst.content='_(stopped)_'; }
  else if(ev==='error'){ asst.content+=(asst.content?'\n\n':'')+'⚠ '+(o.error||'error'); const c=document.getElementById('chat-live-content'); if(c) c.textContent=asst.content; }
}
async function chatSend(){
  const ta=document.getElementById('chat-input'); if(!ta) return;
  const msg=(ta.value||'').trim(); if(!msg) return;
  chatInterrupt();             // if a previous answer is still streaming, stop it and start fresh
  ta.value='';
  CHAT_MSGS.push({role:'user',content:msg});
  CHAT_MSGS.push({role:'assistant',content:'',tools:[],streaming:true});
  CHAT_STREAMING=true;
  const myId=++CHAT_STREAM_ID;  // this send's generation; a newer send/nav supersedes it
  // req_id lets Stop actually cancel THIS generation server-side (see chatInterrupt / /api/chat/cancel)
  // rather than merely closing our own connection and leaving it to run unattended.
  const reqId='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  CHAT_REQ_ID=reqId;
  render();                    // shows the user turn + an empty streaming bubble (ids: chat-live-*)
  chatScroll();
  const asst=CHAT_MSGS[CHAT_MSGS.length-1];
  const ctl=new AbortController(); CHAT_ABORT=ctl;
  try{
    const resp=await fetch('/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({persona:CHAT_PERSONA, message:msg, session_id:CHAT_SID, req_id:reqId}),
      signal:ctl.signal});
    if(!resp.ok || !resp.body) throw new Error('HTTP '+resp.status);
    const reader=resp.body.getReader(), dec=new TextDecoder(); let buf='';
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      if(myId!==CHAT_STREAM_ID) return;   // superseded mid-stream — stop consuming, leave state to the newer action
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){ const frame=buf.slice(0,i); buf=buf.slice(i+2); chatFrame(frame,asst); }
    }
  }catch(e){
    if(myId===CHAT_STREAM_ID && e.name!=='AbortError') asst.content+=(asst.content?'\n\n':'')+'⚠ '+e.message;
  }finally{
    if(myId===CHAT_STREAM_ID){   // only the current generation resets shared state / re-renders
      CHAT_STREAMING=false; CHAT_ABORT=null; CHAT_REQ_ID=null; asst.streaming=false;
      render();                  // final pass: render markdown + refresh the session list
      chatScroll();
      chatLoadSessions();
    }
  }
}

// The 5-min background poll calls load()->render(), which rebuilds the whole page.
// Suppress it while the user is actively interacting so it never wipes an in-progress
// edit (chat draft, PLAN/policy/scanner fields, what-if inputs) or a live chat stream.
// Manual REFRESH always works. (A true per-panel self-refresh is the larger N2b refactor.)
function userBusy(){
  if(CHAT_STREAMING) return true;                          // a chat is streaming
  const ae=document.activeElement;                         // focused in any editable control
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT')) return true;
  const ta=document.getElementById('chat-input');          // an unsent chat draft on the CHAT tab
  return !!(TAB==='chat' && ta && ta.value.trim()!=='');
}
document.getElementById('refresh').onclick=()=>load(true);
document.getElementById('gear').onclick=()=>{ TAB=(TAB==='settings'?'positions':'settings'); render(); };
load(false);
setInterval(()=>{ if(userBusy()) return; load(false, true); }, 300000);  // re-poll every 5 min (server caches); bg=true preserves scroll

// Serial job-queue badge (Increment B): poll /api/jobs and show running/queued depth
// in the header. Independent of the 5-min load so it updates live during a run. Idle = blank.
// Rough job-duration ETA (RESUME-TRACKER item 5): elapsed vs. the median of that job kind's
// last 5 completed runs, from /api/jobs' `progress` field — no per-kind wiring needed here,
// the server already generalized it across every job kind. "No history yet" (not a fake 0%)
// until a kind has completed at least once. over_typical (>1.5x) flips the badge red-ish —
// this doesn't explain WHY a run is slow (item 6), just makes it visible instead of a silent spinner.
const fmtMin=s=>{ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m>0?`${m}m${r?(' '+r+'s'):''}`:`${r}s`; };
function pollJobs(){
  fetch('/api/jobs').then(r=>r.json()).then(j=>{
    const b=document.getElementById('jobs'); if(!b) return;
    if(j && (j.running || j.queued)){
      const run=j.running?('▶ '+j.running):'';
      const q=j.queued?(' · '+j.queued+' queued'):'';
      let eta='';
      if(j.progress && j.progress.kind===j.running){
        const p=j.progress;
        eta = p.typical_seconds!=null
          ? ` (${fmtMin(p.elapsed_seconds)} of ~${fmtMin(p.typical_seconds)} typical${p.pct_of_typical!=null?', '+p.pct_of_typical+'%':''})`
          : ` (${fmtMin(p.elapsed_seconds)}, no history yet)`;
      }
      const color = (j.progress && j.progress.over_typical) ? 'var(--red)' : 'var(--amber)';
      b.innerHTML=`<span style="color:${color}" title="Rough ETA from this job's own history, not a real progress bar">⚙ ${run}${eta}${q}</span>`;
    } else if(j && j.strategist_busy){
      // Chat / weekly strategist / advisory runs share one lock but don't go through the FIFO
      // above, so without this branch the badge would go blank while one of them holds the GPU.
      b.innerHTML=`<span style="color:var(--amber)">⚙ chat/strategist busy</span>`;
    } else { b.textContent=''; }
  }).catch(()=>{});
}
pollJobs(); setInterval(pollJobs, 15000);

// Alerting/monitoring push layer (built 2026-07-18): poll /api/alerts and show a materiality-
// filtered action/warn count in the header, visible from ANY tab — not just when you remember to
// open INSIGHTS → ⚠ ATTENTION. `new` (unseen since the last time the panel was opened, see
// attentionContent()'s ack call) gets its own count so a genuinely fresh condition stands out
// from one you've already seen and left open. Slower cadence than the job badge (this is a
// point-in-time read of cached analysis, not something that changes second-to-second).
function pollAttn(){
  fetch('/api/alerts').then(r=>r.json()).then(a=>{
    const b=document.getElementById('attn'); if(!b) return;
    const c=(a&&a.counts)||{};
    const total=(c.action||0)+(c.warn||0);
    if(!total){ b.textContent=''; return; }
    const color=c.action?'var(--red,var(--amber))':'var(--amber)';
    const newTag=c.new?` <span style="opacity:0.85">(${c.new} new)</span>`:'';
    b.innerHTML=`<span style="color:${color}">⚑ ${c.action||0} action · ${c.warn||0} watch${newTag}</span>`;
  }).catch(()=>{});
}
document.getElementById('attn').onclick=()=>{ TAB='insights'; SUBTAB['insights']='attention'; render(); };
pollAttn(); setInterval(pollAttn, 60000);
</script>
