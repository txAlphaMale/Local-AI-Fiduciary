  'Screens a universe against your criteria (valuation, quality, momentum, optional minimum Piotroski) and ranks survivors by a forward expected-return opportunity score.',
  'Each hit shows which checks it passed and its score; you edit criteria and limits in the panel. Higher score is more attractive on the heuristic. The "▸ analyze" on-demand brief (any ticker, or a scanner hit) now runs and saves server-side, so leaving the sub-tab or reloading no longer loses it — a "recent on-demand (saved)" row keeps the last several analyses; click a ticker there to re-show one instantly without re-running the model.',
  'Use it to generate a shortlist of ideas to then run a full B/S/H analysis on, not as a buy list on its own.');
W('piotroski','Research','Piotroski F-score',
  'A 0 to 9 accounting-quality score: nine pass/fail checks on profitability, leverage/liquidity and operating efficiency. Higher is healthier.',
  '8 to 9 is strong, 0 to 2 is weak. In the scanner it is an optional gate that is off by default so it does not silently change your fit count.',
  'Use it to avoid value traps — a cheap stock with a low F-score is cheap for a reason.');
W('theses','Research','Theses and exit triggers',
  'For any holding you record a falsifiable thesis with pre-committed exit triggers (FCF-margin decay, reverse-DCF implied growth too high, Piotroski floor, a drawdown, or a custom rule).',
  'Each run re-checks the triggers against fresh data; a tripped trigger flags the position for EXIT REVIEW rather than auto-selling.',
  'Use it to enforce sell discipline you set in a calm moment — the terminal reminds you of your own rules when the data breaks them.');
W('alerts','Research','News alerts and discovery',
  'The discovery agent scans news for your holdings and surfaces material items; discovered tracks new names it flags from the news flow.',
  'Alerts are per-holding news hits; the cockpit shows a count. Discovery is idea-generation adjacent to what you own.',
  'Skim alerts for anything that changes a thesis; treat discovered names as candidates for the scanner/analysis pipeline.');

W('drift','Insights & risk','Policy and drift',
  'Compares your actual allocation to your written investment policy (target sleeves, per-position cap, drift band) and flags what is out of band.',
  'Each sleeve shows target vs actual and whether it breached the band; positions over your single-name cap are listed separately.',
  'Use it to decide rebalancing — but weigh the tax cost of selling appreciated positions.');
W('exposure','Insights & risk','Exposure — sector, beta, concentration (HHI)',
  'True economic exposure: sector weights, portfolio beta, and a Herfindahl (HHI) concentration index, including a look-through that counts names held inside your funds.',
  'HHI rises with concentration; the look-through line shows your true single-name exposure, which can exceed the direct view.',
  'Use it to catch hidden concentration (mega-cap tech owned directly and via an index fund) and to see if your beta matches intent.');
W('lookthrough','Insights & risk','Fund look-through (N-PORT)',
  'Resolves each fund to its underlying holdings using SEC N-PORT filings, so exposure and concentration reflect what you truly own.',
  'It splits each fund into equity/bond/cash by asset category and attributes single-name weight through to the underlying stocks. Coverage depends on filings being available.',
  'Use it when much of your book is in funds — it turns 40% VTI into the actual companies and sleeves underneath.');
W('var-cvar','Insights & risk','VaR and CVaR (tail risk)',
  'Value-at-Risk is the loss you would not exceed on a normal bad day at a given confidence; CVaR (expected shortfall) is the average loss on the days worse than that.',
  'Both are positive loss percentages at 1-day and 10-day horizons. CVaR is always at least VaR because it averages the deep tail.',
  'Use CVaR, not VaR, to size how much a single bad stretch could cost — it feeds the position-sizing loss budget.');
W('effective-bets','Insights & risk','Effective number of bets',
  'A diversification measure (Meucci): how many truly independent risk sources you have after accounting for correlation. 1 is everything moves together; n is n independent bets.',
  'Twenty names that all move together have an effective number near 1, not 20. A diversification ratio captures the same idea from correlations alone.',
  'Use it to see through fake diversification — many tickers that are really one bet on the same factor.');
W('factors','Insights & risk','Factor exposure (FF5 + momentum)',
  'Regresses your reconstructed returns on the Fama-French 5 factors plus momentum to show which systematic bets drive your returns, plus an alpha.',
  'Each factor beta is your loading; R-squared is how much of your movement the factors explain; alpha is the unexplained excess (often noise for a small book).',
  'Use it to understand what you are really long — a value plus small-cap tilt — rather than assuming returns are stock-picking skill.');
W('risk-ramp','Insights & risk','Risk ramp (reconstructed history)',
  'Because current holdings have no shared past, the engine rebuilds a daily return series as if you had held today weights over the historical window.',
  'It answers given how I am positioned now, how would that have behaved — not your actual path. Coverage shows the share of the book with usable price history.',
  'Read the risk-suite numbers through this lens: they describe today positioning under history, which is what you want for forward risk.');
W('attribution','Insights & risk','Contribution to return',
  'Chain-linked attribution: how much each holding contributed to total return over the window, with the parts summing exactly to the whole.',
  'Each name shows weight, own return, and contribution in points and as a share of total. Positive and negative contributors are colored.',
  'Use it to see what actually drove performance — often a couple of names — and whether concentration paid or hurt.');
W('money-weighted-irr','Insights & risk','Money-weighted return (XIRR)',
  'The internal rate of return on the paper book actual cash flows (deposits in, current value out) — it credits the timing of contributions, unlike a simple percentage.',
  'Shown alongside the simple return; a short-window flag warns when there is too little history for it to be meaningful.',
  'Use IRR when contributions were uneven — it answers what did my money actually earn, which time-weighted returns hide.');
W('sizing','Insights & risk','Position sizing (CVaR loss budget)',
  'The primary gate: each name tail loss is its value times its CVaR; a loss budget (the percent of net worth you accept losing from one name) implies a maximum position value, and over-budget names get a suggested trim.',
  'Over-budget rows are amber with a max-position and trim; it also shows inverse-volatility target weights and a de-emphasized half-Kelly reference.',
  'Use the loss budget to right-size concentrated winners by how much damage they can do, not just by weight.');
W('staged-sale','Insights & risk','Staged 0%-LTCG diversification',
  'A tax-aware plan to trim an over-concentrated appreciated position over several years, spending the 0% long-term capital-gains bracket each year before pricing the rest at your LTCG rate.',
  'It shows the year-by-year schedule, the tax if you sold everything now versus staged, and the total tax saved.',
  'Use it when you must diversify a big winner but want to bleed the gain out at the lowest tax cost instead of one large hit.');
W('leverage','Insights & risk','Leverage / ruin model',
  'Models borrowing against taxable assets ruin-first: it bootstraps the probability of a margin call at each loan-to-value from your own fat-tailed returns, then reports a maximum prudent LTV and after-tax borrow-vs-sell math.',
  'It shows margin-call probability rising with LTV, the borrow-vs-sell carry, and buy-borrow-die risks. The model never actually borrows.',
  'Use it to pressure-test an SBLOC or margin idea against the downside first — the headline tax-free access ignores the call risk this surfaces.');
W('avenues','Insights & risk','Cross-avenue (marginal dollar)',
  'Ranks where your next dollar earns the best after-tax return across avenues: debt paydown, Treasuries, index, a concentrated position, real estate, or an SBLOC spread, plus one-time tax alpha.',
  'Each avenue shows an after-tax expected return and any one-time boost; concentrated options carry a risk flag.',
  'Use it to allocate new savings or a windfall to the highest after-tax use instead of defaulting to one bucket.');

W('monte-carlo','Planning','Monte Carlo retirement',
  'Simulates thousands of return paths for your plan and reports the share that never run out of money, under several withdrawal policies and return models.',
  'The PLAN to FI strip shows success under a static rule plus guardrail policies and worst-case ending values. Very high success (99%+) can mean you are underspending.',
  'Use it to judge whether your spend/save/retire-age plan is robust and how much dynamic spending rules improve it.');
W('guardrails','Planning','Guardrails (Guyton-Klinger and risk-based)',
  'Dynamic withdrawal policies that cut or raise spending as the portfolio moves. The risk-based policy adjusts by the current probability of success; Guyton-Klinger uses fixed rate bands.',
  'The risk-based strip is primary (cuts below ~70% success, raises above ~99%) and never cuts into your essential needs floor; Guyton-Klinger is a comparison.',
  'Use guardrails to see how flexible spending raises your safe success rate and how deep a cut a bad sequence would require.');
W('fat-tail-block','Planning','Fat-tail and block-bootstrap models',
  'Alternative Monte Carlo return engines: fat-tail draws have heavier crashes than a normal distribution; block-bootstrap stitches together real historical return sequences to preserve momentum and mean-reversion.',
  'These usually read a few points below the normal model — that gap is the cost of the normal model optimism about tails and independence.',
  'Use them as a stress check: a plan that only passes under the normal model is fragile to real-world tails.');
W('funded-ratio','Planning','Funded ratio',
  'A pension-style solvency check: present value of assets plus future savings divided by present value of retirement spending, splitting essential needs (discounted at the risk-free TIPS yield) from wants (discounted at your expected return).',
  'At or above 100% is fully funded; the essentials-only ratio is the more conservative number. It uses the same cash flows as the Monte Carlo.',
  'Use it as a cleaner am I there yet gauge than a success percentage, especially the essentials-only ratio.');
W('social-security','Planning','Social Security',
  'Estimates your benefit (PIA/FRA with COLA and taxation) and folds a benefit floor into the Monte Carlo so success is not understated by ignoring it.',
  'The PLAN to SS sub-tab shows the benefit at different claim ages; the plan uses it as a real income floor.',
  'Use it to see the claiming-age tradeoff and how much guaranteed income lowers the portfolio burden — some plans deliberately assume it is unavailable as a stress test.');
W('aca','Planning','ACA / MAGI bridge',
  'For early retirement before Medicare, models your marketplace subsidy: a MAGI ledger, the premium tax credit, and the 400%-of-poverty subsidy cliff (back for 2026). What a MAGI below 100% FPL means now depends on your state of residence (ASSUMPTIONS): a real coverage gap in a non-expansion state (Texas, Georgia, and 8 others), or likely Medicaid eligibility in an expansion state (most states, incl. North Carolina, Colorado).',
  'It flags when planned income puts you over the cliff (0 subsidy) or into the sub-100% band, and estimates the credit when you set your local benchmark Silver premium. The subsidy JSON now echoes your state and its Medicaid-expansion status so you can see which interpretation applies.',
  'Use it to manage retirement-year income (Roth conversions, gains) so you do not accidentally blow past the subsidy cliff — and set State of residence in ASSUMPTIONS first, since it changes what the low-MAGI band actually means.');
W('roth','Planning','Roth ladder and marginal-rate curve',
  'Composes your true marginal rate on the next dollar — ordinary brackets, the capital-gains bump zone, NIIT, the ACA subsidy slope, and IRMAA steps — into one curve, then plans multi-year Roth conversions that fill low-rate room while respecting 5-year clocks and the pre-65 ACA cap.',
  'The curve shows where the next dollar is cheap versus punitive; the ladder shows a year-by-year conversion amount. Texas has no state income tax, making conversions relatively cheap.',
  'Use it to convert in low-income years up to the point where the marginal rate jumps — the curve makes those cliffs visible.');
W('irmaa','Planning','IRMAA (Medicare surcharge)',
  'Income-Related Monthly Adjustment Amount: above certain MAGI tiers your Medicare Part B premium steps up sharply, based on income two years prior.',
  'It appears as steps in the marginal-rate curve — crossing a tier can cost far more than the tax on the dollar that crossed it.',
  'Use it to avoid nudging MAGI just over an IRMAA threshold with a conversion or gain.');
W('realestate','Planning','Real-estate underwriter',
  'Underwrites a prospective rental deal: net operating income, cap rate, debt-service coverage (DSCR), cash-on-cash, and a levered after-tax IRR that accounts for depreciation recapture and capital-gains tax at sale.',
  'Enter the deal inputs and it returns the full set; DSCR below ~1.2 and thin cash-on-cash are warning signs. Existing real-estate accounts are surfaced separately, along with a property/deed fraud alert tip (2026-07-27) — if a home address is on file (PLAN → INSURANCE), it\'s personalized (2026-07-30): the address is resolved to a county via the free Census Geocoder API and matched against a known statewide resource (currently Florida\'s complete Court Clerks & Comptrollers list), the semi-national propertyfraudalert.com aggregator, and a pre-filled web search — no single national registry covers every county, so this is best-effort, not a guaranteed direct link everywhere.',
  'Use it to compare a specific property against your other avenues on an apples-to-apples after-tax IRR before committing.');
W('business','Planning','Business-acquisition underwriter',
  'Underwrites buying a small business: seller discretionary earnings multiple, DSCR, cash-on-cash, payback, and a levered after-tax IRR including the QSBS section 1202 gain exclusion where it applies.',
  'Enter the deal and it returns the return/coverage set; it reuses the real-estate amortization and IRR engine.',
  'Use it to evaluate an acquisition or search-fund idea on the same after-tax IRR basis as your market and real-estate options.');
W('estate-snapshot','Planning','Estate snapshot vs exemption',
  'Your net estate against the federal exemption (15M per person, ~30M married with portability for 2026), the headroom left, the tax if you died today, and the year your estate would cross the exemption at your assumed growth.',
  'The federal exemption math is identical in every state. state_tax_note flags whether your state of residence (ASSUMPTIONS) ALSO levies its own estate or inheritance tax — 12 states + DC do, typically with a much lower exemption than the federal one; Texas, Colorado, North Carolina and Georgia do not. The years until crossed figure is the trust-planning tripwire.',
  'Under the exemption there is no FEDERAL estate tax to plan around — the action is basis (see step-up and gift-vs-hold) — but check state_tax_note if you\'re in one of the 12+DC states, since state exposure can bite well below the federal exemption. Near the exemption, irrevocable strategies need lead time.');
W('stepup','Planning','Step-up ledger',
  'Per-account view of what a death-basis step-up (IRC 1014) is worth: taxable accounts and the home get their embedded gain wiped; traditional IRA/401k is income in respect of a decedent (heirs pay ordinary tax); Roth passes tax-free; an HSA is the worst asset to die with.',
  'The embedded gain a step-up would wipe totals taxable plus real estate. For the home, set its cost basis so the wiped gain is quantified; the section 121 exclusion already shelters 250k/500k on a lifetime sale. The DOUBLE step-up on jointly-held property only applies in a community-property state (9 of them, incl. Texas) — a common-law state (incl. North Carolina, Georgia, Colorado) only steps up the decedent\'s half by default; community_property_note in the response says which applies to your state of residence.',
  'Use it to reverse the usual drawdown order late in life — spend IRA/HSA first and hold heavily-appreciated taxable positions and the home for the step-up. In a common-law state the benefit is smaller than the Texas-flavored intuition suggests — read community_property_note before assuming the full double step-up.');
W('gift-vs-hold','Planning','Gift vs hold',
  'For an appreciated position, compares gifting now (the donee carries your basis and eventually pays capital-gains tax on the full gain) versus holding to death (the step-up erases the gain).',
  'For an estate under the exemption, holding almost always wins on tax — gift cash or high-basis assets instead. Over the exemption, gifting future growth out of the 40% estate base can flip it.',
  'Use it before a large lifetime gift of a winner — giving away appreciated stock is a common, expensive mistake for sub-exemption estates.');
W('income-plan','Planning','Income / dividend plan',
  'Aggregates the income your book throws off (dividends across all accounts, target yield) to plan for cash needs.',
  'Dividend income sums across every account; the asset-location relocation list, by design, stays taxable-only.',
  'Use it to see how much of your spending can be covered by portfolio income versus selling principal.');
W('income-sources','Planning','Multiple income sources per earner',
  'The single "Gross income — self/spouse" fields in PLAN → ASSUMPTIONS work fine for a simple one-job household, but they don\'t capture a household with a W-2 job PLUS a side 1099, rental income, a pension, or any other second stream per person. This optional itemized breakdown lets you list each income stream separately instead of mentally adding them up into one number every time something changes.',
  'In PLAN → ASSUMPTIONS, expand "itemize income sources" under the income line. Add a row per stream (label, type — W-2/1099/self-employment/rental/pension/other, $/yr, optional notes) for self and/or spouse independently; each side\'s list is completely independent of the other\'s. Once you save with at least one row under either person, that person\'s single income field becomes READ-ONLY and shows the SUM of their itemized rows — everything downstream (ACA/tax MAGI, the PLAN → INSURANCE need-sizing, the setup checklist) keeps reading that same one number exactly as before, so nothing else in the app had to change to support this. Remove every row for a person (leaving the list empty) and that person\'s field goes back to being a plain editable number, exactly like a household that never uses this at all.',
  'Best fit for a two-income household, a side business/consulting gig alongside a W-2, rental property income, or a retiree with both a pension and part-time consulting — anywhere "one income number" was previously an oversimplification you had to compute by hand. If you only have one income stream per person, there\'s no need to use this at all — the plain field works exactly as it always has.');

W('tax-brackets','Taxes & audits','Tax brackets and marginal rate',
  'A full 2026 federal bracket engine (ordinary brackets, long-term capital gains, NIIT) that replaces flat tax assumptions everywhere a tax number is used.',
  'It shows your marginal and effective rates given your income; Texas adds no state income tax. The same engine feeds the Roth curve, ACA and estate math.',
  'Use it to see the real tax on an extra dollar of income or a realized gain before you trigger it.');
W('tlh','Taxes & audits','Tax-loss harvesting',
  'Finds positions at a loss in taxable accounts whose sale would generate a deductible capital loss to offset gains (and up to 3k of ordinary income).',
  'It lists harvestable losses with the dollar amount; the cockpit shows the total. Mind the 30-day wash-sale rule on repurchase.',
  'Use it near year-end or after a drawdown to bank losses — but never let the tax tail wag a good position, and avoid the wash sale.');
W('asset-location','Taxes & audits','Asset location ("holdings misplaced")',
  'Some investments throw off a lot of taxable income every year (high-yield funds, REITs, bond funds). In a regular taxable brokerage account you owe tax on that income each April, even if you reinvest it. In an IRA/401(k) the same income is sheltered, and in a Roth it is never taxed. "Misplaced" means: a holding that pays a high yield (3% or more by default) is sitting in a TAXABLE account, where it creates a yearly tax bill it would not create inside an IRA/401(k)/Roth.',
  'Nothing is wrong with the investment itself, and nothing is urgent. The cockpit chip counts these holdings; click it to open AUDITS → TAX · TLH → "Relocation candidates", which lists each holding, its account, its yield and the estimated income it generates per year. Example: a 5% yield fund worth $40,000 in a taxable account throws off about $2,000 of taxable income a year; in an IRA that tax bill goes away.',
  'What to do: you do not sell and rebuy in the same account. The usual approach is to put new money for income-heavy holdings into your IRA/401(k)/Roth, and keep low-yield, tax-efficient index funds in the taxable account. Swapping positions between accounts can trigger tax if done in the taxable account, so check with your CPA first. If you have no IRA/401(k)/Roth, there is nowhere better to move them and you can ignore this. Change what counts as "high yield" in SETTINGS → ADVANCED KNOBS ("Tax-inefficient yield at/above"). Educational only, not tax advice.');
W('fees-liquidity','Taxes & audits','Fees and liquidity',
  'Flags high-cost funds (by expense ratio where available) and hard-to-exit positions (thin trading volume) so you can see hidden frictions.',
  'High-fee funds and thin/micro-liquidity names are flagged in the FEES and LIQUIDITY tab and summarized in the cockpit.',
  'Use it to prune expensive funds with cheaper equivalents and to know which positions you cannot exit quickly in size.');
W('drip','Taxes & audits','DRIP and fractional flags',
  'Per-account settings for dividend reinvestment and fractional shares that make the tax, drift and income math correct (reinvested dividends are still taxable phantom income in taxable accounts).',
  'Set the flags under AUDITS to Accounts; they feed the tax-audit, drift pressure and income cash-vs-reinvested calculations.',
  'Set them accurately so the terminal models your actual cash flows — otherwise reinvested-dividend tax and drift will be off.');
W('grounding','Taxes & audits','Grounding watchdog and calibration',
  'A registry of every dated tax constant (brackets, LTCG, NIIT, FPL, Social Security bend points, estate exemption, IRMAA) with its source, the year it applies to, and a staleness tripwire, plus a calibration audit of the LLM briefs.',
  'The registry flags a figure as stale when its year falls behind the calendar and nags for re-verification each January. The Brier score grades whether brief confidence matches outcomes.',
  'Use it to trust the tax numbers (they carry sources) and to know how much to weight the model confidence.');

W('strategist','Automation','Strategist (paper trading)',
  'An autonomous agent that runs a hypothetical paper portfolio: it researches with real data and tools, then places simulated buy/sell decisions with fake money so you can watch its reasoning and track record.',
  'It runs weekly or on demand through the serial job queue; the STRATEGIST tab shows its book, report, and activity log. No real orders are ever placed.',
  'Use it as a transparent second opinion whose reasoning and paper P&L you can audit over time — never as an execution system.');
W('chat','Automation','Chat personas',
  'An in-app chat with a Fiduciary persona (planning/analysis) and a Strategist persona, both read-only, with tools to query your book and the research data. It has your knowledge documents in a local RAG. You can also attach an image (paste a screenshot or click 📎) — e.g. a watchlist, a brokerage screenshot, or a headline — and a separate small vision model reads it for ticker symbols, then hands them to the SAME persona/tools to research, before the persona answers. Both personas can see your REAL fund expense ratios and 401k/HSA/Roth contribution room (get_fees_liquidity / get_benefits) as context — you should not need to type balances, expense ratios, or match/headroom figures into chat yourself; ask directly and it looks them up.',
  'Pick a persona and ask; it streams its answer and a thinking indicator while it reasons. It queues behind a running strategist job so they never compete for the GPU. An attached image shows a small 👁 chip naming what tickers it found (or that none were found) before the answer streams — that step itself briefly queues for the GPU too if something else is using it, same as everything else here. Generation runs on the server independent of your browser, so you can switch tabs, navigate away, or even reload mid-answer without losing it — a still-generating conversation shows a ⏳ in the session list; re-open it to reconnect to the live stream and it will finish on screen.',
  'Use it to interrogate your own data in plain language (what is my true tech exposure) — the answers are grounded in the same figures the tabs show. Pasting a screenshot is a shortcut for "look these up" — verify the tickers the 👁 chip identified are actually what you meant before trusting the follow-up research, especially on a blurry or cropped image. Strategist keeps a narrower deep-planning toolset than Fiduciary by design (no IPS/tax/retirement/estate tools) — for retirement-account or tax-planning questions specifically, ask the Fiduciary persona instead of Strategist.');
W('prompts','Automation','Persona prompts & how you\'re addressed',
  'The system prompts that define how the Fiduciary and Strategist chat personas behave are editable, and you set how they refer to you. A {user} token in each prompt is replaced with your chosen reference (your name, or the default "the user") everywhere it appears. This is the fix for the app\'s origins as a single-person tool — nothing is hardcoded to one name anymore.',
  'SETTINGS → PERSONA PROMPTS. Set the "refer to you" field once; edit either prompt and SAVE to customize its instructions/tone/guardrails; RESET TO DEFAULT restores the built-in version. Overrides are stored privately (gitignored) and apply to your next message with no restart.',
  'Use it to rename how the assistants address you, tighten or loosen a persona\'s style, or add a standing instruction (e.g. "always show your math"). Keep the tool names in the default prompt if you edit it — they are how the persona knows what it can do. Educational personas only — editing the prompt does not grant new tools or the ability to trade.');
W('knowledge','Automation','Knowledge library (local RAG)',
  'A folder of reference documents (.md/.txt/.pdf) the chat personas can search: your IPS, IRS publications, investing-principles guides, plus the committed reference/ set (estate & generational transfer, business-acquisition/QSBS frameworks, and a dated snapshot of the grounded 2026 tax/ACA/SS parameters). Everything is embedded locally with bge-m3 — nothing leaves the machine.',
  'SETTINGS → KNOWLEDGE shows the folder, document/chunk counts, embedding model, and last index time. Drop files in the host folder (or remove them) and hit REINDEX; it runs in the background on the job queue and the button shows live chunk-level progress (% and current file) instead of blocking. The personas answer with citations from these documents via their search_knowledge tool.',
  'Use it so chat answers about tax law, IRA mechanics, estate basis rules, or your own IPS quote a document instead of model memory — and refresh the parameter-snapshot doc each January so the library never contradicts the live GROUNDING registry.');
W('earnings-trigger','Automation','Post-earnings brief refresh (event-driven research)',
  'The daily analysis job (18:00 cron) isn\'t the only way a brief gets refreshed: a held ticker\'s earnings print now triggers its OWN targeted refresh — same-day for a before/during-market report, next morning for an after-close one — instead of waiting up to a full day for the next scheduled run. It\'s scoped to just the reporting ticker(s), not the whole book, so it\'s cheap and fast.',
  'Checked once daily (08:15 local) by the internal scheduler; it only enqueues the job kind `earnings_brief` when a print is actually due, so a blank #jobs badge on a normal day is correct, not broken. Each report date only triggers once (tracked internally) so it won\'t re-fire every day the check runs. You can also force it via POST /api/run-earnings-brief.',
  'You don\'t need to do anything — this rides the ⚠ ATTENTION "Earnings" flags already on your dashboard. If a print seems to have landed but the brief still looks stale the next morning, check #jobs for `earnings_brief` or force it manually; known gap: a before-market report on a day the calendar hadn\'t yet surfaced (rare, free-tier data lag) can be missed until the NEXT scheduled analysis run.');
W('benefits','Planning','Benefits & contribution room',
  'The guaranteed-return ladder for the next saved dollar: employer-match capture (instant 50-100% return), HSA headroom (the only triple-tax-advantaged account), 401(k) employee-limit headroom with age catch-ups (and the >$150k mandatory-Roth catch-up rule), direct-vs-backdoor Roth IRA eligibility against the MFJ phase-out (now net of what you\'ve actually contributed this year, not the gross annual limit — see below), and mega-backdoor capacity (§415(c) limit minus everything already going in). All 2026 limits are IRS-verified and registered in the AUDITS→GROUNDING watchdog, so they re-flag themselves every January.',
  'PLAN → BENEFITS. Green = captured/eligible; amber actions = free money or one plan question away (the in-service-rollover question to the administrator is the classic unlock). Enter plan facts once in the editor; salary comes from the household register income. The PER-PAYCHECK TOTAL field (employee+match) has its own pay-frequency selector — weekly, bi-weekly, semi-monthly (1st/15th), monthly, or a custom periods/year for irregular pay (e.g. gig work) — used to annualize it for the salary cross-check line. Pick the one that matches your actual payroll; picking the wrong one silently mis-prices the implied salary (a weekly payroll read as bi-weekly understates it by 2x). **Roth IRA contributed YTD (2026-07-22)**: two new fields (you / spouse) track what you\'ve actually put into a Roth IRA so far this year — the NEXT MARGINAL DOLLAR table\'s "Roth IRA ×2" line now shows what\'s actually still open, not the full annual limit as if $0 had gone in; if both spouses have already maxed out, the line drops off the table entirely rather than falsely still recommending it. **Roth IRA pacing (2026-07-30, optional)**: two more fields (you / spouse) for a recurring $/mo contribution, if you have one — with that entered, the ROTH IRA line projects whether you\'re ON PACE or BEHIND PACE to reach the annual limit by December 31, and (if behind) exactly what $/mo the rest of the year would take to still max out. Leave it blank and nothing changes — this is purely additive to the YTD tracking above.',
  'Revisit at annual enrollment, on any raise (percentages drift against fixed limits), and each January when limits re-index. Contribution room is the one guaranteed-return decision in investing — capture it before optimizing anything riskier. Update the Roth YTD fields whenever you make a contribution so the remaining-room figure stays honest through the year; if your Roth contribution comes out of every paycheck as a fixed amount, enter it once in the recurring $/mo field and let the pacing check do the arithmetic instead of eyeballing it each month.');
W('narrative','Dashboard','State of the Wealth (weekly letter)',
  'A plain-language weekly note the AI writes to the household by composing every module\'s cached headline — net worth and its week change, funded ratio, YTD vs your own policy, concentration and attention flags, harvestable losses, earnings ahead, and the AI\'s own track record — ending with a single THIS WEEK\'S FOCUS action. The family-office quarterly letter, weekly and personal.',
  'Top of the DASHBOARD tab. Writes itself Monday mornings through the job queue (SETTINGS → TASK SCHEDULE), or GENERATE NOW any time (watch the #jobs badge). It cites only numbers the modules actually computed — nothing is invented. It is a single one-shot generation (not a per-ticker loop like the research briefs), so on this hardware it can legitimately take several minutes; it has its own timeout (NARR_LLM_TIMEOUT, separate from the research pipeline\'s) sized for that.',
  'Read it Monday with coffee: it turns seventeen panels into one story and one action. If the focus line ever surprises you, the detail lives one click away in the named tab. Educational, not advice. A small "queued Ns for GPU" note next to the timestamp shows how long this run waited for the GPU before it even started generating — if a run ever times out, that same figure appears in the error message so you can tell GPU contention (something else was busy) apart from the generation itself just being slow.');
W('washsale','Taxes & audits','Wash-sale guard (TLH)',
  'A §1091 enforcement layer on the tax-loss-harvest list: the app snapshots every ticker\'s total share count daily across ALL accounts (IRAs included), infers buys from day-over-day increases (which catches silent DRIP reinvestments), and stamps each TLH candidate CLEAR, DRIP-caution, or BLOCKED — with the date the 31-day window reopens and a not-substantially-identical replacement (different-index fund; same-index clones are flagged as risky).',
  'AUDITS → TAX·TLH, the WASH-SALE column. ✗ BLOCKED = shares were bought within 31 days, selling now disallows the loss on those shares; ⚠ DRIP = turn off reinvestment (or confirm no dividend lands ±30 days) before harvesting; ? = the ledger needs ≥2 daily snapshots to judge. Hover the verdict for the full reasoning.',
  'Use it before executing any harvest: a washed loss isn\'t deferred, it\'s wasted paperwork (and an IRA repurchase kills it permanently, Rev. Rul. 2008-5). Replacement pairs keep market exposure during the window. The brokerage\'s lot records are the legal source of truth — confirm there before filing.');
W('performance','Insights & risk','Performance vs policy (TWR)',
  'Time-weighted returns over standard periods (QTD/YTD/1Y/3Y) for three things side by side: your portfolio (current holdings × their price history — a stated approximation that assumes current weights), your OWN policy benchmark (the IPS sleeve targets mapped to proxy ETFs: VTI/VXUS/BND/BIL), and SPY. Plus a tracked TWR chained from the real daily snapshots with a flow guard that treats implausible one-day moves as deposits.',
  'RISK · EXPOSURE → PERFORMANCE. EXCESS vs POLICY is the verdict column: green means your implementation (picks/tilts) beat the allocation itself; red means the plain policy mix would have done better. Coverage % tells you how much of the book had history; the flow-guard count tells you how approximate the tracked number is.',
  'Use it quarterly for the only honest self-review: "did my decisions add value over my own plan?" Persistent negative excess is the data telling you to index the sleeve. Money-weighted views (which include timing of contributions) live in ATTRIBUTION and the paper book.');
W('cashdebt','Planning','Cash, liquidity & debt desk',
  'The household-CFO hygiene panel: emergency-fund months (designated reserve ÷ essential monthly spend, where essentials use the funded-ratio needs share), idle-cash drag vs the live 3-month T-bill, mortgage payoff-vs-invest (after-tax rate against both the guaranteed T-bill and the risky expected return), a refinance break-even, an avalanche ranking of non-mortgage debts against the invest hurdle (now with a $-RANK column too — a large low-rate balance can cost more real dollars/yr than a tiny high-rate one, and the panel flags it when the two rankings disagree), and a PAYOFF SIMULATOR comparing avalanche vs snowball month-by-month. **PMTS LEFT column (2026-08-08)**: payments remaining on each debt at its own current payment (the "if I change nothing" count), with the month it clears under the avalanche plan below it (rollover + extra $/mo included) — the two routinely differ by years, which is the whole argument for following the plan. **Emergency fund (2026-08-08)**: sized from the accounts you explicitly DESIGNATE as EF sources under SETTINGS → ACCOUNTS (or inline here), not from a guess at which account names look like cash — a reserve parked in a brokerage because savings yields are poor used to be invisible to the gauge. Each source can carry a cap so only part of an account counts, and the gauge also reports months covered after an assumed market drawdown, since the emergencies that drain a reserve tend to arrive with bad markets attached.',
  'PLAN → CASH · DEBT. Red alerts = underfunded EF or debts beating the hurdle; the drag line prices what parked cash forfeits per year. Enter mortgage rate/payment, deposit yield, refi candidates, and per-debt APRs in the editor — balances come from the live feed (Plaid/Monarch/SnapTrade) **or from the HOLDINGS tab\'s LIABILITIES table (2026-07-30)** if you don\'t use either — both feed this desk identically, since the avalanche/payoff math only cares that an account is marked as debt, not where it came from; the T-bill comes from FRED daily. Rate %/minimum payment can be entered right here per debt OR on the liability\'s own row in HOLDINGS → LIABILITIES — either place edits the same saved value. **Payoff simulator (2026-07-22)**: enter a minimum payment per debt (next to its APR in the table) and an optional extra $/mo toward payoff, and it runs a real month-by-month amortization two ways — AVALANCHE (highest rate first) and SNOWBALL (smallest balance first) — each retired debt\'s own minimum payment rolls onto the rest of the queue permanently once it\'s paid off (true rollover, not just a one-time bump), reporting months-to-debt-free and total interest for each strategy side by side. A debt missing either its APR or minimum payment is listed as excluded rather than guessed at — enter both to include it.',
  'Use it monthly and on rate moves: it catches the quiet losses (idle cash, expensive debt) and answers the perennial "extra $1k: mortgage or market?" with the guaranteed-vs-expected framing instead of vibes. EF sizing judgment (job security, one vs two incomes) still overrides the spreadsheet. Avalanche always minimizes total interest paid — but snowball\'s faster small-balance wins are a legitimate behavioral tradeoff if that\'s what keeps you paying at all; the simulator shows both so it\'s your call, not a math verdict.');
W('continuity','Planning','Continuity binder + document currency',
  'An always-current, auto-generated estate-OPERATIONS doc for whoever has to handle things if you can\'t: an action checklist, an account-by-account map of how each one actually transfers (beneficiary vs TOD deed vs probate — pulled straight from the ESTATE titling audit), embedded gain the step-up would wipe, any debts to settle, and a key-contacts register (attorney, CPA, advisor, executor, where the will is kept). Composes numbers already computed elsewhere — it adds no new modeling, just assembles the document view of it. Paired with a DOCUMENT CURRENCY tracker (GAP-8): a recurring staleness check on your will, durable POA, healthcare directive, trust, and beneficiary-designation review — each shows the year you last reviewed it and flags ✓ current / ⚠ stale / — not recorded against an editable review-cadence knob (default 3 years).',
  'PLAN → CONTINUITY. The checklist up top is meant to be read first under stress; the document-currency table, account map, and debts below it are the supporting detail. Both sections regenerate from live data/config on every load, so neither can silently drift the way a one-time printed binder or a "I\'ll remember when I last updated my will" mental note would — though a PRINTED copy (🖶 PRINT button) obviously freezes at print time, so reprint after any major change. A stale or never-recorded document also surfaces on the ⚠ ATTENTION header badge (Estate hygiene category) so it doesn\'t require remembering to check this tab.',
  'Fill in the contacts, executor/will-location fields, and each document\'s last-reviewed year once — that\'s the part the app can\'t infer from your accounts. The 3-year cadence is a hygiene reminder, not a legal deadline: the real trigger to re-review any of these is a life event (marriage, divorce, birth, death, home purchase/sale, move to a new state) whenever it happens, cadence or not. Print a copy and put it somewhere a survivor or co-executor would actually find it; this is decision-support, not a substitute for the actual will/POA/trust documents, which still need a licensed attorney.');
W('theme','Automation','Theme (color palette)',
  'Eight built-in color palettes — AMBER TERMINAL (default), COBALT (blue accent, navy-tinted panels), HIGH CONTRAST (brighter text, stronger borders), DAYLIGHT (light mode), and the four CATPPUCCIN flavors (LATTE, light; FRAPPÉ/MACCHIATO/MOCHA, dark) — plus any CUSTOM themes you make. A theme is just 12 colors (page background, panel, alternate panel, two border strengths, accent, three text shades, and positive / negative / info), swapped by overriding CSS variables, so the whole app re-colors at once.',
  'SETTINGS (⚙ gear) → THEME. Click a card to apply instantly — no reload, and the choice persists locally (this browser only, not synced across devices). To make your own: under CUSTOM THEME pick a theme to start from and press NEW CUSTOM THEME. Each of the 12 colors has a color-picker wheel, a HEX box, R/G/B boxes and HUE / SAT / LIGHT sliders — change any of them and the others follow, and the whole app previews the change live. The READABILITY line shows contrast ratios; 4.5 or higher keeps small text legible, and a ⚠ marks a pair that is hard to read. Name it and press SAVE THEME; it then shows up with a ★ among the theme cards, where you can EDIT, EXPORT (copies it as text) or DELETE it. IMPORT… on another browser pastes an exported theme in.',
  'Purely cosmetic — pick whichever is easiest on your eyes/lighting. Custom themes live in this browser only; use EXPORT / IMPORT to move one to another device. If a built-in or custom palette ever looks wrong somewhere, that is a real bug (a spot still holding a hardcoded color) rather than something to work around per-theme.');
W('hedging','Insights & risk','Hedging (covered calls & collars)',
  'Options math on the concentrated names: a COVERED CALL sells the upside above a strike for cash now (income + assignment probability shown); a COLLAR buys a ~10% protective put funded by selling a call (floor and cap shown, often near zero net cost). Chains are delayed Yahoo data; deltas are computed locally from each contract\'s implied volatility.',
  'RISK · EXPOSURE → HEDGING. Cards build for names over the sizing loss-budget plus top direct weights (≥3%), at the ~30-45 day expiration. Yield %/yr on calls, floor/cap on collars; premiums are mid-quotes — verify live before any order. Rebuilds daily or via REFRESH CHAINS.',
  'Use it when a position is too big to hold naked but too appreciated to sell (the collar) or when you\'d happily be paid to trim at a higher price (the covered call). Assignment REALIZES gains and tight collars trip constructive-sale/holding-period rules — check the lot and the CPA first. Educational, not advice.');
W('insurance','Planning','Insurance & risk transfer (protection desk)',
  'A gap analysis of the coverages that protect the plan from non-market ruin: life (capital-needs method with DIME and human-life-value cross-checks), disability income replacement, umbrella liability sized to net worth, a property & casualty checklist (dwelling replacement cost, auto limits, TX flood/wind), and a long-term-care stance by net-worth band. Needs are computed from your live balance sheet at a real discount rate; in-force coverage comes from the policy register you enter.',
  'PLAN → INSURANCE. Each line shows NEED vs IN-FORCE vs GAP — red gaps are the exposures. Enter household incomes and each policy from its declarations page; ages come from PLAN → ASSUMPTIONS. Amber alerts flag gaps, missing disability cover, and term policies expiring within two years.',
  'Use it because an uninsured death, disability, or lawsuit ends a mid-six-figure FI plan faster than any bear market — quantify the gap, then take the numbers to a licensed agent for quotes. Decision-support only; this tool never sells or recommends products.');
W('backtest','Taxes & audits','Decision backtest (vs SPY)',
  'The proof layer: every dated Buy/Sell/Hold call is scored at fixed 1/3/6/12-month horizons AGAINST SPY over the same window — a Buy that rose less than the index is a miss — and every paper-book buy is compared to putting the same dollars in SPY on the same day. Confidence tiers get a Brier score against these market-relative outcomes.',
  'AUDITS → BACKTEST. HIT = Buys that beat SPY + Sells that lagged it (55%+ is real signal, ~50% is a coin flip); EXCESS is the margin; BRIER below 0.25 means stated confidence carries information. Unresolved horizons are excluded, not counted as misses. It rebuilds weekly (Sunday) or on demand.',
  'Use it to answer the only question that matters about the AI\'s research: is it adding value over just buying the index? Judge trends across horizons, not single cells — small samples are noisy.');

// ---- Glossary (finance vocabulary & abbreviations, distinct from the feature-explainer
// 2026-07-27, Jason's ask: every advanced security/GRC feature should be discoverable here, not
// just to people who already know to look at SETTINGS -> SECURITY -> SECURITY POSTURE. Each entry
// below explains the feature in plain terms and points at the specific document/panel for the
// full detail, rather than duplicating the whole document's content into the Wiki card itself.
W('security-overview','Security & Compliance','What actually protects your data',
  'This app treats your financial data like a real fiduciary would: encrypted at rest, access-controlled, and continuously logged — not just "behind a login." The concrete pieces: Fernet encryption for every sensitive table/file (holdings, income, secrets, chat history), Argon2 password hashing (not a fast/reversible hash), mandatory-by-default MFA, a tamper-evident (HMAC hash-chained) audit log, and role-based access (admin vs. viewer) enforced server-side on every request, not just hidden in the UI.',
  'You do not need to configure any of this — it is on by default. What you CAN configure: HTTPS/certificates, MFA and backup codes, the encryption key backup, and household viewer accounts — each has its own Wiki entry above under "Getting started." This entry is the "why" behind all of those: SETTINGS → SECURITY → SECURITY POSTURE is where the actual evidence lives (see the next entry).',
  'If you only read one thing here: back up `secrets.key` (see "Secrets encryption" above) and your recovery key (see "Account recovery" above) somewhere safe. Nothing else on this list can be recovered without them.');
W('security-posture-page','Security & Compliance','Security Posture page & GRC documents (SETTINGS → SECURITY POSTURE)',
  'A dedicated page showing this app\'s security program as real, checkable evidence rather than a marketing claim — built originally as a portfolio/interview artifact, but genuinely useful for anyone operating this deployment. Two layers: a machine-readable ISO/IEC 27001:2022 Annex A control table (generated from `compliance/generate_soa.py`), and the actual prose documents that table is generated from.',
  'The control table shows every Annex A control as Applied / Partial / N/A with a real evidence pointer (a file, endpoint, or UI panel) — filterable by theme (Organizational/People/Physical/Technological). Below it, "GRC DOCUMENTS" lets you read each underlying document inline: the Risk Register, its own Maintenance Process document, the Statement of Applicability, the Incident Response Runbook, the Privacy Notice, the Data Retention Schedule, the ROPA, and the DPIA — click any title to expand it in place.',
  'Start here for a security review of this deployment, or to answer "how does this app actually handle X" for yourself or anyone else evaluating it. Chat can also answer these questions directly now — ask the Fiduciary persona something like "what happens if there\'s a breach" or "what vulnerabilities are currently accepted" and it will pull the relevant document itself.');
W('risk-register-wiki','Security & Compliance','Risk Register — what it tracks, and how it stays current',
  'A living list of specific risks to this deployment (e.g. "master encryption key loss," "dependency supply-chain compromise"), each rated Low/Medium/High on Likelihood and Impact, before and after the mitigations actually in place today — not aspirational ones. It is editable through the app itself (admin-only), not a file you hand-edit.',
  'Under SETTINGS → SECURITY POSTURE, the "RISK REGISTER (live)" panel lists every open risk with an Edit and Close action per row, plus "+ Add risk" for a new one. Closing a risk requires a written reason and never deletes it — closed risks move to their own "Closed / retired" list underneath, so the register stays an honest history rather than a snapshot that quietly loses context. The full rendered document (same data, prose form) is the "Risk Register" entry in GRC DOCUMENTS above it.',
  'Add a row when something genuinely new needs tracking, not for every individual finding — a single CVE inside an already-tracked risk (like "dependency supply chain") is a detail under that row, not a new one. The full rules for when to add/edit/close a row are in the "Risk Register — Maintenance Process" document, also under GRC DOCUMENTS.');
W('audit-log-detections','Security & Compliance','Security Audit Log & automated detections (SETTINGS → SECURITY)',
  'Every security-relevant event — logins, password/MFA changes, config edits, admin actions, denied requests — is written to an append-only, tamper-evident log (each entry is HMAC-chained to the one before it, so a "GET /api/audit/verify" check can prove nothing was altered or deleted after the fact). A background rules engine also sweeps this log every 5 minutes looking for specific attack patterns.',
  'The Security Audit Log panel supports free-text search, an outcome filter (success/denied/failure), and an "alerts only" toggle to see just what the detection rules flagged, without paging through routine logins. The 3 current detection rules: a failed-login burst (5+ failed logins for one username within 10 minutes), a first-seen source IP for an account with prior login history, and MFA-disabled-then-a-sensitive-change within 30 minutes (the classic account-takeover sequence). "RUN DETECTIONS NOW" triggers an immediate sweep instead of waiting for the next 5-minute cycle.',
  'If something looks wrong — a login you don\'t recognize, a change you didn\'t make — this is where to look first, and the chain-verify status line tells you whether to trust what you\'re seeing. There is no separate paging/email/Slack alert system today; an alert IS an entry in this log. See the "Incident Response" entry below for what to do next.\n\nIP addresses are masked to the last octet by default (203.0.113.x) — a privacy-preserving default, applied consistently to both the event\'s own source IP and any IPs bundled inside a detection alert (e.g. every offending IP in a failed-login burst). On this real (non-demo) instance, an admin can check "Show full IP addresses" above the log to see full precision — useful if you\'re building a firewall/WAF blocklist entry from what you see here. That toggle is unavailable on a public demo instance (masking there protects a visitor\'s IP and isn\'t negotiable) and unavailable to viewer-role accounts. There\'s also a non-UI path: `/data/audit.jsonl` on the host always holds the full unmasked source IP for every event, one JSON line each, readable without logging in — it just doesn\'t include the extra bundled IPs from a multi-IP alert, which stay encrypted and only surface through the unmask toggle.');
W('audit-anchor-wiki','Security & Compliance','External timestamp anchoring (SETTINGS → SECURITY → SECURITY AUDIT LOG)',
  'The audit log\'s HMAC hash chain (above) proves nothing was altered WITHOUT detection — but it can\'t prove WHEN the chain existed. Someone with full write access to this app\'s data (a stolen backup, a compromised host) could in principle regenerate the entire chain from scratch with different content, and it would verify perfectly cleanly. External anchoring closes that gap: batches of log entries are formed into a Merkle tree, and the tree\'s root is submitted to an independent RFC 3161 Time-Stamp Authority (TSA) — a third party who never had write access to this app at all — which returns a cryptographically signed proof that exactly that root existed at that time.',
  'A fixed daily job anchors every entry written since the last anchor (or, if nothing changed, re-affirms the unchanged log head as its own positive evidence). A separate, more frequent job independently re-verifies every anchor purely from what\'s archived — no network call, no dependency on today\'s config — and raises an alert (a "detection.alert"-style entry in this same log) on any mismatch. A stuck or unreachable TSA never drops a batch; it just stays queued and keeps retrying automatically. "⚓ ANCHOR NOW" above the log triggers the same job on demand.',
  'The development default TSA (freetsa.org) is free and unaudited — fine for testing, not for anything that needs to hold up as formal evidence. Production should point SETTINGS → ADVANCED KNOBS → "Audit log anchoring" at a QUALIFIED TSA on the eIDAS (EU) or UK trusted list: under eIDAS Regulation (EU) No 910/2014 Article 41, a qualified electronic timestamp carries a legal presumption of the accuracy and integrity of the date/time it indicates — a free/unqualified TSA\'s timestamp is still real cryptographic evidence, just without that specific legal presumption. Every anchor archives the TSA\'s full certificate chain and a revocation check captured at anchor time, precisely so it stays independently verifiable years later even after that cert has expired or the TSA\'s key has rotated.');
W('backup-restore','Security & Compliance','Backup & restore (SETTINGS → SECURITY POSTURE)',
  'One-click encrypted backup of this container\'s entire data volume, and a staged (review-before-applying) restore, both from a panel in the app itself — no terminal needed. Uses the same AES-256-CBC encryption format (PBKDF2, 300,000 iterations) as the host-level `scripts/backup.sh`/`restore.sh` CLI pair and any scheduled backup (systemd timer locally, EventBridge on the AWS demo), so a backup made any of these three ways is restorable by any of the others.',
  'Set a backup passphrase once under SETTINGS → SECRETS ("Backup passphrase") — it\'s stored encrypted at rest, same as every other secret. Then "RUN BACKUP NOW" produces a timestamped, encrypted archive listed in a table below; "Stage restore" on any archive decrypts and extracts it into a separate staging area for you to inspect — it deliberately never overwrites your live data automatically. Completing an actual restore still means stopping the container, copying the staged files over `/data` yourself, and starting it back up — the same manual last step the CLI script always required, just with the decrypt/extract done for you.',
  'This only protects against losing the container/volume, not the whole host — the encrypted archive lands in `./backups` on the same machine by default. If you want protection against losing the machine itself, copy the encrypted archive somewhere else yourself (it\'s already safe to store anywhere, encrypted); that off-host step isn\'t automated today.');
W('waf-geo-blocking','Security & Compliance','Blocking scanners & restricting by country — AWS demo only (for whoever maintains that deployment)',
  'The public AWS demo sits behind an AWS WAFv2 Web ACL, not app code — Security Groups can\'t geo-block, and a Python-side GeoIP check would need an ongoing-maintenance paid API or self-hosted database for something AWS already solves centrally. Three rules, evaluated in order, first match wins: (1) AWS\'s own continuously-updated malicious-IP/scanner list, (2) a custom CIDR blocklist you control (seeded with an observed Shodan range), (3) a country allow-list — currently US-only, blocking every other country including a legitimate visitor from outside the US.',
  'Built and maintained via `scripts/aws-demo/setup-waf.sh` (safe to re-run — it updates the rule set in place rather than duplicating anything). Adding another CIDR to the blocklist, or another country to the allow-list, doesn\'t require re-running the whole script — see the comments at the bottom of that file for the exact one-line commands. This is a deploy/infrastructure control, not something inside the running app itself.',
  'Not present on the real household instance or the local demo — both are LAN-only today, so there\'s no public attack surface to defend at the network edge yet. If that ever changes for your own deployment, revisit whether an equivalent edge control makes sense for your setup.');
W('viewer-roles','Security & Compliance','Household accounts & the viewer role (RBAC)',
  'A second household member can get their own login (SETTINGS → IAM) as either another admin or a "viewer." Viewer means genuinely read-only: full visibility into everything (dashboard, research, planning, even the Security Posture page itself), but every mutating action anywhere in the app is blocked server-side, not just hidden in the UI.',
  'Mutating buttons (RUN NOW, SAVE, DELETE, BUY/SELL, and similar) are visibly dimmed and disabled for a viewer session rather than silently 403ing when clicked. Chat is available to viewers too — it can research and answer questions using the same read-only tools an admin\'s chat uses, but cannot place trades, change config, or bypass any protection, since the underlying tools it calls are read-only by construction regardless of who is asking. Role transfer (making a viewer the admin, or vice versa) happens in place from SETTINGS → IAM, with a password + username confirmation step since it\'s an irreversible handoff for the current session.',
  'Use a viewer account for a spouse/family member who should be able to see everything and ask the chat questions, but never change settings, trigger jobs, or execute strategist actions. Every denied attempt (if one ever happens) is itself logged as `authz.denied` in the Security Audit Log above.');
W('incident-response','Security & Compliance','If something looks wrong: Incident Response',
  'A written, step-by-step response procedure exists for this deployment — not aspirational, every step names a real endpoint, panel, or script that exists today. It covers detect, triage, contain, eradicate/recover, and a mandatory post-incident step (grow the detection rule set with whatever pattern was just missed).',
  'The full runbook is the "Incident Response Runbook" document under SETTINGS → SECURITY POSTURE → GRC DOCUMENTS. In short: anything suspicious starts in the Security Audit Log (verify chain integrity first — a broken chain means treat this as evidence tampering, not just intrusion), gets classified by severity, then contained using the tools already in the app (force-logout via password change, MFA disable/re-enrollment, credential rotation in SETTINGS → SECRETS).',
  'You do not need to memorize this — bookmark the document itself and read it when (if) you actually need it. The one thing worth doing now, not later: know where your recovery key and `secrets.key` backup are (see the "Account recovery" and "Secrets encryption" entries above) — several containment steps assume you can still get in.');
W('dependency-scanning','Security & Compliance','Dependency & container vulnerability scanning (for anyone deploying/maintaining this app)',
  'Every push/PR touching `requirements.txt` or the Dockerfile, plus a standing weekly scan, runs two checks in CI: `pip-audit` over pinned Python dependencies, and a Trivy scan of the actual built container image (catching OS-package CVEs pip-audit alone would miss). CRITICAL findings must patch within 7 days, HIGH within 30 — enforced by failing the build, not just a report someone might ignore.',
  'When a CRITICAL/HIGH finding has no vendor fix available yet (or the vendor has permanently declined to patch it), it can be formally risk-accepted via a `.trivyignore` file at the repo root rather than leaving CI red indefinitely — each entry names the CVE, why it\'s accepted, and an expiry date. Once that date passes, Trivy automatically stops ignoring it and CI fails again on the next push or the weekly scan — a forced periodic review, not something that has to be tracked by memory.',
  'This is a build/deploy-process control, not something to configure inside the running app — relevant if you\'re the one maintaining this codebase\'s CI pipeline. See `.github/workflows/dependency-scan.yml` and `.trivyignore`\'s own comments for the full detail, and this deployment\'s Risk Register (row R-10) for the current risk-acceptance status.');
W('privacy-program','Security & Compliance','Privacy program: what data is kept, and for how long',
  'Beyond encryption and access control, this app documents an actual privacy program: what personal/financial data it processes and why (the ROPA — Record of Processing Activities), a plain-language notice of what\'s collected and how it\'s used (Privacy Notice), how long each category of data is kept before disposal (Data Retention Schedule), and a formal assessment of privacy risk for the more sensitive data categories (DPIA).',
  'All four documents are under SETTINGS → SECURITY POSTURE → GRC DOCUMENTS, readable inline. If you want your own data in a portable form, `GET /api/privacy/export` (surfaced in the Privacy panel under SETTINGS → SECURITY) produces a full export of your account\'s data — the technical mechanism behind any "what do you have on me" question.',
  'Most relevant if this deployment is ever shown to someone outside your own household (a demo, an interview, a security review) — these documents are what let you answer "what happens to my data" precisely instead of from memory.');
W('glossary-options','Glossary','Options & hedging — calls, puts, collars, greeks',
  'CALL = right to BUY 100 sh at the strike by expiration; PUT = right to SELL.\nSTRIKE = that fixed price.\nPREMIUM = the price paid/received for the contract (shown as a mid-quote here — the average of bid/ask, not a live tradeable price).\nDTE = days to expiration.\nITM/OTM/ATM = in/out/at the money, i.e. whether the strike is currently profitable to exercise.\nDELTA (Δ) = how much the option\'s value moves per $1 move in the stock, roughly the probability of finishing ITM (0.25 delta ≈ 25% chance of assignment).\nIMPLIED VOLATILITY (IV) = the market\'s annualized expected-swing estimate baked into the premium — higher IV means richer premiums on both calls and puts.\nASSIGNMENT = the option is exercised against you; on a covered call that means your shares are sold at the strike.\nCOVERED CALL = sell a call against shares you already own, collecting premium now in exchange for capping the upside above the strike.\nCOLLAR = buy a protective put and sell a call to fund it, trading upside above the call strike for a floor at the put strike; ZERO-COST/NET ≤ $0 means the call premium fully paid for the put.\nFLOOR/CAP = the worst/best price the collar leaves you at, in percent from spot.',
  'This app\'s HEDGING panel shows delta and IV per contract, plus the covered call\'s annualized yield and the collar\'s floor/cap/net cost — all computed from delayed chains (CBOE primary, Yahoo fallback), so treat them as sizing guides and re-quote live before any order.',
  'Look here whenever a HEDGING card uses a term you don\'t recognize. For the tax mechanics (qualified covered call holding-period suspension, straddle rules, constructive sale on tight collars) see the dedicated Options & Hedging Mechanics doc in the Knowledge library — ask CHAT to search_knowledge for it, and confirm any specific move with a CPA before acting.');
W('glossary-tax-retirement','Glossary','Tax & retirement acronyms — LTCG, NIIT, IRMAA, MAGI, RMD…',
  'LTCG/STCG = long/short-term capital gains (held over/under one year; LTCG gets preferential federal rates).\nNIIT = 3.8% Net Investment Income Tax on investment income above a MAGI threshold.\nMAGI = Modified Adjusted Gross Income, the income figure that gates NIIT, ACA subsidies, IRMAA and Roth eligibility — each uses its own add-back rules, so the same "MAGI" label can mean a slightly different number per program.\nIRMAA = the Medicare Part B/D premium surcharge triggered by MAGI two years prior, in income-banded tiers.\nACA/PTC/FPL = Affordable Care Act premium tax credit, gated by income as a percent of the Federal Poverty Level — the "subsidy cliff" is where PTC drops to zero.\nTLH = tax-loss harvesting, selling a loser to realize a deductible loss (subject to the wash-sale rule).\nRMD = Required Minimum Distribution, the mandatory annual withdrawal from pre-tax retirement accounts starting at the IRS-set age.\nPIA/FRA = Social Security Primary Insurance Amount and Full Retirement Age, the base benefit and the age it\'s paid at without early/delayed adjustment; COLA = the annual cost-of-living increase applied to it.',
  'These show up across PLAN (retirement, ACA, Social Security, Roth ladder) and AUDITS → TAX·TLH / GROUNDING. GROUNDING lists the current dollar/percent value and source for every dated constant — this glossary explains what the acronym MEANS, GROUNDING shows what it currently IS.',
  'Use this when a PLAN or AUDITS panel assumes you already know the acronym. For year-specific numbers (thresholds, rates, brackets) always defer to AUDITS → GROUNDING over any static description, since those are indexed annually.');
W('glossary-risk','Glossary','Risk & portfolio analytics — VaR, CVaR, Sharpe, HHI, TWR/XIRR…',
  'VaR (Value at Risk) = the loss you\'d expect to exceed only X% of the time over a horizon (e.g. 95% 1-month VaR of 8% means an 8%+ monthly loss happens about 1 in 20 months).\nCVaR/Expected Shortfall = the AVERAGE loss in that worst-X% tail — a harsher, more informative number than VaR alone since it captures how bad the tail actually gets.\nSHARPE = excess return per unit of total volatility; SORTINO/CALMAR/TREYNOR are variants using downside deviation, max drawdown, or beta instead.\nMAX DRAWDOWN = the largest peak-to-trough decline over the window.\nHHI (Herfindahl-Hirschman Index) = a concentration score (sum of squared weights) — higher means fewer names dominate the book.\nEFFECTIVE NUMBER OF BETS = 1/HHI on a risk-weighted basis, a more honest "how diversified am I really" than raw position count.\nFACTOR EXPOSURE (FF5 + momentum) = how much of the portfolio\'s return is explained by known systematic factors (market, size, value, profitability, investment, momentum) rather than stock-picking.\nTWR (Time-Weighted Return) = performance stripped of the effect of deposit/withdrawal timing — the right number to compare against a benchmark.\nXIRR/money-weighted return = the return actually experienced given YOUR cash-flow timing — the right number to judge your own results.',
  'These live under RISK · EXPOSURE → RISK / ATTRIBUTION / PERFORMANCE. TWR vs policy/SPY answers "did my decisions add value"; XIRR answers "what did I personally earn."',
  'Reach for VaR/CVaR and HHI/effective-bets when sizing or trimming a concentrated name; reach for TWR vs XIRR when someone asks "how am I doing" and you need to know which question they\'re really asking.');
W('glossary-realestate-business','Glossary','Real estate & business acquisition — cap rate, DSCR, NOI, CoC, SDE…',
  'NOI (Net Operating Income) = rental income minus operating expenses, before debt service — the core rental-property profitability number.\nCAP RATE = NOI ÷ purchase price, a quick unlevered-yield comparison across deals.\nDSCR (Debt Service Coverage Ratio) = NOI (or SDE, for a business) ÷ annual debt payments; lenders gate financing at a minimum DSCR, commonly around 1.25×.\nCoC (Cash-on-Cash return) = annual pre-tax cash flow ÷ actual cash invested (down payment + closing costs) — the levered-return number, distinct from cap rate.\nSDE (Seller\'s Discretionary Earnings) = the small-business valuation metric for owner-operator businesses (pre-tax profit + owner comp + addbacks), vs EBITDA once professional management is assumed.\nPAYBACK PERIOD = years of cash flow to recover the initial equity.\nQSBS §1202 = the federal capital-gains exclusion for qualified small-business C-corp stock held past a multi-year threshold.',
  'This app\'s PLAN → REAL ESTATE and PLAN → BUSINESS underwriters compute these directly from deal inputs, alongside a levered after-tax IRR.',
  'Use these when reading a real-estate or business-acquisition deal card; cap rate and CoC in particular are easy to conflate but answer different questions (deal quality vs your personal leverage payoff).');
W('glossary-estate-benefits','Glossary','Estate, insurance & benefits — step-up, DIME, umbrella, HSA, mega-backdoor…',
  'STEP-UP IN BASIS = an inherited asset\'s cost basis resets to fair market value at death, erasing embedded capital gains for the heir (§1014).\nDIME = a life-insurance need-sizing method (Debt + Income replacement + Mortgage + Education).\nUMBRELLA LIABILITY = excess liability coverage sitting above your auto/home policy limits, sized to net worth since a lawsuit judgment isn\'t capped at your underlying policy.\nHSA = Health Savings Account, triple-tax-advantaged (pre-tax in, tax-free growth, tax-free for medical) but only with a qualifying high-deductible health plan.\nMEGA-BACKDOOR ROTH = after-tax 401(k) contributions above the normal deferral limit, converted (in-plan or out) to Roth — only available if the plan allows after-tax contributions AND in-service rollovers (ISR).\nCATCH-UP CONTRIBUTIONS = higher contribution limits available starting at age 50 (401k/IRA) with a further bump at 60–63 for 401(k)s.\nREVOCABLE (LIVING) TRUST = a trust you fund and control during your lifetime (often as your own trustee) and can amend or revoke any time — avoids probate and lets a successor trustee step in immediately on incapacity, but gives NO asset-protection or estate-tax benefit while revocable.\nIRREVOCABLE TRUST = generally can\'t be changed once created; assets and future growth leave your estate for good — the tool behind SLAT/IDGT/GRAT strategies (see the Estate wiki entry) once an estate nears the exemption.\nPOUR-OVER WILL = a will whose only job is to catch anything left OUTSIDE your trust at death and direct it in — a trust-based plan is really this pair of documents together, not a will replacement.\nFUNDING A TRUST = actually retitling assets (deeds, accounts) into the trust\'s name — an unfunded trust (paperwork only, nothing retitled) skips probate for nothing; retirement accounts/life insurance are usually left in your own name and just get a beneficiary-designation update instead.\nDURABLE POA (FINANCIAL) = appoints an agent for financial/legal decisions if you\'re incapacitated — a DIFFERENT document from the healthcare one below, with a different agent unless drafted to cover both.\nHEALTHCARE DIRECTIVE / ADVANCE DIRECTIVE = your own written medical wishes (life support, CPR, etc.); usually paired with a medical POA (the person empowered to apply those wishes) rather than used alone.\nPROBATE = the court-supervised process of validating a will (or applying intestacy law without one) and transferring assets — public, and commonly 6 months to 2+ years depending on the state and whether it\'s contested; beneficiary designations, TOD deeds, and a funded trust all bypass it.',
  'These live under PLAN → ESTATE, PLAN → INSURANCE, and PLAN → BENEFITS. Each panel shows NEED vs IN-FORCE/CAPTURED vs GAP against your entered facts. The trust/will/POA/probate terms are the mechanics layer CHAT can walk you through conversationally — ask it "do I need a trust" or "what does funding a trust mean" directly.',
  'Use these before entering your own policy/plan facts, so a term like "ISR" or "DIME" doesn\'t block you from filling in the panel correctly. For the trust/POA/probate terms, treat this as prep for an attorney conversation, not a substitute for one — CHAT and this glossary explain the mechanics, they don\'t draft or replace the documents.');
