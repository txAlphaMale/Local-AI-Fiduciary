<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PORTFOLIO TERMINAL</title>
<style>
  :root{
    --bg:#0a0b0d; --panel:#121417; --panel2:#0f1115; --bd:#23262b; --bd2:#2e333a;
    --amber:#f0a823; --txt:#cdd2d8; --mut:#7d848c; --dim:#565c64;
    --grn:#2ec27e; --red:#ff5d5d; --blu:#4a9eff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:13px;line-height:1.45;}
  a{color:var(--blu);text-decoration:none;}
  .wrap{max-width:1500px;margin:0 auto;padding:10px 14px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;
    border-bottom:1px solid var(--bd2);padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap;}
  .brand{color:var(--amber);letter-spacing:2px;font-size:15px;font-weight:700;}
  .brand small{color:var(--dim);letter-spacing:1px;font-weight:400;font-size:11px;margin-left:8px;}
  .topstats{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;}
  .ts{display:flex;flex-direction:column;}
  .ts .l{color:var(--mut);font-size:10px;letter-spacing:1px;}
  .ts .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .controls{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:11px;}
  button{background:transparent;color:var(--amber);border:1px solid var(--bd2);
    font-family:inherit;font-size:11px;letter-spacing:1px;padding:5px 10px;border-radius:3px;cursor:pointer;}
  button:hover{background:var(--panel);border-color:var(--amber);}
  input{background:var(--panel2);color:var(--txt);border:1px solid var(--bd2);border-radius:3px;
    padding:3px 5px;font-family:inherit;font-size:12px;}
  input:focus{outline:none;border-color:var(--amber);}
  .grid{display:grid;gap:10px;}
  .cols{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .panel{background:var(--panel);border:1px solid var(--bd);border-radius:4px;padding:10px 12px;}
  .ph{color:var(--amber);font-size:10px;letter-spacing:2px;margin-bottom:8px;border-bottom:1px solid var(--bd);padding-bottom:5px;}
  .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums;}
  .row .nm{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .sub{color:var(--mut);font-size:11px;}
  .pos{color:var(--grn);} .neg{color:var(--red);} .muted{color:var(--mut);}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th{color:var(--mut);font-size:10px;letter-spacing:1px;text-align:right;padding:4px 6px;
    border-bottom:1px solid var(--bd2);cursor:pointer;user-select:none;white-space:nowrap;}
  th.l,td.l{text-align:left;}
  th:hover{color:var(--amber);}
  td{padding:3px 6px;text-align:right;border-bottom:1px solid #191c20;white-space:nowrap;}
  td.sym{color:var(--amber);text-align:left;}
  td.name{color:var(--mut);text-align:left;max-width:230px;overflow:hidden;text-overflow:ellipsis;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--mut);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .sw{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .err{color:var(--red);padding:20px;text-align:center;}
  .chartbox{position:relative;height:160px;}
  /* ---- Fiduciary / Strategist chat (Phase 4) ---- */
  .chat-wrap{display:flex;gap:12px;height:68vh;min-height:420px;}
  .chat-side{flex:0 0 210px;display:flex;flex-direction:column;border-right:1px solid var(--bd);padding-right:10px;overflow:hidden;}
  .chat-persona{display:flex;gap:6px;margin-bottom:10px;}
  .chat-ptab{flex:1;text-align:center;cursor:pointer;font-size:10px;letter-spacing:1px;padding:5px 0;border:1px solid var(--bd2);border-radius:3px;color:var(--mut);}
  .chat-ptab.on{color:var(--amber);border-color:var(--amber);}
  .chat-list{flex:1;overflow:auto;}
  .chat-sess{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 6px;border-radius:3px;cursor:pointer;font-size:11px;color:var(--txt);}
  .chat-sess:hover{background:var(--panel2);}
  .chat-sess.on{background:var(--panel2);border-left:2px solid var(--amber);}
  .chat-sess-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-sess-x{color:var(--dim);flex:0 0 auto;padding:0 2px;}
  .chat-sess-x:hover{color:var(--red);}
  .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-scroll{flex:1;overflow:auto;padding:4px 8px 8px;}
  .msg{margin:10px 0;display:flex;flex-direction:column;}
  .msg.user{align-items:flex-end;}
  .msg .msg-body{max-width:88%;padding:8px 11px;border-radius:8px;line-height:1.5;font-size:13px;overflow-wrap:anywhere;}
  .msg.user .msg-body{background:var(--panel);border:1px solid var(--bd2);color:var(--txt);}
  .msg.asst .msg-body{background:var(--panel2);border:1px solid var(--bd);color:var(--txt);}
  .msg.asst .msg-body p:first-child{margin-top:0;} .msg.asst .msg-body p:last-child{margin-bottom:0;}
  .msg.asst .msg-body pre{background:#0b0d10;border:1px solid var(--bd2);border-radius:4px;padding:8px;overflow:auto;font-size:12px;}
  .msg.asst .msg-body code{background:#0b0d10;padding:1px 4px;border-radius:3px;font-size:12px;}
  .msg.asst .msg-body pre code{background:none;padding:0;}
  .msg.asst .msg-body table{margin:6px 0;border-collapse:collapse;} .msg.asst .msg-body th,.msg.asst .msg-body td{text-align:left;border:1px solid var(--bd2);padding:3px 6px;}
  .msg-tools{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px;}
  .tool-chip{font-size:10px;letter-spacing:.5px;color:var(--mut);border:1px solid var(--bd2);border-radius:10px;padding:1px 8px;}
  .chat-bar{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--bd);padding-top:8px;margin-top:4px;}
  .chat-input{flex:1;resize:none;min-height:38px;max-height:140px;background:var(--panel2);color:var(--txt);border:1px solid var(--bd2);border-radius:4px;padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.4;}
  .chat-input:focus{outline:none;border-color:var(--amber);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">PORTFOLIO TERMINAL<small id="meta">loading…</small></div>
    <div class="topstats" id="stats"></div>
    <div class="controls">
      <span id="updated"></span>
      <button id="refresh">↻ REFRESH</button>
      <button id="gear" title="Settings" aria-label="Settings" style="font-size:15px;line-height:1;">⚙</button>
    </div>
  </div>
  <div id="body"><div class="muted" style="padding:30px;text-align:center;">Loading portfolio…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const PIE = ['#f0a823','#2ec27e','#4a9eff','#a07bff','#ff7ab8','#5fd0c4','#888780','#e0623a'];
const usd = n => (n==null?'—':'$'+Math.round(n).toLocaleString());
const sgn = n => n==null?'—':(n<0?'-':'+')+'$'+Math.abs(Math.round(n)).toLocaleString();
const pct = n => n==null?'—':(n>0?'+':'')+n.toFixed(2)+'%';
const cls = n => n==null?'muted':(n>=0?'pos':'neg');
const shortInst = s => (s||'?').split(' - ')[0].replace(' from Morgan Stanley','');
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

let DATA=null, SORT={key:'value',dir:-1}, charts=[], VIEW='consolidated', ANALYSIS=null, INSIGHTS=null, RETIRE=null, IDEAS=null, DISCO=null, STRAT=null, STRAT_SERIES=null, TAX=null, TAXAUDIT=null, TAX_INCOME=null, TAX_LTCG=0, FL=null, EXP=null, LT=null, RISK=null, RISKSUITE=null, ATTRIB=null, SCORE=null, INCOME=null, ACCTCFG=null, SETTINGS_CFG=null, SECRETS_CFG=null, KNOWLEDGE_CFG=null, VH=null, GROUND=null, EST=null, LAST_SCAN_ANALYSIS=null, TAB='positions', FOCUS_TICKER=null;
let CHAT_MSGS=[], CHAT_SID=null, CHAT_PERSONA='fiduciary', CHAT_SESSIONS=null, CHAT_STREAMING=false, CHAT_ABORT=null, CHAT_SESS_LOADING=false, CHAT_STREAM_ID=0;
// Second-level sub-tabs: SUBTAB[panelKey] = active section key (persisted).
let SUBTAB={}; try{ SUBTAB=JSON.parse(localStorage.getItem('fidSubtab')||'{}')||{}; }catch(_){ SUBTAB={}; }
let SUBORDER={}; try{ SUBORDER=JSON.parse(localStorage.getItem('fidSubOrder')||'{}')||{}; }catch(_){ SUBORDER={}; }
function setSubtab(panel,key){ SUBTAB[panel]=key; try{ localStorage.setItem('fidSubtab',JSON.stringify(SUBTAB)); }catch(_){} render(); }
function reorderSubtab(panel, orderedKeys, fromKey, toKey){
  if(fromKey===toKey) return;
  const ks=orderedKeys.slice(); const fi=ks.indexOf(fromKey); if(fi<0) return;
  ks.splice(fi,1); const ti=ks.indexOf(toKey); ks.splice(ti<0?ks.length:ti,0,fromKey);
  SUBORDER[panel]=ks; try{ localStorage.setItem('fidSubOrder',JSON.stringify(SUBORDER)); }catch(_){}
  render();
}
// Render a 2nd-row sub-tab bar for `panel` and ONLY the active section's node.
// sections: [{key,label,build:()=>Node}] (falsy entries are ignored). Lazy build =
// unselected sections aren't constructed (cheaper + the hook for per-section refresh).
function panelSubtabs(panel, sections){
  const wrap=el('div');
  let avail=(sections||[]).filter(Boolean);
  if(!avail.length) return wrap;
  const ord=SUBORDER[panel];   // user-dragged order (persisted); unknown keys fall to the end
  if(ord){ const ix=k=>{ const i=ord.indexOf(k); return i<0?999:i; }; avail=avail.slice().sort((a,b)=>ix(a.key)-ix(b.key)); }
  const orderedKeys=avail.map(s=>s.key);
  let active=SUBTAB[panel];
  if(!avail.some(s=>s.key===active)) active=avail[0].key;
  const bar=el('div'); bar.style.cssText='display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 13px;';
  avail.forEach((s,i)=>{
    if(i){ const sep=el('span',null,'·'); sep.style.cssText='color:var(--bd2);opacity:0.6;font-size:11px;user-select:none;'; bar.appendChild(sep); }
    const on=s.key===active;
    const t=el('span',null,s.label);
    t.title='drag to reorder';
    t.style.cssText='cursor:pointer;letter-spacing:1px;font-size:10px;padding:3px 9px;border-radius:3px;'+
      (on?'background:rgba(230,180,80,0.13);color:var(--amber);':'color:var(--mut);');
    t.onclick=()=>setSubtab(panel,s.key);
    t.draggable=true;
    t.ondragstart=e=>{ try{ e.dataTransfer.setData('text/plain', s.key); e.dataTransfer.effectAllowed='move'; }catch(_){} };
    t.ondragover=e=>{ e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){} };
    t.ondrop=e=>{ e.preventDefault(); let from=''; try{ from=e.dataTransfer.getData('text/plain'); }catch(_){} if(from) reorderSubtab(panel, orderedKeys, from, s.key); };
    bar.appendChild(t);
  });
  wrap.appendChild(bar);
  const sec=avail.find(s=>s.key===active)||avail[0];
  try{ wrap.appendChild(sec.build()); }
  catch(e){ const er=el('div','err'); er.textContent='section error: '+e; wrap.appendChild(er); }
  return wrap;
}
function openBrief(t){ if(!t) return; FOCUS_TICKER=t; TAB='research'; SUBTAB['research']='briefs'; render(); }

// analyst (Finnhub consensus) rating helpers, shared by the positions table + research panel
const ratingColor = r => r==='Buy'?'var(--grn)':(r==='Sell'?'var(--red)':'var(--amber)');
const ratingBadge = r => r ? `<span style="color:${ratingColor(r)}">${r}</span>` : '<span class="muted">—</span>';
const analystRating = t => (ANALYSIS&&ANALYSIS.briefs&&ANALYSIS.briefs[t]&&ANALYSIS.briefs[t].grounded)
  ? ANALYSIS.briefs[t].grounded.rating : null;

async function load(refresh, bg){
  if(CHAT_STREAMING) return;   // never wipe the page (and the live chat) mid-stream
  const _bgScrollY = bg ? window.scrollY : null;   // preserve the user's place across a background poll
  document.getElementById('refresh').textContent='…';
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 90000);
    let r;
    try{ r = await fetch('/api/portfolio'+(refresh?'?refresh=1':''), {signal:ctl.signal}); }
    finally{ clearTimeout(to); }
    const d = await r.json();
    if(d.error){ document.getElementById('body').innerHTML='<div class="err">'+d.error+'</div>'; return; }
    DATA=d;
    render();   // show core dashboard immediately — never block the page on a slow secondary panel
    const gj=async(u)=>{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),25000);
      try{ return await (await fetch(u,{signal:c.signal})).json(); }catch(_){ return null; }finally{ clearTimeout(t); } };
    const [an,ins,ret,ide,dis,str,tax,txa,fl,exp,lt,rk,sc,inc,acc,setg,secg,kng,vh,gnd,est,rks,ats]=await Promise.all([
      gj('/api/analysis'),gj('/api/rebalance'),gj('/api/retirement'),
      gj('/api/opportunities'),gj('/api/discovery'),gj('/api/paper'),gj('/api/tax'),gj('/api/tax-audit'),gj('/api/fees-liquidity'),gj('/api/exposure'),gj('/api/lookthrough'),gj('/api/risk-metrics'),gj('/api/scorecard'),gj('/api/income-plan'),gj('/api/accounts-config'),gj('/api/settings'),gj('/api/secrets'),gj('/api/knowledge'),gj('/api/value-history'),gj('/api/grounding'),gj('/api/estate'),gj('/api/risk-suite'),gj('/api/attribution')]);
    ANALYSIS=an; INSIGHTS=ins; RETIRE=ret; IDEAS=ide; DISCO=dis; STRAT=str; TAX=tax; TAXAUDIT=txa; FL=fl; EXP=exp; LT=lt; RISK=rk; SCORE=sc; INCOME=inc; ACCTCFG=acc; SETTINGS_CFG=setg; SECRETS_CFG=secg; KNOWLEDGE_CFG=kng; VH=vh; GROUND=gnd; EST=est; RISKSUITE=rks; ATTRIB=ats;
    if(TAX_INCOME==null){ const ra=(RETIRE&&!RETIRE.error&&RETIRE.assumptions)||{}; TAX_INCOME=(ra.annual_expenses!=null?Math.round(ra.annual_expenses):0)||0;
      if(TAX_INCOME>0){ try{ const rt=await fetch(`/api/tax?gross_ordinary=${TAX_INCOME}&ltcg=${TAX_LTCG||0}`); TAX=await rt.json(); }catch(_){} } }
    render();   // re-render with research / insights / plan / ideas / strategist panels
    if(_bgScrollY!=null){ try{ window.scrollTo(0, _bgScrollY); }catch(_){} }   // restore scroll after a background refresh
  }catch(e){ document.getElementById('body').innerHTML='<div class="err">'+e+'</div>'; }
  document.getElementById('refresh').textContent='↻ REFRESH';
}

function render(){
  const d=DATA;
  document.getElementById('meta').textContent =
    ` · ${d.investment_account_count} brokerage accts · ${d.position_count} positions`;
  const age = d.cached_age_s||0;
  document.getElementById('updated').textContent =
    'as of '+new Date(d.generated_at*1000).toLocaleString()+(age>60?` (${Math.round(age/60)}m old)`:'');
  // top stats
  const stats=[
    ['NET WORTH', usd(d.net_worth), ''],
    ['INVESTED', usd(d.invested_value), ''],
    ['UNREAL P/L', sgn(d.total_unrealized_gain), cls(d.total_unrealized_gain)],
    ['P/L %', pct(d.total_gain_pct), cls(d.total_gain_pct)],
  ];
  document.getElementById('stats').innerHTML = stats.map(s=>
    `<div class="ts"><span class="l">${s[0]}</span><span class="v ${s[2]}">${s[1]}</span></div>`).join('');

  const body=document.getElementById('body'); body.innerHTML='';
  charts.forEach(c=>c.destroy()); charts=[];

  if(TAB!=='chat'){   // the CHAT tab uses the full panel; skip the dashboard strips above it
  body.appendChild(cockpitPanel());   // always-visible "what needs attention" strip

  // row 1: allocations + accounts
  const r1=el('div','grid cols'); body.appendChild(r1);
  r1.appendChild(allocPanel('ALLOCATION · INSTITUTION','c-inst', d.by_institution, d.invested_value));
  r1.appendChild(allocPanel('ALLOCATION · ASSET TYPE','c-type', d.by_type, d.invested_value));
  r1.appendChild(accountsPanel(d));

  // row 2: gainers / losers / movers
  const r2=el('div','grid cols'); r2.style.marginTop='10px'; body.appendChild(r2);
  r2.appendChild(moversPanel('TOP GAINERS', d.gainers, 'gain'));
  r2.appendChild(moversPanel('TOP LOSERS', d.losers, 'gain'));
  r2.appendChild(moversPanel('DAY MOVERS', d.day_movers, 'day_pct'));

  // row 3: portfolio value vs SPY (growth-of-100 line; accrues from the daily snapshot)
  const r3=el('div'); r3.style.marginTop='10px'; r3.appendChild(valuePanel()); body.appendChild(r3);
  }

  // tabbed panel: POSITIONS | RESEARCH (one at a time, to keep the page short)
  const on='color:var(--amber)', off='color:var(--mut)';
  const haveAnalysis = ANALYSIS && ANALYSIS.briefs && Object.keys(ANALYSIS.briefs).length;
  const haveInsights = INSIGHTS && !INSIGHTS.error;
  const havePlan = RETIRE && !RETIRE.error;
  const haveIdeas = IDEAS && !IDEAS.error;
  const haveStrat = STRAT && !STRAT.error;
  const haveTaxAudit = TAXAUDIT && !TAXAUDIT.error && (TAXAUDIT.tax_loss_harvest || TAXAUDIT.asset_location);
  const haveTaxBracket = TAX && !TAX.error && (TAX.marginal_ordinary_rate_pct!=null || TAX.effective);
  const haveTax = haveTaxAudit || haveTaxBracket;
  const haveFL = FL && !FL.error && FL.liquidity;
  const haveResearch = haveAnalysis || haveIdeas;   // RESEARCH tab = briefs + ideas/scan
  const haveAudits = haveTax || haveFL;             // AUDITS tab = tax + fees/liquidity
  if(TAB==='ideas') TAB='research';                 // migrate legacy tab keys -> grouped tabs
  if(TAB==='tax' || TAB==='fl') TAB='audits';
  if(TAB==='research' && !haveResearch) TAB='positions';
  if(TAB==='insights' && !haveInsights) TAB='positions';
  if(TAB==='plan' && !havePlan) TAB='positions';
  if(TAB==='audits' && !haveAudits) TAB='positions';
  if(TAB==='strategist' && !haveStrat) TAB='positions';
  const _gear=document.getElementById('gear'); if(_gear) _gear.style.color=(TAB==='settings')?'var(--amber)':'';
  const p=el('div','panel'); p.style.marginTop='10px';
  const tabBar=el('div'); tabBar.style.cssText='display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--bd);padding-bottom:7px;margin-bottom:10px;flex-wrap:wrap;';
  const mkTab=(key,label)=>{
    const active=TAB===key;
    const t=el('span',null,label);
    t.style.cssText=`cursor:pointer;letter-spacing:2px;font-size:11px;padding-bottom:7px;margin-bottom:-8px;`+
      `border-bottom:2px solid ${active?'var(--amber)':'transparent'};color:${active?'var(--amber)':'var(--mut)'};`;
    t.onclick=()=>{ TAB=key; render(); };
    return t;
  };
  const tabSpecs=[['positions',`OVERVIEW · ${d.unique_securities}`]];
  if(haveResearch) tabSpecs.push(['research','RESEARCH · IDEAS']);
  if(haveInsights) tabSpecs.push(['insights','RISK · EXPOSURE']);
  if(havePlan) tabSpecs.push(['plan','PLAN · FI']);
  if(haveAudits) tabSpecs.push(['audits','AUDITS · TAX·FEES']);
  if(haveStrat) tabSpecs.push(['strategist','STRATEGIST']);
  tabSpecs.push(['chat','CHAT']);   // Fiduciary / Strategist chat — always available (Phase 4, replaces OWUI)
  // SETTINGS is NOT a top tab — it opens from the ⚙ gear in the top-right (N11).
  tabSpecs.forEach((ts,i)=>{
    if(i){ const sep=el('span',null,'|'); sep.style.cssText='color:var(--bd2);opacity:0.7;font-size:12px;user-select:none;'; tabBar.appendChild(sep); }
    tabBar.appendChild(mkTab(ts[0],ts[1]));
  });
  if(TAB==='positions'){   // right-aligned consolidated/by-account sub-toggle
    const tg=el('span'); tg.style.cssText='cursor:pointer;letter-spacing:1px;margin-left:auto;font-size:11px;';
    tg.innerHTML=`<span style="${VIEW==='consolidated'?on:off}">CONSOLIDATED</span> <span class="muted">·</span> <span style="${VIEW==='detail'?on:off}">BY ACCOUNT</span>`;
    tg.onclick=()=>{ VIEW=VIEW==='consolidated'?'detail':'consolidated'; render(); };
    tabBar.appendChild(tg);
  }
  p.appendChild(tabBar);
  const tc=el('div');
  const hrule=()=>{ const s=el('div'); s.style.cssText='border-top:1px solid var(--bd);margin:18px 0 4px;'; return s; };
  if(TAB==='research'){
    const hasDisc=(typeof DISCO!=='undefined' && DISCO && DISCO.discovered && DISCO.discovered.length);
    const hasAlerts=(typeof DISCO!=='undefined' && DISCO && DISCO.alerts && DISCO.alerts.length);
    tc.appendChild(panelSubtabs('research',[
      hasAlerts && {key:'alerts',label:'NEWS ALERTS',build:()=>alertsContent()},
      haveAnalysis && {key:'briefs',label:'B/S/H BRIEFS',build:()=>analysisContent(ANALYSIS)},
      hasDisc && {key:'discovered',label:'DISCOVERED',build:()=>discoveredContent()},
      haveIdeas && {key:'scanner',label:'SCANNER · IDEAS',build:()=>scannerContent()},
    ]));
  } else if(TAB==='audits'){
    tc.appendChild(panelSubtabs('audits',[
      {key:'accounts',label:'ACCOUNTS',build:()=>accountsEditor()},
      haveTax && {key:'tax',label:'TAX · TLH',build:()=>taxContent(TAX, TAXAUDIT)},
      haveFL && {key:'fees',label:'FEES · LIQUIDITY',build:()=>flContent(FL)},
      GROUND && !GROUND.error && {key:'grounding',label:'GROUNDING',build:()=>groundingContent()},
    ]));
  } else if(TAB==='insights' && haveInsights){
    const hasExp=(EXP && (!EXP.error || EXP.computing));
    const hasRisk=((RISK && !RISK.error) || (RISKSUITE && !RISKSUITE.error));
    const hasAttrib=(ATTRIB && !ATTRIB.error);
    const hasLT=(LT && ((!LT.error && LT.true_exposure) || LT.computing));
    tc.appendChild(panelSubtabs('insights',[

  const A=[];  // {sev: warn|opp|info|ok, cat, msg, tab}

  if(INSIGHTS && !INSIGHTS.error){
    const nOver=(INSIGHTS.concentration||[]).length;
    if(nOver) A.push({sev:'warn',cat:'OVER CAP',msg:nOver+' position(s) over your cap',tab:'insights'});
    const nDrift=(INSIGHTS.allocation||[]).filter(a=>a.flag).length;
    if(nDrift) A.push({sev:'warn',cat:'DRIFT',msg:nDrift+' sleeve(s) out of band',tab:'insights'});
  }
  if(TAXAUDIT && !TAXAUDIT.error){
    const tlh=TAXAUDIT.tax_loss_harvest||{};
    if(tlh.total_harvestable_loss && Math.abs(tlh.total_harvestable_loss)>0)
      A.push({sev:'opp',cat:'TAX-LOSS',msg:usd(Math.abs(tlh.total_harvestable_loss))+' harvestable ('+(tlh.count||0)+')',tab:'audits'});
    const nLoc=((TAXAUDIT.asset_location||{}).misplaced||[]).length;
    if(nLoc) A.push({sev:'opp',cat:'ASSET LOC',msg:nLoc+' holding(s) misplaced',tab:'audits'});
  }
  if(FL && !FL.error){
    const nHigh=(((FL.fees||{}).funds)||[]).filter(x=>x.high).length;
    if(nHigh) A.push({sev:'warn',cat:'FEES',msg:nHigh+' high-cost fund(s)',tab:'audits'});
    const nLiq=(((FL.liquidity||{}).flagged)||[]).length;
    if(nLiq) A.push({sev:'warn',cat:'LIQUIDITY',msg:nLiq+' hard-to-exit',tab:'audits'});
  }
  if(DISCO && !DISCO.error){
    const nA=((DISCO.alerts)||[]).length;
    if(nA) A.push({sev:'info',cat:'NEWS',msg:nA+' holding alert(s)',tab:'research'});
  }
  if(RETIRE && !RETIRE.error && RETIRE.monte_carlo && RETIRE.monte_carlo.success_pct!=null){
    const sp=RETIRE.monte_carlo.success_pct;
    A.push({sev: sp>=80?'ok':(sp>=60?'info':'warn'), cat:'FIRE', msg:sp+'% success', tab:'plan'});
  }
  if(RETIRE && !RETIRE.error && RETIRE.bridge && RETIRE.bridge.aca){
    const ac=RETIRE.bridge.aca, fl=ac.flags||{}, sub=ac.subsidy||{}, fp=sub.fpl_pct;
    if(fl.over_cliff) A.push({sev:'warn',cat:'ACA CLIFF',msg:'bridge MAGI '+(fp||'?')+'% FPL — over 400%, $0 subsidy',tab:'plan'});
    else if(fl.below_floor_gap) A.push({sev:'warn',cat:'ACA GAP',msg:'MAGI <100% FPL — TX coverage gap',tab:'plan'});
    else if(fl.on_cliff_edge) A.push({sev:'info',cat:'ACA',msg:(fp||'?')+'% FPL — near 400% cliff',tab:'plan'});
  }
  if(LT && !LT.error && LT.hidden_exposure){
    LT.hidden_exposure.filter(h=>h.ticker && (h.weight_pct||0)>20).slice(0,3).forEach(h=>{
      A.push({sev:'warn',cat:'HIDDEN EXPOSURE',msg:h.ticker+' truly '+h.weight_pct+'% incl. funds',tab:'insights'});
    });
  }
  if(!A.length){ const ok=el('div'); ok.style.cssText='font-size:12px;color:var(--grn);'; ok.textContent='✓ All clear — nothing over your thresholds right now.'; p.appendChild(ok); return p; }
  const colOf={warn:'var(--amber)',opp:'var(--grn)',ok:'var(--grn)',info:'var(--mut)'};
  const strip=el('div'); strip.style.cssText='display:flex;flex-wrap:wrap;gap:7px;';
  A.forEach(a=>{
    const c=colOf[a.sev]||'var(--mut)';
    const chip=el('span');
    chip.style.cssText=`cursor:pointer;border:1px solid ${c};border-left:3px solid ${c};border-radius:3px;`+
      `padding:3px 9px;font-size:11px;color:var(--txt);white-space:nowrap;`;
    chip.innerHTML=`<span style="color:${c};letter-spacing:1px;">${a.cat}</span> <span class="muted">·</span> ${a.msg}`;
    chip.title='Go to '+a.tab.toUpperCase()+' tab';
    chip.onclick=()=>{ TAB=a.tab; render(); };
    strip.appendChild(chip);
  });
  p.appendChild(strip);
  return p;
}

function analysisContent(a){
  const wrap=el('div');
  const sub=el('div','muted'); sub.style.cssText='font-size:10px;letter-spacing:1px;margin-bottom:8px;';
  sub.innerHTML=(a.updated_at?staleStamp(a.updated_at,30)+' · ':'')+'analyst vs model · informational, not advice';
  wrap.appendChild(sub);
  // AI track record (how the model's own past calls performed)
  if(SCORE && SCORE.status==='ready'){
    const s=SCORE, br=s.by_rating||{}, rr=x=>x&&x.avg_fwd_return_pct!=null?`${x.avg_fwd_return_pct>0?'+':''}${x.avg_fwd_return_pct}% (n${x.n})`:'—';
    const sc=el('div'); sc.style.cssText='border:1px solid var(--bd2);border-radius:4px;padding:7px 10px;margin-bottom:10px;font-size:11px;';
    sc.innerHTML=`<span class="ph" style="border:none;padding:0;margin:0;font-size:11px;">AI TRACK RECORD</span> `+
      `<span class="muted">(${s.scored_calls} scored calls, ≥${s.min_age_days}d fwd):</span> `+
      `Buy <span class="${(br.Buy&&br.Buy.avg_fwd_return_pct>=0)?'pos':'neg'}">${rr(br.Buy)}</span> · `+
      `Hold ${rr(br.Hold)} · Sell <span class="${(br.Sell&&br.Sell.avg_fwd_return_pct<=0)?'pos':'neg'}">${rr(br.Sell)}</span> · `+
      `Buy−Hold <span class="${(s.buy_minus_hold_pct||0)>=0?'pos':'neg'}">${s.buy_minus_hold_pct==null?'—':(s.buy_minus_hold_pct>0?'+':'')+s.buy_minus_hold_pct+'pt'}</span> · `+
      `hit-rate ${s.directional_hit_rate_pct==null?'—':s.directional_hit_rate_pct+'%'}`;
    wrap.appendChild(sc);
  }
  const head=el('div'); head.style.cssText='display:grid;grid-template-columns:70px 150px 1fr;gap:8px;font-size:10px;color:var(--mut);letter-spacing:1px;border-bottom:1px solid var(--bd2);padding:3px 0;';
  head.innerHTML='<span>SYM</span><span>ANALYST · MODEL</span><span>THESIS</span>';
  wrap.appendChild(head);
  const badge=r=>{ if(!r) return '<span class="muted">—</span>'; const c=r==='Buy'?'var(--grn)':(r==='Sell'?'var(--red)':'var(--amber)'); return `<span style="color:${c}">${r}</span>`; };
  const fundLine=b=>{
    const f=b.fundamentals, v=b.valuation, out=[];
    if(f && f.available){
      const m=f.metrics||{}, r=f.ratios||{}, bits=[];
      if(m.fiscal_year_end) bits.push('FY'+String(m.fiscal_year_end).slice(0,4));
      if(m.revenue_growth_pct!=null) bits.push('rev '+(m.revenue_growth_pct>0?'+':'')+m.revenue_growth_pct+'%');
      if(r.net_margin_pct!=null) bits.push('nm '+r.net_margin_pct+'%');
      if(r.return_on_equity_pct!=null) bits.push('ROE '+r.return_on_equity_pct+'%');
      if(r.fcf_margin_pct!=null) bits.push('FCFm '+r.fcf_margin_pct+'%');
      if(r.debt_to_equity!=null) bits.push('Liab/Eq '+r.debt_to_equity);
      if(r.quality_of_earnings!=null) bits.push('QoE '+r.quality_of_earnings);
      out.push(`<span style="display:block;color:var(--blu);font-size:10px;margin-top:3px">▸ GAAP: ${bits.join(' · ')}</span>`);
      const sco=f.scores||{}, pf=sco.piotroski_f, az=sco.altman_z, sb=[];
      if(pf) sb.push(`<span class="${pf.rating==='strong'?'pos':(pf.rating==='weak'?'neg':'')}">Piotroski F ${pf.score}/${pf.of}</span>`);
      if(az) sb.push(`<span class="${az.zone==='safe'?'pos':(az.zone==='distress'?'neg':'')}">Altman Z′ ${az.z_score} (${az.zone})</span>`);
      if(sb.length) out.push(`<span style="display:block;color:var(--blu);font-size:10px;margin-top:2px">▸ SCORES: ${sb.join(' · ')}</span>`);
    } else if(f){
      out.push(`<span style="display:block;color:var(--dim);font-size:10px;margin-top:3px">▸ GAAP: not SEC-filed</span>`);
    }
    if(v && (v.pe_ttm!=null||v.pb!=null||v.dividend_yield_pct!=null)){
      const vb=[];
      if(v.pe_ttm!=null) vb.push('P/E '+(+v.pe_ttm).toFixed(1));
      if(v.pe_forward!=null) vb.push('fwd '+(+v.pe_forward).toFixed(1));
      if(v.pb!=null) vb.push('P/B '+(+v.pb).toFixed(1));
      if(v.ps_ttm!=null) vb.push('P/S '+(+v.ps_ttm).toFixed(1));
      if(v.dividend_yield_pct!=null) vb.push('yld '+(+v.dividend_yield_pct).toFixed(2)+'%');
      out.push(`<span style="display:block;color:var(--amber);font-size:10px;margin-top:2px">▸ VAL: ${vb.join(' · ')}</span>`);
    }
    return out.join('');
  };
  const briefs=a.briefs;
  // sort: actionable calls first (Buy, Sell, then Hold), then by model confidence, then ticker
  const RANK={Buy:0,Sell:1,Hold:2}, CONF={high:0,med:1,low:2};
  const sortedKeys=Object.keys(briefs).sort((x,y)=>{
    const mx=(briefs[x]||{}).llm||{}, my=(briefs[y]||{}).llm||{};
    const rx=RANK[mx.rating]==null?3:RANK[mx.rating], ry=RANK[my.rating]==null?3:RANK[my.rating];
    if(rx!==ry) return rx-ry;
    const cx=CONF[mx.confidence]==null?3:CONF[mx.confidence], cy=CONF[my.confidence]==null?3:CONF[my.confidence];
    if(cx!==cy) return cx-cy;
    return x.localeCompare(y);
  });
  sortedKeys.forEach(t=>{
    const b=briefs[t]||{}, g=b.grounded||{}, m=b.llm||{};
    const esc=s=>(s==null?'':s).toString().replace(/</g,'&lt;');
    const thesis=esc(m.thesis||m.summary||(m.error?'model error: '+m.error:''));
    const extra=[];
    if(m.bull_case) extra.push(`<span class="pos" style="display:block;font-size:11px;margin-top:4px">▲ BULL: ${esc(m.bull_case)}</span>`);
    if(m.bear_case) extra.push(`<span class="neg" style="display:block;font-size:11px;margin-top:2px">▼ BEAR: ${esc(m.bear_case)}</span>`);
    if(m.key_risks){ const kr=Array.isArray(m.key_risks)?m.key_risks.join('; '):m.key_risks; extra.push(`<span class="muted" style="display:block;font-size:11px;margin-top:2px">⚠ RISKS: ${esc(kr)}</span>`); }
    const tgt=g.target_mean?` <span class="muted" style="font-size:11px">$${Math.round(g.target_mean)}</span>`:'';
    const conf=m.confidence?` <span class="muted" style="font-size:10px">(${m.confidence})</span>`:'';
    const row=el('div'); row.id='brief-'+t; row.style.cssText='display:grid;grid-template-columns:70px 150px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #191c20;font-size:12px;align-items:start;transition:background 0.4s;';
    row.innerHTML=`<span style="color:var(--amber)">${t}</span>`+
      `<span>${badge(g.rating)}${tgt} <span class="muted">·</span> ${badge(m.rating)}${conf}</span>`+
      `<span style="line-height:1.45"><span class="muted">${thesis||'—'}</span>${extra.join('')}${fundLine(b)}</span>`;
    wrap.appendChild(row);
  });
  return wrap;
}

function researchBrief(d){
  const wrap=el('div'); wrap.style.cssText='padding:6px 0;font-size:12px;line-height:1.5;';
  const m=d.llm||{}, g=d.grounded||{}, va=d.valuation||{};
  const dsc=s=>(s==null?'':s).toString().replace(/</g,'&lt;');
  let html=`<span style="color:var(--amber)">${d.ticker}</span> ${ratingBadge(g.rating)}`+(m.rating?` <span class="muted">·</span> ${ratingBadge(m.rating)}`+(m.confidence?` <span class="muted" style="font-size:10px">(${m.confidence})</span>`:''):'');
  if(g.target_mean) html+=` <span class="muted">· analyst target $${(+g.target_mean).toFixed(2)}</span>`;
  const th=dsc(m.thesis||m.summary||(m.error?'research error: '+m.error:''));
  if(th) html+=`<div class="muted" style="margin-top:4px">${th}</div>`;
  if(m.bull_case) html+=`<div class="pos" style="font-size:11px;margin-top:3px">▲ BULL: ${dsc(m.bull_case)}</div>`;
  if(m.bear_case) html+=`<div class="neg" style="font-size:11px;margin-top:2px">▼ BEAR: ${dsc(m.bear_case)}</div>`;
  if(m.key_risks){ const kr=Array.isArray(m.key_risks)?m.key_risks.join('; '):m.key_risks; html+=`<div class="muted" style="font-size:11px;margin-top:2px">⚠ RISKS: ${dsc(kr)}</div>`; }
  const fund=d.fundamentals||{}, fu=(fund.available?(fund.metrics||{}):{}), ra=(fund.available?(fund.ratios||{}):{});
  const gb=[]; if(fu.revenue_growth_pct!=null) gb.push('rev '+(fu.revenue_growth_pct>0?'+':'')+fu.revenue_growth_pct+'%'); if(ra.net_margin_pct!=null) gb.push('nm '+ra.net_margin_pct+'%'); if(ra.fcf_margin_pct!=null) gb.push('FCFm '+ra.fcf_margin_pct+'%'); if(ra.debt_to_equity!=null) gb.push('D/E '+ra.debt_to_equity);
  const vb=[]; if(va.pe_forward!=null) vb.push('fwd P/E '+(+va.pe_forward).toFixed(1)); if(va.ps_ttm!=null) vb.push('P/S '+(+va.ps_ttm).toFixed(1)); if(va.dividend_yield_pct!=null) vb.push('yld '+(+va.dividend_yield_pct).toFixed(2)+'%');
  if(gb.length) html+=`<div style="color:var(--blu);font-size:10px;margin-top:4px">▸ GAAP: ${gb.join(' · ')}</div>`;
  if(vb.length) html+=`<div style="color:var(--amber);font-size:10px;margin-top:1px">▸ VAL: ${vb.join(' · ')}</div>`;
  const rd=m.reverse_dcf;
  if(rd && rd.implied_growth_pct!=null){
    const dem=/demanding/.test(rd.assessment||'');
    html+=`<div style="font-size:10px;margin-top:1px;color:${dem?'var(--amber)':'var(--mut)'}">▸ REVERSE-DCF: price implies ~${rd.implied_growth_pct}%/yr FCF growth (${rd.years}y)`+
      (rd.vs_actual_growth_pct!=null?` vs ${rd.vs_actual_growth_pct}% actual`:'')+(rd.assessment?` — ${dsc(rd.assessment)}`:'')+`</div>`;
  }
  const ver=m.verification;
  if(ver&&ver.checked&&ver.grounded_score!=null){
    const thr=(ver.threshold!=null?ver.threshold:0.6), sc=Math.round(ver.grounded_score*100), low=ver.grounded_score<thr;
    html+=`<div class="${low?'neg':'pos'}" style="font-size:10px;margin-top:6px">🔍 GROUNDEDNESS ${sc}% <span class="muted">· share of claims supported by the provided data (flagged &lt; ${Math.round(thr*100)}%)</span>`+(ver.assessment?` <span class="muted">· ${dsc(ver.assessment)}</span>`:'')+`</div>`;
    if(Array.isArray(ver.unsupported_claims)&&ver.unsupported_claims.length) html+=`<div class="neg" style="font-size:10px;margin-top:1px">⚑ UNSUPPORTED: ${dsc(ver.unsupported_claims.join('; '))}</div>`;
    if(m.confidence_adjusted) html+=`<div class="muted" style="font-size:10px;margin-top:1px">confidence lowered ${dsc(m.confidence_original)}→${dsc(m.confidence)} (weakly grounded in the data)</div>`;
  }
  html+=`<div class="muted" style="font-size:10px;margin-top:6px">Educational, not advice.</div>`;
  wrap.innerHTML=html; return wrap;
}
function researchIdea(t){
  const box=document.getElementById('scan-analysis'); if(!box) return;
  box.innerHTML='';
  box.appendChild(el('div','ph','ON-DEMAND ANALYSIS · '+t));
  const wait=el('div','muted'); wait.style.cssText='font-size:11px;padding:6px 0;';
  wait.textContent='Analyzing '+t+'… the model runs for a minute or two (SEC fundamentals + analyst + news → LLM), then a second 🔍 groundedness pass fact-checks the brief against that data. Leaving this sub-tab cancels the view but not the run.';
  box.appendChild(wait);
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 300000);
  fetch('/api/research?ticker='+encodeURIComponent(t),{signal:ctl.signal}).then(r=>r.json()).then(d=>{
    clearTimeout(to);
    const b=document.getElementById('scan-analysis'); if(!b) return;
    b.innerHTML=''; b.appendChild(el('div','ph','ON-DEMAND ANALYSIS · '+t));
    if(!d || d.error){ b.appendChild(el('div','muted',(d&&d.error)||'analysis failed')); return; }
    LAST_SCAN_ANALYSIS={ticker:t, data:d};   // cache so a refresh / tab-switch doesn't wipe it
    b.appendChild(researchBrief(d));
  }).catch(e=>{ clearTimeout(to); const b=document.getElementById('scan-analysis'); if(!b) return;
    b.innerHTML=''; b.appendChild(el('div','ph','ON-DEMAND ANALYSIS · '+t));
    b.appendChild(el('div','muted', e.name==='AbortError'?'timed out (model too slow) — try again':('error: '+e))); });
}

  const gn=el('div','muted'); gn.style.cssText='font-size:10px;line-height:1.45;margin:6px 0 14px;'; gn.textContent=g.note||''; wrap.appendChild(gn);

  const v=g.verifier||{};

  if(v.status!=='ready'){ const w=el('div','muted'); w.style.cssText='font-size:11px;margin:6px 0 14px;'; w.textContent=v.note||'no verdicts yet'; wrap.appendChild(w); }
  else{

    vs.innerHTML=st('VERDICTS',v.verdicts)+
      st('AVG GROUNDEDNESS',(v.avg_grounded_score!=null?Math.round(v.avg_grounded_score*100)+'%':'—'),(v.avg_grounded_score||0)>=0.6?'pos':'neg')+
      st('BELOW THRESHOLD',(v.below_threshold_pct!=null?v.below_threshold_pct+'%':'—'))+
      st('DOWNGRADED',(v.downgrade_pct!=null?v.downgrade_pct+'%':'—'))+
      st('JUDGE FAILURES',(v.check_failure_pct!=null?v.check_failure_pct+'%':'—'));
    wrap.appendChild(vs);
    const vn=el('div','muted'); vn.style.cssText='font-size:10px;line-height:1.45;margin-bottom:14px;'; vn.textContent=v.note||''; wrap.appendChild(vn);
  }
  // ---- confidence calibration (Brier), from the scorecard ----
  const c=(SCORE&&!SCORE.error?SCORE.calibration:null);
  const ch=el('div','ph','CONFIDENCE CALIBRATION · BRIER SCORE'); ch.style.marginTop='4px'; wrap.appendChild(ch);
  if(!c){ const w=el('div','muted'); w.style.cssText='font-size:11px;margin:6px 0;'; w.textContent='Accrues once enough directional (Buy/Sell) calls age past the scorecard window.'; wrap.appendChild(w); }

    cs.innerHTML=st('BRIER',c.brier,(c.brier<=c.coin_flip_brier?'pos':'neg'))+st('COIN FLIP','0.25')+st('CALLS',c.n);
    wrap.appendChild(cs);

function saveRetire(){
  const num=id=>{const x=document.getElementById(id).value; return x===''?null:parseFloat(x);};
  const val=id=>{const e=document.getElementById(id); return e?e.value:'';};
  const body={
    withdrawal_rate_pct: num('ret-wr')||4,
    expected_real_return_pct: num('ret-rr')||5,
    current_age: num('ret-age'),
    target_age: num('ret-tage')||60,
    annual_expenses_override: num('ret-exp'),
    annual_savings_override: num('ret-sav'),
    income_target_yield_pct: num('ret-yield')||3.5,
    optimistic_real_return_pct: num('ret-opt')||8,
    volatility_pct: num('ret-vol'),
  };
  // Tax / ACA / SS — only send keys the user actually filled, so a blank never
  // clobbers a stored value. filing_status is a select (always present).
  const fs=val('ret-fs'); if(fs) body.filing_status=fs;
  const opt=(id,key,xf)=>{const v=num(id); if(v!=null) body[key]=xf?xf(v):v;};
  opt('ret-fill','convert_fill_to_rate',v=>v/100);   // UI shows % ; config stores a decimal rate
  opt('ret-needs','needs_pct_of_expenses');          // funded-ratio needs/wants split (G1)
  opt('ret-hh','household_size');
  opt('ret-slcsp','aca_slcsp_annual');
  opt('ret-by','birth_year');
  opt('ret-ca','ss_claim_age');
  opt('ret-ssb','ss_estimated_fra_benefit');
  opt('ret-sby','spouse_birth_year');
  opt('ret-sca','spouse_ss_claim_age');
  opt('ret-sssb','spouse_ss_estimated_fra_benefit');
  fetch('/api/retirement-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(()=>load(false)).catch(e=>alert('Save failed: '+e));
}

function ssWhatif(){

function savePolicy(){
  const targets={};
  document.querySelectorAll('.pol-type').forEach(i=>{ const v=parseFloat(i.value); if(!isNaN(v)) targets[i.dataset.type]=v; });
  const sleeves={};
  document.querySelectorAll('.pol-sleeve').forEach(i=>{ const v=parseFloat(i.value); if(!isNaN(v)) sleeves[i.dataset.sleeve]=v; });
  const caps={};
  (document.getElementById('pol-caps').value||'').split(',').forEach(p=>{
    const m=p.split(':'); const t=(m[0]||'').trim().toUpperCase(); const v=parseFloat((m[1]||'').trim());
    if(t && !isNaN(v)) caps[t]=v;
  });
  const body={ targets_by_type:targets, targets_by_sleeve:sleeves,
    max_position_pct: parseFloat(document.getElementById('pol-maxcap').value)||10,
    drift_threshold_pct: parseFloat(document.getElementById('pol-drift').value)||5,
    position_caps: caps };
  fetch('/api/policy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).then(()=>load(false)).catch(e=>alert('Save failed: '+e));
}

function stratPost(path,body,label){
  return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(r=>r.json()).then(d=>{ if(d&&d.error){ alert(label+' failed: '+d.error); } load(false); return d; })
    .catch(e=>alert(label+' failed: '+e));
}
function stratRun(){
  const s=document.getElementById('strat-runstatus');
  if(s) s.textContent='⏳ Strategist review started — the model runs for several minutes. Hit REFRESH to see new trades & the weekly report.';
  fetch('/api/paper/run',{method:'POST'}).then(r=>r.json())
    .then(d=>{ if(s&&d&&d.status==='already running') s.textContent='⏳ A review is already running…'; })
    .catch(e=>{ if(s) s.textContent='Run failed: '+e; });
}
function stratReset(){
  const c=parseFloat(document.getElementById('strat-reset').value)||2000;
  if(!confirm('Reset the paper portfolio to $'+c.toLocaleString()+'? This wipes positions, history, and any recurring contribution.')) return;
  stratPost('/api/paper/reset',{starting_cash:c},'Reset');
}
function stratContribute(){
  const a=parseFloat(document.getElementById('strat-add').value);
  if(!a||a<=0){ alert('Enter a positive amount to add.'); return; }
  stratPost('/api/paper/contribute',{amount:a},'Contribute');
}
function stratRecurring(){
  const a=parseFloat(document.getElementById('strat-rec').value);
  const cad=document.getElementById('strat-cad').value;
  if(!a||a<=0){ alert('Enter a positive recurring amount.'); return; }
  stratPost('/api/paper/recurring',{amount:a,cadence:cad},'Set recurring');
}

function stratSeedToggle(){ const p=document.getElementById('strat-seedpanel'); if(p) p.style.display=(p.style.display==='none'?'block':'none'); }

function stratSeed(){
  const tickers=[...document.querySelectorAll('.seedck')].filter(x=>x.checked).map(x=>x.getAttribute('data-ticker'));

  wrap.appendChild(ctrl);
  // seed-from-holdings picker (hidden until ⊕ SEED)
  const seedable=((DATA&&DATA.consolidated)||[]).filter(c=>c.ticker && c.type!=='Cash' && c.type!=='Mutual Fund').sort((a,b)=>(b.value||0)-(a.value||0));

  const seedPanel=el('div'); seedPanel.id='strat-seedpanel'; seedPanel.style.cssText='display:none;border:1px solid var(--bd2);border-radius:4px;padding:10px 12px;margin-bottom:12px;';
  seedPanel.innerHTML=
    `<div class="ph" style="border:none;margin-bottom:8px;padding:0;">SEED FROM MY HOLDINGS</div>`+
    `<div style="margin-bottom:8px;font-size:12px;">Cost basis <select id="seed-basis" style="background:var(--panel2);color:var(--txt);border:1px solid var(--bd2);border-radius:3px;"><option value="current">current price (return starts at 0)</option><option value="real">real basis (carry embedded gains)</option></select> &nbsp; Extra cash $<input id="seed-cash" type="number" value="0" style="width:80px;"/></div>`+
    `<div style="margin-bottom:8px;max-height:120px;overflow:auto;">${boxes||'<span class="muted">No tradable holdings found.</span>'}</div>`+
    `<div class="muted" style="font-size:10px;margin-bottom:8px;">Mutual funds &amp; cash are excluded (no live tradable price). Uses your real share counts. This RESETS the paper book.</div>`+
    `<div><button onclick="stratSeed()">✓ SEED &amp; RESET</button> <button onclick="stratSeedAll(true)">all</button> <button onclick="stratSeedAll(false)">none</button> <button onclick="stratSeedToggle()">cancel</button></div>`;
  wrap.appendChild(seedPanel);
  const runStatus=el('div','muted'); runStatus.id='strat-runstatus'; runStatus.style.cssText='font-size:10px;min-height:13px;margin-bottom:10px;'; wrap.appendChild(runStatus);
  if(rec){ const ri=el('div','muted'); ri.style.cssText='font-size:10px;margin-bottom:10px;'; ri.innerHTML=`<span style="color:var(--amber)">↻ recurring</span> $${rec.amount} ${rec.cadence} · next ${new Date(rec.next_ts*1000).toLocaleDateString()}`; wrap.appendChild(ri); }
  if(r.contributed || r.seed_basis){ const ci=el('div','muted'); ci.style.cssText='font-size:10px;margin-bottom:10px;'; const parts=[]; if(r.seed_basis) parts.push('seeded $'+(+r.seed_basis).toLocaleString()); if(r.starting_cash) parts.push('cash $'+(+r.starting_cash).toLocaleString()); if(r.contributed) parts.push('contributions $'+(+r.contributed).toLocaleString()); ci.textContent=`Invested capital: $${(+r.invested_capital).toLocaleString()} (${parts.join(' + ')})`+(r.seeded_from?' · seeded from real holdings':''); wrap.appendChild(ci); }
  const stats=el('div'); stats.style.cssText='display:flex;gap:26px;flex-wrap:wrap;margin-bottom:12px;';
  const st=(l,v,c)=>`<div class="ts"><span class="l">${l}</span><span class="v ${c||''}">${v}</span></div>`;
  stats.innerHTML=st('TOTAL VALUE',u2(r.total_value))+
    st('RETURN',(r.return_pct!=null?(r.return_pct>0?'+':'')+r.return_pct+'%':'—'),cls(r.return_pct))+
    st('P/L',sgn(r.total_return),cls(r.total_return))+st('CASH',u2(r.cash))+st('START',u2(r.starting_cash));
  wrap.appendChild(stats);
  STRAT_SERIES=(r.reports&&r.reports.length>=2)?r.reports.map(x=>({t:x.ts,v:x.total_value})):null;
  if(STRAT_SERIES){ const cb=el('div','chartbox'); cb.style.height='150px'; cb.innerHTML='<canvas id="c-strat"></canvas>'; wrap.appendChild(cb); }
  wrap.appendChild(el('div','ph','PAPER POSITIONS'));
  if(r.positions && r.positions.length){
    const t=el('table'); const h=el('tr'); h.innerHTML='<th class="l">SYM</th><th>SHARES</th><th>AVG</th><th>PX</th><th>VALUE</th><th>P/L</th><th>P/L%</th>'; t.appendChild(h);
    r.positions.forEach(p=>{ const tr=el('tr'); tr.innerHTML=`<td class="sym">${p.ticker}</td><td>${(+p.shares).toFixed(3)}</td><td>${p.avg_cost!=null?'$'+(+p.avg_cost).toFixed(2):'—'}</td><td>${p.price!=null?'$'+(+p.price).toFixed(2):'—'}</td><td>${usd(p.value)}</td><td class="${cls(p.gain)}">${sgn(p.gain)}</td><td class="${cls(p.gain_pct)}">${pct(p.gain_pct)}</td>`; t.appendChild(tr); });
    wrap.appendChild(t);
  } else { wrap.appendChild(el('div','muted','All cash — no positions yet.')); }
  if(r.reports && r.reports.length){
    const rh=el('div','ph','LATEST WEEKLY REPORT'); rh.style.marginTop='12px'; wrap.appendChild(rh);
    const last=r.reports[r.reports.length-1];
    const rb=el('div','muted'); rb.style.cssText='font-size:11px;white-space:pre-wrap;line-height:1.45;';
    rb.textContent=`${new Date(last.ts*1000).toLocaleString()} · value ${u2(last.total_value)} (${last.return_pct>0?'+':''}${last.return_pct}%)\n\n${last.summary||'(no summary)'}`;
    wrap.appendChild(rb);
  }
  if(r.transactions && r.transactions.length){
    const th=el('div','ph','TRANSACTIONS'); th.style.marginTop='12px'; wrap.appendChild(th);
    [...r.transactions].reverse().slice(0,15).forEach(x=>{ const d=el('div'); d.style.cssText='font-size:11px;padding:1px 0;'; d.innerHTML=`<span class="muted">${new Date(x.ts*1000).toLocaleDateString()}</span> <span class="${x.action==='buy'?'pos':'neg'}">${x.action.toUpperCase()}</span> <span style="color:var(--amber)">${x.ticker}</span> ${(+x.shares).toFixed(3)} @ $${(+x.price).toFixed(2)} = ${usd(x.value)}`; wrap.appendChild(d); });
  }
  return wrap;
}

function staleStamp(ts, warnHrs){
  warnHrs=warnHrs||30; if(!ts) return '';
  const h=(Date.now()/1000-ts)/3600, col=h>warnHrs?'var(--amber)':'var(--mut)';
  const txt=h<1?Math.max(1,Math.round(h*60))+'m':(h<48?Math.round(h)+'h':Math.round(h/24)+'d');
  return `<span style="color:${col}">updated ${txt} ago${h>warnHrs?' ⚠ stale':''}</span>`;
}

// ============================================================================
//  Fiduciary / Strategist chat (Phase 4) — streams from POST /api/chat.
//  Read-only: the backend hard-blocks paper-ledger writers for these personas.
//  EventSource is GET-only, so we stream with fetch()+ReadableStream and parse
//  the SSE frames (events: session, token, tool, tool_done, done, error).
// ============================================================================
function mdToHtml(t){
  try{ if(window.marked) return marked.parse(t||'', {breaks:true}); }catch(_){}
  return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
}
function chatScroll(){ const s=document.getElementById('chat-scroll'); if(s) s.scrollTop=s.scrollHeight; }
function chatLoadSessions(){
  if(CHAT_SESS_LOADING) return;
  CHAT_SESS_LOADING=true;
  fetch('/api/chat/sessions').then(r=>r.json())
    .then(d=>{ CHAT_SESSIONS=(d&&d.sessions)||[]; })
    .catch(()=>{ CHAT_SESSIONS=CHAT_SESSIONS||[]; })
    .finally(()=>{ CHAT_SESS_LOADING=false; if(TAB==='chat' && !CHAT_STREAMING) render(); });
}
// Stop the in-flight stream (if any) and supersede its finally handler so a new
// action (new chat, switch persona/session, new message) can start immediately.
function chatInterrupt(){
  if(!CHAT_STREAMING) return;
  CHAT_STREAM_ID++;                       // supersede the running send's generation
  if(CHAT_ABORT){ try{ CHAT_ABORT.abort(); }catch(_){} }
  CHAT_ABORT=null; CHAT_STREAMING=false;
  const last=CHAT_MSGS[CHAT_MSGS.length-1];
  if(last && last.streaming) last.streaming=false;   // freeze the partial answer in place
}
function chatStop(){ chatInterrupt(); render(); }
function chatNew(){ chatInterrupt(); CHAT_SID=null; CHAT_MSGS=[]; render(); }
function chatSetPersona(p){ chatInterrupt(); if(CHAT_PERSONA!==p){ CHAT_PERSONA=p; CHAT_SID=null; CHAT_MSGS=[]; render(); } }
function chatOpen(sid,persona){
  chatInterrupt();
  fetch('/api/chat/session/'+sid).then(r=>r.json()).then(d=>{
    CHAT_SID=sid; if(persona) CHAT_PERSONA=persona;
    CHAT_MSGS=((d&&d.messages)||[]).filter(m=>m.role==='user'||m.role==='assistant')
      .map(m=>({role:m.role,content:m.content||'',tools:[]}));
    render(); chatScroll();
  }).catch(e=>alert('Could not open chat: '+e));
}
function chatDelete(sid,ev){
  if(ev) ev.stopPropagation();
  if(!confirm('Delete this conversation?')) return;
  if(!confirm('Delete this conversation?')) return;
  fetch('/api/chat/session/'+sid,{method:'DELETE'}).then(r=>r.json()).then(()=>{
    if(CHAT_SID===sid){ CHAT_SID=null; CHAT_MSGS=[]; }
    chatLoadSessions();
  }).catch(e=>alert('Delete failed: '+e));
}
function chatKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); chatSend(); } }
function chatTools(asst){
  const t=document.getElementById('chat-live-tools'); if(!t) return;
  t.innerHTML=asst.tools.map(x=>`<span class="tool-chip">${x.done?'✓':'⋯'} ${x.name}</span>`).join('');
}
function chatFrame(frame,asst){
  let ev='message', data='';
  frame.split('\n').forEach(line=>{
    if(line.indexOf('event:')===0) ev=line.slice(6).trim();
    else if(line.indexOf('data:')===0) data+=line.slice(5).trim();
  });
  let o={}; if(data){ try{ o=JSON.parse(data); }catch(_){} }
  if(ev==='session'){ CHAT_SID=o.session_id||CHAT_SID; }
  else if(ev==='token'){ asst.content+=(o.t||''); const c=document.getElementById('chat-live-content'); if(c) c.textContent=asst.content; chatScroll(); }
  else if(ev==='tool'){ asst.tools.push({name:o.name,done:false}); chatTools(asst); }
  else if(ev==='tool_done'){ for(let k=asst.tools.length-1;k>=0;k--){ if(asst.tools[k].name===o.name && !asst.tools[k].done){ asst.tools[k].done=true; break; } } chatTools(asst); }
  else if(ev==='status'){ const c=document.getElementById('chat-live-content'); if(c && !asst.content) c.textContent='⏳ '+(o.message||'waiting…'); chatScroll(); }
  else if(ev==='thinking'){ asst.think=(asst.think||'')+(o.t||''); const c=document.getElementById('chat-live-content'); if(c && !asst.content) c.textContent='💭 thinking… '+asst.think.slice(-400); chatScroll(); }
  else if(ev==='done'){ CHAT_SID=o.session_id||CHAT_SID; }
  else if(ev==='error'){ asst.content+=(asst.content?'\n\n':'')+'⚠ '+(o.error||'error'); const c=document.getElementById('chat-live-content'); if(c) c.textContent=asst.content; }
}
async function chatSend(){
  const ta=document.getElementById('chat-input'); if(!ta) return;
  const msg=(ta.value||'').trim(); if(!msg) return;
  chatInterrupt();             // if a previous answer is still streaming, stop it and start fresh
  ta.value='';
  CHAT_MSGS.push({role:'user',content:msg});
  CHAT_MSGS.push({role:'assistant',content:'',tools:[],streaming:true});
  CHAT_STREAMING=true;
  const myId=++CHAT_STREAM_ID;  // this send's generation; a newer send/nav supersedes it
  render();                    // shows the user turn + an empty streaming bubble (ids: chat-live-*)
  chatScroll();
  const asst=CHAT_MSGS[CHAT_MSGS.length-1];
  const ctl=new AbortController(); CHAT_ABORT=ctl;
  try{
    const resp=await fetch('/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({persona:CHAT_PERSONA, message:msg, session_id:CHAT_SID}),
      signal:ctl.signal});
    if(!resp.ok || !resp.body) throw new Error('HTTP '+resp.status);
    const reader=resp.body.getReader(), dec=new TextDecoder(); let buf='';
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      if(myId!==CHAT_STREAM_ID) return;   // superseded mid-stream — stop consuming, leave state to the newer action
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){ const frame=buf.slice(0,i); buf=buf.slice(i+2); chatFrame(frame,asst); }
    }
  }catch(e){
    if(myId===CHAT_STREAM_ID && e.name!=='AbortError') asst.content+=(asst.content?'\n\n':'')+'⚠ '+e.message;
  }finally{
    if(myId===CHAT_STREAM_ID){   // only the current generation resets shared state / re-renders
      CHAT_STREAMING=false; CHAT_ABORT=null; asst.streaming=false;
      render();                  // final pass: render markdown + refresh the session list
      chatScroll();
      chatLoadSessions();
    }
  }
}
function chatContent(){
  if(CHAT_SESSIONS===null) chatLoadSessions();
  const wrap=el('div','chat-wrap');
  // ---- sidebar: new + persona toggle + session history ----
  const side=el('div','chat-side');
  const nb=el('button',null,'＋ NEW CHAT'); nb.style.cssText='width:100%;margin-bottom:8px;'; nb.onclick=chatNew; side.appendChild(nb);
  const ptg=el('div','chat-persona');
  const mkP=(k,lab)=>{ const s=el('span',null,lab); s.className='chat-ptab'+(CHAT_PERSONA===k?' on':''); s.onclick=()=>chatSetPersona(k); return s; };
  ptg.appendChild(mkP('fiduciary','FIDUCIARY')); ptg.appendChild(mkP('strategist','STRATEGIST'));
  side.appendChild(ptg);
  const list=el('div','chat-list');
  if(CHAT_SESSIONS===null){ const m=el('div','muted'); m.style.cssText='font-size:11px;padding:6px 2px;'; m.textContent='Loading…'; list.appendChild(m); }
  else {
    const sess=CHAT_SESSIONS.filter(s=>s.persona===CHAT_PERSONA);
    if(!sess.length){ const m=el('div','muted'); m.style.cssText='font-size:11px;padding:6px 2px;'; m.textContent='No conversations yet.'; list.appendChild(m); }
    else sess.forEach(s=>{
      const it=el('div','chat-sess'+(s.id===CHAT_SID?' on':''));
      const tt=el('span','chat-sess-t'); tt.textContent=s.title||'(untitled)'; tt.title=s.title||'';
      const x=el('span','chat-sess-x'); x.textContent='✕'; x.title='Delete'; x.onclick=(e)=>chatDelete(s.id,e);
      it.appendChild(tt); it.appendChild(x);
      it.onclick=()=>chatOpen(s.id,s.persona);
      list.appendChild(it);
    });
  }
  side.appendChild(list);
  wrap.appendChild(side);
  // ---- main: transcript + input ----
  const main=el('div','chat-main');
  const scroll=el('div','chat-scroll'); scroll.id='chat-scroll';
  if(!CHAT_MSGS.length){
    const hint=el('div','muted'); hint.style.cssText='padding:24px 12px;text-align:center;font-size:12px;line-height:1.7;';
    hint.innerHTML=(CHAT_PERSONA==='fiduciary'
      ? 'Ask the <span style="color:var(--amber)">Fiduciary</span> about your holdings, concentration, drift, tax, the ACA bridge, or your FIRE plan.'
      : 'Ask the <span style="color:var(--amber)">Strategist</span> about the paper book and market ideas.')
      +'<br><span style="font-size:10px">read-only · no orders · informational, not advice</span>';
    scroll.appendChild(hint);
  }
  CHAT_MSGS.forEach(m=>{
    const row=el('div','msg '+(m.role==='user'?'user':'asst'));
    if(m.role==='assistant'){
      const tools=el('div','msg-tools'); if(m.streaming) tools.id='chat-live-tools';
      if(m.tools && m.tools.length) tools.innerHTML=m.tools.map(x=>`<span class="tool-chip">${x.done?'✓':'⋯'} ${x.name}</span>`).join('');
      row.appendChild(tools);
      const c=el('div','msg-body');
      if(m.streaming){ c.id='chat-live-content'; c.textContent = m.content || (m.think ? '💭 thinking… '+m.think.slice(-400) : '▍ working…'); }
      else c.innerHTML=mdToHtml(m.content);
      row.appendChild(c);
    } else {
      const c=el('div','msg-body'); c.textContent=m.content; row.appendChild(c);
    }
    scroll.appendChild(row);
  });
  main.appendChild(scroll);
  const bar=el('div','chat-bar');
  const ta=el('textarea'); ta.id='chat-input'; ta.className='chat-input'; ta.rows=1;
  ta.placeholder='Message the '+(CHAT_PERSONA==='fiduciary'?'Fiduciary':'Strategist')+'…  (Enter to send · Shift+Enter = newline)';
  ta.onkeydown=chatKey;   // typing stays enabled while a previous answer streams (Enter sends a new one, interrupting)
  bar.appendChild(ta);
  if(CHAT_STREAMING){ const stop=el('button',null,'■ STOP'); stop.onclick=chatStop; bar.appendChild(stop); }
  else { const send=el('button',null,'SEND ▸'); send.onclick=chatSend; bar.appendChild(send); }
  main.appendChild(bar);
  wrap.appendChild(main);
  setTimeout(chatScroll,0);
  return wrap;
}

// The 5-min background poll calls load()->render(), which rebuilds the whole page.
// Suppress it while the user is actively interacting so it never wipes an in-progress
// edit (chat draft, PLAN/policy/scanner fields, what-if inputs) or a live chat stream.
// Manual REFRESH always works. (A true per-panel self-refresh is the larger N2b refactor.)
function userBusy(){
  if(CHAT_STREAMING) return true;                          // a chat is streaming
  const ae=document.activeElement;                         // focused in any editable control
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.tagName==='SELECT')) return true;
  const ta=document.getElementById('chat-input');          // an unsent chat draft on the CHAT tab
  return !!(TAB==='chat' && ta && ta.value.trim()!=='');
}
document.getElementById('refresh').onclick=()=>load(true);
document.getElementById('gear').onclick=()=>{ TAB=(TAB==='settings'?'positions':'settings'); render(); };
load(false);
setInterval(()=>{ if(userBusy()) return; load(false, true); }, 300000);  // re-poll every 5 min (server caches); bg=true preserves scroll
</script>
