<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 2026-07-26 notifications work: manifest+apple meta make "Add to Home Screen" available, which
     is a HARD requirement for the Push API on iOS Safari (16.4+) -- an ordinary open tab there can
     never receive push, only an installed PWA can. Harmless no-ops on desktop/Android. -->
<link rel="manifest" href="/manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Fiduciary" />
<meta name="theme-color" content="#0a0b0d" />
<title>PORTFOLIO TERMINAL</title>
<style>
  :root{
    /* ---- Tier 1: primitives (unchanged — every existing var() reference in this file already
       points at these, so they are NOT renamed; renaming would be a breaking change, not additive.
       See docs/UI-THEMING-DESIGN-TOKEN-PROPOSAL.md, step 1.) ---- */
    --bg:#0a0b0d; --panel:#121417; --panel2:#0f1115; --bd:#23262b; --bd2:#2e333a;
    --amber:#f0a823; --txt:#cdd2d8; --mut:#7d848c; --dim:#565c64;
    --grn:#2ec27e; --red:#ff5d5d; --blu:#4a9eff;

    /* ---- Tier 2: semantic (NEW, 2026-07-19 — additive only, nothing below is consumed by
       existing markup yet; that migration is step 2, a separate/larger effort). Names describe
       INTENT so a future palette swap only needs to change what these ALIAS to, never every call
       site. Each currently mirrors a Tier-1 primitive 1:1 — deliberately trivial for now, this is
       the seam a future theme variant swaps. ---- */
    --color-bg: var(--bg);
    --color-panel: var(--panel);
    --color-panel-alt: var(--panel2);
    --color-border: var(--bd);
    --color-border-strong: var(--bd2);
    --color-text: var(--txt);
    --color-text-muted: var(--mut);
    --color-text-dim: var(--dim);
    --color-accent: var(--amber);
    --color-positive: var(--grn);
    --color-negative: var(--red);
    --color-info: var(--blu);

    /* Overlay/translucent — a small reusable set, NOT a 1:1 mirror of the ~8 hand-picked rgba()
       literals scattered in the file today (those varied slightly pixel-to-pixel with no system,
       e.g. rgba(230,180,80,0.13) vs rgba(240,180,80,0.07) for "amber, faint" in two different
       spots) — consolidating onto ONE canonical value per accent/weight *is* part of the fix,
       so these are intentionally new values, not extracted from the old ones. */
    --overlay-accent-weak: rgba(240,168,35,0.13);
    --overlay-accent-weaker: rgba(240,168,35,0.07);
    --overlay-positive-weak: rgba(46,194,126,0.12);
    --overlay-negative-weak: rgba(255,93,93,0.12);
    --overlay-info-weak: rgba(74,158,255,0.12);
    --overlay-white-weak: rgba(255,255,255,0.02);

    /* ---- Tier 2: spacing — a 4px-based scale (RESUME-TRACKER 2026-07-19 research: this is the
       standard convention for this exact "dark terminal dashboard" category, and matches this
       app's own values well — most observed padding/margin in the audit falls in the 0-40px
       range). This is the genuinely NEW structural layer: today's ~200 distinct hardcoded padding
       strings have no shared system to migrate onto until this exists. ---- */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 28px;
    --space-8: 32px;
    --space-9: 36px;
    --space-10: 40px;

    /* ---- Tier 2: typography — names the micro type-scale that already exists IMPLICITLY (the
       audit found font-size values cluster tightly at 9/10/11/12px — 399 of the file's ~419
       font-size declarations are one of these four). Values below match the observed cluster
       centers exactly, so adopting these is a rename, not a redesign. ---- */
    --font-size-xs: 9px;
    --font-size-sm: 10px;
    --font-size-base: 11px;
    --font-size-md: 12px;
    --font-size-lg: 14px;
    --font-size-xl: 16px;

    /* ---- Tier 2: radius — same story as typography: 2/3/4px already dominate every
       border-radius in the file (33 of 36 uses). ---- */
    --radius-sm: 2px;
    --radius-md: 3px;
    --radius-lg: 4px;
  }

  /* ---- Step 3 (2026-07-19): alternate themes — the acceptance test for the whole token
     migration. Each overrides ONLY Tier-1 primitives (never Tier 2/3), which is sufficient:
     every Tier-2 semantic var (e.g. --color-accent: var(--amber)) resolves --amber lazily at
     used-value time per the CSS cascade, so redefining --amber here automatically re-colors
     every one of the ~700 call sites that reference var(--color-accent) — zero JS/HTML touched,
     proving the "swap style via centralized config" goal from the original proposal doc. Applied
     via a data-theme attribute on <html>, set from THEME_LIST / localStorage — see themeContent()
     and the early-init block near SUBTAB/SUBORDER. ---- */
  :root[data-theme="cobalt"]{
    --bg:#080b12; --panel:#0d1420; --panel2:#0a0f18; --bd:#1a2536; --bd2:#243349;
    --amber:#4d9bff; --txt:#d7e2f0; --mut:#7c8ba3; --dim:#4d5b70;
    --grn:#2ec27e; --red:#ff5d5d; --blu:#4ad4ff;
  }
  :root[data-theme="highcontrast"]{
    --bg:#050505; --panel:#0d0d0d; --panel2:#000000; --bd:#3a3a3a; --bd2:#555555;
    --amber:#ffb020; --txt:#f5f5f5; --mut:#b8b8b8; --dim:#868686;
    --grn:#3ddb8f; --red:#ff6b6b; --blu:#5eb3ff;
  }
  /* DAYLIGHT (2026-07-23, revised same day per Jason's live feedback) — the first LIGHT variant,
     a harder proof of the token architecture than cobalt/highcontrast: those two hue-shift an
     already-dark palette, this one inverts the bg/text relationship entirely. All 6 signal colors
     (amber/grn/red/blu) are deepened from their dark-theme values, since the dark theme's
     brighter tones read fine on near-black but lose contrast/legibility used as text/accent color
     on a light background.
     REVISION: the first pass (--bg:#f7f5f0/--panel:#ffffff/--bd:#ddd8cd) was too flat — Jason
     caught it live ("too bright... difficult to visually differentiate the elements... because of
     a shared page background and background of each element"). The dark theme gets its panel-vs-
     page separation from strong BORDER contrast (bright amber accents + visible --bd/--bd2 against
     near-black), not fill contrast alone — the first daylight pass had both panel fill AND border
     too close to the page bg to read as separated cards. Fix: widened the --bg/--panel gap (warm
     gray-beige page vs. crisp white cards, a real perceptible "lift") and darkened --bd/--bd2
     meaningfully so card edges are clearly visible at a glance, not just theoretically present.
     Still overrides ONLY Tier-1 primitives — nothing else needed for the whole app to re-color. */
  /* REVISION 2 (same day): Jason's second live pass — panel/page separation now reads fine, but
     text was still too faded (--txt/--mut leaned grey, not truly dark) and the signal colors were
     over-desaturated ("truer" red/green/blue requested). Values below were chosen against
     computed WCAG contrast ratios (not eyeballed): --txt near-black (18.9:1 on white, plenty of
     headroom), --mut/--dim firmed up (8.9:1 / 4.6:1, was 6-ish/3.8), and amber/grn/red/blu all
     picked as more saturated "true" tones while staying >=4.5:1 against white (small 9-12px text
     in this dashboard needs real contrast, not just visual vividness) — green in particular: the
     most saturated candidate tested (#16a34a) only cleared 3.3:1, unsafe at this font size, so
     landed one step darker (#0f7a38, 5.4:1) as the vivid-but-legible balance. */
  :root[data-theme="daylight"]{
    --bg:#ece7dc; --panel:#ffffff; --panel2:#f5f2ea; --bd:#c9c2b0; --bd2:#a89f88;
    --amber:#a0530a; --txt:#111111; --mut:#4d4a42; --dim:#7a7468;
    --grn:#0f7a38; --red:#c81e1e; --blu:#1d4ed8;
    /* REVISION 3 (2026-07-23, same day — "briefs display colors still soft"): the base
       --overlay-*-weak tokens (defined once in :root, not per-theme) are hardcoded rgba()
       literals built from the DARK theme's brighter signal colors (e.g. rgba(240,168,35,0.13)
       — the old bright --amber #f0a823). Live-verified via computed styles: badge/chip
       borders and text ARE rendering the correct v3 daylight hex values (checked directly,
       not by eye) — the actual defect was these overlay tints, which stayed tied to the
       dark palette's amber/grn/red/blu instead of daylight's own, so the FIRST-TIME SETUP
       card and setup-spotlight callout fills were nudging toward the WRONG accent hue.
       Re-derived here from this theme's own signal colors at the same alpha weights. */
    --overlay-accent-weak: rgba(160,83,10,0.13);
    --overlay-accent-weaker: rgba(160,83,10,0.07);
    --overlay-positive-weak: rgba(15,122,56,0.12);
    --overlay-negative-weak: rgba(200,30,30,0.12);
    --overlay-info-weak: rgba(29,78,216,0.12);
  }

  /* ---- Catppuccin flavors (2026-07-31) — four more Tier-1 overrides, same mechanism as
     cobalt/highcontrast/daylight above: only --bg/--panel/--panel2/--bd/--bd2/--amber/--txt/
     --mut/--dim/--grn/--red/--blu are touched, so the whole app re-colors with zero JS/HTML
     changes. Values are the official hex swatches from https://catppuccin.com/palette
     (flavors: Latte, Frappé, Macchiato, Mocha). Catppuccin is a community-maintained,
     MIT-licensed color scheme — copyright (c) 2021 Catppuccin, https://github.com/catppuccin/
     catppuccin/blob/main/LICENSE. Palette values are used here as inert data (hex codes are
     generally not independently copyrightable), but the MIT license and full attribution are
     kept below and also surfaced in the SETTINGS -> THEME panel UI (see themeContent()) as a
     courtesy credit to the project, not because it's strictly required for color values alone.

     Mapping convention (same "panel lightest, panel2 middle, bg darkest" layering used by every
     theme above): --bg <- flavor's Crust, --panel2 <- Mantle, --panel <- Base; --bd <- Surface0,
     --bd2 <- Surface1; --txt <- Text, --mut <- Subtext0, --dim <- Overlay0; --amber (this app's
     accent slot) <- Peach, the closest warm/orange analog in the Catppuccin set since Catppuccin
     has no direct "amber" swatch; --grn/--red/--blu <- Green/Red/Blue. Latte (the one LIGHT
     flavor) additionally re-derives the --overlay-*-weak tokens from its own signal colors, same
     fix as the DAYLIGHT theme above and for the identical reason (the base :root overlay rgba()
     literals are tuned to the DARK theme's amber and read wrong-hued on a light background). */
  :root[data-theme="catppuccin-latte"]{
    --bg:#dce0e8; --panel:#eff1f5; --panel2:#e6e9ef; --bd:#ccd0da; --bd2:#bcc0cc;
    --amber:#fe640b; --txt:#4c4f69; --mut:#6c6f85; --dim:#9ca0b0;
    --grn:#40a02b; --red:#d20f39; --blu:#1e66f5;
    --overlay-accent-weak: rgba(254,100,11,0.13);
    --overlay-accent-weaker: rgba(254,100,11,0.07);
    --overlay-positive-weak: rgba(64,160,43,0.12);
    --overlay-negative-weak: rgba(210,15,57,0.12);
    --overlay-info-weak: rgba(30,102,245,0.12);
  }
  :root[data-theme="catppuccin-frappe"]{
    --bg:#232634; --panel:#303446; --panel2:#292c3c; --bd:#414559; --bd2:#51576d;
    --amber:#ef9f76; --txt:#c6d0f5; --mut:#a5adce; --dim:#737994;
    --grn:#a6d189; --red:#e78284; --blu:#8caaee;
  }
  :root[data-theme="catppuccin-macchiato"]{
    --bg:#181926; --panel:#24273a; --panel2:#1e2030; --bd:#363a4f; --bd2:#494d64;
    --amber:#f5a97f; --txt:#cad3f5; --mut:#a5adcb; --dim:#6e738d;
    --grn:#a6da95; --red:#ed8796; --blu:#8aadf4;
  }
  :root[data-theme="catppuccin-mocha"]{
    --bg:#11111b; --panel:#1e1e2e; --panel2:#181825; --bd:#313244; --bd2:#45475a;
    --amber:#fab387; --txt:#cdd6f4; --mut:#a6adc8; --dim:#6c7086;
    --grn:#a6e3a1; --red:#f38ba8; --blu:#89b4fa;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--color-bg);color:var(--color-text);
    font-family:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:13px;line-height:1.45;}
  a{color:var(--color-info);text-decoration:none;}
  .wrap{max-width:1500px;margin:0 auto;padding:var(--space-3) var(--space-4) var(--space-10);}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);
    border-bottom:1px solid var(--color-border-strong);padding-bottom:var(--space-2);margin-bottom:var(--space-3);flex-wrap:wrap;}
  .brand{color:var(--color-accent);letter-spacing:2px;font-size:15px;font-weight:700;}
  .brand small{color:var(--color-text-dim);letter-spacing:1px;font-weight:400;font-size:var(--font-size-base);margin-left:var(--space-2);}
  .topstats{display:flex;gap:var(--space-6);flex-wrap:wrap;align-items:baseline;}
  .ts{display:flex;flex-direction:column;}
  .ts .l{color:var(--color-text-muted);font-size:var(--font-size-sm);letter-spacing:1px;}
  .ts .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .controls{display:flex;align-items:center;gap:var(--space-3);color:var(--color-text-muted);font-size:var(--font-size-base);}
  button{background:transparent;color:var(--color-accent);border:1px solid var(--color-border-strong);
    font-family:inherit;font-size:var(--font-size-base);letter-spacing:1px;padding:var(--space-1) var(--space-3);border-radius:var(--radius-md);cursor:pointer;}
  button:hover{background:var(--color-panel);border-color:var(--color-accent);}
  input{background:var(--color-panel-alt);color:var(--color-text);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);
    padding:var(--space-1) var(--space-1);font-family:inherit;font-size:var(--font-size-md);}
  input:focus{outline:none;border-color:var(--color-accent);}
  input.calc-in::placeholder{font-style:italic;opacity:0.45;}
  .grid{display:grid;gap:var(--space-3);}
  .cols{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .panel{background:var(--color-panel);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-3);}
  .ph{color:var(--color-accent);font-size:var(--font-size-sm);letter-spacing:2px;margin-bottom:var(--space-2);border-bottom:1px solid var(--color-border);padding-bottom:var(--space-1);}
  .row{display:flex;justify-content:space-between;gap:var(--space-2);padding:2px 0;font-variant-numeric:tabular-nums;}
  .row .nm{color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .sub{color:var(--color-text-muted);font-size:var(--font-size-base);}
  .pos{color:var(--color-positive);} .neg{color:var(--color-negative);} .muted{color:var(--color-text-muted);}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th{color:var(--color-text-muted);font-size:var(--font-size-sm);letter-spacing:1px;text-align:right;padding:var(--space-1) var(--space-2);
    border-bottom:1px solid var(--color-border-strong);cursor:pointer;user-select:none;white-space:nowrap;}
  th.l,td.l{text-align:left;}
  th:hover{color:var(--color-accent);}
  td{padding:var(--space-1) var(--space-2);text-align:right;border-bottom:1px solid var(--color-border);white-space:nowrap;}
  td.sym{color:var(--color-accent);text-align:left;}
  td.name{color:var(--color-text-muted);text-align:left;max-width:230px;overflow:hidden;text-overflow:ellipsis;}
  /* Free-text description/note/rationale cells (step-up "treatment", avenue "why", gap "note", etc.)
     opt into wrapping instead of the table default nowrap — they're marked by the existing
     class="l ..." + inline font-size pattern already used at every such call site, so this one
     rule covers all of them without a class added at each site. Numeric/ticker cells that happen to
     share the pattern are unaffected: no spaces to break on, so nowrap vs normal looks identical. */
  td.l[style*="font-size"]{white-space:normal;word-break:break-word;max-width:360px;}
  /* Explicit wrap opt-in (2026-07-26) -- same intent as the rule above (long free-text cells
     should wrap, not force a horizontal scrollbar), but as a real class instead of the
     style*="font-size" trigger, for call sites that don't happen to carry an inline font-size.
     Prefer this for any NEW table with a long-text column; the rule above stays as-is for the
     existing call sites already depending on it. */
  th.wrap,td.wrap{white-space:normal;overflow-wrap:break-word;word-break:break-word;}
  /* Denser row padding + line-height for long reference tables (2026-07-26) — opt in per table
     with class="tbl-compact" rather than repeating padding inline on every cell. The default
     td/th padding above (var(--space-1) var(--space-2)) is fine for shorter tables; a 90+ row
     reference list reads better tighter. */
  .tbl-compact{line-height:1.25;}
  .tbl-compact th,.tbl-compact td{padding:3px 8px;}
  .legend{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-2);font-size:var(--font-size-base);color:var(--color-text-muted);}
  .legend span{display:flex;align-items:center;gap:var(--space-1);}
  .sw{width:9px;height:9px;border-radius:var(--radius-sm);display:inline-block;}
  .err{color:var(--color-negative);padding:var(--space-5);text-align:center;}
  .chartbox{position:relative;height:160px;}
  /* ---- Fiduciary / Strategist chat (Phase 4) ---- */
  .chat-wrap{display:flex;gap:var(--space-3);height:68vh;min-height:420px;}
  .chat-side{flex:0 0 210px;display:flex;flex-direction:column;border-right:1px solid var(--color-border);padding-right:var(--space-3);overflow:hidden;}
  .chat-persona{display:flex;gap:var(--space-2);margin-bottom:var(--space-3);}
  .chat-ptab{flex:1;text-align:center;cursor:pointer;font-size:var(--font-size-sm);letter-spacing:1px;padding:5px 0;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);color:var(--color-text-muted);}
  .chat-ptab.on{color:var(--color-accent);border-color:var(--color-accent);}
  .chat-list{flex:1;overflow:auto;}
  .chat-sess{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding:var(--space-1) var(--space-2);border-radius:var(--radius-md);cursor:pointer;font-size:var(--font-size-base);color:var(--color-text);}
  .chat-sess:hover{background:var(--color-panel-alt);}
  .chat-sess.on{background:var(--color-panel-alt);border-left:2px solid var(--color-accent);}
  .chat-sess-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-sess-x{color:var(--color-text-dim);flex:0 0 auto;padding:0 2px;}
  .chat-sess-x:hover{color:var(--color-negative);}
  .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-scroll{flex:1;overflow:auto;padding:var(--space-1) var(--space-2) var(--space-2);}
  .msg{margin:10px 0;display:flex;flex-direction:column;}
  .msg.user{align-items:flex-end;}
  .msg .msg-body{max-width:88%;padding:var(--space-2) var(--space-3);border-radius:8px;line-height:1.5;font-size:13px;overflow-wrap:anywhere;}
  .msg.user .msg-body{background:var(--color-panel);border:1px solid var(--color-border-strong);color:var(--color-text);}
  .msg.asst .msg-body{background:var(--color-panel-alt);border:1px solid var(--color-border);color:var(--color-text);}
  .msg.asst .msg-body p:first-child{margin-top:0;} .msg.asst .msg-body p:last-child{margin-bottom:0;}
  .msg.asst .msg-body pre{background:#0b0d10;border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);padding:var(--space-2);overflow:auto;font-size:var(--font-size-md);}
  .msg.asst .msg-body code{background:#0b0d10;padding:var(--space-1) var(--space-1);border-radius:var(--radius-md);font-size:var(--font-size-md);}
  .msg.asst .msg-body pre code{background:none;padding:0;}
  .msg.asst .msg-body table{margin:6px 0;border-collapse:collapse;table-layout:fixed;width:100%;} .msg.asst .msg-body th,.msg.asst .msg-body td{text-align:left;border:1px solid var(--color-border-strong);padding:var(--space-1) var(--space-2);overflow-wrap:break-word;word-break:break-word;}
  /* GRC document viewer (2026-07-27 fix -- Jason caught right-aligned/overflowing tables in the
     rendered DPIA doc, e.g. the Likelihood/Impact/Measures table). #posture-doc-viewer (SETTINGS ->
     SECURITY POSTURE -> GRC DOCUMENTS) renders 7 different .md files through the same mdToHtml()/
     marked.js path chat already uses -- but only chat's own container (.msg.asst .msg-body above)
     ever got matching table CSS. Without it, every markdown table in every one of those 7 documents
     fell back to the app's GLOBAL td default (text-align:right, white-space:nowrap, ~line 182),
     which is right for numeric data tables elsewhere but wrong for prose-heavy compliance tables --
     hence the right-aligned, unwrapped, horizontally-scrolling text in the screenshot. Same
     table-layout:fixed + left-align + wrap treatment as the chat rule above, applied once here so
     it covers all 7 documents through this one shared container rather than needing a fix per doc. */
  #posture-doc-viewer table{margin:6px 0;border-collapse:collapse;table-layout:fixed;width:100%;}
  #posture-doc-viewer th,#posture-doc-viewer td{text-align:left;border:1px solid var(--color-border-strong);padding:var(--space-1) var(--space-2);overflow-wrap:break-word;word-break:break-word;white-space:normal;}
  .msg-tools{display:flex;flex-wrap:wrap;gap:var(--space-1);margin-bottom:var(--space-1);}
  .tool-chip{font-size:var(--font-size-sm);letter-spacing:.5px;color:var(--color-text-muted);border:1px solid var(--color-border-strong);border-radius:10px;padding:var(--space-1) var(--space-2);}
  .chat-bar{display:flex;gap:var(--space-2);align-items:flex-end;border-top:1px solid var(--color-border);padding-top:var(--space-2);margin-top:var(--space-1);}
  .chat-input{flex:1;resize:none;min-height:38px;max-height:140px;background:var(--color-panel-alt);color:var(--color-text);border:1px solid var(--color-border-strong);border-radius:var(--radius-lg);padding:var(--space-2) var(--space-3);font-family:inherit;font-size:13px;line-height:1.4;}
  .chat-input:focus{outline:none;border-color:var(--color-accent);}
  /* Guided tour popover (Driver.js, 2026-07-23) — retheme its hardcoded-white default to the
     app's own tokens so it matches whichever of the 4 themes is active, instead of a fixed
     white/black popover clashing with dark themes or looking generic against DAYLIGHT. */

function startTour(){
  if(!window.driver || !window.driver.js){ console.warn('driver.js not loaded — tour unavailable'); return; }
  const driverFn = window.driver.js.driver;
  const steps = buildTourSteps();
  let d=null;
  const goToStep=(idx)=>{
    if(idx<0) return;
    if(idx>=steps.length){ if(d) d.destroy(); _tourMarkDone(); return; }
    const s=steps[idx];
    if(s.tab==='wiki'){ TAB='wiki'; if(s.focusWiki){ WIKI_FOCUS=s.focusWiki; WIKI_OPEN[s.focusWiki]=true; } render(); }
    else { TAB=s.tab; if(s.subtab) setSubtab(s.tab, s.subtab); else render(); }
    setTimeout(()=>{
      if(d) d.destroy();
      const isLast = idx===steps.length-1;
      const step={ element: s.element||undefined,
        popover:{ title:s.title, description:s.desc,
          showButtons: idx===0 ? ['next','close'] : (isLast? ['previous','close'] : ['next','previous','close']),
          nextBtnText: isLast?'Done':'Next →', prevBtnText:'← Back',
          onNextClick:()=>goToStep(idx+1), onPrevClick:()=>goToStep(idx-1),
          onCloseClick:()=>{ d.destroy(); _tourMarkDone(); } } };
      if(!step.element || !document.querySelector(step.element)) delete step.element;
      d = driverFn({ allowClose:true, stagePadding:6, animate:true, popoverClass:'fid-tour-popover',
        progressText:(idx+1)+' of '+steps.length, showProgress:true,

      d.drive();
    }, s.element? 150:0);
  };

                     // shouldn't re-trigger the auto-start on every future Dashboard visit; the
                     // manual 🎯 replay icon stays available regardless of this flag.

// Drag-reorder for tab bars, browser-tab style: the tabs rearrange LIVE under the pointer while you hold the mouse, and
// the order is saved when you let go (Esc / dropping outside the bar puts everything back). History: the first version
// had drop handlers only on the labels and always inserted BEFORE the target (stop icon over the separators, last slot
// unreachable); the second drew an insertion marker that looked glued to the word. Live movement needs no marker.
// A tab moves past a neighbour only once the pointer crosses that neighbour's midpoint, which keeps it from jittering
// when tabs have different widths. The whole bar is the drop zone, so gaps/separators never show the no-drop cursor.
function wireTabBarDnD(bar, onCommit, onRevert){
  let drag=null, dropped=false, orig='';
  const tabs=()=>[...bar.querySelectorAll('[data-dkey]')];
  const keys=()=>tabs().map(t=>t.dataset.dkey);
  const tpl=bar.querySelector('[data-sep]');
  const resep=()=>{            // exactly one separator between neighbouring tabs, whatever order they are in now
    if(!tpl) return;
    bar.querySelectorAll('[data-sep]').forEach(x=>x.remove());
    tabs().forEach((t,i)=>{ if(i) t.parentNode.insertBefore(tpl.cloneNode(true), t); });
  };
  const nearest=e=>{
    let best=null, bd=1e12;
    tabs().filter(t=>t!==drag).forEach(t=>{ const r=t.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const d=Math.hypot(e.clientX-cx,(e.clientY-cy)*3); if(d<bd){ bd=d; best={t,cx}; } });
    return best;
  };
  bar.ondragstart=e=>{
    const t=e.target&&e.target.closest&&e.target.closest('[data-dkey]'); if(!t) return;
    drag=t; dropped=false; orig=keys().join('|');
    setTimeout(()=>{ if(drag) drag.style.opacity='0.35'; },0);           // dim the tab being moved (its slot follows the pointer)
  };
  bar.ondragover=e=>{
    e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){}
    if(!drag) return;
    const n=nearest(e); if(!n) return;
    const all=tabs(), di=all.indexOf(drag), ti=all.indexOf(n.t);
    if(di<ti && e.clientX>n.cx){ n.t.parentNode.insertBefore(drag, n.t.nextSibling); resep(); }
    else if(di>ti && e.clientX<n.cx){ n.t.parentNode.insertBefore(drag, n.t); resep(); }
  };
  bar.ondrop=e=>{
    e.preventDefault(); dropped=true;
    if(drag && keys().join('|')!==orig) onCommit(keys());
  };
  bar.ondragend=()=>{
    if(drag) drag.style.opacity='';
    const moved=drag && keys().join('|')!==orig;
    if(!dropped && moved && onRevert) onRevert();                          // cancelled: put the tabs back
    drag=null;
  };
}

let TABORDER=[]; try{ TABORDER=JSON.parse(localStorage.getItem('fidTabOrder')||'[]')||[]; }catch(_){ TABORDER=[]; }

// Render a 2nd-row sub-tab bar for `panel` and ONLY the active section's node.
// sections: [{key,label,build:()=>Node}] (falsy entries are ignored). Lazy build =
// unselected sections aren't constructed (cheaper + the hook for per-section refresh).
function panelSubtabs(panel, sections){
  const wrap=el('div');
  let avail=(sections||[]).filter(Boolean);
  if(!avail.length) return wrap;
  const ord=SUBORDER[panel];   // user-dragged order (persisted); unknown keys fall to the end
  if(ord){ const ix=k=>{ const i=ord.indexOf(k); return i<0?999:i; }; avail=avail.slice().sort((a,b)=>ix(a.key)-ix(b.key)); }
  let active=SUBTAB[panel];
  if(!avail.some(s=>s.key===active)) active=avail[0].key;
  const bar=el('div'); bar.style.cssText='display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin:0 0 13px;';
  avail.forEach((s,i)=>{
    if(i){ const sep=el('span',null,'·'); sep.dataset.sep='1'; sep.style.cssText='color:var(--color-border-strong);opacity:0.6;font-size:var(--font-size-base);user-select:none;'; bar.appendChild(sep); }
    const on=s.key===active;
    const t=el('span',null,s.label);
    t.title='drag to reorder';
    t.style.cssText='cursor:pointer;letter-spacing:1px;font-size:var(--font-size-sm);padding:var(--space-1) var(--space-2);border-radius:var(--radius-md);'+
      (on?'background:rgba(230,180,80,0.13);color:var(--color-accent);':'color:var(--color-text-muted);');
    t.onclick=()=>setSubtab(panel,s.key);
    t.draggable=true; t.dataset.dkey=s.key;
    t.ondragstart=e=>{ try{ e.dataTransfer.setData('text/plain', s.key); e.dataTransfer.effectAllowed='move'; }catch(_){} };
    bar.appendChild(t);
  });
  wireTabBarDnD(bar, ks=>commitSubOrder(panel, ks), render);
  wrap.appendChild(bar);
  const sec=avail.find(s=>s.key===active)||avail[0];
  try{ wrap.appendChild(sec.build()); }
  catch(e){ const er=el('div','err'); er.textContent='section error: '+e; wrap.appendChild(er); }
  return wrap;
}

async function load(refresh, bg){
  if(CS(CHAT_PERSONA).streaming) return;   // never wipe the page (and the live chat) mid-stream for the persona being VIEWED — a background persona's own stream is untouched by this (its DOM isn't rendered while hidden)
  const _bgScrollY = bg ? window.scrollY : null;   // preserve the user's place across a background poll
  document.getElementById('refresh').textContent='…';
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 90000);
    let r;
    try{ r = await fetch('/api/portfolio'+(refresh?'?refresh=1':''), {signal:ctl.signal}); }
    finally{ clearTimeout(to); }
    const d = await r.json();
    const gj=async(u)=>{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),25000);
      try{ return await (await fetch(u,{signal:c.signal})).json(); }catch(_){ return null; }finally{ clearTimeout(t); } };
    if(d.error){
      // 2026-07-24 fix: a failing portfolio provider (e.g. Monarch/mcpo down) used to leave
      // SETTINGS_CFG/SECRETS_CFG unfetched AND DATA undefined -- render() dereferences DATA
      // unconditionally, so the very first line it runs threw the instant the gear icon was
      // clicked, silently no-op'ing the click. That locked the user out of the one panel
      // (SETTINGS) that could actually fix the failing provider. Fetch settings/secrets here,
      // independently of portfolio health, so SETTINGS/SECRETS stay reachable regardless.
      DATA=null;
      // Also fetch HOLDCSV here: if the failure IS the portfolio provider (e.g. Monarch down),
      // switching to the CSV provider + HOLDINGS tab is the actual escape hatch -- it must stay
      // reachable, not just SETTINGS.
      const [setg,secg,hcsv,mlia]=await Promise.all([gj('/api/settings'), gj('/api/secrets'), gj('/api/holdings-csv'), gj('/api/manual-liabilities')]);
      SETTINGS_CFG=setg; SECRETS_CFG=secg; HOLDCSV=hcsv; MANLIAB=mlia;
      document.getElementById('body').innerHTML='<div class="err">'+d.error
        +'<br><br><span class="muted" style="font-size:var(--font-size-sm);">Portfolio data is unavailable, but SETTINGS (⚙, top right) and the HOLDINGS tab still work — no brokerage account required if you switch to CSV.</span></div>';
      // TASK-002 finding: break-glass must not depend on the portfolio provider. The designee's
      // REQUEST button and the vault live in vaultContent(), so mount it here too.
      try{
        const bodyEl=document.getElementById('body');
        const vp=el('div','panel'); vp.style.cssText='margin-top:var(--space-4);padding:var(--space-3);';
        vp.appendChild(el('div','ph','DOCUMENT VAULT · EMERGENCY ACCESS (available even while portfolio data is down)'));
        vp.appendChild(emergencyBannerNode()); vp.appendChild(vaultContent()); bodyEl.appendChild(vp);
      }catch(_){ }
      return;
    }
    DATA=d;
    render();   // show core dashboard immediately — never block the page on a slow secondary panel
    const [an,ins,ret,ide,dis,str,pscn,tax,txa,fl,exp,lt,rk,sc,inc,acc,setg,secg,kng,vh,gnd,est,rks,ats,szg,rth,lev,avn,ths,rea,biz,alt,sch,btr,insu,hdg,cdb,prf,nrr,ben,con,setp,hcsv,mlia,areg]=await Promise.all([
      gj('/api/analysis'),gj('/api/rebalance'),gj('/api/retirement'),
      gj('/api/opportunities'),gj('/api/discovery'),gj('/api/paper'+(CURRENT_SCENARIO_ID?('?scenario_id='+encodeURIComponent(CURRENT_SCENARIO_ID)):'')),gj('/api/paper/scenarios'),gj('/api/tax'),gj('/api/tax-audit'),gj('/api/fees-liquidity'),gj('/api/exposure'),gj('/api/lookthrough'),gj('/api/risk-metrics'),gj('/api/scorecard'),gj('/api/income-plan'),gj('/api/accounts-config'),gj('/api/settings'),gj('/api/secrets'),gj('/api/knowledge'),gj('/api/value-history'),gj('/api/grounding'),gj('/api/estate'),gj('/api/risk-suite'),gj('/api/attribution'),gj('/api/sizing'),gj('/api/roth'),gj('/api/leverage'),gj('/api/avenues'),gj('/api/theses'),gj('/api/realestate'),gj('/api/business'),gj('/api/alerts'),gj('/api/schedule'),gj('/api/backtest'),gj('/api/insurance'),gj('/api/hedging'),gj('/api/cashdebt'),gj('/api/performance'),gj('/api/narrative'),gj('/api/benefits'),gj('/api/continuity'),gj('/api/setup-progress'),gj('/api/holdings-csv'),gj('/api/manual-liabilities'),gj('/api/account-registry')]);
    ANALYSIS=an; INSIGHTS=ins; RETIRE=ret; IDEAS=ide; DISCO=dis; STRAT=str; SCENARIOS=pscn; TAX=tax; TAXAUDIT=txa; FL=fl; EXP=exp; LT=lt; RISK=rk; SCORE=sc; INCOME=inc; ACCTCFG=acc; SETTINGS_CFG=setg; SECRETS_CFG=secg; KNOWLEDGE_CFG=kng; VH=vh; GROUND=gnd; EST=est; RISKSUITE=rks; ATTRIB=ats; SIZING=szg; ROTH=rth; LEVERAGE=lev; AVENUES=avn; THESES=ths; REALESTATE=rea; BUSINESS=biz; ATTENTION=alt; SCHEDULE=sch; BT=btr; INS=insu; HEDGE=hdg; CASHDEBT=cdb; PERF=prf; NARR=nrr; BEN=ben; CONTIN=con; SETUPPROG=setp; HOLDCSV=hcsv; MANLIAB=mlia; ACCTREG=areg;
    // keep the scenario switcher pointed at a real scenario: adopt the server's resolved default
    // the first time (nothing chosen yet), or if a previously-selected scenario_id was deleted.
    if(STRAT && STRAT.id && (!CURRENT_SCENARIO_ID || (SCENARIOS && SCENARIOS.scenarios && !SCENARIOS.scenarios.some(s=>s.id===CURRENT_SCENARIO_ID)))){
      CURRENT_SCENARIO_ID=STRAT.id; try{ localStorage.setItem('fidScenarioId', CURRENT_SCENARIO_ID); }catch(_){}
    }
    // YOUR LEDGER (2026-07-23b) — the single user-kind scenario, if one exists yet. Fetched as its
    // own follow-up (can't be part of the Promise.all batch above — we don't know its id until
    // SCENARIOS comes back) exactly like the pattern already used below for tax defaults/prompts.
    try{
      const ul=(SCENARIOS&&SCENARIOS.scenarios||[]).find(s=>s.kind==='user');
      USER_LEDGER = ul ? await gj('/api/paper?scenario_id='+encodeURIComponent(ul.id)) : null;
    }catch(_){ USER_LEDGER=null; }
    if(TAX_INCOME==null){ const ra=(RETIRE&&!RETIRE.error&&RETIRE.assumptions)||{}; TAX_INCOME=(ra.annual_expenses!=null?Math.round(ra.annual_expenses):0)||0;
      if(TAX_INCOME>0){ try{ const rt=await fetch(`/api/tax?gross_ordinary=${TAX_INCOME}&ltcg=${TAX_LTCG||0}`); TAX=await rt.json(); }catch(_){} } }
    try{ const rc=await gj('/api/research-cache?history=1'); if(rc && !rc.error){ RESEARCH_CACHE={recent:rc.recent||[], items:rc.items||{}}; } }catch(_){}
    try{ const pc=await gj('/api/prompts'); if(pc && !pc.error){ PROMPTS_CFG=pc; } }catch(_){}
    _resumeResearchPolls();   // re-attach pollers for any on-demand analysis still running after a reload/navigation
    render();   // re-render with research / insights / plan / ideas / strategist panels
    if(!bg) _maybeAutoStartTour();   // once per page session, only after a real (non-background) load
    if(_bgScrollY!=null){ try{ window.scrollTo(0, _bgScrollY); }catch(_){} }   // restore scroll after a background refresh
  }catch(e){ document.getElementById('body').innerHTML='<div class="err">'+e+'</div>'; }
  document.getElementById('refresh').textContent='↻ REFRESH';
}

W('setup-guide','Getting started','First-time setup checklist',
  'A ranked checklist of the optional forms — scattered across a few panels — that unlock the rest of the app beyond what your connected holdings alone already produce (Positions, Research, Risk/Exposure, Fees/Liquidity, Tax-Loss Harvesting, and the Dashboard all work with zero setup). Ranked by biggest unlock for the least typing, not a hard dependency chain — skip anything you don\'t want to enter and that module just stays a placeholder.',
  '**Tier 1 (PLAN → ASSUMPTIONS, do this one first)**: state of residence (biggest single lever — Estate/ACA/Tax/Cash·Debt all read it; left blank, the app silently assumes Texas and flags it in ⚠ ATTENTION until set), filing status, ages, target retirement age, annual expenses/savings, household size, birth year + SS estimate, estate donee count, home cost basis. **Tier 2**: PLAN → INSURANCE (household income — nothing on that page computes without it; children; policies in force; home value override), PLAN → CASH·DEBT (mortgage rate/payment, refi rate, deposit yield, per-debt APRs, the mortgage checkbox for oddly-named loans), PLAN → BENEFITS (401(k) %/match formula, per-paycheck total, after-tax/ISR status for mega-backdoor Roth, HSA facts). **Tier 3**: ACA benchmark premium, IPS policy targets/position caps, Finnhub/Tavily API keys (`.env`, unlocks Research/news/scanning).',
  'Do these in any order, whenever — nothing breaks by skipping them, and most panels update live once you save. After a first pass, check ⚠ ATTENTION (header badge): it flags anything still obviously incomplete instead of making you hunt for it. Full field-by-field detail lives in `NEW-USER-SETUP-GUIDE.md` in the app folder if you want the long-form version of this checklist. **The live checklist tracking your actual saved config is right below this entry** (2026-07-23 — moved here from a Dashboard card, per a user request to keep the Dashboard itself uncluttered) — a ✓/○ per field, a running "X of N done", and a GO → link that jumps straight to the panel that has it. A small "First-time setup: X of N done" chip + a 🎯 tour button also show on the Dashboard while anything is still outstanding. **Prefer a guided walkthrough instead?** Click 🎯 next to COCKPIT on any tab (or the button below) for a step-by-step tour that highlights each unfilled field directly, one panel at a time.');
W('overview','Getting started','What this terminal is',
  'A local-first financial cockpit: it ingests your holdings, researches each one against SEC fundamentals, analyst consensus and news, and runs read-only planning agents (retirement, tax, risk, estate, opportunity scanning). A sandboxed Strategist trades a hypothetical paper ledger so you can watch how it reasons — no real orders are ever placed.',
  'Everything is organized into top-level tabs (Dashboard, Overview, Research, Insights, Plan, Audits, Strategist, Calculators, Chat) with sub-tabs inside each. The cockpit strip at the top flags what needs attention and its chips jump you to the relevant tab.',
  'Start on the Dashboard for the at-a-glance picture, then follow a cockpit chip or a tab into the detail. Nothing here is advice — it is decision-support you verify with a professional.');
W('not-advice','Getting started','Not advice — how to trust the numbers',
  'Every figure is computed locally from your data plus free/public APIs (SEC EDGAR, Finnhub, Tavily). The LLM-written briefs are opinions grounded in that data, not facts, and the tax/estate figures are educational models of current law.',
  'Where a number depends on a live source that could be stale, the UI shows a freshness stamp or a grounding note. The AUDITS to GROUNDING tab lists every dated tax constant with its source and a re-verification date.',
  'Treat briefs as a research analyst take to pressure-test, and confirm any tax, estate, or legal move with a CPA or attorney before acting.');
W('job-queue','Getting started','Serial job queue and the gear badge',
  'Heavy jobs (analysis, discovery, opportunity scan, strategist) run one at a time through a single serial queue so they never contend for the GPU. Chat, the weekly Strategist run, and advisory "what would you do with $X" runs share a separate lock on the same GPU rather than going through that queue. The badge in the header reflects both. Chat itself queues in two places: behind the shared chat/strategist/advisory lock, and (separately) behind whichever job-queue run currently holds the GPU — both waits now show a live status line in the chat transcript naming what is running and roughly how much longer, instead of an unexplained pause.',
  'A badge like running strategist, 2 queued means the strategist is running with two jobs behind it. "chat/strategist busy" means a chat conversation, the weekly run, or an advisory run is using the model right now (queue depth for those is not shown, since only one can hold the lock at a time). Blank means idle. GET /api/jobs is the same data as a raw list. In Chat, a message like waiting: "Daily analysis (briefs)" is using the model (4m 12s so far, ~6m 30s typical) means a job-queue run is holding the GPU and your reply is queued behind it — it will start automatically once that job finishes, no action needed.',
  'If you fire several heavy jobs at once, expect them to line up rather than run together — that is by design. A duplicate of a job already queued or running is merged, not run twice. Pressing Stop in Chat cancels your own generation (POST /api/chat/cancel) and frees the badge within about a second, whether it was waiting on the chat lock or on the GPU behind a job. Switching between the Fiduciary and Strategist chat tabs, opening a different saved conversation, or starting a new chat no longer cancels whatever the OTHER persona was still generating — it keeps running in the background (a ⏳ appears on its tab) and you will see the finished answer when you switch back. Only an explicit Stop, or sending a new message in the SAME persona/session, actually stops a generation early.');
W('scheduler','Getting started','Automated jobs (Task Schedule)',
  'The recurring agents run on a built-in scheduler inside the app (no external service). Each job fires at a set time and is enqueued into the serial job queue.',
  'Settings to Task Schedule lists every automated job, its cadence (daily, weekly on a given day, or monthly), and its time in 24-hour clock. Times run in the app timezone shown at the top of that panel.',
  'Edit a job time and Save to override the default (applies within a minute, no restart); Reset restores the default. Turn the whole scheduler off with INTERNAL_SCHEDULER=0 to trigger everything by hand.');
W('https-cert','Getting started','HTTPS / certificates (SETTINGS → SECURITY → Certificate)',
  'By default this app serves plain HTTP — fine on a trusted home LAN, not fine once anything is reachable beyond it. SETTINGS → SECURITY → Certificate sets up real encrypted HTTPS with no command-line work: three built-in methods, pick whichever fits your deployment.',
  '**Self-signed** (instant): generate a key pair right here, no prerequisites at all — browsers show a "not trusted" warning until you manually trust the certificate once, but nothing else needs to be set up. Best for a pure local-LAN install. **Let\'s Encrypt / ACME** (preferred, when available): a real, browser-trusted certificate the app renews for you automatically — needs either a public DNS name with port 80 reachable from the internet (HTTP-01) or API credentials for your DNS provider (DNS-01, no public reachability needed). **Manual (CSR)**: the app generates a private key + certificate signing request you take to any Certificate Authority (or an internal CA for a LAN-only deployment); paste the signed certificate back in to install it — the private key never leaves this server.',
  'After setting one up, the app restarts itself in place within a couple seconds to switch modes — the current page will go unresponsive for a moment; that\'s expected, reload at the new address (the HTTPS port, default 8443, once a certificate is active; the plain-HTTP port, default 8097, if you REMOVE one). If you\'re on Let\'s Encrypt, auto-renew is on by default and needs no attention; a "renew now" button covers testing or renewing early.');
W('secrets-encryption','Getting started','Secrets encryption & the secrets.key backup (SETTINGS → SECRETS)',
  'Every credential saved from SETTINGS → SECRETS (Finnhub, SnapTrade, Monarch, Tavily, the Claude/LLM provider keys, etc.) is encrypted before it\'s stored — not just protected by a locked-down file, an actual encryption key stands between the database and anyone reading it.',
  'The encryption key lives at `secrets.key` in the app\'s data volume, generated automatically the first time it\'s needed (same auto-generate-if-absent approach `SESSION_SECRET` already uses) — nothing to set up. Values you save through the UI are encrypted before they reach the database; the app decrypts them again only when it actually needs to use them (calling Finnhub, logging into Monarch, etc.). One thing this does NOT cover: `mcpo-secrets/mcpo.env`, the small bridge file that carries Monarch/Tavily credentials to the separate mcpo container — Docker itself reads that file directly, which means it has to stay plain text (locked down to owner-only access, but not encrypted the way the database copy is).',
  '**Back up `secrets.key` along with your data volume.** If that key is ever lost — a wiped volume, a botched restore that skips it — every credential already saved through SETTINGS → SECRETS becomes permanently unreadable, with no way to recover it; you\'d need to re-enter everything from scratch. It\'s worth including in whatever backup routine already covers your data volume, not treated as an afterthought. Migrating a credential OFF `.env` and into this UI takes one clean pass: save the new value here while the old `.env` line is still active (it\'s held in reserve, not yet in effect — the panel says so), then remove that `.env` line and recreate the affected service\'s container. **Note the exact command, it matters:** a plain restart (`docker compose restart`) reuses the container\'s existing environment and will NOT pick up an edited `.env`/mcpo.env. For portfolio-api, `docker compose up -d --build portfolio-api` is enough (the `--build` itself forces a recreate). For **mcpo specifically, `up -d` alone is NOT enough** — mcpo has no build step (a prebuilt image, same tag every time), so nothing forces Docker to notice a changed `mcpo.env`; you need `docker compose up -d mcpo --force-recreate` (confirmed 2026-07-26 — a real incident where a plain `up -d mcpo` silently did nothing while Monarch credentials sat stale). Monarch/Tavily specifically need portfolio-api recreated first (it regenerates the mcpo bridge file on boot), then mcpo with `--force-recreate`.');
W('ai-provider','Getting started','AI provider (SETTINGS → AI / LLM PROVIDER): local Ollama vs. hosted Claude',
  'Every LLM-backed feature — chat, the weekly Strategist run, cash-deployment advice, the Dashboard narrative, and every research brief\'s JSON synthesis — routes through one swappable backend, set in SETTINGS → AI / LLM PROVIDER. The default is your own local Ollama models (zero marginal cost, fully private, bounded by these two 1080 Tis). Optionally, chat/analysis alone can point at Anthropic\'s Claude API instead — a separate, metered, pay-per-token service, added 2026-07-24.',
  'Two model tiers exist for the Claude path: an "everyday" model (chat + the Dashboard narrative) and a "Strategist" model (the autonomous weekly paper-trading run + the on-demand cash-deployment planner), since those two run longer, tool-heavier ReAct loops that can justify a stronger/pricier model — set separately so a quick chat question doesn\'t pay Opus-tier cost every turn. Embeddings (the Knowledge/RAG index that lets chat cite your own documents) CANNOT run on Claude — Anthropic sells no embeddings API at all — so they stay on local Ollama regardless of the chat provider, unless "Knowledge/RAG embeddings provider" is separately pointed at an OpenAI-compatible embeddings host. Retrieval quality is unaffected either way: Claude only ever sees the already-retrieved passages as plain text, same as Ollama does today. **Important:** a claude.ai Pro/Max chat subscription does NOT include API access — the key this needs comes from a separate console.anthropic.com account with its own pay-per-token billing, unrelated to a Pro subscription\'s usage.',
  'Enter the provider, host URL (blank = provider default), and model names under SETTINGS → AI / LLM PROVIDER; the LLM and embeddings API keys live in the SECRETS panel (masked, write-only, never shown again once saved). Everything here applies the next time portfolio-api\'s container is recreated (`docker compose up -d` — a plain `restart` reuses the old environment and won\'t pick this up), same as every other Model config field; there is no live swap. Leaving the provider on "ollama" (the default) changes nothing about how this app already behaves.');
W('holdings-csv','Getting started','No brokerage account? The HOLDINGS tab (CSV positions + manual liabilities)',
  'A full portfolio data source that needs no brokerage account, no OAuth, no third-party service at all — you enter positions directly, either by hand in an editable table or by uploading a spreadsheet export. Reachable as its own top-level HOLDINGS tab, always available regardless of whether Plaid/Monarch/SnapTrade is even configured or currently working — including during an outage, since this tab is deliberately never gated behind a successful portfolio load. Below the positions table is a second, separate **LIABILITIES** section (2026-07-30) for loans and credit cards — see the third paragraph.',
  'Two ways to get positions in, and you can mix both: **Edit the table directly** — click + ADD ROW for a new blank row, type into any cell (ticker/name/quantity/cost basis/account/institution are plain text/number boxes; type is a dropdown with Stock/ETF/Mutual Fund/Bond/Cash/Real Estate/Other; institution and account suggest values as you type but accept anything). **Type a ticker and tab out** — the app looks it up at SEC EDGAR and fills in the name and type (e.g. an ETF ticker becomes type ETF with its fund name). A name you typed yourself is never overwritten, and a ticker SEC does not know (crypto, some foreign listings) is left for you to fill in. Click the ✕ button at the end of a row to remove it. Nothing is saved until you click ↳ SAVE HOLDINGS — the table only holds your edits in the browser until then. **Upload a CSV instead** — click ⬆ UPLOAD CSV and pick a file (a spreadsheet export, or anything with the right headers); this REPLACES the entire table at once rather than merging with what was there, so download the current state first if you want to keep some existing rows while adding others from a file. Click ⬇ DOWNLOAD TEMPLATE any time for a starter file with the correct header row and two example lines to build from in Excel/Sheets. Column meanings: **ticker** (required — the symbol; case-insensitive, stored uppercase) and **quantity** (required — number of shares, or the dollar amount itself for a Cash-type row) are the only two that matter for a row to count; **name** is a free-text label shown in the table only; **cost basis** is your total dollars paid (not per-share) — leave it blank if unknown, positions with no cost basis still show live value, just no gain/loss; **account** groups positions for the by-account view and tax-status detection (leave blank and it defaults to "Brokerage"); **institution** is a free-text label only; **type** drives both display and which positions count as equity vs. cash vs. bonds elsewhere in the app (leave blank and it defaults to "Stock"). Saving is all-or-nothing: if ANY row fails validation — a blank ticker, a quantity that is not a positive number, or a cost basis that is not a number — nothing is written at all, and every problem row is listed by row number with a plain-language reason, rather than the save silently dropping just the bad row (which is what would otherwise happen with no explanation at all).',
  'Filling this in does NOT automatically make it the active portfolio — check the banner at the top of the HOLDINGS tab. If it says these holdings are "not the active data source," go to SETTINGS → ACCOUNTS → "Portfolio data source" and switch it to CSV (applies immediately). Once it IS active, prices/day-change for every non-Cash row are fetched live from Finnhub on each dashboard load, same as every other provider — you only maintain quantities/cost basis here, not prices. To update a holding later (a new purchase, a sale, a stock split), just reopen HOLDINGS, edit the affected row(s) in the table, and SAVE again — there is no need to re-upload the whole file for a small change. This is also the fastest way back onto a working dashboard if Monarch/mcpo is ever down: switch to CSV here temporarily (even with just one placeholder row) rather than staring at a portfolio-load error, then switch back to Monarch once it recovers.\n\n**LIABILITIES (2026-07-30):** the positions table above has no row shape for debt — a loan or credit card has no ticker and no share quantity — so liabilities live in their own small table underneath it instead. Click + ADD LIABILITY, fill in name (required, must be unique), institution, type (Credit Card/Auto Loan/Student Loan/Personal Loan/HELOC/Mortgage/Other Loan), and balance owed (required, a positive number), then ↳ SAVE LIABILITIES. Rate % and minimum payment are optional right on the row — they\'re the exact same fields SETTINGS → PLAN CASH·DEBT already edits for any debt by name, so filling them in here or there always agrees; there\'s no separate copy to fall out of sync. Marking a row\'s type "Mortgage" automatically excludes it from the debt avalanche and folds it into mortgage payoff-vs-invest instead, the same as the "Mortgage?" checkbox on a Monarch-synced account. **This works no matter which portfolio provider is active** — csv and snaptrade users get real debt accounts for the first time (previously every account from those two paths was hardcoded as an asset with total_liabilities always $0), and even a Monarch household can use it to track something Monarch itself never syncs, like a private family loan. A saved liability shows up in net worth, PLAN → CASH·DEBT, and the CONTINUITY binder\'s liabilities list exactly like a synced account — nothing else in the app needed to change to recognize it.');
W('monarch-setup','Getting started','Connecting Monarch Money (live, real-time)',
  'Monarch Money is a paid budgeting/net-worth service that aggregates real brokerage, bank, and retirement accounts. Using it here means the dashboard reads your ACTUAL live balances and positions with no manual entry — the tradeoff is a Monarch subscription and handing this app your Monarch login. NOTE: Monarch has no official public API — this uses an unofficial one, so it is OFF until an administrator ticks the risk acknowledgment in SETTINGS → ACCOUNTS → "Monarch (unofficial, at your own risk)" and clicks ENABLE; Plaid (see its WIKI entry) is the official-API alternative.',
  'Three credentials, all set from SETTINGS → SECRETS → "Portfolio (Monarch)": your Monarch email, your Monarch password, and your Monarch MFA/TOTP secret (the same secret you\'d scan into an authenticator app during Monarch\'s own MFA setup — not a 6-digit code, the underlying secret string, since this app has to generate fresh codes on every login the same way an authenticator app would). All three are encrypted at rest and never shown again once saved — see the "Secrets encryption" WIKI entry. These credentials are consumed by the separate `mcpo` container, so after saving them here you need `docker compose up -d --build portfolio-api` FIRST (its boot writes the credentials to the bridge file `mcpo` reads), THEN `docker compose up -d mcpo --force-recreate` — in that order, not a combined `docker compose up -d` for the whole stack, and NOT just `up -d mcpo` without `--force-recreate` (confirmed 2026-07-26: mcpo has no build step, so Compose doesn\'t detect a changed mcpo.env on its own — a plain `up -d mcpo` silently leaves it running on stale credentials).',
  'Set SETTINGS → ACCOUNTS → "Portfolio data source" to `monarch` once you have accepted the risk notice there (applies immediately). If the dashboard ever shows a portfolio-load error, it almost always means one of these three credentials is stale (Monarch password changed, or the MFA secret doesn\'t match what Monarch currently has on file), OR that mcpo simply hasn\'t been recreated since the credentials last changed (see above — this includes mcpo\'s Monarch session periodically expiring and needing a fresh login from current credentials, even if you didn\'t just change anything). Check `docker compose logs mcpo` for the real underlying error; if it says something like "MONARCH_EMAIL and MONARCH_PASSWORD environment variables are required," that\'s this — run `docker compose up -d mcpo --force-recreate`. Consider switching temporarily to the HOLDINGS (CSV) tab so the rest of the app stays usable while you sort it out.');
W('snaptrade-setup','Getting started','Connecting SnapTrade (live, many brokers incl. Robinhood)',
  'SnapTrade links one or many real brokerage accounts (Robinhood and most other major U.S. brokers) directly, without going through Monarch or Plaid, so the dashboard shows live positions and cash with no manual entry. Official docs and signup: https://snaptrade.com/ — their setup screens change, so follow their documentation for the outside half: https://docs.snaptrade.com/docs/getting-started',
  'Two kinds of key, and which you have decides the steps (details: https://docs.snaptrade.com/docs/personal-vs-commercial). **Personal key (free; your client ID starts with `PERS-`):** the user is built into the key, so there is nothing to register. Save the client ID and consumer key under SETTINGS → SECRETS & KEYS → "Portfolio (SnapTrade)", then SETTINGS → ACCOUNTS → "SnapTrade" → CONNECT A BROKERAGE: a SnapTrade window opens, you log in to your broker there, and you are done (the link is good for about 5 minutes — press the button again for a fresh one). **Commercial key:** also run `python3 snaptrade_register.py` once on the host; it prints a SNAPTRADE_USER_ID and SNAPTRADE_USER_SECRET to save beside the other two. **To try it with no real account:** press CONNECT SANDBOX (TEST DATA) and pick the Sandbox broker in the portal — SnapTrade\'s simulated brokerage with two funded accounts (https://docs.snaptrade.com/docs/sandbox).',
  'Set SETTINGS → ACCOUNTS → "Portfolio data source" to `snaptrade` (applies immediately — no restart). The dashboard then shows each brokerage account (cash included) and its positions; the brokerage\'s own account type (IRA, Roth, 401k…) is added to the account name so the tax audit classifies it. Money-market funds the broker already counts as cash are not added twice, and option positions are listed in a note but not valued yet. SnapTrade does not provide debts — use the HOLDINGS tab\'s LIABILITIES table. If the dashboard says SnapTrade returned no accounts, you have not linked a brokerage yet; if it says it is not configured, check the key pair (and, for a commercial key, the user ID/secret). A linked brokerage can need re-authorizing from time to time — use CONNECT again.');
W('plaid-setup','Getting started','Connecting Plaid (banks, brokerages, cards & loans — balances only, no transactions)',
  'Plaid is a bank-linking service with an official API. Used here it brings in the live BALANCES of your checking/savings, the HOLDINGS in your brokerage and retirement accounts, and your LIABILITIES (credit cards, mortgage, student/auto loans — with APR and minimum payment where the institution provides them), so the dashboard needs no manual entry. It deliberately does NOT request transactions: this app is not a spending tracker, and Plaid charges more for that data. You log in to your institution on a page hosted by Plaid — your bank password never touches this server; the app keeps only an encrypted access token per institution. Plaid is a paid service with a free sandbox: see the cost notes below and the authoritative billing page at https://plaid.com/docs/account/billing/',
  'SET-UP, step by step (Plaid\'s own pages are the authority — this entry only covers the app side):\n1. Create a Plaid developer account at https://dashboard.plaid.com/ and get your keys (Plaid explains where in https://plaid.com/docs/quickstart/). You get ONE client ID and a SEPARATE secret for each environment (Sandbox and Production).\n2. In the app: SETTINGS → SECRETS & KEYS → "Portfolio (Plaid)": save the client ID and the secret. Then SETTINGS → ADVANCED KNOBS → "Plaid environment": `sandbox` (Plaid\'s fake test banks) or `production` (your real institutions). The secret you saved must belong to the environment you pick.\n3. Connect: SETTINGS → ACCOUNTS → "Plaid · connect banks, brokerages, cards & loans". Press the button for the kind of account — BANK / CASH ACCOUNTS, BROKERAGE & RETIREMENT, or CREDIT CARDS & LOANS (Plaid only lists institutions that support what that button asks for, which is why there are three). A Plaid window opens in a new tab: sign in to your institution there. This page notices when you finish (within a few seconds; the link is good for 30 minutes). Repeat for each institution. Each shows ✓ connected, with REMOVE and (if it ever needs you to log in again) RECONNECT.\n4. Make it the data source: SETTINGS → ACCOUNTS → "Portfolio data source" → `plaid` (applies immediately).\nTRY IT FREE FIRST: in Sandbox, pick any test institution and sign in with username `user_good` and password `pass_good` (list of test logins: https://plaid.com/docs/sandbox/test-credentials/). Sandbox is always free but only ever shows fake accounts — it cannot connect your real institutions.\nGOING LIVE: real institutions need Production access and a plan. Plaid\'s billing page (https://plaid.com/docs/account/billing/) explains the plans: new US/Canada accounts may qualify for a free Trial plan limited to 10 connections for the life of the account; otherwise it is Pay-as-you-go, where Investments and Liabilities are billed per connected institution per month until you remove it. Check YOUR Dashboard for the terms and prices that apply to you; prices are not listed publicly. Some large institutions may also need extra approval in the Dashboard before they work in Production — the Dashboard tells you which. Details of the hosted login flow this app uses: https://plaid.com/docs/link/hosted-link/',
  'If the panel says "NO credentials yet": save BOTH values in SECRETS & KEYS (they apply immediately, no restart). An error mentioning invalid API keys usually means the environment and the secret don\'t match (a Sandbox secret with `production` selected, or the reverse). A ⚠ "needs re-login" on an institution means it expired or you changed your password there — press RECONNECT and log in again; until then its balances are not updating (a ⚠ ATTENTION alert also appears). REMOVE tells Plaid to disconnect the institution (which stops Plaid\'s billing for it) and deletes the stored token — on a free Trial plan the connection slot is not given back. If the dashboard shows "Plaid has no connected institutions yet" you selected `plaid` before connecting anything: connect one, or set the data source back to `csv`/`monarch`/`snaptrade` in ADVANCED KNOBS. Where Plaid provides a card\'s or loan\'s APR and minimum payment, PLAN → CASH·DEBT and the What-If calculator use them automatically — anything you type yourself overrides Plaid\'s figure, and 0% debts are skipped in What-If. The app never reads your account or routing numbers and never pulls transactions. Only an administrator can see or change any of this; Plaid\'s support and status are the place to check if an institution itself is down.');
W('mfa','Getting started','Multi-factor authentication (MFA) & backup codes',
  'A rotating 6-digit code from any authenticator app (Google Authenticator, Authy, 1Password, Bitwarden, etc.) required at login on top of your password. Since this app manages your full financial picture, MFA is treated as a CRITICAL setup step — it shows a ! on the setup checklist and a stop on the guided tour, not an optional extra.',
  'Set up right after creating your account (the first-run screen offers to walk you through it immediately, checked by default) or any time later in SETTINGS → IAM → "SET UP MFA": scan the QR code with your authenticator app, enter the 6-digit code it shows, and you\'ll be given 10 single-use backup codes — save them somewhere safe, they\'re shown exactly once and never again. SETTINGS → IAM also shows how many backup codes you have left; regenerate a fresh set (disable, then re-enable MFA) once you\'re down to your last couple.',
  'If you lose your phone/authenticator: log in using one of your saved backup codes in place of the 6-digit code (the login screen\'s code field explicitly accepts either) — this works exactly like a normal login, no special recovery flow needed. Once in, go to SETTINGS → IAM, disable MFA (requires your password), then set it up again from scratch with your new device. If you\'ve also lost your backup codes, or never set up MFA at all, see the "Account recovery" entry below instead.');
W('account-recovery','Getting started','Account recovery — forgot password, lost MFA, or locked out entirely',
  'Two independent recovery paths, for two different situations. **Tier 1 (still have MFA working):** forgot the password but still have your authenticator app or a saved backup code. **Tier 2 (MFA is also gone, or was never set up):** forgotten password with no working second factor — this needs host/container access to this deployment, not just a browser.',
  'Tier 1: click "Forgot password? (requires MFA)" on the sign-in screen, enter your username and a current authenticator code (or an unused backup code), then set a new password — this reuses the same code check the login screen itself uses, so it\'s exactly as secure as normal MFA login. Tier 2: run `docker compose exec portfolio-api python auth.py --reset-credentials` from the machine hosting this deployment. It will ask for your username, your **recovery key**, and a new password. The recovery key is a one-time secret shown ONCE — either right after you created your account, or whenever you last generated/regenerated one in SETTINGS → IAM → "HOST RECOVERY KEY". Like MFA, this is a CRITICAL checklist item: if you haven\'t generated one yet, do it now, before you need it — there is no way to recover a lost recovery key, only to generate a new one while you still have access.',
  'Without a recovery key on file, `--reset-credentials` cannot help you — the only remaining option is `python auth.py --wipe-all` (same command form), which is genuinely destructive: it deletes the login, ALL financial config/history/scenarios, chat history, and the knowledge index cache, returning the app to a blank first-run state. This is intentional — host/container access alone is deliberately NOT enough to reset just the login and silently take over your existing data; it either gets you back into your OWN account (via the recovery key) or wipes everything and starts over, with nothing in between. Bottom line: generate your recovery key today, in SETTINGS → IAM, and store it like you would a password — it is the only thing standing between "forgot my password" and "lost everything."');
W('notifications','Getting started','Push & email notifications (SETTINGS → NOTIFICATIONS)',
  'Get security alerts (logins, MFA/account changes, admin actions, detections) and portfolio-data-source outage warnings pushed straight to your phone or laptop, or emailed to you — instead of the only way to find out being to open SETTINGS → SECURITY → SECURITY AUDIT LOG yourself. Self-hosted, no third-party push service or paid cloud API involved (see the "Secrets encryption" entry\'s spirit — same philosophy applied here).',
  '**Push** (this device/browser only — each phone or laptop subscribes separately): click 🔔 SUBSCRIBE THIS DEVICE in SETTINGS → NOTIFICATIONS, allow the browser permission prompt, and you\'re done. **On iPhone/iPad specifically**, Apple only allows push to an installed web app, never an ordinary open Safari tab — first tap the Share icon → "Add to Home Screen," then open the app from the Home Screen icon you just created and subscribe from there (requires iOS 16.4+; nearly every device released since 2023 qualifies). Android/desktop Chrome, Firefox, and Edge all support subscribing directly from an ordinary tab, no install step needed. **Email** goes to ONE shared address for the whole household, set up once by the admin account: enter an SMTP server under SETTINGS → SECRETS & KEYS → "Notifications (Email)" — for Gmail specifically, that\'s `smtp.gmail.com`, port `587`, your full email address, and an **App Password** (Google requires 2-Step Verification turned on first to generate one — this is NOT your normal Gmail password, search "Google App Passwords" if you\'ve never made one), then flip the email checkbox on in SETTINGS → NOTIFICATIONS. Any other provider\'s SMTP details work the same way, not just Gmail.',
  'Pick which categories notify you (security alerts, portfolio outages) and through which channels, then use ✉ SEND TEST NOTIFICATION to confirm both actually arrive before relying on them. A viewer account (a second household login) manages its own push subscription and preferences independently — email is admin-controlled only, since it\'s one shared inbox for the household, not a per-person setting. "Portfolio outage" alerts only ever fire for whichever data source you actually have configured — a household on the CSV/HOLDINGS tab or that\'s never touched SnapTrade will never see a SnapTrade alert, since there is nothing there to have an outage. If a subscribed device stops receiving push (browser data cleared, permission revoked, app uninstalled), it silently drops off the list next time an alert tries to reach it — just re-subscribe from that device to restore it.');

W('net-worth','Dashboard','Net worth',
  'Every account value signed by type: assets add, liabilities (credit cards, loans, mortgage) subtract. It includes non-brokerage assets your provider tracks, such as a Zillow-valued home.',
  'The headline figure is total assets minus total liabilities. The ACCOUNTS panel breaks it into holdings accounts plus an Other assets and liabilities section so you can see exactly what rolls up.',
  'Use it as the top-of-funnel number for the funded-ratio and estate views. If it looks off, check the ACCOUNTS panel for a mis-synced balance.');
W('invested','Dashboard','Invested value vs net worth',
  'Invested value is the market value of your securities (what the risk, exposure and attribution engines analyze). Net worth is the whole balance sheet including cash, real estate and debts.',
  'The two differ by your cash, real assets and liabilities. Securities-level analytics use invested value; planning views (funded ratio, estate) use net worth.',
  'Concentration is about invested value; solvency is about net worth — pick the right one for the question.');
W('allocation','Dashboard','Allocation donuts (institution / asset type)',
  'Two doughnuts split your invested value — one by custodian/institution, one by asset type (stock, ETF, cash).',
  'Each slice is a share of invested value; the legend lists top holdings with percentages. Institution concentration is custodial risk; asset-type mix is your rough stock/bond/cash posture.',
  'Use the asset-type donut for a quick check against your target mix, and the institution donut to notice if too much sits at one custodian.');
W('accounts-panel','Dashboard','Accounts — holdings plus other assets and liabilities',
  'A list of every account: brokerage/holdings accounts first, then an Other assets and liabilities section for cash, the home, and debts that move net worth but hold no securities. An investment account whose provider syncs only a balance (no line-item holdings — some 401(k)s do this) is shown with the accounts and marked "balance only", and is counted in the Institution donut; it just can\'t appear in per-security views (exposure, drift, tax) because there are no holdings to analyze.',
  'Holdings accounts show market value; the other section shows assets in normal color and liabilities in red. Together they reconcile to net worth. The Institution donut includes balance-only investment accounts (its total is invested holdings + those balances); the Asset-type donut stays holdings-only, since a balance without holdings has no known asset type.',
  'This is where to confirm the terminal sees a real asset (the home) or a liability (a mortgage). A wrong balance here is usually a provider-sync issue to fix upstream.');
W('movers','Dashboard','Top gainers / losers / day movers',
  'Gainers and losers rank positions by total unrealized dollar gain/loss; day movers rank by the largest one-day percentage change.',
  'Gainers/losers are lifetime P&L on the position (needs cost basis); day movers are today volatility regardless of basis.',
  'Day movers surface what drives today swings; gainers/losers flag your most-appreciated names (step-up/harvest candidates) and biggest drags (thesis-review candidates).');
W('growth-vs-spy','Dashboard','Portfolio vs SPY (growth of 100)',
  'A line chart of your portfolio and SPY both indexed to 100 on the first recorded day, so you compare growth paths regardless of dollar size.',
  'The series accrues from a daily snapshot, so it needs at least two days before it draws. Divergence from the SPY line is your relative performance.',
  'Use it as a rough benchmark of whether your positioning beats a plain index over the window it has data for — not precise attribution.');
W('cockpit','Dashboard','Cockpit — what needs attention',
  'A persistent strip of chips summarizing everything outside a threshold: concentration, drift, tax-loss opportunities, high fees, illiquid names, ACA cliffs, FIRE success, hidden fund exposure.',
  'Chip color encodes severity — red is act now, amber is watch, green is ok/opportunity, grey is info. Each chip names the issue and a count. EMERGENCY FUND shows how many months of essential spending your reserve covers against your target. Green chips have a ✕: dismiss one once you have seen it and it stays out of the way — it comes back on its own the moment it stops being green. "N acknowledged · show" under the strip lists them again.',
  'Click a chip to jump to the tab with the full detail. Treat the cockpit as your daily triage list.');
W('attention','Insights & risk','⚠ Attention digest + header badge (alerting layer)',
  'A materiality-filtered digest, aggregated server-side: tripped thesis exit-triggers, single-name loss-budget breaches, concentration/macro-stress flags, policy and IPS sleeve drift-band breaches, a realized-volatility regime-shift check (last 21 trading days vs this book\'s own 45-day trailing baseline — not a generic threshold), earnings-this-week on your holdings, and data-grounding staleness. Distinct from the older COCKPIT strip (client-side, dashboard-only) — this one has a header badge so it is visible from every tab, not just when you remember to look.',
  'The ⚑ badge next to the job-queue indicator shows total action+watch count and, in parentheses, how many are NEW since you last opened this panel (e.g. "2 action · 1 watch (1 new)"). Red-tinted = at least one ACTION item; amber = watch-only. Blank badge = nothing flagged. Inside the panel, each card is labeled ACTION (red, do something), WATCH (amber, monitor), or INFO (grey, awareness only); a card marked ● NEW hasn\'t been seen yet this cycle.',
  'Click the badge from anywhere to jump straight to this panel — opening it marks the current set as seen (POST /api/alerts/ack), so the "new" count resets and only genuinely fresh conditions light up next time. This is the closest thing to a push notification the app has (fully local, no external service) — check the badge instead of clicking into every tab looking for problems.');

W('consolidated','Positions','Consolidated vs by-account',
  'Consolidated merges the same security held in multiple accounts into one row; by-account shows each lot where it sits.',
  'Consolidated answers how much AAPL do I own; by-account answers where is it and in which tax wrapper.',
  'Use consolidated for concentration and thesis work; use by-account when a decision depends on tax location.');
W('cost-basis','Positions','Cost basis and unrealized P/L',
  'Cost basis is what you paid (detected per account — some providers report per-share, some a total). Unrealized P/L is current value minus basis.',
  'A suspect flag or blank gain means the basis looked corrupt and was suppressed rather than shown wrong. Percentages are gain over basis.',
  'Basis drives tax-loss harvesting, step-up value and staged-sale planning — if a key position shows no basis, fix it at the source.');
W('analyst-rating','Positions','Analyst consensus rating',
  'A Buy/Hold/Sell badge from Finnhub aggregation of Wall Street analyst ratings.',
  'It is the street consensus, not the terminal view — the terminal own take is the B/S/H brief in Research.',
  'Use it as one external data point; where it disagrees with your grounded brief, understand the gap before acting.');

W('briefs','Research','Buy / Sell / Hold briefs',
  'For each holding the local LLM writes a short thesis grounded in SEC fundamentals, valuation multiples, analyst consensus and news, ending in a Buy/Sell/Hold call with a confidence level. One exception: a holding detected as a Collective Investment Trust (CIT — a bank/trust-company-managed pooled vehicle used inside some 401k plans, e.g. a target-date "Retirement Trust" or a CIT share class of a mutual fund strategy) skips this pipeline entirely, since a CIT is not publicly traded, has no ticker/CUSIP, and files nothing with the SEC — there is no market data or GAAP filing to base a Buy/Sell call on.',
  'Each brief carries a rating, a confidence (high/med/low), the sources it used, and a freshness stamp. Briefs sort actionable-first. A CIT shows "CIT · not publicly traded" instead of a rating, with a note explaining that decision-support is limited to what your plan provider itself reports (expense ratio, glidepath if target-date, category) — this is by design, not a data gap or an error. Its dollar value still counts fully toward net worth and asset-type allocation; it is only excluded from ticker-dependent analytics (the brief itself, risk/factor/VaR modeling, N-PORT look-through) since none of those have anything to attach to.',
  'Read a brief as a starting analyst opinion to challenge, not a directive. Low confidence or few sources means dig further. If a 401k holding shows "no brief available"/CIT instead of a rating, that is expected — verify it against your plan provider\'s own fund factsheet instead, not this terminal.');
W('confidence','Research','Brief confidence and calibration',
  'Confidence is the model stated conviction; calibration (in AUDITS to Grounding) tracks whether that confidence has matched reality via a Brier score.',
  'A Brier score near 0.25 is coin-flip; lower is better. The per-tier table shows whether high-confidence briefs actually hit more than low.',
  'If calibration shows overconfidence, discount high-confidence calls. This is how you learn how much to trust the briefs over time.');
W('reverse-dcf','Research','Reverse-DCF (implied growth)',
  'Rather than guessing a fair value, it solves for the free-cash-flow growth rate the current price already implies, given trailing FCF and a terminal growth assumption.',
  'A line like price implies 12%/yr versus the actual revenue CAGR tells you if the market demands heroic, in-line, or undemanding growth.',
  'Use it to sanity-check valuation: implied growth far above what the business has ever done means priced for perfection.');
W('scanner','Research','Opportunity scanner',
