function _calcSave(){ try{ localStorage.setItem('fidCalcIn', JSON.stringify(CALC_IN)); localStorage.setItem('fidCalcWiSel', CALC_WI_SEL||''); }catch(_){} }
const _cE=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// d must be a number: these are also handed to _cTable as column formatters, which call fmt(value, row).
const _c$=(n,d)=>{ if(n==null||n===''||isNaN(n)) return '—'; const dd=(typeof d==='number'&&d>=0&&d<=6)?d:0;
  return ((+n)<-0.004?'−':'')+'$'+Math.abs(+n).toLocaleString(undefined,{minimumFractionDigits:dd,maximumFractionDigits:dd}); };
const _c$2=n=>_c$(n,2);
const _cP=(n,d)=>(n==null||n===''||isNaN(n))?'—':(+n).toFixed((typeof d==='number'&&d>=0&&d<=6)?d:2)+'%';
const _cN=(n,d)=>(n==null||n===''||isNaN(n))?'—':(+n).toLocaleString(undefined,{maximumFractionDigits:(typeof d==='number'&&d>=0&&d<=6)?d:2});
function _cMonthsFromNow(m){
  if(m==null||isNaN(m)) return '—';
  const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+Math.round(m));
  return d.toLocaleString(undefined,{month:'short',year:'numeric'});
}

// Nothing here is required: the DRIP form calculates from typed inputs alone. These are shortcuts
// that FILL the form — a holding gives market value; a lookup gives price, trailing yield, payment
// frequency and trailing growth rates (GET /api/calc/dividend-lookup → Yahoo chart API).
let CALC_DRIP_LU=null;
function _dripPayers(){
  // Known dividend yields per ticker: the tax audit's consolidated dividend-income rows first,
  // then any research brief's valuation. Both only cover tickers with a daily brief.
  const m={};
  (((TAXAUDIT||{}).dividend_income||{}).by_ticker||[]).forEach(r=>{ if(r.ticker && r.dividend_yield_pct>0) m[r.ticker]=r.dividend_yield_pct; });
  const br=(ANALYSIS&&ANALYSIS.briefs)||{};
  Object.keys(br).forEach(t=>{ const y=(((br[t]||{}).valuation)||{}).dividend_yield_pct; if(y>0 && m[t]==null) m[t]=y; });
  return m;
}
async function _dripLookup(key, t, repaint){
  t=String(t||'').trim().toUpperCase(); if(!t) return;
  const st=document.getElementById('calc-drip-lu-status'); if(st) st.textContent='looking up '+t+'…';
  let j;
  try{ const r=await fetch('/api/calc/dividend-lookup?ticker='+encodeURIComponent(t)); j=await r.json(); if(!r.ok&&!j.error) j={error:'HTTP '+r.status}; }
  catch(e){ j={error:'Lookup failed: '+e}; }
  if(j.error){ CALC_DRIP_LU={ticker:t,error:j.error}; return repaint(); }
  const o=CALC_IN[key]; o.ticker=t;
  if(j.price) o.share_price=String(j.price);
  if(j.ttm_dividend!=null){ o.dividend_per_share=String(j.ttm_dividend); o.dividend_yield_pct=''; }
  else if(j.dividend_yield_pct!=null) o.dividend_yield_pct=String(j.dividend_yield_pct);
  if(j.frequency) o.frequency=String(j.frequency);
  // Growth rates are ASSUMPTIONS: history only fills a blank field, never overwrites one you typed.
  const dg=j.dividend_growth_5y_pct!=null?j.dividend_growth_5y_pct:j.dividend_growth_3y_pct;
  const pg=j.price_cagr_10y_pct!=null?j.price_cagr_10y_pct:j.price_cagr_5y_pct;
  if(dg!=null && (o.dividend_growth_pct==null||o.dividend_growth_pct==='')) o.dividend_growth_pct=String(dg);
  if(pg!=null && (o.price_growth_pct==null||o.price_growth_pct==='')) o.price_growth_pct=String(pg);
  CALC_DRIP_LU=j; _calcSave(); repaint();
}

        (j.pays_dividend===false?' · <b>pays no dividend</b> (last 12 months)':
          ` · TTM dividend ${j.ttm_dividend!=null?'$'+(+j.ttm_dividend).toFixed(3)+'/sh':'—'} (${_cP(j.dividend_yield_pct,2)} trailing${j.forward_yield_pct!=null?', '+_cP(j.forward_yield_pct,2)+' at the latest rate':''}) · ${fq}`+
          ` · dividend growth ${g(j.dividend_growth_3y_pct,j.dividend_growth_5y_pct,j.dividend_growth_10y_pct)} · price CAGR ${g(null,j.price_cagr_5y_pct,j.price_cagr_10y_pct)}`)+
        `<br><span class="muted">Source: ${_cE(j.source||'—')}. Price, dividend per share (trailing 12 months) and frequency were filled in; growth fields are filled only when blank (5y dividend / 10y price trailing rates) — they're your assumptions to edit. Now enter your shares <i>or</i> market value.${(j.notes||[]).length?' '+_cE(j.notes.join(' ')):''}</span>`;

function _calcSeed(key, force){
  const spec=CALC_SPECS[key]; if(!spec) return;
  if(CALC_IN[key] && !force) return;
  const o={};
  spec.groups.forEach(g=>g.f.forEach(f=>{ if(f.d!==undefined) o[f.k]=f.d; }));
  CALC_IN[key]=o; _calcSave();
}
function _calcFieldLabel(key,k){
  const spec=CALC_SPECS[key]; let lab=k;
  (spec?spec.groups:[]).forEach(g=>g.f.forEach(f=>{ if(f.k===k) lab=f.l.replace(/^…or /,''); }));
  return lab;
}
function _calcQueue(key, ms){
  clearTimeout(CALC_TIMERS[key]);
  CALC_TIMERS[key]=setTimeout(()=>calcRun(key), ms==null?350:ms);
}
function _calcInputs(key){
  // send only non-blank values; checkboxes go as booleans
  const src=CALC_IN[key]||{}, o={};
  Object.keys(src).forEach(k=>{ const v=src[k]; if(v===''||v==null) return; o[k]=v; });
  return o;
}
async function calcRun(key){
  const spec=CALC_SPECS[key]; if(!spec) return;
  const seq=(CALC_SEQ[key]=(CALC_SEQ[key]||0)+1);
  let res;
  try{
    const r=await fetch('/api/calc',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({calculator:spec.calc||key, inputs:spec.mapInputs?spec.mapInputs(_calcInputs(key)):_calcInputs(key)})});
    res=await r.json();
    if(!r.ok && !res.error) res={error:'HTTP '+r.status};
  }catch(e){ res={error:'Request failed: '+e}; }
  if(seq!==CALC_SEQ[key]) return;          // a newer keystroke's request superseded this one
  CALC_OUT[key]=res;
  _calcPaint(key);
}
function _calcPaint(key){
  const box=document.getElementById('calc-out-'+key); if(!box) return;

  if(p!==p2){ err.textContent='Passwords do not match.'; return; }
  try{
    const r=await fetch('/api/auth/first-run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(d.error){ err.textContent=d.error; return; }
    // first-run already establishes request.session['uid'] server-side (app.py auth_first_run),
    // so the account is authenticated at this point — the MFA setup/verify endpoints (session-
    // gated, no separate login step) can be called immediately.
    AUTH_STATUS={has_user:true,authenticated:true,user:d.user};
    // Recovery key reveal (2026-07-24, Account Recovery Tier 2) comes FIRST, regardless of the
    // MFA checkbox — it's the host-CLI fallback for "forgot password AND lost MFA," so it applies
    // whether or not MFA gets set up in the next step. Shown exactly once, same as MFA backup
    // codes; the "CONTINUE" button stays disabled until the user acknowledges saving it.
    renderFirstRunRecoveryKey(d.recovery_key, d.recovery_key_note, wantsMfa);
  }catch(e){ err.textContent='Request failed: '+e; }
}
// One-time recovery-key reveal, shown immediately after account creation (2026-07-24, Account
// Recovery Tier 2). This is the ONLY copy of the plaintext key that will ever exist outside the
// user's own records — auth.py stores only an argon2 hash. Gates "CONTINUE" behind an explicit
// acknowledgment checkbox rather than a plain button, mirroring the deliberate friction on the
// MFA backup-codes screen (both are "you cannot get this back" moments).
function renderFirstRunRecoveryKey(recoveryKey, note, wantsMfa){
  const body=document.getElementById('body'); body.innerHTML='';
  const wrap=_authFormShell('SAVE YOUR RECOVERY KEY', note||'This is the only way back into this account if you ever forget your password AND lose your MFA device/backup codes. It is shown once, right now, and never stored anywhere retrievable.');
  const box=el('div');
  box.innerHTML=
    `<div style="display:flex;align-items:center;justify-content:center;gap:8px;background:var(--color-panel-alt);padding:var(--space-3);border-radius:var(--radius-md);margin-bottom:var(--space-3);">`+
      `<span style="font-family:monospace;font-size:var(--font-size-lg);letter-spacing:1px;word-break:break-all;">${recoveryKey}</span>`+
      `<span id="fr-rk-copy"></span></div>`+
    `<label style="font-size:var(--font-size-sm);display:block;margin-bottom:var(--space-3);"><input type="checkbox" id="fr-rk-ack" onchange="document.getElementById('fr-rk-continue').disabled=!this.checked;"/> I've saved this somewhere safe (password manager, or printed and locked away)</label>`+
    `<button id="fr-rk-continue" onclick="_frRecoveryKeyContinue(${wantsMfa?'true':'false'})" style="width:100%;" disabled>CONTINUE</button>`;
  wrap.appendChild(box);
  body.appendChild(wrap);
  const cp=document.getElementById('fr-rk-copy');
  if(cp) cp.appendChild(copyBtn(recoveryKey, 'Copy recovery key'));
}
function _frRecoveryKeyContinue(wantsMfa){
  if(wantsMfa) renderFirstRunMfaPrompt(); else authInitApp();
}
// Guided MFA enrollment immediately after account creation (2026-07-24 backlog). Reuses
// securityMfaSetup()/securityMfaVerify() (parameterized by containerId, see the SECURITY panel
// section below) rather than duplicating the QR/verify/backup-codes markup — this container is
// tagged data-onboarding="1" so securityMfaVerify()'s "DONE" button calls _frMfaSetupDone()
// (finish onboarding into the dashboard) instead of render() (redraw the Settings panel, which
// doesn't exist yet on this screen).
function renderFirstRunMfaPrompt(){
  const body=document.getElementById('body'); body.innerHTML='';
  const wrap=_authFormShell('SET UP MULTI-FACTOR AUTHENTICATION','Scan the QR code with any authenticator app (Google Authenticator, Authy, 1Password, Bitwarden, etc.), then enter the 6-digit code it shows.');
  const area=el('div'); area.id='fr-mfa-setup-area'; area.setAttribute('data-onboarding','1');
  wrap.appendChild(area);
  const skip=el('div'); skip.style.cssText='margin-top:var(--space-4);text-align:center;';
  skip.innerHTML=`<a href="#" onclick="_frMfaSetupSkip();return false;" class="muted" style="font-size:var(--font-size-sm);">Skip for now — set this up later in SETTINGS → IAM</a>`;
  wrap.appendChild(skip);
  body.appendChild(wrap);
  securityMfaSetup('fr-mfa-setup-area');
}
function _frMfaSetupSkip(){ authInitApp(); }
function _frMfaSetupDone(){ authInitApp(); }
// Bug fix (2026-07-26, Jason): renderLogin(true) used to rebuild the ENTIRE form from scratch,
// including fresh blank #li-user/#li-pass inputs — so after a correct username/password, the MFA
// step visually asked for username+password AGAIN (empty, unfilled) alongside the code. The
// backend's own POST /api/auth/login is (deliberately, per its own docstring) a single-call
// contract — it always wants username+password+code together, there is no separate server-side
// "phase 1 passed" session the way /api/auth/recovery/start's 5-minute recovery_uid marker works.
// Rather than add a new stateful pre-auth session just for this, the fix is client-side only:
// cache the already-verified-as-CORRECT username/password in memory (`_pendingLoginCreds`,
// cleared the instant login succeeds OR the user backs out) and render ONLY the code field for
// step 2 — resending the cached username/password transparently alongside the code, exactly
// matching the expected behavior ("display the MFA field separately after successful username/
// password authentication") without changing the backend's request contract at all.
let _pendingLoginCreds=null;
function renderLogin(mfaRequired){
  const body=document.getElementById('body'); body.innerHTML='';
  const wrap=_authFormShell('SIGN IN', null);
  const form=el('div');
  if(mfaRequired && _pendingLoginCreds){
    form.innerHTML=
      `<div class="muted" style="font-size:var(--font-size-sm);margin-bottom:var(--space-3);">Signed in as <b>${_pendingLoginCreds.username}</b> — enter your authenticator code to continue.</div>`+
      `<div style="margin-bottom:var(--space-3);">Authenticator code (or a backup code)<br/><input id="li-code" type="text" style="width:100%;margin-top:4px;" autocomplete="one-time-code"/></div>`+
      `<div id="li-err" class="neg" style="font-size:var(--font-size-sm);min-height:16px;margin-bottom:var(--space-2);"></div>`+
      `<button onclick="authLoginSubmit()" style="width:100%;">VERIFY &amp; SIGN IN</button>`;
  } else {
    _pendingLoginCreds=null;   // starting fresh — any previously cached password is discarded
    form.innerHTML=
      `<div style="margin-bottom:var(--space-3);">Username<br/><input id="li-user" type="text" style="width:100%;margin-top:4px;" autocomplete="username"/></div>`+
      `<div style="margin-bottom:var(--space-3);">Password<br/><input id="li-pass" type="password" style="width:100%;margin-top:4px;" autocomplete="current-password"/></div>`+
      `<div id="li-err" class="neg" style="font-size:var(--font-size-sm);min-height:16px;margin-bottom:var(--space-2);"></div>`+
      `<button onclick="authLoginSubmit()" style="width:100%;">SIGN IN</button>`;
  }
  wrap.appendChild(form);
  if(mfaRequired && _pendingLoginCreds){
    // Lets someone back out to the username/password screen (typo'd username, wrong account,
    // etc.) instead of being stuck re-entering a code for an account they didn't mean to sign
    // into — discards the cached credentials, same as any other abandoned login attempt.
    const back=el('div'); back.style.cssText='margin-top:var(--space-3);text-align:center;';
    back.innerHTML=`<a href="#" onclick="_pendingLoginCreds=null;renderLogin(false);return false;" class="muted" style="font-size:var(--font-size-sm);">← Not you? Sign in with a different account</a>`;
    wrap.appendChild(back);
  }
  // Account Recovery Tier 1 (2026-07-24 backlog, design from RESUME-TRACKER.md 2026-07-23f) —
  // forgot-password via a still-working authenticator/backup code. Only useful if MFA is
  // enabled on the account; the link itself doesn't know that in advance (asking would leak
  // account existence pre-login) — /api/auth/recovery/start gives the same generic error either
  // way if MFA isn't actually enabled. Not shown mid-MFA-step (password's already correct then —
  // recovery is for a forgotten PASSWORD, not a missing code).
  if(!(mfaRequired && _pendingLoginCreds)){
    const forgot=el('div'); forgot.style.cssText='margin-top:var(--space-3);text-align:center;';
    forgot.innerHTML=`<a href="#" onclick="renderRecovery();return false;" class="muted" style="font-size:var(--font-size-sm);">Forgot password? (requires MFA)</a>`;
    wrap.appendChild(forgot);
  }
  body.appendChild(wrap);
  const focusId=(mfaRequired && _pendingLoginCreds)?'li-code':'li-user';
  const focusEl=document.getElementById(focusId); if(focusEl) focusEl.focus();
  const lastField=document.getElementById((mfaRequired && _pendingLoginCreds)?'li-code':'li-pass');
  if(lastField) lastField.onkeydown=e=>{ if(e.key==='Enter') authLoginSubmit(); };
}
async function authLoginSubmit(){
  const codeEl=document.getElementById('li-code');
  const inMfaStep=!!(codeEl && _pendingLoginCreds);
  const u=inMfaStep?_pendingLoginCreds.username:(document.getElementById('li-user').value||'').trim();
  const p=inMfaStep?_pendingLoginCreds.password:document.getElementById('li-pass').value;
  const code=codeEl?codeEl.value.trim():'';
  const err=document.getElementById('li-err'); err.textContent='';
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,code:code})});
    const d=await r.json();
    if(d.error){
      if(d.mfa_required && !inMfaStep){
        // Password (and username) just verified correct server-side — cache them ONLY in memory,
        // only for the remainder of this same login attempt, never persisted or sent anywhere
        // except back to this same endpoint alongside the code the user is about to enter.
        _pendingLoginCreds={username:u, password:p};
        renderLogin(true);
        return;
      }
      // Wrong/expired code on an already-cached attempt: stay on the code screen, don't wipe the
      // cached username/password — the user should only ever have to retype the CODE, not start
      // the whole login over, on a simple typo.
      err.textContent=d.error;
      if(codeEl){ codeEl.value=''; codeEl.focus(); }
      return;
    }
    _pendingLoginCreds=null;
    AUTH_STATUS={has_user:true,authenticated:true,user:d.user};
    authInitApp();
  }catch(e){ err.textContent='Request failed: '+e; }
}
// Account Recovery Tier 1 (2026-07-24) — two-step, mirrors the MFA setup/verify pattern above:
// step 1 re-authenticates with a TOTP/backup code (POST /recovery/start, which sets a 5-minute
// session-bound "recovery_uid" marker server-side — see app.py); step 2 sets the new password
// (POST /recovery/reset, authorized by that marker, not by a code/token in the request body).
function renderRecovery(){
  const body=document.getElementById('body'); body.innerHTML='';
  const wrap=_authFormShell('RESET PASSWORD','Verify with your authenticator app or a saved backup code, then set a new password. This account must already have MFA enabled — if it doesn\'t, this app\'s owner needs host access to reset it instead.');
  const area=el('div'); area.id='rec-area';
  area.innerHTML=
    `<div style="margin-bottom:var(--space-3);">Username<br/><input id="rec-user" type="text" style="width:100%;margin-top:4px;" autocomplete="username"/></div>`+
    `<div style="margin-bottom:var(--space-3);">Authenticator code (or a backup code)<br/><input id="rec-code" type="text" style="width:100%;margin-top:4px;" autocomplete="one-time-code"/></div>`+
    `<div id="rec-err" class="neg" style="font-size:var(--font-size-sm);min-height:16px;margin-bottom:var(--space-2);"></div>`+
    `<button onclick="authRecoveryStart()" style="width:100%;">VERIFY &amp; CONTINUE</button>`;
  wrap.appendChild(area);
  const back=el('div'); back.style.cssText='margin-top:var(--space-4);text-align:center;';
  back.innerHTML=`<a href="#" onclick="renderLogin(false);return false;" class="muted" style="font-size:var(--font-size-sm);">← Back to sign in</a>`;
  wrap.appendChild(back);
  body.appendChild(wrap);
}
async function authRecoveryStart(){
  const u=(document.getElementById('rec-user').value||'').trim();
  const code=(document.getElementById('rec-code').value||'').trim();
  const err=document.getElementById('rec-err'); err.textContent='';
  if(!u || !code){ err.textContent='Enter your username and a code.'; return; }
  try{
    const r=await fetch('/api/auth/recovery/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,code:code})});
    const d=await r.json();
    if(d.error){ err.textContent=d.error; return; }
    const area=document.getElementById('rec-area');
    area.innerHTML=
      `<div class="pos" style="margin-bottom:8px;">✓ Verified. Set a new password (this recovery step expires in 5 minutes):</div>`+
      `<div style="margin-bottom:var(--space-3);">New password (min 8 characters)<br/><input id="rec-newpass" type="password" style="width:100%;margin-top:4px;" autocomplete="new-password"/></div>`+
      `<div style="margin-bottom:var(--space-3);">Confirm password<br/><input id="rec-newpass2" type="password" style="width:100%;margin-top:4px;" autocomplete="new-password"/></div>`+
      `<div id="rec-err2" class="neg" style="font-size:var(--font-size-sm);min-height:16px;margin-bottom:var(--space-2);"></div>`+
      `<button onclick="authRecoveryReset()" style="width:100%;">SET NEW PASSWORD</button>`;
  }catch(e){ err.textContent='Request failed: '+e; }
}
async function authRecoveryReset(){
  const p=document.getElementById('rec-newpass').value, p2=document.getElementById('rec-newpass2').value;
  const err=document.getElementById('rec-err2'); err.textContent='';
  if(p.length<8){ err.textContent='Password must be at least 8 characters.'; return; }
  if(p!==p2){ err.textContent='Passwords do not match.'; return; }
  try{
    const r=await fetch('/api/auth/recovery/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({new_password:p})});
    const d=await r.json();
    if(d.error){ err.textContent=d.error; return; }
    alert('Password reset. Sign in with your new password.');
    renderLogin(false);
  }catch(e){ err.textContent='Request failed: '+e; }
}
function authInitApp(){
  document.getElementById('refresh').onclick=()=>load(true);
  document.getElementById('gear').onclick=()=>{ TAB=(TAB==='settings'?'positions':'settings'); render(); };
  load(false);
  setInterval(()=>{ if(userBusy()) return; load(false, true); }, 300000);  // re-poll every 5 min (server caches); bg=true preserves scroll
  // RESUME-TRACKER (2026-07-29) — start the job/alert/demo-status pollers only once a session
  // actually exists. Previously these fired unconditionally at script-load time, including on the
  // bare login screen, which meant every unauthenticated page view hit /api/jobs, /api/alerts, and
  // /api/demo/status with no cookie yet and got logged as a burst of authz.denied "no_session"
  // events ahead of the real login — benign (client-side badge polling), but it read like probing
  // activity in the Security Audit Log. Starting them here also fixes a real side-effect: since
  // pollDemoStatus() never re-ran after login, the DEMO_MODE banner was silently never showing.
  startBackgroundPolling();
}
async function authCheckAndInit(){
  try{
    AUTH_STATUS=await (await fetch('/api/auth/status')).json();
  }catch(e){
    document.getElementById('body').innerHTML='<div class="err">Could not reach the server: '+e+'</div>';
    return;
  }
  if(!AUTH_STATUS.has_user) renderFirstRun();
  else if(!AUTH_STATUS.authenticated) renderLogin(false);
  else authInitApp();
}
authCheckAndInit();

// Serial job-queue badge (Increment B): poll /api/jobs and show running/queued depth
// in the header. Independent of the 5-min load so it updates live during a run. Idle = blank.
// Rough job-duration ETA (RESUME-TRACKER item 5): elapsed vs. the median of that job kind's
// last 5 completed runs, from /api/jobs' `progress` field — no per-kind wiring needed here,
// the server already generalized it across every job kind. "No history yet" (not a fake 0%)
// until a kind has completed at least once. over_typical (>1.5x) flips the badge red-ish —
// this doesn't explain WHY a run is slow (item 6), just makes it visible instead of a silent spinner.
const fmtMin=s=>{ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return m>0?`${m}m${r?(' '+r+'s'):''}`:`${r}s`; };
function pollJobs(){
  fetch('/api/jobs').then(r=>r.json()).then(j=>{
    const b=document.getElementById('jobs'); if(!b) return;
    if(j && (j.running || j.queued)){
      const run=j.running?('▶ '+j.running):'';
      const q=j.queued?(' · '+j.queued+' queued'):'';
      let eta='';
      if(j.progress && j.progress.kind===j.running){
        const p=j.progress;
        eta = p.typical_seconds!=null
          ? ` (${fmtMin(p.elapsed_seconds)} of ~${fmtMin(p.typical_seconds)} typical${p.pct_of_typical!=null?', '+p.pct_of_typical+'%':''})`
          : ` (${fmtMin(p.elapsed_seconds)}, no history yet)`;
      }
      const color = (j.progress && j.progress.over_typical) ? 'var(--color-negative)' : 'var(--color-accent)';
      b.innerHTML=`<span style="color:${color}" title="Rough ETA from this job's own history, not a real progress bar">⚙ ${run}${eta}${q}</span>`;
    } else if(j && j.strategist_busy){
      // Chat / weekly strategist / advisory runs share one lock but don't go through the FIFO
      // above, so without this branch the badge would go blank while one of them holds the GPU.
      b.innerHTML=`<span style="color:var(--color-accent)">⚙ chat/strategist busy</span>`;
    } else { b.textContent=''; }
  }).catch(()=>{});
}
// (bootstrapped from startBackgroundPolling(), called by authInitApp() once a session exists —
// see RESUME-TRACKER (2026-07-29) note above authInitApp())

// Alerting/monitoring push layer (built 2026-07-18): poll /api/alerts and show a materiality-
// filtered action/warn count in the header, visible from ANY tab — not just when you remember to
// open RISK · EXPOSURE → ⚠ ATTENTION. `new` (unseen since the last time the panel was opened, see
// attentionContent()'s ack call) gets its own count so a genuinely fresh condition stands out
// from one you've already seen and left open. Slower cadence than the job badge (this is a
// point-in-time read of cached analysis, not something that changes second-to-second).
function pollAttn(){
  fetch('/api/alerts').then(r=>r.json()).then(a=>{
    const b=document.getElementById('attn'); if(!b) return;
    const c=(a&&a.counts)||{};
    const total=(c.action||0)+(c.warn||0);
    if(!total){ b.textContent=''; return; }
    const color=c.action?'var(--red,var(--color-accent))':'var(--color-accent)';
    const newTag=c.new?` <span style="opacity:0.85">(${c.new} new)</span>`:'';
    b.innerHTML=`<span style="color:${color}">⚑ ${c.action||0} action · ${c.warn||0} watch${newTag}</span>`;
  }).catch(()=>{});
}
document.getElementById('attn').onclick=()=>{ TAB='insights'; SUBTAB['insights']='attention'; render(); };
// (bootstrapped from startBackgroundPolling(), see note above authInitApp())

// Demo harness (2026-07-25) — shows a persistent, unmissable banner when this deployment is
// running with DEMO_MODE=1 (see demo_seed.py), so nobody mistakes synthetic demo data for a real
// household's finances. Checked once at load — demo_mode doesn't change without a redeploy, so no
// polling needed.
function pollDemoStatus(){
  fetch('/api/demo/status').then(r=>r.json()).then(d=>{
    DEMO_STATUS=d;
    const b=document.getElementById('demo-banner');
    if(!b) return;
    if(d && d.demo_mode){
      b.style.display='block';
      b.textContent=`⚠ DEMO INSTANCE — all data is synthetic/pseudo data, not a real household's finances. Login: ${d.demo_admin_username||'demo'}. See SETTINGS → SECURITY POSTURE for the control mapping behind this build.`;
    } else {
      b.style.display='none';
    }
  }).catch(()=>{});
}
// Gate: only start once, only after a real session exists (see RESUME-TRACKER 2026-07-29 note
// above authInitApp()) — never fired for an unauthenticated page view.
let _bgPollingStarted=false;
function startBackgroundPolling(){
  if(_bgPollingStarted) return;
  _bgPollingStarted=true;
  pollJobs(); setInterval(pollJobs, 15000);
  pollAttn(); setInterval(pollAttn, 60000);
  pollDemoStatus();
}
</script>
</body>
</html>
