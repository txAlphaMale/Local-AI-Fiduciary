<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PORTFOLIO TERMINAL</title>
<style>
  :root{
    --bg:#0a0b0d; --panel:#121417; --panel2:#0f1115; --bd:#23262b; --bd2:#2e333a;
    --amber:#f0a823; --txt:#cdd2d8; --mut:#7d848c; --dim:#565c64;
    --grn:#2ec27e; --red:#ff5d5d; --blu:#4a9eff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:13px;line-height:1.45;}
  a{color:var(--blu);text-decoration:none;}
  .wrap{max-width:1500px;margin:0 auto;padding:10px 14px 40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;
    border-bottom:1px solid var(--bd2);padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap;}
  .brand{color:var(--amber);letter-spacing:2px;font-size:15px;font-weight:700;}
  .brand small{color:var(--dim);letter-spacing:1px;font-weight:400;font-size:11px;margin-left:8px;}
  .topstats{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;}
  .ts{display:flex;flex-direction:column;}
  .ts .l{color:var(--mut);font-size:10px;letter-spacing:1px;}
  .ts .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .controls{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:11px;}
  button{background:transparent;color:var(--amber);border:1px solid var(--bd2);
    font-family:inherit;font-size:11px;letter-spacing:1px;padding:5px 10px;border-radius:3px;cursor:pointer;}
  button:hover{background:var(--panel);border-color:var(--amber);}
  input{background:var(--panel2);color:var(--txt);border:1px solid var(--bd2);border-radius:3px;
    padding:3px 5px;font-family:inherit;font-size:12px;}
  input:focus{outline:none;border-color:var(--amber);}
  .grid{display:grid;gap:10px;}
  .cols{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .panel{background:var(--panel);border:1px solid var(--bd);border-radius:4px;padding:10px 12px;}
  .ph{color:var(--amber);font-size:10px;letter-spacing:2px;margin-bottom:8px;border-bottom:1px solid var(--bd);padding-bottom:5px;}
  .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums;}
  .row .nm{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .sub{color:var(--mut);font-size:11px;}
  .pos{color:var(--grn);} .neg{color:var(--red);} .muted{color:var(--mut);}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th{color:var(--mut);font-size:10px;letter-spacing:1px;text-align:right;padding:4px 6px;
    border-bottom:1px solid var(--bd2);cursor:pointer;user-select:none;white-space:nowrap;}
  th.l,td.l{text-align:left;}
  th:hover{color:var(--amber);}
  td{padding:3px 6px;text-align:right;border-bottom:1px solid #191c20;white-space:nowrap;}
  td.sym{color:var(--amber);text-align:left;}
  td.name{color:var(--mut);text-align:left;max-width:230px;overflow:hidden;text-overflow:ellipsis;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--mut);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .sw{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .err{color:var(--red);padding:20px;text-align:center;}
  .chartbox{position:relative;height:160px;}
  /* ---- Fiduciary / Strategist chat (Phase 4) ---- */
  .chat-wrap{display:flex;gap:12px;height:68vh;min-height:420px;}
  .chat-side{flex:0 0 210px;display:flex;flex-direction:column;border-right:1px solid var(--bd);padding-right:10px;overflow:hidden;}
  .chat-persona{display:flex;gap:6px;margin-bottom:10px;}
  .chat-ptab{flex:1;text-align:center;cursor:pointer;font-size:10px;letter-spacing:1px;padding:5px 0;border:1px solid var(--bd2);border-radius:3px;color:var(--mut);}
  .chat-ptab.on{color:var(--amber);border-color:var(--amber);}
  .chat-list{flex:1;overflow:auto;}
  .chat-sess{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 6px;border-radius:3px;cursor:pointer;font-size:11px;color:var(--txt);}
  .chat-sess:hover{background:var(--panel2);}
  .chat-sess.on{background:var(--panel2);border-left:2px solid var(--amber);}
  .chat-sess-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-sess-x{color:var(--dim);flex:0 0 auto;padding:0 2px;}
  .chat-sess-x:hover{color:var(--red);}
  .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-scroll{flex:1;overflow:auto;padding:4px 8px 8px;}
  .msg{margin:10px 0;display:flex;flex-direction:column;}
  .msg.user{align-items:flex-end;}
  .msg .msg-body{max-width:88%;padding:8px 11px;border-radius:8px;line-height:1.5;font-size:13px;overflow-wrap:anywhere;}
  .msg.user .msg-body{background:var(--panel);border:1px solid var(--bd2);color:var(--txt);}
  .msg.asst .msg-body{background:var(--panel2);border:1px solid var(--bd);color:var(--txt);}
  .msg.asst .msg-body p:first-child{margin-top:0;} .msg.asst .msg-body p:last-child{margin-bottom:0;}
  .msg.asst .msg-body pre{background:#0b0d10;border:1px solid var(--bd2);border-radius:4px;padding:8px;overflow:auto;font-size:12px;}
  .msg.asst .msg-body code{background:#0b0d10;padding:1px 4px;border-radius:3px;font-size:12px;}
  .msg.asst .msg-body pre code{background:none;padding:0;}
  .msg.asst .msg-body table{margin:6px 0;border-collapse:collapse;} .msg.asst .msg-body th,.msg.asst .msg-body td{text-align:left;border:1px solid var(--bd2);padding:3px 6px;}
  .msg-tools{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px;}
  .tool-chip{font-size:10px;letter-spacing:.5px;color:var(--mut);border:1px solid var(--bd2);border-radius:10px;padding:1px 8px;}
  .chat-bar{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--bd);padding-top:8px;margin-top:4px;}
  .chat-input{flex:1;resize:none;min-height:38px;max-height:140px;background:var(--panel2);color:var(--txt);border:1px solid var(--bd2);border-radius:4px;padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.4;}
  .chat-input:focus{outline:none;border-color:var(--amber);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">PORTFOLIO TERMINAL<small id="meta">loading…</small></div>
    <div class="topstats" id="stats"></div>
    <div class="controls">
      <span id="attn" style="font-size:11px;cursor:pointer;" title="materiality-filtered alerts — click to open"></span>
      <span id="jobs" style="font-size:11px;" title="serial job queue"></span>
      <span id="updated"></span>
      <button id="refresh">↻ REFRESH</button>
      <button id="gear" title="Settings" aria-label="Settings" style="font-size:15px;line-height:1;">⚙</button>
    </div>
  </div>
  <div id="body"><div class="muted" style="padding:30px;text-align:center;">Loading portfolio…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const PIE = ['#f0a823','#2ec27e','#4a9eff','#a07bff','#ff7ab8','#5fd0c4','#888780','#e0623a'];
// Mirrors states.py STATE_NAMES (RESUME-TRACKER item 3) — for the ASSUMPTIONS "State of
// residence" dropdown only; every actual state-fact lookup (community property, TOD deeds,
// Medicaid expansion, tax type) happens server-side in states.py, not here.
const STATE_NAMES = {AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",
  CT:"Connecticut",DE:"Delaware",DC:"District of Columbia",FL:"Florida",GA:"Georgia",HI:"Hawaii",
  ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",
  MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",
  MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",
  NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",
  PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",
  TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",
  WI:"Wisconsin",WY:"Wyoming"};
const usd = n => (n==null?'—':'$'+Math.round(n).toLocaleString());
const sgn = n => n==null?'—':(n<0?'-':'+')+'$'+Math.abs(Math.round(n)).toLocaleString();
const pct = n => n==null?'—':(n>0?'+':'')+n.toFixed(2)+'%';
const cls = n => n==null?'muted':(n>=0?'pos':'neg');
const shortInst = s => (s||'?').split(' - ')[0].replace(' from Morgan Stanley','');
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

// Analysis token (guards /api/run-*, /api/knowledge/reindex): server injects the real value at
// GET / time (see app.py's index() — string-substitutes this placeholder), empty when the
// ANALYSIS_TOKEN secret isn't configured. Diagnosed 2026-07-17: every manual trigger button below
// used to POST with no header at all, so a configured token made them silently 401 while the
// button text still claimed "queued…" — the scheduler's own runs were unaffected since they call
// _enqueue() directly in Python, never over HTTP.
const ANALYSIS_TOKEN = "__ANALYSIS_TOKEN__";
// Fire a manual job-trigger POST with the token attached, plus real failure surfacing (a 401,
// a downed API, or a network error now shows in the button instead of a silent no-op).
function runJob(url, btn, queuedLabel){
  if(btn){ btn.textContent = queuedLabel || 'queued…'; btn.disabled = true; }
  return fetch(url, {method:'POST', headers: ANALYSIS_TOKEN ? {'X-Analysis-Token': ANALYSIS_TOKEN} : {}})
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status+(r.status===401?' — check ANALYSIS_TOKEN':'')); return r.json().catch(()=>({})); })
    .catch(e => { if(btn){ btn.textContent = 'failed: '+e.message; btn.disabled = false; } console.error('runJob', url, e); });
}

let DATA=null, SORT={key:'value',dir:-1}, charts=[], VIEW='consolidated', ANALYSIS=null, INSIGHTS=null, RETIRE=null, IDEAS=null, DISCO=null, STRAT=null, STRAT_SERIES=null, TAX=null, TAXAUDIT=null, TAX_INCOME=null, TAX_LTCG=0, FL=null, EXP=null, LT=null, RISK=null, RISKSUITE=null, ATTRIB=null, SIZING=null, ROTH=null, LEVERAGE=null, AVENUES=null, THESES=null, REALESTATE=null, BUSINESS=null, ATTENTION=null, SCORE=null, INCOME=null, ACCTCFG=null, SETTINGS_CFG=null, SECRETS_CFG=null, KNOWLEDGE_CFG=null, VH=null, GROUND=null, EST=null, SCHEDULE=null, BT=null, INS=null, INS_POLS=null, HEDGE=null, CASHDEBT=null, PERF=null, NARR=null, BEN=null, CONTIN=null, CONTIN_CONTACTS=null, LAST_SCAN_ANALYSIS=null, TAB='dashboard', FOCUS_TICKER=null;
let CHAT_MSGS=[], CHAT_SID=null, CHAT_PERSONA='fiduciary', CHAT_SESSIONS=null, CHAT_STREAMING=false, CHAT_ABORT=null, CHAT_SESS_LOADING=false, CHAT_STREAM_ID=0, CHAT_REQ_ID=null;
// Second-level sub-tabs: SUBTAB[panelKey] = active section key (persisted).
let SUBTAB={}; try{ SUBTAB=JSON.parse(localStorage.getItem('fidSubtab')||'{}')||{}; }catch(_){ SUBTAB={}; }
let SUBORDER={}; try{ SUBORDER=JSON.parse(localStorage.getItem('fidSubOrder')||'{}')||{}; }catch(_){ SUBORDER={}; }
function setSubtab(panel,key){ SUBTAB[panel]=key; try{ localStorage.setItem('fidSubtab',JSON.stringify(SUBTAB)); }catch(_){} render(); }
function reorderSubtab(panel, orderedKeys, fromKey, toKey){
  if(fromKey===toKey) return;
  const ks=orderedKeys.slice(); const fi=ks.indexOf(fromKey); if(fi<0) return;
  ks.splice(fi,1); const ti=ks.indexOf(toKey); ks.splice(ti<0?ks.length:ti,0,fromKey);
  SUBORDER[panel]=ks; try{ localStorage.setItem('fidSubOrder',JSON.stringify(SUBORDER)); }catch(_){}
  render();
}
// Top-level tab bar drag-reorder (mirrors the sub-tab pattern above — was never wired for the
// TOP row, so dragging a top tab just highlighted its text instead of moving it). Persisted
// separately from SUBORDER since this reorders a flat list, not one list per panel.
let TABORDER=[]; try{ TABORDER=JSON.parse(localStorage.getItem('fidTabOrder')||'[]')||[]; }catch(_){ TABORDER=[]; }
function reorderTopTab(orderedKeys, fromKey, toKey){
  if(fromKey===toKey) return;
  const ks=orderedKeys.slice(); const fi=ks.indexOf(fromKey); if(fi<0) return;
  ks.splice(fi,1); const ti=ks.indexOf(toKey); ks.splice(ti<0?ks.length:ti,0,fromKey);
  TABORDER=ks; try{ localStorage.setItem('fidTabOrder',JSON.stringify(TABORDER)); }catch(_){}
  render();
}
// Render a 2nd-row sub-tab bar for `panel` and ONLY the active section's node.
// sections: [{key,label,build:()=>Node}] (falsy entries are ignored). Lazy build =
// unselected sections aren't constructed (cheaper + the hook for per-section refresh).
function panelSubtabs(panel, sections){
  const wrap=el('div');
  let avail=(sections||[]).filter(Boolean);
  if(!avail.length) return wrap;
  const ord=SUBORDER[panel];   // user-dragged order (persisted); unknown keys fall to the end
  if(ord){ const ix=k=>{ const i=ord.indexOf(k); return i<0?999:i; }; avail=avail.slice().sort((a,b)=>ix(a.key)-ix(b.key)); }
  const orderedKeys=avail.map(s=>s.key);
  let active=SUBTAB[panel];
  if(!avail.some(s=>s.key===active)) active=avail[0].key;
  const bar=el('div'); bar.style.cssText='display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 13px;';
  avail.forEach((s,i)=>{
    if(i){ const sep=el('span',null,'·'); sep.style.cssText='color:var(--bd2);opacity:0.6;font-size:11px;user-select:none;'; bar.appendChild(sep); }
    const on=s.key===active;
    const t=el('span',null,s.label);
    t.title='drag to reorder';
    t.style.cssText='cursor:pointer;letter-spacing:1px;font-size:10px;padding:3px 9px;border-radius:3px;'+
      (on?'background:rgba(230,180,80,0.13);color:var(--amber);':'color:var(--mut);');
    t.onclick=()=>setSubtab(panel,s.key);
    t.draggable=true;
    t.ondragstart=e=>{ try{ e.dataTransfer.setData('text/plain', s.key); e.dataTransfer.effectAllowed='move'; }catch(_){} };
    t.ondragover=e=>{ e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){} };
    t.ondrop=e=>{ e.preventDefault(); let from=''; try{ from=e.dataTransfer.getData('text/plain'); }catch(_){} if(from) reorderSubtab(panel, orderedKeys, from, s.key); };
    bar.appendChild(t);
  });
  wrap.appendChild(bar);
  const sec=avail.find(s=>s.key===active)||avail[0];
  try{ wrap.appendChild(sec.build()); }
  catch(e){ const er=el('div','err'); er.textContent='section error: '+e; wrap.appendChild(er); }
  return wrap;
}
function openBrief(t){ if(!t) return; FOCUS_TICKER=t; TAB='research'; SUBTAB['research']='briefs'; render(); }

// analyst (Finnhub consensus) rating helpers, shared by the positions table + research panel
const ratingColor = r => r==='Buy'?'var(--grn)':(r==='Sell'?'var(--red)':'var(--amber)');
const ratingBadge = r => r ? `<span style="color:${ratingColor(r)}">${r}</span>` : '<span class="muted">—</span>';
const analystRating = t => (ANALYSIS&&ANALYSIS.briefs&&ANALYSIS.briefs[t]&&ANALYSIS.briefs[t].grounded)
  ? ANALYSIS.briefs[t].grounded.rating : null;

async function load(refresh, bg){
  if(CHAT_STREAMING) return;   // never wipe the page (and the live chat) mid-stream
  const _bgScrollY = bg ? window.scrollY : null;   // preserve the user's place across a background poll
  document.getElementById('refresh').textContent='…';
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 90000);
    let r;
    try{ r = await fetch('/api/portfolio'+(refresh?'?refresh=1':''), {signal:ctl.signal}); }
    finally{ clearTimeout(to); }
    const d = await r.json();
    if(d.error){ document.getElementById('body').innerHTML='<div class="err">'+d.error+'</div>'; return; }
    DATA=d;
    render();   // show core dashboard immediately — never block the page on a slow secondary panel
    const gj=async(u)=>{ const c=new AbortController(); const t=setTimeout(()=>c.abort(),25000);
      try{ return await (await fetch(u,{signal:c.signal})).json(); }catch(_){ return null; }finally{ clearTimeout(t); } };
    const [an,ins,ret,ide,dis,str,tax,txa,fl,exp,lt,rk,sc,inc,acc,setg,secg,kng,vh,gnd,est,rks,ats,szg,rth,lev,avn,ths,rea,biz,alt,sch,btr,insu,hdg,cdb,prf,nrr,ben,con]=await Promise.all([
      gj('/api/analysis'),gj('/api/rebalance'),gj('/api/retirement'),
      gj('/api/opportunities'),gj('/api/discovery'),gj('/api/paper'),gj('/api/tax'),gj('/api/tax-audit'),gj('/api/fees-liquidity'),gj('/api/exposure'),gj('/api/lookthrough'),gj('/api/risk-metrics'),gj('/api/scorecard'),gj('/api/income-plan'),gj('/api/accounts-config'),gj('/api/settings'),gj('/api/secrets'),gj('/api/knowledge'),gj('/api/value-history'),gj('/api/grounding'),gj('/api/estate'),gj('/api/risk-suite'),gj('/api/attribution'),gj('/api/sizing'),gj('/api/roth'),gj('/api/leverage'),gj('/api/avenues'),gj('/api/theses'),gj('/api/realestate'),gj('/api/business'),gj('/api/alerts'),gj('/api/schedule'),gj('/api/backtest'),gj('/api/insurance'),gj('/api/hedging'),gj('/api/cashdebt'),gj('/api/performance'),gj('/api/narrative'),gj('/api/benefits'),gj('/api/continuity')]);
    ANALYSIS=an; INSIGHTS=ins; RETIRE=ret; IDEAS=ide; DISCO=dis; STRAT=str; TAX=tax; TAXAUDIT=txa; FL=fl; EXP=exp; LT=lt; RISK=rk; SCORE=sc; INCOME=inc; ACCTCFG=acc; SETTINGS_CFG=setg; SECRETS_CFG=secg; KNOWLEDGE_CFG=kng; VH=vh; GROUND=gnd; EST=est; RISKSUITE=rks; ATTRIB=ats; SIZING=szg; ROTH=rth; LEVERAGE=lev; AVENUES=avn; THESES=ths; REALESTATE=rea; BUSINESS=biz; ATTENTION=alt; SCHEDULE=sch; BT=btr; INS=insu; HEDGE=hdg; CASHDEBT=cdb; PERF=prf; NARR=nrr; BEN=ben; CONTIN=con;
    if(TAX_INCOME==null){ const ra=(RETIRE&&!RETIRE.error&&RETIRE.assumptions)||{}; TAX_INCOME=(ra.annual_expenses!=null?Math.round(ra.annual_expenses):0)||0;
      if(TAX_INCOME>0){ try{ const rt=await fetch(`/api/tax?gross_ordinary=${TAX_INCOME}&ltcg=${TAX_LTCG||0}`); TAX=await rt.json(); }catch(_){} } }
    render();   // re-render with research / insights / plan / ideas / strategist panels
    if(_bgScrollY!=null){ try{ window.scrollTo(0, _bgScrollY); }catch(_){} }   // restore scroll after a background refresh
  }catch(e){ document.getElementById('body').innerHTML='<div class="err">'+e+'</div>'; }
  document.getElementById('refresh').textContent='↻ REFRESH';
}

// ============================================================================
//  In-app WIKI / help (data-driven). Each entry is one W(id,cat,title,def,read,use):
//  def = what it is, read = how to interpret it, use = when to act. Add a feature's
//  help by adding one W(...) line. Rendered in the WIKI tab (searchable, by category)
//  and deep-linked from per-section "?" affordances via wikiLink(id).
// ============================================================================
const WIKI_CATS = ['Getting started','Dashboard','Positions','Research','Insights & risk','Planning','Taxes & audits','Automation','Glossary'];
const WIKI = [];
let WIKI_FOCUS=null, WIKI_OPEN={}, WIKI_Q='';
function W(id,cat,title,def,read,use){ WIKI.push({id,cat,title,def,read,use}); }

W('overview','Getting started','What this terminal is',
  'A local-first financial cockpit: it ingests your holdings, researches each one against SEC fundamentals, analyst consensus and news, and runs read-only planning agents (retirement, tax, risk, estate, opportunity scanning). A sandboxed Strategist trades a hypothetical paper ledger so you can watch how it reasons — no real orders are ever placed.',
  'Everything is organized into top-level tabs (Dashboard, Overview, Research, Insights, Plan, Audits, Strategist, Chat) with sub-tabs inside each. The cockpit strip at the top flags what needs attention and its chips jump you to the relevant tab.',
  'Start on the Dashboard for the at-a-glance picture, then follow a cockpit chip or a tab into the detail. Nothing here is advice — it is decision-support you verify with a professional.');
W('not-advice','Getting started','Not advice — how to trust the numbers',
  'Every figure is computed locally from your data plus free/public APIs (SEC EDGAR, Finnhub, Tavily). The LLM-written briefs are opinions grounded in that data, not facts, and the tax/estate figures are educational models of current law.',
  'Where a number depends on a live source that could be stale, the UI shows a freshness stamp or a grounding note. The AUDITS to GROUNDING tab lists every dated tax constant with its source and a re-verification date.',
  'Treat briefs as a research analyst take to pressure-test, and confirm any tax, estate, or legal move with a CPA or attorney before acting.');
W('job-queue','Getting started','Serial job queue and the gear badge',
  'Heavy jobs (analysis, discovery, opportunity scan, strategist) run one at a time through a single serial queue so they never contend for the GPU. Chat, the weekly Strategist run, and advisory "what would you do with $X" runs share a separate lock on the same GPU rather than going through that queue. The badge in the header reflects both.',
  'A badge like running strategist, 2 queued means the strategist is running with two jobs behind it. "chat/strategist busy" means a chat conversation, the weekly run, or an advisory run is using the model right now (queue depth for those is not shown, since only one can hold the lock at a time). Blank means idle. GET /api/jobs is the same data as a raw list.',
  'If you fire several heavy jobs at once, expect them to line up rather than run together — that is by design. A duplicate of a job already queued or running is merged, not run twice. Pressing Stop in Chat cancels your own generation (POST /api/chat/cancel) and frees the badge within about a second — it used to only close your browser connection and leave the badge blank while the reply kept generating unseen.');
W('scheduler','Getting started','Automated jobs (Task Schedule)',
  'The recurring agents run on a built-in scheduler inside the app (no external service). Each job fires at a set time and is enqueued into the serial job queue.',
  'Settings to Task Schedule lists every automated job, its cadence (daily, weekly on a given day, or monthly), and its time in 24-hour clock. Times run in the app timezone shown at the top of that panel.',
  'Edit a job time and Save to override the default (applies within a minute, no restart); Reset restores the default. Turn the whole scheduler off with INTERNAL_SCHEDULER=0 to trigger everything by hand.');

W('net-worth','Dashboard','Net worth',
  'Every account value signed by type: assets add, liabilities (credit cards, loans, mortgage) subtract. It includes non-brokerage assets your provider tracks, such as a Zillow-valued home.',
  'The headline figure is total assets minus total liabilities. The ACCOUNTS panel breaks it into holdings accounts plus an Other assets and liabilities section so you can see exactly what rolls up.',
  'Use it as the top-of-funnel number for the funded-ratio and estate views. If it looks off, check the ACCOUNTS panel for a mis-synced balance.');
W('invested','Dashboard','Invested value vs net worth',
  'Invested value is the market value of your securities (what the risk, exposure and attribution engines analyze). Net worth is the whole balance sheet including cash, real estate and debts.',
  'The two differ by your cash, real assets and liabilities. Securities-level analytics use invested value; planning views (funded ratio, estate) use net worth.',
  'Concentration is about invested value; solvency is about net worth — pick the right one for the question.');
W('allocation','Dashboard','Allocation donuts (institution / asset type)',
  'Two doughnuts split your invested value — one by custodian/institution, one by asset type (stock, ETF, cash).',
  'Each slice is a share of invested value; the legend lists top holdings with percentages. Institution concentration is custodial risk; asset-type mix is your rough stock/bond/cash posture.',
  'Use the asset-type donut for a quick check against your target mix, and the institution donut to notice if too much sits at one custodian.');
W('accounts-panel','Dashboard','Accounts — holdings plus other assets and liabilities',
  'A list of every account: brokerage/holdings accounts first, then an Other assets and liabilities section for cash, the home, and debts that move net worth but hold no securities.',
  'Holdings accounts show market value; the other section shows assets in normal color and liabilities in red. Together they reconcile to net worth.',
  'This is where to confirm the terminal sees a real asset (the home) or a liability (a mortgage). A wrong balance here is usually a provider-sync issue to fix upstream.');
W('movers','Dashboard','Top gainers / losers / day movers',
  'Gainers and losers rank positions by total unrealized dollar gain/loss; day movers rank by the largest one-day percentage change.',
  'Gainers/losers are lifetime P&L on the position (needs cost basis); day movers are today volatility regardless of basis.',
  'Day movers surface what drives today swings; gainers/losers flag your most-appreciated names (step-up/harvest candidates) and biggest drags (thesis-review candidates).');
W('growth-vs-spy','Dashboard','Portfolio vs SPY (growth of 100)',
  'A line chart of your portfolio and SPY both indexed to 100 on the first recorded day, so you compare growth paths regardless of dollar size.',
  'The series accrues from a daily snapshot, so it needs at least two days before it draws. Divergence from the SPY line is your relative performance.',
  'Use it as a rough benchmark of whether your positioning beats a plain index over the window it has data for — not precise attribution.');
W('cockpit','Dashboard','Cockpit — what needs attention',
  'A persistent strip of chips summarizing everything outside a threshold: concentration, drift, tax-loss opportunities, high fees, illiquid names, ACA cliffs, FIRE success, hidden fund exposure.',
  'Chip color encodes severity — amber is watch, green is opportunity/ok, grey is info. Each chip names the issue and a count.',
  'Click a chip to jump to the tab with the full detail. Treat the cockpit as your daily triage list.');
W('attention','Insights & risk','⚠ Attention digest + header badge (alerting layer)',
  'A materiality-filtered digest, aggregated server-side: tripped thesis exit-triggers, single-name loss-budget breaches, concentration/macro-stress flags, policy and IPS sleeve drift-band breaches, a realized-volatility regime-shift check (last 21 trading days vs this book\'s own 45-day trailing baseline — not a generic threshold), earnings-this-week on your holdings, and data-grounding staleness. Distinct from the older COCKPIT strip (client-side, dashboard-only) — this one has a header badge so it is visible from every tab, not just when you remember to look.',
  'The ⚑ badge next to the job-queue indicator shows total action+watch count and, in parentheses, how many are NEW since you last opened this panel (e.g. "2 action · 1 watch (1 new)"). Red-tinted = at least one ACTION item; amber = watch-only. Blank badge = nothing flagged. Inside the panel, each card is labeled ACTION (red, do something), WATCH (amber, monitor), or INFO (grey, awareness only); a card marked ● NEW hasn\'t been seen yet this cycle.',
  'Click the badge from anywhere to jump straight to this panel — opening it marks the current set as seen (POST /api/alerts/ack), so the "new" count resets and only genuinely fresh conditions light up next time. This is the closest thing to a push notification the app has (fully local, no external service) — check the badge instead of clicking into every tab looking for problems.');

W('consolidated','Positions','Consolidated vs by-account',
  'Consolidated merges the same security held in multiple accounts into one row; by-account shows each lot where it sits.',
  'Consolidated answers how much AAPL do I own; by-account answers where is it and in which tax wrapper.',
  'Use consolidated for concentration and thesis work; use by-account when a decision depends on tax location.');
W('cost-basis','Positions','Cost basis and unrealized P/L',
  'Cost basis is what you paid (detected per account — some providers report per-share, some a total). Unrealized P/L is current value minus basis.',
  'A suspect flag or blank gain means the basis looked corrupt and was suppressed rather than shown wrong. Percentages are gain over basis.',
  'Basis drives tax-loss harvesting, step-up value and staged-sale planning — if a key position shows no basis, fix it at the source.');
W('analyst-rating','Positions','Analyst consensus rating',
  'A Buy/Hold/Sell badge from Finnhub aggregation of Wall Street analyst ratings.',
  'It is the street consensus, not the terminal view — the terminal own take is the B/S/H brief in Research.',
  'Use it as one external data point; where it disagrees with your grounded brief, understand the gap before acting.');

W('briefs','Research','Buy / Sell / Hold briefs',
  'For each holding the local LLM writes a short thesis grounded in SEC fundamentals, valuation multiples, analyst consensus and news, ending in a Buy/Sell/Hold call with a confidence level.',
  'Each brief carries a rating, a confidence (high/med/low), the sources it used, and a freshness stamp. Briefs sort actionable-first.',
  'Read a brief as a starting analyst opinion to challenge, not a directive. Low confidence or few sources means dig further.');
W('confidence','Research','Brief confidence and calibration',
  'Confidence is the model stated conviction; calibration (in AUDITS to Grounding) tracks whether that confidence has matched reality via a Brier score.',
  'A Brier score near 0.25 is coin-flip; lower is better. The per-tier table shows whether high-confidence briefs actually hit more than low.',
  'If calibration shows overconfidence, discount high-confidence calls. This is how you learn how much to trust the briefs over time.');
W('reverse-dcf','Research','Reverse-DCF (implied growth)',
  'Rather than guessing a fair value, it solves for the free-cash-flow growth rate the current price already implies, given trailing FCF and a terminal growth assumption.',
  'A line like price implies 12%/yr versus the actual revenue CAGR tells you if the market demands heroic, in-line, or undemanding growth.',
  'Use it to sanity-check valuation: implied growth far above what the business has ever done means priced for perfection.');
W('scanner','Research','Opportunity scanner',
  'Screens a universe against your criteria (valuation, quality, momentum, optional minimum Piotroski) and ranks survivors by a forward expected-return opportunity score.',
  'Each hit shows which checks it passed and its score; you edit criteria and limits in the panel. Higher score is more attractive on the heuristic.',
  'Use it to generate a shortlist of ideas to then run a full B/S/H analysis on, not as a buy list on its own.');
W('piotroski','Research','Piotroski F-score',
  'A 0 to 9 accounting-quality score: nine pass/fail checks on profitability, leverage/liquidity and operating efficiency. Higher is healthier.',
  '8 to 9 is strong, 0 to 2 is weak. In the scanner it is an optional gate that is off by default so it does not silently change your fit count.',
  'Use it to avoid value traps — a cheap stock with a low F-score is cheap for a reason.');
W('theses','Research','Theses and exit triggers',
  'For any holding you record a falsifiable thesis with pre-committed exit triggers (FCF-margin decay, reverse-DCF implied growth too high, Piotroski floor, a drawdown, or a custom rule).',
  'Each run re-checks the triggers against fresh data; a tripped trigger flags the position for EXIT REVIEW rather than auto-selling.',
  'Use it to enforce sell discipline you set in a calm moment — the terminal reminds you of your own rules when the data breaks them.');
W('alerts','Research','News alerts and discovery',
  'The discovery agent scans news for your holdings and surfaces material items; discovered tracks new names it flags from the news flow.',
  'Alerts are per-holding news hits; the cockpit shows a count. Discovery is idea-generation adjacent to what you own.',
  'Skim alerts for anything that changes a thesis; treat discovered names as candidates for the scanner/analysis pipeline.');

W('drift','Insights & risk','Policy and drift',
  'Compares your actual allocation to your written investment policy (target sleeves, per-position cap, drift band) and flags what is out of band.',
  'Each sleeve shows target vs actual and whether it breached the band; positions over your single-name cap are listed separately.',
  'Use it to decide rebalancing — but weigh the tax cost of selling appreciated positions.');
W('exposure','Insights & risk','Exposure — sector, beta, concentration (HHI)',
  'True economic exposure: sector weights, portfolio beta, and a Herfindahl (HHI) concentration index, including a look-through that counts names held inside your funds.',
  'HHI rises with concentration; the look-through line shows your true single-name exposure, which can exceed the direct view.',
  'Use it to catch hidden concentration (mega-cap tech owned directly and via an index fund) and to see if your beta matches intent.');
W('lookthrough','Insights & risk','Fund look-through (N-PORT)',
  'Resolves each fund to its underlying holdings using SEC N-PORT filings, so exposure and concentration reflect what you truly own.',
  'It splits each fund into equity/bond/cash by asset category and attributes single-name weight through to the underlying stocks. Coverage depends on filings being available.',
  'Use it when much of your book is in funds — it turns 40% VTI into the actual companies and sleeves underneath.');
W('var-cvar','Insights & risk','VaR and CVaR (tail risk)',
  'Value-at-Risk is the loss you would not exceed on a normal bad day at a given confidence; CVaR (expected shortfall) is the average loss on the days worse than that.',
  'Both are positive loss percentages at 1-day and 10-day horizons. CVaR is always at least VaR because it averages the deep tail.',
  'Use CVaR, not VaR, to size how much a single bad stretch could cost — it feeds the position-sizing loss budget.');
W('effective-bets','Insights & risk','Effective number of bets',
  'A diversification measure (Meucci): how many truly independent risk sources you have after accounting for correlation. 1 is everything moves together; n is n independent bets.',
  'Twenty names that all move together have an effective number near 1, not 20. A diversification ratio captures the same idea from correlations alone.',
  'Use it to see through fake diversification — many tickers that are really one bet on the same factor.');
W('factors','Insights & risk','Factor exposure (FF5 + momentum)',
  'Regresses your reconstructed returns on the Fama-French 5 factors plus momentum to show which systematic bets drive your returns, plus an alpha.',
  'Each factor beta is your loading; R-squared is how much of your movement the factors explain; alpha is the unexplained excess (often noise for a small book).',
  'Use it to understand what you are really long — a value plus small-cap tilt — rather than assuming returns are stock-picking skill.');
W('risk-ramp','Insights & risk','Risk ramp (reconstructed history)',
  'Because current holdings have no shared past, the engine rebuilds a daily return series as if you had held today weights over the historical window.',
  'It answers given how I am positioned now, how would that have behaved — not your actual path. Coverage shows the share of the book with usable price history.',
  'Read the risk-suite numbers through this lens: they describe today positioning under history, which is what you want for forward risk.');
W('attribution','Insights & risk','Contribution to return',
  'Chain-linked attribution: how much each holding contributed to total return over the window, with the parts summing exactly to the whole.',
  'Each name shows weight, own return, and contribution in points and as a share of total. Positive and negative contributors are colored.',
  'Use it to see what actually drove performance — often a couple of names — and whether concentration paid or hurt.');
W('money-weighted-irr','Insights & risk','Money-weighted return (XIRR)',
  'The internal rate of return on the paper book actual cash flows (deposits in, current value out) — it credits the timing of contributions, unlike a simple percentage.',
  'Shown alongside the simple return; a short-window flag warns when there is too little history for it to be meaningful.',
  'Use IRR when contributions were uneven — it answers what did my money actually earn, which time-weighted returns hide.');
W('sizing','Insights & risk','Position sizing (CVaR loss budget)',
  'The primary gate: each name tail loss is its value times its CVaR; a loss budget (the percent of net worth you accept losing from one name) implies a maximum position value, and over-budget names get a suggested trim.',
  'Over-budget rows are amber with a max-position and trim; it also shows inverse-volatility target weights and a de-emphasized half-Kelly reference.',
  'Use the loss budget to right-size concentrated winners by how much damage they can do, not just by weight.');
W('staged-sale','Insights & risk','Staged 0%-LTCG diversification',
  'A tax-aware plan to trim an over-concentrated appreciated position over several years, spending the 0% long-term capital-gains bracket each year before pricing the rest at your LTCG rate.',
  'It shows the year-by-year schedule, the tax if you sold everything now versus staged, and the total tax saved.',
  'Use it when you must diversify a big winner but want to bleed the gain out at the lowest tax cost instead of one large hit.');
W('leverage','Insights & risk','Leverage / ruin model',
  'Models borrowing against taxable assets ruin-first: it bootstraps the probability of a margin call at each loan-to-value from your own fat-tailed returns, then reports a maximum prudent LTV and after-tax borrow-vs-sell math.',
  'It shows margin-call probability rising with LTV, the borrow-vs-sell carry, and buy-borrow-die risks. The model never actually borrows.',
  'Use it to pressure-test an SBLOC or margin idea against the downside first — the headline tax-free access ignores the call risk this surfaces.');
W('avenues','Insights & risk','Cross-avenue (marginal dollar)',
  'Ranks where your next dollar earns the best after-tax return across avenues: debt paydown, Treasuries, index, a concentrated position, real estate, or an SBLOC spread, plus one-time tax alpha.',
  'Each avenue shows an after-tax expected return and any one-time boost; concentrated options carry a risk flag.',
  'Use it to allocate new savings or a windfall to the highest after-tax use instead of defaulting to one bucket.');

W('monte-carlo','Planning','Monte Carlo retirement',
  'Simulates thousands of return paths for your plan and reports the share that never run out of money, under several withdrawal policies and return models.',
  'The PLAN to FI strip shows success under a static rule plus guardrail policies and worst-case ending values. Very high success (99%+) can mean you are underspending.',
  'Use it to judge whether your spend/save/retire-age plan is robust and how much dynamic spending rules improve it.');
W('guardrails','Planning','Guardrails (Guyton-Klinger and risk-based)',
  'Dynamic withdrawal policies that cut or raise spending as the portfolio moves. The risk-based policy adjusts by the current probability of success; Guyton-Klinger uses fixed rate bands.',
  'The risk-based strip is primary (cuts below ~70% success, raises above ~99%) and never cuts into your essential needs floor; Guyton-Klinger is a comparison.',
  'Use guardrails to see how flexible spending raises your safe success rate and how deep a cut a bad sequence would require.');
W('fat-tail-block','Planning','Fat-tail and block-bootstrap models',
  'Alternative Monte Carlo return engines: fat-tail draws have heavier crashes than a normal distribution; block-bootstrap stitches together real historical return sequences to preserve momentum and mean-reversion.',
  'These usually read a few points below the normal model — that gap is the cost of the normal model optimism about tails and independence.',
  'Use them as a stress check: a plan that only passes under the normal model is fragile to real-world tails.');
W('funded-ratio','Planning','Funded ratio',
  'A pension-style solvency check: present value of assets plus future savings divided by present value of retirement spending, splitting essential needs (discounted at the risk-free TIPS yield) from wants (discounted at your expected return).',
  'At or above 100% is fully funded; the essentials-only ratio is the more conservative number. It uses the same cash flows as the Monte Carlo.',
  'Use it as a cleaner am I there yet gauge than a success percentage, especially the essentials-only ratio.');
W('social-security','Planning','Social Security',
  'Estimates your benefit (PIA/FRA with COLA and taxation) and folds a benefit floor into the Monte Carlo so success is not understated by ignoring it.',
  'The PLAN to SS sub-tab shows the benefit at different claim ages; the plan uses it as a real income floor.',
  'Use it to see the claiming-age tradeoff and how much guaranteed income lowers the portfolio burden — some plans deliberately assume it is unavailable as a stress test.');
W('aca','Planning','ACA / MAGI bridge',
  'For early retirement before Medicare, models your marketplace subsidy: a MAGI ledger, the premium tax credit, and the 400%-of-poverty subsidy cliff (back for 2026). What a MAGI below 100% FPL means now depends on your state of residence (ASSUMPTIONS): a real coverage gap in a non-expansion state (Texas, Georgia, and 8 others), or likely Medicaid eligibility in an expansion state (most states, incl. North Carolina, Colorado).',
  'It flags when planned income puts you over the cliff (0 subsidy) or into the sub-100% band, and estimates the credit when you set your local benchmark Silver premium. The subsidy JSON now echoes your state and its Medicaid-expansion status so you can see which interpretation applies.',
  'Use it to manage retirement-year income (Roth conversions, gains) so you do not accidentally blow past the subsidy cliff — and set State of residence in ASSUMPTIONS first, since it changes what the low-MAGI band actually means.');
W('roth','Planning','Roth ladder and marginal-rate curve',
  'Composes your true marginal rate on the next dollar — ordinary brackets, the capital-gains bump zone, NIIT, the ACA subsidy slope, and IRMAA steps — into one curve, then plans multi-year Roth conversions that fill low-rate room while respecting 5-year clocks and the pre-65 ACA cap.',
  'The curve shows where the next dollar is cheap versus punitive; the ladder shows a year-by-year conversion amount. Texas has no state income tax, making conversions relatively cheap.',
  'Use it to convert in low-income years up to the point where the marginal rate jumps — the curve makes those cliffs visible.');
W('irmaa','Planning','IRMAA (Medicare surcharge)',
  'Income-Related Monthly Adjustment Amount: above certain MAGI tiers your Medicare Part B premium steps up sharply, based on income two years prior.',
  'It appears as steps in the marginal-rate curve — crossing a tier can cost far more than the tax on the dollar that crossed it.',
  'Use it to avoid nudging MAGI just over an IRMAA threshold with a conversion or gain.');
W('realestate','Planning','Real-estate underwriter',
  'Underwrites a prospective rental deal: net operating income, cap rate, debt-service coverage (DSCR), cash-on-cash, and a levered after-tax IRR that accounts for depreciation recapture and capital-gains tax at sale.',
  'Enter the deal inputs and it returns the full set; DSCR below ~1.2 and thin cash-on-cash are warning signs. Existing real-estate accounts are surfaced separately.',
  'Use it to compare a specific property against your other avenues on an apples-to-apples after-tax IRR before committing.');
W('business','Planning','Business-acquisition underwriter',
  'Underwrites buying a small business: seller discretionary earnings multiple, DSCR, cash-on-cash, payback, and a levered after-tax IRR including the QSBS section 1202 gain exclusion where it applies.',
  'Enter the deal and it returns the return/coverage set; it reuses the real-estate amortization and IRR engine.',
  'Use it to evaluate an acquisition or search-fund idea on the same after-tax IRR basis as your market and real-estate options.');
W('estate-snapshot','Planning','Estate snapshot vs exemption',
  'Your net estate against the federal exemption (15M per person, ~30M married with portability for 2026), the headroom left, the tax if you died today, and the year your estate would cross the exemption at your assumed growth.',
  'The federal exemption math is identical in every state. state_tax_note flags whether your state of residence (ASSUMPTIONS) ALSO levies its own estate or inheritance tax — 12 states + DC do, typically with a much lower exemption than the federal one; Texas, Colorado, North Carolina and Georgia do not. The years until crossed figure is the trust-planning tripwire.',
  'Under the exemption there is no FEDERAL estate tax to plan around — the action is basis (see step-up and gift-vs-hold) — but check state_tax_note if you\'re in one of the 12+DC states, since state exposure can bite well below the federal exemption. Near the exemption, irrevocable strategies need lead time.');
W('stepup','Planning','Step-up ledger',
  'Per-account view of what a death-basis step-up (IRC 1014) is worth: taxable accounts and the home get their embedded gain wiped; traditional IRA/401k is income in respect of a decedent (heirs pay ordinary tax); Roth passes tax-free; an HSA is the worst asset to die with.',
  'The embedded gain a step-up would wipe totals taxable plus real estate. For the home, set its cost basis so the wiped gain is quantified; the section 121 exclusion already shelters 250k/500k on a lifetime sale. The DOUBLE step-up on jointly-held property only applies in a community-property state (9 of them, incl. Texas) — a common-law state (incl. North Carolina, Georgia, Colorado) only steps up the decedent\'s half by default; community_property_note in the response says which applies to your state of residence.',
  'Use it to reverse the usual drawdown order late in life — spend IRA/HSA first and hold heavily-appreciated taxable positions and the home for the step-up. In a common-law state the benefit is smaller than the Texas-flavored intuition suggests — read community_property_note before assuming the full double step-up.');
W('gift-vs-hold','Planning','Gift vs hold',
  'For an appreciated position, compares gifting now (the donee carries your basis and eventually pays capital-gains tax on the full gain) versus holding to death (the step-up erases the gain).',
  'For an estate under the exemption, holding almost always wins on tax — gift cash or high-basis assets instead. Over the exemption, gifting future growth out of the 40% estate base can flip it.',
  'Use it before a large lifetime gift of a winner — giving away appreciated stock is a common, expensive mistake for sub-exemption estates.');
W('income-plan','Planning','Income / dividend plan',
  'Aggregates the income your book throws off (dividends across all accounts, target yield) to plan for cash needs.',
  'Dividend income sums across every account; the asset-location relocation list, by design, stays taxable-only.',
  'Use it to see how much of your spending can be covered by portfolio income versus selling principal.');

W('tax-brackets','Taxes & audits','Tax brackets and marginal rate',
  'A full 2026 federal bracket engine (ordinary brackets, long-term capital gains, NIIT) that replaces flat tax assumptions everywhere a tax number is used.',
  'It shows your marginal and effective rates given your income; Texas adds no state income tax. The same engine feeds the Roth curve, ACA and estate math.',
  'Use it to see the real tax on an extra dollar of income or a realized gain before you trigger it.');
W('tlh','Taxes & audits','Tax-loss harvesting',
  'Finds positions at a loss in taxable accounts whose sale would generate a deductible capital loss to offset gains (and up to 3k of ordinary income).',
  'It lists harvestable losses with the dollar amount; the cockpit shows the total. Mind the 30-day wash-sale rule on repurchase.',
  'Use it near year-end or after a drawdown to bank losses — but never let the tax tail wag a good position, and avoid the wash sale.');
W('asset-location','Taxes & audits','Asset location',
  'Audits whether tax-inefficient holdings (high-yield, high-turnover) are sitting in taxable accounts where they should be tax-advantaged, and vice versa.',
  'It flags misplaced holdings; the list is taxable-account-focused by design. Relocating is about which wrapper holds what, not what you own.',
  'Use it to cut lifetime tax drag by moving income-heavy assets into IRAs/Roth and keeping tax-efficient index funds in taxable.');
W('fees-liquidity','Taxes & audits','Fees and liquidity',
  'Flags high-cost funds (by expense ratio where available) and hard-to-exit positions (thin trading volume) so you can see hidden frictions.',
  'High-fee funds and thin/micro-liquidity names are flagged in the FEES and LIQUIDITY tab and summarized in the cockpit.',
  'Use it to prune expensive funds with cheaper equivalents and to know which positions you cannot exit quickly in size.');
W('drip','Taxes & audits','DRIP and fractional flags',
  'Per-account settings for dividend reinvestment and fractional shares that make the tax, drift and income math correct (reinvested dividends are still taxable phantom income in taxable accounts).',
  'Set the flags under AUDITS to Accounts; they feed the tax-audit, drift pressure and income cash-vs-reinvested calculations.',
  'Set them accurately so the terminal models your actual cash flows — otherwise reinvested-dividend tax and drift will be off.');
W('grounding','Taxes & audits','Grounding watchdog and calibration',
  'A registry of every dated tax constant (brackets, LTCG, NIIT, FPL, Social Security bend points, estate exemption, IRMAA) with its source, the year it applies to, and a staleness tripwire, plus a calibration audit of the LLM briefs.',
  'The registry flags a figure as stale when its year falls behind the calendar and nags for re-verification each January. The Brier score grades whether brief confidence matches outcomes.',
  'Use it to trust the tax numbers (they carry sources) and to know how much to weight the model confidence.');

W('strategist','Automation','Strategist (paper trading)',
  'An autonomous agent that runs a hypothetical paper portfolio: it researches with real data and tools, then places simulated buy/sell decisions with fake money so you can watch its reasoning and track record.',
  'It runs weekly or on demand through the serial job queue; the STRATEGIST tab shows its book, report, and activity log. No real orders are ever placed.',
  'Use it as a transparent second opinion whose reasoning and paper P&L you can audit over time — never as an execution system.');
W('chat','Automation','Chat personas',
  'An in-app chat with a Fiduciary persona (planning/analysis) and a Strategist persona, both read-only, with tools to query your book and the research data. It has your knowledge documents in a local RAG.',
  'Pick a persona and ask; it streams its answer and a thinking indicator while it reasons. It queues behind a running strategist job so they never compete for the GPU.',
  'Use it to interrogate your own data in plain language (what is my true tech exposure) — the answers are grounded in the same figures the tabs show.');
W('knowledge','Automation','Knowledge library (local RAG)',
  'A folder of reference documents (.md/.txt/.pdf) the chat personas can search: your IPS, IRS publications, investing-principles guides, plus the committed reference/ set (estate & generational transfer, business-acquisition/QSBS frameworks, and a dated snapshot of the grounded 2026 tax/ACA/SS parameters). Everything is embedded locally with bge-m3 — nothing leaves the machine.',
  'SETTINGS → KNOWLEDGE shows the folder, document/chunk counts, embedding model, and last index time. Drop files in the host folder (or remove them) and hit REINDEX; it runs in the background on the job queue and the button shows live chunk-level progress (% and current file) instead of blocking. The personas answer with citations from these documents via their search_knowledge tool.',
  'Use it so chat answers about tax law, IRA mechanics, estate basis rules, or your own IPS quote a document instead of model memory — and refresh the parameter-snapshot doc each January so the library never contradicts the live GROUNDING registry.');
W('earnings-trigger','Automation','Post-earnings brief refresh (event-driven research)',
  'The daily analysis job (18:00 cron) isn\'t the only way a brief gets refreshed: a held ticker\'s earnings print now triggers its OWN targeted refresh — same-day for a before/during-market report, next morning for an after-close one — instead of waiting up to a full day for the next scheduled run. It\'s scoped to just the reporting ticker(s), not the whole book, so it\'s cheap and fast.',
  'Checked once daily (08:15 local) by the internal scheduler; it only enqueues the job kind `earnings_brief` when a print is actually due, so a blank #jobs badge on a normal day is correct, not broken. Each report date only triggers once (tracked internally) so it won\'t re-fire every day the check runs. You can also force it via POST /api/run-earnings-brief.',
  'You don\'t need to do anything — this rides the ⚠ ATTENTION "Earnings" flags already on your dashboard. If a print seems to have landed but the brief still looks stale the next morning, check #jobs for `earnings_brief` or force it manually; known gap: a before-market report on a day the calendar hadn\'t yet surfaced (rare, free-tier data lag) can be missed until the NEXT scheduled analysis run.');
W('benefits','Planning','Benefits & contribution room',
  'The guaranteed-return ladder for the next saved dollar: employer-match capture (instant 50-100% return), HSA headroom (the only triple-tax-advantaged account), 401(k) employee-limit headroom with age catch-ups (and the >$150k mandatory-Roth catch-up rule), direct-vs-backdoor Roth IRA eligibility against the MFJ phase-out, and mega-backdoor capacity (§415(c) limit minus everything already going in). All 2026 limits are IRS-verified and registered in the AUDITS→GROUNDING watchdog, so they re-flag themselves every January.',
  'PLAN → BENEFITS. Green = captured/eligible; amber actions = free money or one plan question away (the in-service-rollover question to the administrator is the classic unlock). Enter plan facts once in the editor; salary comes from the household register income.',
  'Revisit at annual enrollment, on any raise (percentages drift against fixed limits), and each January when limits re-index. Contribution room is the one guaranteed-return decision in investing — capture it before optimizing anything riskier.');
W('narrative','Dashboard','State of the Wealth (weekly letter)',
  'A plain-language weekly note the AI writes to the household by composing every module\'s cached headline — net worth and its week change, funded ratio, YTD vs your own policy, concentration and attention flags, harvestable losses, earnings ahead, and the AI\'s own track record — ending with a single THIS WEEK\'S FOCUS action. The family-office quarterly letter, weekly and personal.',
  'Top of the DASHBOARD tab. Writes itself Monday mornings through the job queue (SETTINGS → TASK SCHEDULE), or GENERATE NOW any time (watch the #jobs badge). It cites only numbers the modules actually computed — nothing is invented.',
  'Read it Monday with coffee: it turns seventeen panels into one story and one action. If the focus line ever surprises you, the detail lives one click away in the named tab. Educational, not advice.');
W('washsale','Taxes & audits','Wash-sale guard (TLH)',
  'A §1091 enforcement layer on the tax-loss-harvest list: the app snapshots every ticker\'s total share count daily across ALL accounts (IRAs included), infers buys from day-over-day increases (which catches silent DRIP reinvestments), and stamps each TLH candidate CLEAR, DRIP-caution, or BLOCKED — with the date the 31-day window reopens and a not-substantially-identical replacement (different-index fund; same-index clones are flagged as risky).',
  'AUDITS → TAX·TLH, the WASH-SALE column. ✗ BLOCKED = shares were bought within 31 days, selling now disallows the loss on those shares; ⚠ DRIP = turn off reinvestment (or confirm no dividend lands ±30 days) before harvesting; ? = the ledger needs ≥2 daily snapshots to judge. Hover the verdict for the full reasoning.',
  'Use it before executing any harvest: a washed loss isn\'t deferred, it\'s wasted paperwork (and an IRA repurchase kills it permanently, Rev. Rul. 2008-5). Replacement pairs keep market exposure during the window. The brokerage\'s lot records are the legal source of truth — confirm there before filing.');
W('performance','Insights & risk','Performance vs policy (TWR)',
  'Time-weighted returns over standard periods (QTD/YTD/1Y/3Y) for three things side by side: your portfolio (current holdings × their price history — a stated approximation that assumes current weights), your OWN policy benchmark (the IPS sleeve targets mapped to proxy ETFs: VTI/VXUS/BND/BIL), and SPY. Plus a tracked TWR chained from the real daily snapshots with a flow guard that treats implausible one-day moves as deposits.',
  'INSIGHTS → PERFORMANCE. EXCESS vs POLICY is the verdict column: green means your implementation (picks/tilts) beat the allocation itself; red means the plain policy mix would have done better. Coverage % tells you how much of the book had history; the flow-guard count tells you how approximate the tracked number is.',
  'Use it quarterly for the only honest self-review: "did my decisions add value over my own plan?" Persistent negative excess is the data telling you to index the sleeve. Money-weighted views (which include timing of contributions) live in ATTRIBUTION and the paper book.');
W('cashdebt','Planning','Cash, liquidity & debt desk',
  'The household-CFO hygiene panel: emergency-fund months (actual cash ÷ essential monthly spend, where essentials use the funded-ratio needs share), idle-cash drag vs the live 3-month T-bill, mortgage payoff-vs-invest (after-tax rate against both the guaranteed T-bill and the risky expected return), a refinance break-even, and an avalanche ranking of non-mortgage debts against the invest hurdle.',
  'PLAN → CASH · DEBT. Red alerts = underfunded EF or debts beating the hurdle; the drag line prices what parked cash forfeits per year. Enter mortgage rate/payment, deposit yield, refi candidates, and per-debt APRs in the editor — balances come from the live feed, the T-bill from FRED daily.',
  'Use it monthly and on rate moves: it catches the quiet losses (idle cash, expensive debt) and answers the perennial "extra $1k: mortgage or market?" with the guaranteed-vs-expected framing instead of vibes. EF sizing judgment (job security, one vs two incomes) still overrides the spreadsheet.');
W('continuity','Planning','Continuity binder + document currency',
  'An always-current, auto-generated estate-OPERATIONS doc for whoever has to handle things if you can\'t: an action checklist, an account-by-account map of how each one actually transfers (beneficiary vs TOD deed vs probate — pulled straight from the ESTATE titling audit), embedded gain the step-up would wipe, any debts to settle, and a key-contacts register (attorney, CPA, advisor, executor, where the will is kept). Composes numbers already computed elsewhere — it adds no new modeling, just assembles the document view of it. Paired with a DOCUMENT CURRENCY tracker (GAP-8): a recurring staleness check on your will, durable POA, healthcare directive, trust, and beneficiary-designation review — each shows the year you last reviewed it and flags ✓ current / ⚠ stale / — not recorded against an editable review-cadence knob (default 3 years).',
  'PLAN → CONTINUITY. The checklist up top is meant to be read first under stress; the document-currency table, account map, and debts below it are the supporting detail. Both sections regenerate from live data/config on every load, so neither can silently drift the way a one-time printed binder or a "I\'ll remember when I last updated my will" mental note would — though a PRINTED copy (🖶 PRINT button) obviously freezes at print time, so reprint after any major change. A stale or never-recorded document also surfaces on the ⚠ ATTENTION header badge (Estate hygiene category) so it doesn\'t require remembering to check this tab.',
  'Fill in the contacts, executor/will-location fields, and each document\'s last-reviewed year once — that\'s the part the app can\'t infer from your accounts. The 3-year cadence is a hygiene reminder, not a legal deadline: the real trigger to re-review any of these is a life event (marriage, divorce, birth, death, home purchase/sale, move to a new state) whenever it happens, cadence or not. Print a copy and put it somewhere a survivor or co-executor would actually find it; this is decision-support, not a substitute for the actual will/POA/trust documents, which still need a licensed attorney.');
W('hedging','Insights & risk','Hedging (covered calls & collars)',
  'Options math on the concentrated names: a COVERED CALL sells the upside above a strike for cash now (income + assignment probability shown); a COLLAR buys a ~10% protective put funded by selling a call (floor and cap shown, often near zero net cost). Chains are delayed Yahoo data; deltas are computed locally from each contract\'s implied volatility.',
  'INSIGHTS → HEDGING. Cards build for names over the sizing loss-budget plus top direct weights (≥3%), at the ~30-45 day expiration. Yield %/yr on calls, floor/cap on collars; premiums are mid-quotes — verify live before any order. Rebuilds daily or via REFRESH CHAINS.',
  'Use it when a position is too big to hold naked but too appreciated to sell (the collar) or when you\'d happily be paid to trim at a higher price (the covered call). Assignment REALIZES gains and tight collars trip constructive-sale/holding-period rules — check the lot and the CPA first. Educational, not advice.');
W('insurance','Planning','Insurance & risk transfer (protection desk)',
  'A gap analysis of the coverages that protect the plan from non-market ruin: life (capital-needs method with DIME and human-life-value cross-checks), disability income replacement, umbrella liability sized to net worth, a property & casualty checklist (dwelling replacement cost, auto limits, TX flood/wind), and a long-term-care stance by net-worth band. Needs are computed from your live balance sheet at a real discount rate; in-force coverage comes from the policy register you enter.',
  'PLAN → INSURANCE. Each line shows NEED vs IN-FORCE vs GAP — red gaps are the exposures. Enter household incomes and each policy from its declarations page; ages come from PLAN → ASSUMPTIONS. Amber alerts flag gaps, missing disability cover, and term policies expiring within two years.',
  'Use it because an uninsured death, disability, or lawsuit ends a mid-six-figure FI plan faster than any bear market — quantify the gap, then take the numbers to a licensed agent for quotes. Decision-support only; this tool never sells or recommends products.');
W('backtest','Taxes & audits','Decision backtest (vs SPY)',
  'The proof layer: every dated Buy/Sell/Hold call is scored at fixed 1/3/6/12-month horizons AGAINST SPY over the same window — a Buy that rose less than the index is a miss — and every paper-book buy is compared to putting the same dollars in SPY on the same day. Confidence tiers get a Brier score against these market-relative outcomes.',
  'AUDITS → BACKTEST. HIT = Buys that beat SPY + Sells that lagged it (55%+ is real signal, ~50% is a coin flip); EXCESS is the margin; BRIER below 0.25 means stated confidence carries information. Unresolved horizons are excluded, not counted as misses. It rebuilds weekly (Sunday) or on demand.',
  'Use it to answer the only question that matters about the AI\'s research: is it adding value over just buying the index? Judge trends across horizons, not single cells — small samples are noisy.');

// ---- Glossary (finance vocabulary & abbreviations, distinct from the feature-explainer
// entries above). Grouped by discipline rather than one-term-per-card, since the search box
// already matches substrings across def/read/use — searching "delta" finds the options card
// even though the card title is the group name, not the term. RESUME-TRACKER backlog item 2.
W('glossary-options','Glossary','Options & hedging — calls, puts, collars, greeks',
  'CALL = right to BUY 100 sh at the strike by expiration; PUT = right to SELL.\nSTRIKE = that fixed price.\nPREMIUM = the price paid/received for the contract (shown as a mid-quote here — the average of bid/ask, not a live tradeable price).\nDTE = days to expiration.\nITM/OTM/ATM = in/out/at the money, i.e. whether the strike is currently profitable to exercise.\nDELTA (Δ) = how much the option\'s value moves per $1 move in the stock, roughly the probability of finishing ITM (0.25 delta ≈ 25% chance of assignment).\nIMPLIED VOLATILITY (IV) = the market\'s annualized expected-swing estimate baked into the premium — higher IV means richer premiums on both calls and puts.\nASSIGNMENT = the option is exercised against you; on a covered call that means your shares are sold at the strike.\nCOVERED CALL = sell a call against shares you already own, collecting premium now in exchange for capping the upside above the strike.\nCOLLAR = buy a protective put and sell a call to fund it, trading upside above the call strike for a floor at the put strike; ZERO-COST/NET ≤ $0 means the call premium fully paid for the put.\nFLOOR/CAP = the worst/best price the collar leaves you at, in percent from spot.',
  'This app\'s HEDGING panel shows delta and IV per contract, plus the covered call\'s annualized yield and the collar\'s floor/cap/net cost — all computed from delayed chains (CBOE primary, Yahoo fallback), so treat them as sizing guides and re-quote live before any order.',
  'Look here whenever a HEDGING card uses a term you don\'t recognize. For the tax mechanics (qualified covered call holding-period suspension, straddle rules, constructive sale on tight collars) see the dedicated Options & Hedging Mechanics doc in the Knowledge library — ask CHAT to search_knowledge for it, and confirm any specific move with a CPA before acting.');
W('glossary-tax-retirement','Glossary','Tax & retirement acronyms — LTCG, NIIT, IRMAA, MAGI, RMD…',
  'LTCG/STCG = long/short-term capital gains (held over/under one year; LTCG gets preferential federal rates).\nNIIT = 3.8% Net Investment Income Tax on investment income above a MAGI threshold.\nMAGI = Modified Adjusted Gross Income, the income figure that gates NIIT, ACA subsidies, IRMAA and Roth eligibility — each uses its own add-back rules, so the same "MAGI" label can mean a slightly different number per program.\nIRMAA = the Medicare Part B/D premium surcharge triggered by MAGI two years prior, in income-banded tiers.\nACA/PTC/FPL = Affordable Care Act premium tax credit, gated by income as a percent of the Federal Poverty Level — the "subsidy cliff" is where PTC drops to zero.\nTLH = tax-loss harvesting, selling a loser to realize a deductible loss (subject to the wash-sale rule).\nRMD = Required Minimum Distribution, the mandatory annual withdrawal from pre-tax retirement accounts starting at the IRS-set age.\nPIA/FRA = Social Security Primary Insurance Amount and Full Retirement Age, the base benefit and the age it\'s paid at without early/delayed adjustment; COLA = the annual cost-of-living increase applied to it.',
  'These show up across PLAN (retirement, ACA, Social Security, Roth ladder) and AUDITS → TAX·TLH / GROUNDING. GROUNDING lists the current dollar/percent value and source for every dated constant — this glossary explains what the acronym MEANS, GROUNDING shows what it currently IS.',
  'Use this when a PLAN or AUDITS panel assumes you already know the acronym. For year-specific numbers (thresholds, rates, brackets) always defer to AUDITS → GROUNDING over any static description, since those are indexed annually.');
W('glossary-risk','Glossary','Risk & portfolio analytics — VaR, CVaR, Sharpe, HHI, TWR/XIRR…',
  'VaR (Value at Risk) = the loss you\'d expect to exceed only X% of the time over a horizon (e.g. 95% 1-month VaR of 8% means an 8%+ monthly loss happens about 1 in 20 months).\nCVaR/Expected Shortfall = the AVERAGE loss in that worst-X% tail — a harsher, more informative number than VaR alone since it captures how bad the tail actually gets.\nSHARPE = excess return per unit of total volatility; SORTINO/CALMAR/TREYNOR are variants using downside deviation, max drawdown, or beta instead.\nMAX DRAWDOWN = the largest peak-to-trough decline over the window.\nHHI (Herfindahl-Hirschman Index) = a concentration score (sum of squared weights) — higher means fewer names dominate the book.\nEFFECTIVE NUMBER OF BETS = 1/HHI on a risk-weighted basis, a more honest "how diversified am I really" than raw position count.\nFACTOR EXPOSURE (FF5 + momentum) = how much of the portfolio\'s return is explained by known systematic factors (market, size, value, profitability, investment, momentum) rather than stock-picking.\nTWR (Time-Weighted Return) = performance stripped of the effect of deposit/withdrawal timing — the right number to compare against a benchmark.\nXIRR/money-weighted return = the return actually experienced given YOUR cash-flow timing — the right number to judge your own results.',
  'These live under INSIGHTS → RISK / ATTRIBUTION / PERFORMANCE. TWR vs policy/SPY answers "did my decisions add value"; XIRR answers "what did I personally earn."',
  'Reach for VaR/CVaR and HHI/effective-bets when sizing or trimming a concentrated name; reach for TWR vs XIRR when someone asks "how am I doing" and you need to know which question they\'re really asking.');
W('glossary-realestate-business','Glossary','Real estate & business acquisition — cap rate, DSCR, NOI, CoC, SDE…',
  'NOI (Net Operating Income) = rental income minus operating expenses, before debt service — the core rental-property profitability number.\nCAP RATE = NOI ÷ purchase price, a quick unlevered-yield comparison across deals.\nDSCR (Debt Service Coverage Ratio) = NOI (or SDE, for a business) ÷ annual debt payments; lenders gate financing at a minimum DSCR, commonly around 1.25×.\nCoC (Cash-on-Cash return) = annual pre-tax cash flow ÷ actual cash invested (down payment + closing costs) — the levered-return number, distinct from cap rate.\nSDE (Seller\'s Discretionary Earnings) = the small-business valuation metric for owner-operator businesses (pre-tax profit + owner comp + addbacks), vs EBITDA once professional management is assumed.\nPAYBACK PERIOD = years of cash flow to recover the initial equity.\nQSBS §1202 = the federal capital-gains exclusion for qualified small-business C-corp stock held past a multi-year threshold.',
  'This app\'s PLAN → REAL ESTATE and PLAN → BUSINESS underwriters compute these directly from deal inputs, alongside a levered after-tax IRR.',
  'Use these when reading a real-estate or business-acquisition deal card; cap rate and CoC in particular are easy to conflate but answer different questions (deal quality vs your personal leverage payoff).');
W('glossary-estate-benefits','Glossary','Estate, insurance & benefits — step-up, DIME, umbrella, HSA, mega-backdoor…',
  'STEP-UP IN BASIS = an inherited asset\'s cost basis resets to fair market value at death, erasing embedded capital gains for the heir (§1014).\nDIME = a life-insurance need-sizing method (Debt + Income replacement + Mortgage + Education).\nUMBRELLA LIABILITY = excess liability coverage sitting above your auto/home policy limits, sized to net worth since a lawsuit judgment isn\'t capped at your underlying policy.\nHSA = Health Savings Account, triple-tax-advantaged (pre-tax in, tax-free growth, tax-free for medical) but only with a qualifying high-deductible health plan.\nMEGA-BACKDOOR ROTH = after-tax 401(k) contributions above the normal deferral limit, converted (in-plan or out) to Roth — only available if the plan allows after-tax contributions AND in-service rollovers (ISR).\nCATCH-UP CONTRIBUTIONS = higher contribution limits available starting at age 50 (401k/IRA) with a further bump at 60–63 for 401(k)s.',
  'These live under PLAN → ESTATE, PLAN → INSURANCE, and PLAN → BENEFITS. Each panel shows NEED vs IN-FORCE/CAPTURED vs GAP against your entered facts.',
  'Use these before entering your own policy/plan facts, so a term like "ISR" or "DIME" doesn\'t block you from filling in the panel correctly.');

// A small clickable "?" that deep-links into a WIKI entry. Drop wikiLink('id') into any header.
function wikiLink(id){
  const a=el('span',null,'?');
  a.title='What is this? (opens the Wiki)';
  a.style.cssText='cursor:pointer;display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;'+
    'border:1px solid var(--bd2);border-radius:50%;font-size:10px;color:var(--mut);margin-left:6px;vertical-align:middle;';
  a.onclick=(e)=>{ if(e&&e.stopPropagation) e.stopPropagation(); WIKI_FOCUS=id; WIKI_OPEN[id]=true; TAB='wiki'; render(); };
  return a;
}
function wikiContent(){
  const wrap=el('div');
  wrap.appendChild(el('div','ph','WIKI · HOW TO READ THIS TERMINAL'));
  const intro=el('div','muted'); intro.style.cssText='font-size:11px;line-height:1.5;margin-bottom:10px;';
  intro.textContent='Every feature explained: what it is, how to read it, and when to act. Search below, or click a "?" anywhere in the terminal to jump straight to the relevant entry.';
  wrap.appendChild(intro);
  const sb=el('input'); sb.type='search'; sb.placeholder='Search the wiki…'; sb.id='wiki-search';
  sb.value=(WIKI_Q||''); sb.style.cssText='width:100%;max-width:360px;margin-bottom:12px;padding:5px 8px;';
  sb.oninput=()=>{ WIKI_Q=sb.value; const box=document.getElementById('wiki-body'); if(box){ box.innerHTML=''; buildWiki(box); } };
  wrap.appendChild(sb);
  const body=el('div'); body.id='wiki-body'; wrap.appendChild(body);
  buildWiki(body);
  return wrap;
}
function buildWiki(box){
  const esc=s=>(s==null?'':s).toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const q=(WIKI_Q||'').trim().toLowerCase();
  const match=e=> !q || (e.title+' '+e.def+' '+e.read+' '+e.use+' '+e.cat).toLowerCase().includes(q);
  let shown=0;
  WIKI_CATS.forEach(cat=>{
    const items=WIKI.filter(e=>e.cat===cat && match(e));
    if(!items.length) return;
    const ch=el('div'); ch.style.cssText='letter-spacing:2px;font-size:10px;color:var(--amber);margin:14px 0 6px;'; ch.textContent=cat.toUpperCase();
    box.appendChild(ch);
    items.forEach(e=>{ shown++;
      const card=el('div'); card.id='wiki-'+e.id;
      card.style.cssText='border:1px solid var(--bd);border-radius:4px;margin:5px 0;padding:8px 11px;';
      const open=!!WIKI_OPEN[e.id] || (WIKI_FOCUS===e.id);
      const head=el('div'); head.style.cssText='cursor:pointer;display:flex;justify-content:space-between;align-items:center;';
      head.innerHTML=`<span class="sym">${esc(e.title)}</span><span class="muted" style="font-size:11px;">${open?'−':'+'}</span>`;
      head.onclick=()=>{ WIKI_OPEN[e.id]=!open; const b=document.getElementById('wiki-body'); b.innerHTML=''; buildWiki(b); };
      card.appendChild(head);
      if(open){
        // esc() first (XSS-safe), THEN turn any authored \n into a real line break — lets a
        // long glossary entry list one term per line instead of one run-on paragraph, while
        // every other entry (no \n in its source string) renders exactly as before.
        const nl=s=>esc(s).replace(/\n/g,'<br>');
        const d=el('div'); d.style.cssText='margin-top:7px;font-size:12px;line-height:1.5;';
        d.innerHTML=`<div><span class="muted" style="font-size:10px;letter-spacing:1px;">WHAT IT IS</span><br>${nl(e.def)}</div>`+
          `<div style="margin-top:6px;"><span class="muted" style="font-size:10px;letter-spacing:1px;">HOW TO READ IT</span><br>${nl(e.read)}</div>`+
          `<div style="margin-top:6px;"><span class="muted" style="font-size:10px;letter-spacing:1px;">WHEN TO USE IT</span><br>${nl(e.use)}</div>`;
        card.appendChild(d);
      }
      box.appendChild(card);
    });
  });
  if(!shown){ const m=el('div','muted'); m.style.cssText='font-size:12px;'; m.textContent='No wiki entries match "'+WIKI_Q+'".'; box.appendChild(m); }
  if(WIKI_FOCUS){ const id='wiki-'+WIKI_FOCUS; WIKI_FOCUS=null;
    setTimeout(()=>{ const n=document.getElementById(id); if(n){ n.scrollIntoView({behavior:'smooth',block:'center'});
      n.style.boxShadow='0 0 0 2px var(--amber)'; setTimeout(()=>{ n.style.boxShadow=''; },2400); } },60);
  }
}

function render(){
  const d=DATA;
  document.getElementById('meta').textContent =
    ` · ${d.investment_account_count} brokerage accts · ${d.position_count} positions`;
  const age = d.cached_age_s||0;
  document.getElementById('updated').textContent =
    'as of '+new Date(d.generated_at*1000).toLocaleString()+(age>60?` (${Math.round(age/60)}m old)`:'');
  // top stats
  const stats=[
    ['NET WORTH', usd(d.net_worth), ''],
    ['INVESTED', usd(d.invested_value), ''],
    ['UNREAL P/L', sgn(d.total_unrealized_gain), cls(d.total_unrealized_gain)],
    ['P/L %', pct(d.total_gain_pct), cls(d.total_gain_pct)],
  ];
  document.getElementById('stats').innerHTML = stats.map(s=>
    `<div class="ts"><span class="l">${s[0]}</span><span class="v ${s[2]}">${s[1]}</span></div>`).join('');

  const body=document.getElementById('body'); body.innerHTML='';
  charts.forEach(c=>c.destroy()); charts=[];

  if(TAB!=='chat' && TAB!=='wiki'){   // CHAT and WIKI use the full panel; skip the cockpit strip above them
    body.appendChild(cockpitPanel());   // always-visible "what needs attention" strip + tile router
  }
  // NOTE: the Dashboard visuals (allocation donuts · accounts · gainers/losers/day-movers ·
  // Portfolio-vs-SPY growth-of-100 chart) formerly rendered here as a permanent header that ate
  // vertical space on every tab. They now live in their own leftmost "DASHBOARD" top-level tab
  // (see dashboardContent() + the tabSpecs list below). The cockpit stays persistent as the
  // attention strip whose chips route to the relevant tab.

  // tabbed panel: POSITIONS | RESEARCH (one at a time, to keep the page short)
  const on='color:var(--amber)', off='color:var(--mut)';
  const haveAnalysis = ANALYSIS && ANALYSIS.briefs && Object.keys(ANALYSIS.briefs).length;
  const haveInsights = INSIGHTS && !INSIGHTS.error;
  const havePlan = RETIRE && !RETIRE.error;
  const haveIdeas = IDEAS && !IDEAS.error;
  const haveStrat = STRAT && !STRAT.error;
  const haveTaxAudit = TAXAUDIT && !TAXAUDIT.error && (TAXAUDIT.tax_loss_harvest || TAXAUDIT.asset_location);
  const haveTaxBracket = TAX && !TAX.error && (TAX.marginal_ordinary_rate_pct!=null || TAX.effective);
  const haveTax = haveTaxAudit || haveTaxBracket;
  const haveFL = FL && !FL.error && FL.liquidity;
  const haveResearch = haveAnalysis || haveIdeas;   // RESEARCH tab = briefs + ideas/scan
  const haveAudits = haveTax || haveFL;             // AUDITS tab = tax + fees/liquidity
  if(TAB==='ideas') TAB='research';                 // migrate legacy tab keys -> grouped tabs
  if(TAB==='tax' || TAB==='fl') TAB='audits';
