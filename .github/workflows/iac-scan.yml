name: IaC & Dockerfile scan (Checkov)

# Static checks of what we ship as configuration: Dockerfiles, Terraform (the AWS demo) and these workflows.
# Policy and every accepted exception (with the reason) live in .checkov.yaml -- a NEW finding fails the run,
# an accepted one is a reviewed line in that file. Complements pip-audit/Trivy (dependencies and image CVEs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 2"     # Tuesdays: new Checkov rules land over time
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov (IaC and Dockerfile scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Checkov (pinned)
        run: pip install checkov==3.3.29
      - name: Scan
        run: checkov --config-file .checkov.yaml

  notify-on-failure:
    name: Open an alert issue when a scan fails outside a PR
    needs: [checkov]
    if: ${{ always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write   # only this job; it opens/updates one GitHub issue so a red scheduled scan reaches Jason's notifications
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="ALERT: iac-scan (Checkov) failed"
          body="iac-scan (Checkov) failed (trigger: ${{ github.event_name }}, ref: ${{ github.ref_name }}). Run: ${RUN_URL}"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
