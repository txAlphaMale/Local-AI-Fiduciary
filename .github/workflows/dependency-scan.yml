name: Dependency & container vulnerability scan

# SEC-7b (Dependency & Container Vulnerability Management) -- ISO/IEC 27001:2022 A.8.8 · renamed
# 2026-07-27 from the old shared "SEC-7" label (which also covered backup/restore, now SEC-7a) once
# this half grew its own multi-round history (trivy-action supply-chain pin, SARIF permissions,
# base-image drift, .trivyignore risk acceptance) — see RESUME-TRACKER.md's rename entry.
# NIST SP 800-53 RA-5/SI-2 · SOC 2 (2017 TSC) CC7.1/CC8.1.
#
# Two scans, both against what's actually shipped:
#   1. pip-audit over portfolio-api/requirements.txt -- known CVEs in pinned Python dependencies.
#   2. Trivy image scan over the ACTUAL built portfolio-api image (not just the requirements
#      file) -- catches OS-package CVEs from the python:3.12-slim base + curl/tar/socat/
#      ca-certificates installed in the Dockerfile, which pip-audit alone would miss entirely.
#
# Runs on every push/PR touching dependency-relevant files, AND on a weekly schedule -- CVEs are
# disclosed against code that hasn't changed, so "only scan on change" would miss newly-disclosed
# vulnerabilities in already-merged pinned versions.
#
# SEVERITY-BASED PATCH SLA (the acceptance criterion this workflow exists to make enforceable):
#   CRITICAL -- patch within 7 days of disclosure   (job below FAILS the run; blocks merge)
#   HIGH     -- patch within 30 days                (job below FAILS the run; blocks merge)
#   MEDIUM   -- patch within 90 days                 (reported, does not fail the run)
#   LOW      -- best-effort, no fixed SLA            (reported, does not fail the run)
# This SLA is the same one referenced in compliance/RISK-REGISTER.md (R-10) and
# compliance/STATEMENT-OF-APPLICABILITY.md (A.8.8) -- keep all three in sync if it changes.

on:
  push:
    branches: [main]
    paths:
      - "portfolio-api/requirements.txt"
      - "portfolio-api/Dockerfile"
      - ".github/workflows/dependency-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "portfolio-api/requirements.txt"
      - "portfolio-api/Dockerfile"
  schedule:
    # Every Monday 09:00 UTC -- catches newly-disclosed CVEs against unchanged pinned versions.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write   # upload SARIF to the repo's Security tab (Trivy step below)
  actions: read            # 2026-07-27: upload-sarif's own internal get-a-workflow-run call needs
                           # this on a private repo, or it 403s ("Resource not accessible by
                           # integration") even with security-events: write already set -- confirmed
                           # via github/codeql-action's own issue tracker (#2117), not a guess.

jobs:
  pip-audit:
    name: pip-audit (Python dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pip-audit
        run: |
          pip install --quiet pip-audit
          # --strict: a parse/resolution failure is itself a finding, not a silent skip.
          # Fails the job on ANY known vulnerability -- Python deps here are few and pinned,
          # so "fail on anything, triage in the PR" is cheaper than a severity-parsing step.
          pip-audit --strict -r portfolio-api/requirements.txt

  trivy-image-scan:
    name: Trivy scan (built portfolio-api image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portfolio-api image (scan target, not published)
        run: docker build -t fiduciary-portfolio-api:scan ./portfolio-api
      - name: Run Trivy vulnerability scanner
        # Pinned to the commit SHA, not a tag (2026-07-27): aquasecurity/trivy-action was hit by a
        # supply-chain compromise on 2026-03-19 (TeamPCP) -- 76 of its 77 version tags, including
        # the 0.24.0 this workflow used to reference, were force-pushed to malicious commits that
        # injected a credential-stealing payload before running the real scan (output looked
        # normal either way). GitHub deleted/invalidated the poisoned tags during remediation,
        # which is why 0.24.0 stopped resolving -- NOT a transient CI problem. v0.35.0 is the one
        # tag GitHub's immutable-releases protection had already locked before the attack, so it's
        # the only confirmed-clean one; pinning by its full commit SHA (not just the tag) means
        # this step can't be silently re-pointed by any future tag manipulation of the same kind.
        # Do NOT change this to @0.25.0, @master, or any other trivy-action tag/branch without
        # first checking https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: "fiduciary-portfolio-api:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"   # fail the job -- CRITICAL/HIGH are inside the 7/30-day SLA above
          # 2026-07-27: 6 genuine CRITICALs (essential Debian/perl/zlib packages, no vendor fix,
          # one permanent will_not_fix) formally risk-accepted per Jason -- see .trivyignore at
          # repo root for the CVE list, justification, and 90-day exp: re-review dates.
          trivyignores: ".trivyignore"
      - name: Upload SARIF to GitHub Security tab
        if: always()
        # v3 -> v4 (2026-07-27): v3 is GitHub's own deprecated Node-20 runtime (the "Node 20 is
        # being deprecated" warning in a failed run's log was this, not the actual failure); v4 is
        # GitHub's current stable release (Node 24), first-party action so the tag-hijack risk
        # profile here is not the same as the third-party aquasecurity/trivy-action incident above.
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Full report (all severities, informational -- does not fail the job)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.35.0 -- see pinning note on the step above
        with:
          image-ref: "fiduciary-portfolio-api:scan"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"
          # Deliberately NOT applying .trivyignore here -- this step is informational only
          # (exit-code 0) and exists so the risk-accepted CVEs stay visible in the log for the
          # 90-day review, rather than silently disappearing from the report entirely.
