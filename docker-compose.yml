# ============================================================================
#  Fiduciary — self-contained stack
#  A local-first financial analysis assistant. Runs independently of any other
#  Local AI services. Two containers: mcpo (MCP bridge) and portfolio-api (the
#  app + dashboard + the built-in job scheduler). Ollama is a HOST prerequisite
#  reached via host.docker.internal — it is intentionally NOT a service here
#  (avoids duplicating a multi-GB model + host-specific GPU pinning).
#
#  Scheduling is internal to portfolio-api (INTERNAL_SCHEDULER, times in the
#  dashboard under Settings -> Task Schedule) — there is no scheduler container.
#  (Earlier versions used an external n8n container; it has been retired.)
#
#  Quick start:
#     cp .env.example .env                         # then fill in your values
#     cp mcpo/config.json.example mcpo/config.json # required before first run
#     docker compose up -d --build
#     dashboard -> http://localhost:8097
#
#  Container names are prefixed "fiduciary-" and mcpo is not published, so this
#  stack can run alongside another Compose project (e.g. a home-automation stack)
#  on the same host without name/port collisions. Override the published port
#  with DASH_PORT in .env if 8097 is already taken.
# ============================================================================

name: fiduciary

services:
  # ---- MCP bridge: exposes MCP servers (Monarch, Tavily, time) over HTTP ------
  # Only stdio (uvx) servers here, so there are NO streamable-http sidecars and
  # therefore no startup-order race — no depends_on needed. Not published to the
  # host: only portfolio-api (same network) talks to it.
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: fiduciary-mcpo
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 2026-07-24: TAVILY_API_KEY/MONARCH_* moved OFF the hardcoded `environment:` block below and
    # onto a second env_file instead, so they can be managed from the dashboard's SETTINGS ->
    # SECRETS panel (portfolio-api writes ./mcpo-secrets/mcpo.env) instead of requiring .env edits
    # on the docker host. `.env` is listed SECOND so it still wins for anyone who sets these
    # directly there (matches this app's "real env always wins" rule everywhere else) --
    # portfolio-api's own write logic never puts an already-.env-set key into mcpo.env in the
    # first place, so the two files are never actually fighting over the same key in practice;
    # the list order here is just defense-in-depth. mcpo.env MUST exist before the first
    # `docker compose up` (same requirement as config.json below) -- `cp mcpo-secrets/mcpo.env.example
    # mcpo-secrets/mcpo.env`. MCPO_API_KEY is NOT part of this -- it's passed via the `--api-key`
    # CLI flag below, which Compose resolves from the TOP-LEVEL .env only (env_file entries can't
    # feed command-line variable substitution), so it stays a genuine .env-only, restart-to-change
    # value, same as before.
    env_file:
      - ./mcpo-secrets/mcpo.env
      - .env
    volumes:
      - ./mcpo/config.json:/app/config.json:ro   # MUST exist (cp from the .example) or mcpo crash-loops
      - ./mcpo/data:/root/.mcpo                   # OAuth/session persistence (Monarch login)
    command: ["--host", "0.0.0.0", "--port", "8000", "--api-key", "${MCPO_API_KEY}", "--config", "/app/config.json", "--hot-reload"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ---- The app: normalizes holdings, computes everything, serves the dashboard
  portfolio-api:
    build:
      context: ./portfolio-api
      dockerfile: Dockerfile
    image: fiduciary-portfolio-api:local
    container_name: fiduciary-portfolio-api
    restart: unless-stopped
    depends_on:
      - mcpo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      - MCPO_BASE_URL=http://mcpo:8000
      - MONARCH_ROUTE=monarch
      - MCPO_API_KEY=${MCPO_API_KEY}
      - CACHE_TTL=600
      # Built-in job scheduler: fires the recurring agents on TZ-local time (job times are
      # editable in the dashboard under Settings -> Task Schedule). INTERNAL_SCHEDULER=0 off.
      - TZ=${TZ:-America/Chicago}
      - INTERNAL_SCHEDULER=${INTERNAL_SCHEDULER:-1}
      - ANALYSIS_FILE=/data/analysis.json
      - ANALYSIS_TOKEN=${ANALYSIS_TOKEN}
      # Session login (2026-07-23c) — real username/password + optional TOTP MFA now gates the
      # whole app; AUTH_DB lands in the same /data volume already mounted below, no new volume
      # needed. Set SESSION_SECRET in .env for a real deployment — left blank, one is generated
      # and persisted to /data automatically so sessions still survive a restart.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_MAX_AGE_DAYS=${SESSION_MAX_AGE_DAYS:-30}
      - SESSION_HTTPS_ONLY=${SESSION_HTTPS_ONLY:-0}
      # In-app HTTPS (2026-07-23f) — self-signed / Let's Encrypt (ACME) / manual CSR, all set up
      # from SETTINGS -> SECURITY -> Certificate, no redeploy needed to switch methods. HTTPS_PORT
      # is only actually listening once a certificate exists; until then the app serves plain
      # HTTP on DASH_PORT as it always has. ACME_EMAIL is optional but recommended (Let's
      # Encrypt account contact, used for expiry-warning emails if renewal ever silently stops
      # working). ACME_STAGING=1 uses Let's Encrypt's staging CA (untrusted certs, but no rate
      # limits) — handy the first time you're testing ACME issuance end to end.
      - HTTPS_PORT=${HTTPS_PORT:-8443}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - ACME_STAGING=${ACME_STAGING:-0}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      # Ollama runs on the HOST (prerequisite), reached over the host gateway.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ANALYSIS_MODEL=${ANALYSIS_MODEL:-qwen3.6:27b}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-1200}
      - LLM_KEEP_ALIVE=${LLM_KEEP_ALIVE:-30m}
      - SEC_USER_AGENT=${SEC_USER_AGENT}
      - EDGAR_TTL=86400
      - PORTFOLIO_PROVIDER=${PORTFOLIO_PROVIDER:-csv}
      # Knowledge RAG (N12): drop .md/.txt/.pdf into ./knowledge on the host → indexed via bge-m3.
      - KNOWLEDGE_DIR=/knowledge
      - EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      # P1 free-data adoptions: FINRA short interest + RentCast home AVM (both free-tier
      # registrations; also settable in the dashboard's masked secrets editor).
      - FINRA_CLIENT_ID=${FINRA_CLIENT_ID:-}
      - FINRA_CLIENT_SECRET=${FINRA_CLIENT_SECRET:-}
      - RENTCAST_API_KEY=${RENTCAST_API_KEY:-}
    volumes:
      - portfolio-data:/data
      - ./knowledge:/knowledge:ro   # user-populated Knowledge folder (host-editable; container reads)
      - ./mcpo-secrets:/mcpo-secrets   # portfolio-api WRITES mcpo.env here (SETTINGS -> SECRETS);
                                       # mcpo reads the same host path via its own env_file above
    ports:
      - "${DASH_PORT:-8097}:8097"
      - "${HTTPS_PORT:-8443}:8443"
      # Only needed for ACME's http-01 challenge (SETTINGS -> SECURITY -> Certificate -> Let's
      # Encrypt -> HTTP-01). acme.sh briefly binds this port ONLY during issuance/renewal, then
      # releases it — nothing else in the app ever listens here. Leave commented out if you're
      # using dns-01 instead (no public reachability needed) or the self-signed/manual-CSR
      # methods (neither needs any inbound port beyond DASH_PORT/HTTPS_PORT above). Uncomment
      # and set ACME_HTTP01_PORT if 80 is already taken by something else on this host.
      # - "${ACME_HTTP01_PORT:-80}:80"

volumes:
  portfolio-data:
